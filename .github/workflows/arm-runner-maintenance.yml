name: Benchmark Runner Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        runner: [reproducible-benchmarks, reproducible-benchmarks-arm]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 5
    steps:
      - name: Inspect runner storage and prerequisites
        shell: bash
        run: |
          set -uo pipefail
          hostname
          uname -m
          nproc
          free -h
          lsblk -b -o NAME,SIZE,FSTYPE,MOUNTPOINTS
          findmnt -o TARGET,SOURCE,FSTYPE --target /
          df -hT / /data /mnt/sda 2>/dev/null || true
          docker info --format 'Docker root: {{.DockerRootDir}}; storage driver: {{.Driver}}' || true
          docker ps --format '{{.Names}} {{.Status}}' || true
          for snapshot in /data/nethermind/nethermind-flat-snapshot /data/nethermind/nethermind-flat-25490000 /mnt/sda/nethermind-flat-snapshot /mnt/sda/nethermind-flat-25490000; do
            ls -ld "$snapshot" 2>/dev/null || true
          done
          for tool in growpart resize2fs xfs_growfs; do
            command -v "$tool" || true
          done
