name: EEZ streaming session tests

on:
  workflow_call:
    inputs:
      conformance:
        type: boolean
        default: true
      upstream_revision:
        type: string
        default: ''
      rollupx_revision:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      conformance:
        description: Run selected upstream vectors instead of compatibility tests
        type: boolean
        default: true
      upstream_revision:
        description: 'Replay a public upstream main commit; empty selects current main'
        type: string
        default: ''
      rollupx_revision:
        description: 'Replay a public RollupX main commit; empty selects current main'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: eez-streaming-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}-${{ inputs.conformance == false && 'unit' || 'conformance' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select upstream execution data
    if: inputs.conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Resolve current upstream vector data
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REVISION: ${{ inputs.upstream_revision }}
        run: |
          python3 -m unittest discover -s scripts/eez/devnet -p 'test_*.py'
          python3 scripts/eez/devnet/upstream.py vectors --revision "$UPSTREAM_REVISION" --directory "$RUNNER_TEMP/eez-vectors" --output "$RUNNER_TEMP/eez-vectors/upstream.json"
      - name: Resolve current RollupX streaming and execution data
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REVISION: ${{ inputs.rollupx_revision }}
        run: python3 scripts/eez/devnet/upstream.py rollupx-execution --revision "$UPSTREAM_REVISION" --directory "$RUNNER_TEMP/eez-rollupx-vectors" --output "$RUNNER_TEMP/eez-rollupx-vectors/upstream.json"
      - uses: actions/upload-artifact@v4
        with:
          name: eez-selected-vectors
          path: |
            ${{ runner.temp }}/eez-vectors
            ${{ runner.temp }}/eez-rollupx-vectors
          if-no-files-found: error
          retention-days: 14

  tests:
    name: EEZ execution (${{ matrix.runner }}, ${{ matrix.variant }})
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || inputs.conformance == false && needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      EEZ_REQUIRE_UPSTREAM_VECTORS: ${{ inputs.conformance && matrix.variant == 'release' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: release
            build-args: ''
          - runner: ubuntu-24.04-arm
            variant: release
            build-args: ''
          - runner: ubuntu-latest
            variant: checked
            build-args: -p:DefineConstants=TRACE%3BDEBUG
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        if: needs.prepare.result == 'success' && matrix.variant == 'release'
        with:
          name: eez-selected-vectors
          path: ${{ runner.temp }}
      - uses: actions/setup-dotnet@v5
      - name: Restore
        run: dotnet restore src/Nethermind/Nethermind.Eez.Test/Nethermind.Eez.Test.csproj --locked-mode
      - name: Compile
        run: dotnet build src/Nethermind/Nethermind.Eez.Test/Nethermind.Eez.Test.csproj -c Release --no-restore ${{ matrix.build-args }}
      - name: Execution requests and witness tests
        if: matrix.variant == 'release'
        run: |
          dotnet test --project src/Nethermind/Nethermind.Consensus.Test/Nethermind.Consensus.Test.csproj -c Release \
            -- --filter 'FullyQualifiedName~Nethermind.Consensus.Test.Stateless.WitnessTests|FullyQualifiedName~Nethermind.Consensus.Test.Stateless.ExistingBlockWitnessTests|FullyQualifiedName~Nethermind.Consensus.Test.ExecutionProcessorTests'
      - name: Compatibility tests
        env:
          EEZ_LOCAL_CONFORMANCE: ${{ matrix.variant != 'release' || !inputs.conformance }}
        run: |
          filter='FullyQualifiedName!~StreamingConformanceTests'
          if [[ "$EEZ_LOCAL_CONFORMANCE" == true ]]; then filter='FullyQualifiedName~Nethermind.Eez.Test'; fi
          dotnet src/Nethermind/artifacts/bin/Nethermind.Eez.Test/release/Nethermind.Eez.Test.dll \
            --filter "$filter" --minimum-expected-tests 1 \
            --hangdump --hangdump-timeout 5m --hangdump-type Mini --crashdump --crashdump-type Mini
      - name: No-intrinsics compatibility
        if: matrix.runner == 'ubuntu-latest' && matrix.variant == 'release'
        env:
          DOTNET_EnableHWIntrinsic: '0'
          EEZ_REQUIRE_UPSTREAM_VECTORS: 'false'
        run: |
          dotnet src/Nethermind/artifacts/bin/Nethermind.Eez.Test/release/Nethermind.Eez.Test.dll \
            --minimum-expected-tests 1 --hangdump --hangdump-timeout 5m --hangdump-type Mini --crashdump --crashdump-type Mini
      - name: Trie DB compatibility
        if: matrix.runner == 'ubuntu-latest' && matrix.variant == 'release'
        env:
          TEST_USE_TRIE: '1'
          EEZ_REQUIRE_UPSTREAM_VECTORS: 'false'
        run: |
          dotnet src/Nethermind/artifacts/bin/Nethermind.Eez.Test/release/Nethermind.Eez.Test.dll \
            --minimum-expected-tests 1 --hangdump --hangdump-timeout 5m --hangdump-type Mini --crashdump --crashdump-type Mini
      - name: Upstream streaming conformance
        if: inputs.conformance && matrix.variant == 'release'
        env:
          EEZ_CONFORMANCE_VECTOR_DIR: ${{ runner.temp }}/eez-vectors
          EEZ_ROLLUPX_EXECUTION_VECTOR_DIR: ${{ runner.temp }}/eez-rollupx-vectors
        run: |
          dotnet src/Nethermind/artifacts/bin/Nethermind.Eez.Test/release/Nethermind.Eez.Test.dll \
            --filter 'FullyQualifiedName~StreamingConformanceTests' --minimum-expected-tests 1 \
            --hangdump --hangdump-timeout 5m --hangdump-type Mini --crashdump --crashdump-type Mini
      - name: Retain vector provenance
        if: always() && needs.prepare.result == 'success' && matrix.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: eez-vector-provenance-${{ matrix.runner }}-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/eez-vectors/upstream.json
            ${{ runner.temp }}/eez-rollupx-vectors/upstream.json
          if-no-files-found: warn
          retention-days: 14
