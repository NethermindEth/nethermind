name: Publish Docker image

on:
  schedule:
    - cron: '0 0 * * *'

  push:
    branches: [master, release/*, performance]
    paths: [src/Nethermind/**]

  workflow_dispatch:
    inputs:
      image-name:
        description: Image name
        required: true
        default: nethermind
      tag:
        description: Image tag
        required: true
      dockerfile:
        description: Dockerfile
        required: true
        default: Dockerfile
      version-file:
        description: Project or props file declaring the image version (derived from Dockerfile when empty)
        required: false
        default: ''
      build-config:
        description: Build configuration
        required: true
        default: release
        type: choice
        options: [release, debug]

permissions:
  contents: read

jobs:
  publish-docker:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check whether the nightly is already built from this commit
        id: nightly
        if: github.event_name == 'schedule'
        run: |
          revision=$(docker buildx imagetools inspect nethermindeth/nethermind:nightly \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision" }}' || true)
          if [ "$revision" = "$GITHUB_SHA" ]; then echo "unchanged=true" >> "$GITHUB_OUTPUT"; fi

      # Private repositories (nethermind-sec) get the smaller hosted runner, whose root disk this build fills.
      - name: Free up disk space
        if: github.event.repository.private && steps.nightly.outputs.unchanged != 'true'
        # It starts with ~15 GB free and a full build needs ~33 GB; these hold over 25 GB the job never uses.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /opt/az /usr/local/share/chromium /opt/google
          docker image prune -af > /dev/null
          df -h /

      - name: Check out repository
        if: steps.nightly.outputs.unchanged != 'true'
        uses: actions/checkout@v6

      - name: Publish Docker image
        if: steps.nightly.outputs.unchanged != 'true'
        uses: ./.github/actions/publish-docker
        with:
          image-name: ${{ github.event.inputs.image-name || 'nethermind' }}
          tag: ${{ github.event.inputs.tag || (github.event_name == 'schedule' && 'nightly') || '' }}
          dockerfile: ${{ github.event.inputs.dockerfile || 'Dockerfile' }}
          version-file: ${{ github.event.inputs.version-file || '' }}
          build-config: ${{ github.event.inputs.build-config || 'release' }}
          docker-hub-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}
          docker-hub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
