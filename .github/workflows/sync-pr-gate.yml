name: Sync PR Gate (Hoodi)

on:
  # pull_request_target runs master's copy of this file, sync-pr-gate-hoodi.yml and the gcp-runner action, so only reviewed
  # code can use the GCP spawner identity. PR code runs only on the VM, which cannot impersonate it.
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    # Syncs Hoodi with the PR's Docker image on GCP VMs, so it only runs when the
    # PR can change that image or this gate. Not a required check, so skipping leaves no pending status.
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'scripts/entrypoint.sh'
      - 'scripts/wait-for-sync.cs'
      - 'scripts/sync/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/sync-pr-gate.yml'
      - '.github/workflows/sync-pr-gate-hoodi.yml'
      - '.github/actions/gcp-runner/**'

concurrency:
  group: sync-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-consensus:
    if: github.event.pull_request.head.repo.fork == false && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      clients: ${{ steps.clients.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: clients
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100
            });
            const affectsEmbedded = path =>
              /^src\/Nethermind\/Nethermind\.(BeaconChain[^/]*|Network\.Libp2p[^/]*|Merge\.Plugin[^/]*|Serialization\.Ssz[^/]*|Analyzers[^/]*)\//.test(path) ||
              /^src\/Nethermind\/Nethermind\.Runner\/(NethermindPlugins\.cs|Nethermind\.Runner\.csproj)$/.test(path) ||
              /(^|\/)(Directory\.(Build\.(props|targets)|Packages\.props)|global\.json|Dockerfile)$/.test(path) ||
              /^\.github\/workflows\/sync-pr-gate(-hoodi)?\.yml$/.test(path);
            return files.length >= 3000 || files.some(file => affectsEmbedded(file.filename) || affectsEmbedded(file.previous_filename || ''))
              ? ['Lodestar', 'Embedded'] : ['Lodestar'];

  sync-hoodi:
    name: "Sync hoodi (${{ matrix.mode }}${{ matrix.consensus == 'Embedded' && ', embedded CL' || '' }})"
    needs: select-consensus
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        mode: [HalfPath, Flat]
        consensus: ${{ fromJSON(needs.select-consensus.outputs.clients) }}
    uses: ./.github/workflows/sync-pr-gate-hoodi.yml
    with:
      mode: ${{ matrix.mode }}
      consensus: ${{ matrix.consensus }}
    secrets: inherit
