name: Test selection

# Builds the model that pull requests use to run only the tests their change can affect
# (scripts/ci/select_tests.py, .github/actions/select-tests, the Select EEST tests step of run-nethtest.yml).
# Every hour it adds the finished test runs to the journal, growing it back to 60 days, and rebuilds the model.
# Once a day it refreshes the test costs and replays the selector over the journal into the job summary: the
# share of cost it runs and the failures it would have hidden.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Branch of this repository whose journal.jsonl.gz starts an empty state, so the first model
          does not wait for the hourly backfill
        required: false
        default: ''

permissions:
  # actions: write deletes the superseded state and model artifacts.
  actions: write
  contents: read

concurrency:
  group: test-selection
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  STATE: ${{ github.workspace }}/state

jobs:
  model:
    name: Build the selection model
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Full history without file contents: the merge base and the diff of every run come from local git.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore the state
        env:
          SEED: ${{ inputs.seed }}
        run: |
          mkdir -p "$STATE"
          # A fork can name its branch master, but only the base repository can start scheduled or dispatched runs.
          previous=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test-selection.yml --branch master \
            --status success -L 20 --json databaseId,event \
            -q '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [ -n "$previous" ]; then
            gh run download "$previous" -R "$GITHUB_REPOSITORY" -n test-selection-state -D "$STATE" || true
          fi
          if [ -n "$SEED" ] && [ ! -f "$STATE/journal.jsonl.gz" ]; then
            [[ "$SEED" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid seed branch"; exit 1; }
            git fetch --no-tags --depth=1 origin "refs/heads/$SEED"
            git show FETCH_HEAD:journal.jsonl.gz > "$STATE/journal.jsonl.gz"
          fi
          if [ "$(cat "$STATE/inventory-date" 2>/dev/null)" != "$(date -u +%F)" ]; then
            echo "DAILY=true" >> "$GITHUB_ENV"
          fi

      - name: Refresh the test costs
        if: env.DAILY == 'true'
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nethermind-tests.yml --branch master --event push \
            --status success -L 1 --json databaseId -q '.[0].databaseId')
          python scripts/ci/select_tests.py inventory --run "$run" --out "$STATE/inventory.json.gz"
          date -u +%F > "$STATE/inventory-date"

      - name: Collect runs
        run: python scripts/ci/select_tests.py collect --journal "$STATE/journal.jsonl.gz"

      - name: Build the model
        run: python scripts/ci/select_tests.py model --journal "$STATE/journal.jsonl.gz" --out "$STATE/model.json.gz"

      - name: Replay the selector over the journal
        if: env.DAILY == 'true'
        run: |
          python scripts/ci/select_tests.py replay --journal "$STATE/journal.jsonl.gz" \
            --inventory "$STATE/inventory.json.gz" --report "$STATE/report.md"
          cat "$STATE/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the state
        uses: actions/upload-artifact@v7
        with:
          name: test-selection-state
          path: |
            ${{ env.STATE }}/journal.jsonl.gz
            ${{ env.STATE }}/inventory.json.gz
            ${{ env.STATE }}/inventory-date
          retention-days: 7

      - name: Publish the model
        uses: actions/upload-artifact@v7
        with:
          name: test-selection-model
          path: |
            ${{ env.STATE }}/model.json.gz
            ${{ env.STATE }}/inventory.json.gz
          retention-days: 7

      # Each run supersedes the previous one; keep the newest two of each artifact so a broken run can fall back.
      # Only artifacts of master runs in this repository count, so a fork's artifact of the same name is left alone.
      - name: Delete superseded artifacts
        run: |
          for name in test-selection-state test-selection-model; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" -q '.artifacts[]' |
              jq -s -r '[.[] | select(.workflow_run.head_branch == "master"
                  and .workflow_run.head_repository_id == .workflow_run.repository_id)]
                | sort_by(.created_at) | reverse | .[2:][] | .id' |
              xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
          done
