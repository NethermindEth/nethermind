name: Run EXPB Reproducible Benchmarks

on:
  workflow_dispatch:
    inputs:
      arch:
        description: >-
          Which self-hosted benchmark runner to use, and with it every path that differs between the
          boxes. amd64 = `reproducible-benchmarks` (EPYC 4344P, snapshots under /mnt/sda); arm64 =
          `reproducible-benchmarks-arm` (Axion, snapshots under /data, flat layout only). Timings from
          the two boxes are NOT comparable — never mix them in one A/B.
        required: false
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      client:
        description: Execution client to benchmark (non-Nethermind clients currently support Fusaka only)
        required: false
        type: choice
        options:
          - nethermind
          - reth
          - geth
        default: nethermind
      measurement_source:
        description: Timing source; auto uses Nethermind SSE when available, engine-api uses the common K6 TTFB table
        required: false
        type: choice
        options:
          - auto
          - engine-api
        default: auto
      expb_repo:
        description: execution-payloads-benchmarks repository in owner/repo format
        required: false
        default: NethermindEth/execution-payloads-benchmarks
      expb_branch:
        description: execution-payloads-benchmarks branch or tag
        required: false
        default: main
      state_layout:
        description: State layout mode
        required: true
        type: choice
        options:
          - halfpath
          - flat
        default: flat
      payload_set:
        description: Payload set mode
        required: true
        type: choice
        options:
          - realblocks
          - superblocks
          - fusaka
        default: superblocks
      delay_seconds:
        description: Value used to replace <<DELAY>> placeholder (integer)
        required: false
        default: "0"
      amount:
        description: Override payload amount (default 1000 for realblocks, 100 for superblocks)
        required: false
        default: ""
      additional_extra_flags:
        description: >-
          Optional extra flags appended to the selected client's command line.
          Nethermind example (single): --Merge.SweepMemory=NoGC.
          Example (multiple): --Sync.FastSync=false, --Pruning.CacheMb=12000
          (or provide one flag per line). Reference-client example:
          --engine.slow-block-threshold=0 for reth.
        required: false
        default: ""
      flat_write_buffer_floor:
        description: >-
          FlatDb write-buffer (memtable) floor in bytes for flat-layout runs, applied as
          --FlatDb.PersistenceWriteBufferFloor. Keeps small-CompactSize persistence batches from
          shrinking RocksDB memtables (decouples write amplification from CompactSize). Set empty to
          disable. Ignored for non-flat layouts and when additional_extra_flags already sets it.
          SET THIS EMPTY when benchmarking an image built before 2026-06-16 (#11936 added the flag):
          older clients reject an unknown argument by printing CLI usage and exiting, which looks
          like a workflow failure rather than a flag mismatch.
        required: false
        default: "67108864"
      expb_env:
        description: >-
          Optional environment variables passed to the expb process (KEY=VALUE,
          comma- or newline-separated). Applies to both single-image and
          multi-image runs. Enables expb env-gated options, e.g.
          EXPB_EVM_WARMUP=1 (per-block eth_simulateV1 warmup). Values that
          themselves contain commas must use the newline-separated form, since
          commas are treated as entry separators.
        required: false
        default: ""
      rebuild_docker:
        description: Rebuild Nethermind Docker image before running benchmarks
        required: false
        type: boolean
        default: true
      run_count:
        description: Number of times to run the benchmark (for reproducibility testing)
        required: false
        type: number
        default: 1
      docker_images:
        description: >-
          Force-test specific Docker images (comma-separated full image references including repo).
          Skips docker build; runs each image as a separate benchmark.
          Example: nethermindeth/nethermind:master-21f1dca,nethermind/nethermind:latest
        required: false
        default: ""
      enable_retrospective:
        description: Enable retrospective multi-image benchmark (scans Docker Hub for recent master-* images)
        required: false
        type: boolean
        default: false
      retrospective_last:
        description: Number of recent master-* Docker images to consider (retrospective mode)
        required: false
        type: number
        default: 100
      retrospective_step:
        description: Pick every Nth image from the pool (retrospective mode)
        required: false
        type: number
        default: 10
      dottrace:
        description: >-
          dotTrace profiling of the client. sampling/tracing snapshots are post-processed to XML
          reports; timeline captures a UI-only snapshot (Reporter cannot convert it). Line-by-line
          is not offered - it needs PDBs the docker images do not carry. 'true' is a legacy alias
          for sampling. Any enabled mode also collects a dotnet-trace EventPipe .nettrace
          (gc/contention/threading/exception events) alongside, shipped in the same artifact.
        required: false
        type: choice
        options:
          - "false"
          - sampling
          - tracing
          - timeline
        default: "false"
      perf:
        description: >-
          Record a Linux perf profile of the client alongside the run. perf samples on the host and
          resolves both managed frames (via the runtime's perf map) and native frames (via the
          container's shared objects), so time inside RocksDB, the allocator and the GC is attributed
          instead of collapsing into dotTrace's single '[Native or optimized code]' node. Produces
          a folded-stack perf.folded readable with scripts/perf-report.sh.
          Independent of the dottrace input; enabling both samples the process twice, which perturbs
          timings - use perf runs for attribution, not for A/B numbers.
        required: false
        type: boolean
        default: false
      trace_blocks:
        description: >-
          Comma-separated block numbers to profile with dotTrace (e.g. 22360451,22360454). When set,
          implies dottrace=true and passes the list to the client as NETHERMIND_PROFILE_BLOCKS (so its
          BlockProfiler plugin brackets each block). Produces one .dtp workspace containing one
          snapshot per traced block (open in the dotTrace UI; the numbered .dtp.NNNN files are storage
          segments, not per-block files); the parsed XML report aggregates all traced windows, so trace
          a single block per run when isolated XML matters. Leave empty for whole-run profiling.
        required: false
        default: ""
      client_env:
        description: >-
          Extra environment variables for the Nethermind client container (KEY=VALUE, comma-separated),
          injected into the scenario extra_env. Example: DOTNET_GCgen0size=0x20000000. Applied to every
          scenario, including each image of a multi-image run.
        required: false
        default: ""
      measurement_mode:
        description: >-
          Processing measurement preset. standard preserves the normal RocksDB/client path;
          compute-warm enables EXPB_EVM_WARMUP=1 and raises the RPC gas cap for a lower-variance
          compute-focused signal. Compute-warm runs are not comparable with standard runs.
        required: false
        type: choice
        options:
          - standard
          - compute-warm
        default: standard
  pull_request:
    types: [labeled]
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  resolve:
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'performance is good' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      mode: ${{ steps.resolve.outputs.mode }}
      branch: ${{ steps.resolve.outputs.branch }}
      clean_branch: ${{ steps.resolve.outputs.clean_branch }}
      should_trigger_publish_docker: ${{ steps.resolve.outputs.should_trigger_publish_docker }}
      should_wait_for_publish_docker: ${{ steps.resolve.outputs.should_wait_for_publish_docker }}
      rebuild_docker: ${{ steps.resolve.outputs.rebuild_docker }}
      config_file: ${{ steps.resolve.outputs.config_file }}
      image_label: ${{ steps.resolve.outputs.image_label }}
      expb_repo: ${{ steps.resolve.outputs.expb_repo }}
      expb_branch: ${{ steps.resolve.outputs.expb_branch }}
      expb_data_dir: ${{ steps.resolve.outputs.expb_data_dir }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      flat_snapshot_dir: ${{ steps.resolve.outputs.flat_snapshot_dir }}
      flat_snapshot_block_dir: ${{ steps.resolve.outputs.flat_snapshot_block_dir }}
      delay_seconds: ${{ steps.resolve.outputs.delay_seconds }}
      amount: ${{ steps.resolve.outputs.amount }}
      additional_extra_flags: ${{ steps.resolve.outputs.additional_extra_flags }}
      expb_env: ${{ steps.resolve.outputs.expb_env }}
      cleanup_grace_seconds: ${{ steps.resolve.outputs.cleanup_grace_seconds }}
      scenario_name: ${{ steps.resolve.outputs.scenario_name }}
      run_count: ${{ steps.resolve.outputs.run_count }}
      run_indices: ${{ steps.resolve.outputs.run_indices }}
      docker_images: ${{ steps.resolve.outputs.docker_images }}
      retrospective_last: ${{ steps.resolve.outputs.retrospective_last }}
      retrospective_step: ${{ steps.resolve.outputs.retrospective_step }}
      state_layout: ${{ steps.resolve.outputs.state_layout }}
      payload_sets: ${{ steps.resolve.outputs.payload_sets }}
      dottrace: ${{ steps.resolve.outputs.dottrace }}
      perf: ${{ steps.resolve.outputs.perf }}
      dottrace_mode: ${{ steps.resolve.outputs.dottrace_mode }}
      trace_blocks: ${{ steps.resolve.outputs.trace_blocks }}
      client_env: ${{ steps.resolve.outputs.client_env }}
      measurement_mode: ${{ steps.resolve.outputs.measurement_mode }}
      client: ${{ steps.resolve.outputs.client }}
      measurement_source: ${{ steps.resolve.outputs.measurement_source }}
      client_snapshot_dir: ${{ steps.resolve.outputs.client_snapshot_dir }}
      snapshot_mount_path: ${{ steps.resolve.outputs.snapshot_mount_path }}
    steps:
      - name: Resolve branch and configuration
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABEL: ${{ github.event.label.name }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPO: ${{ github.repository }}
          PUSH_BRANCH: ${{ github.ref_name }}
          DISPATCH_CLIENT: ${{ inputs.client }}
          DISPATCH_MEASUREMENT_SOURCE: ${{ inputs.measurement_source }}
          DISPATCH_STATE_LAYOUT: ${{ inputs.state_layout }}
          DISPATCH_ARCH: ${{ inputs.arch }}
          DISPATCH_PAYLOAD_SET: ${{ inputs.payload_set }}
          DISPATCH_EXPB_REPO: ${{ inputs.expb_repo }}
          DISPATCH_EXPB_BRANCH: ${{ inputs.expb_branch }}
          DISPATCH_DELAY_SECONDS: ${{ inputs.delay_seconds }}
          DISPATCH_AMOUNT: ${{ inputs.amount }}
          DISPATCH_ADDITIONAL_EXTRA_FLAGS: ${{ inputs.additional_extra_flags }}
          DISPATCH_FLAT_WRITE_BUFFER_FLOOR: ${{ inputs.flat_write_buffer_floor }}
          DISPATCH_EXPB_ENV: ${{ inputs.expb_env }}
          DISPATCH_REBUILD_DOCKER: ${{ inputs.rebuild_docker }}
          DISPATCH_RUN_COUNT: ${{ inputs.run_count }}
          DISPATCH_DOCKER_IMAGES: ${{ inputs.docker_images }}
          DISPATCH_ENABLE_RETROSPECTIVE: ${{ inputs.enable_retrospective }}
          DISPATCH_RETROSPECTIVE_LAST: ${{ inputs.retrospective_last }}
          DISPATCH_RETROSPECTIVE_STEP: ${{ inputs.retrospective_step }}
          DISPATCH_DOTTRACE: ${{ inputs.dottrace }}
          DISPATCH_PERF: ${{ inputs.perf }}
          DISPATCH_TRACE_BLOCKS: ${{ inputs.trace_blocks }}
          DISPATCH_CLIENT_ENV: ${{ inputs.client_env }}
          DISPATCH_MEASUREMENT_MODE: ${{ inputs.measurement_mode }}
        run: |
          set -euo pipefail

          should_run="true"
          mode="single"
          client="nethermind"
          measurement_source="auto"
          client_snapshot_dir=""
          snapshot_mount_path=""
          # Default FlatDb write-buffer floor (bytes) for flat layout; overridden by the dispatch input.
          flat_write_buffer_floor="67108864"
          expb_env=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            branch="${PUSH_BRANCH}"
            client="${DISPATCH_CLIENT:-nethermind}"
            measurement_source="${DISPATCH_MEASUREMENT_SOURCE:-auto}"
            state_layout="${DISPATCH_STATE_LAYOUT}"
            payload_set="${DISPATCH_PAYLOAD_SET}"
            expb_repo="${DISPATCH_EXPB_REPO}"
            expb_branch="${DISPATCH_EXPB_BRANCH}"
            arch="${DISPATCH_ARCH:-amd64}"
            delay_seconds="${DISPATCH_DELAY_SECONDS:-0}"
            if [[ -n "${DISPATCH_AMOUNT}" ]]; then
              amount="${DISPATCH_AMOUNT}"
            elif [[ "${payload_set}" == "realblocks" || "${payload_set}" == "fusaka" ]]; then
              amount="1000"
            else
              amount="100"
            fi
            additional_extra_flags="${DISPATCH_ADDITIONAL_EXTRA_FLAGS:-}"
            flat_write_buffer_floor="${DISPATCH_FLAT_WRITE_BUFFER_FLOOR-67108864}"
            # "off" disables the floor injection entirely (an empty dispatch input falls back to the default,
            # so it cannot express "no floor"; needed to benchmark images predating the config key).
            if [[ "${flat_write_buffer_floor}" == "off" ]]; then
              flat_write_buffer_floor=""
            fi
            expb_env="${DISPATCH_EXPB_ENV:-}"
            cleanup_grace_seconds="90"
            rebuild_docker="${DISPATCH_REBUILD_DOCKER:-true}"
            run_count="${DISPATCH_RUN_COUNT:-1}"
            payload_sets="[\"${payload_set}\"]"

            # Determine mode: multi-image if docker_images or retrospective is enabled
            docker_images="${DISPATCH_DOCKER_IMAGES:-}"
            enable_retrospective="${DISPATCH_ENABLE_RETROSPECTIVE:-false}"
            retrospective_last="${DISPATCH_RETROSPECTIVE_LAST:-100}"
            retrospective_step="${DISPATCH_RETROSPECTIVE_STEP:-10}"
            dottrace="${DISPATCH_DOTTRACE:-false}"
            perf="${DISPATCH_PERF:-false}"
            # Normalize the profiling selector: legacy boolean 'true' means sampling.
            case "${dottrace}" in
              true|sampling) dottrace_mode="sampling" ;;
              tracing|timeline) dottrace_mode="${dottrace}" ;;
              false|"") dottrace_mode="" ;;
              *) echo "dottrace must be false, sampling, tracing, or timeline (got '${dottrace}')."; exit 1;;
            esac
            trace_blocks="$(printf '%s' "${DISPATCH_TRACE_BLOCKS:-}" | tr -d '[:space:]')"
            if [[ -n "${trace_blocks}" ]]; then
              if ! [[ "${trace_blocks}" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
                echo "trace_blocks must be a comma-separated list of block numbers, got '${trace_blocks}'."
                exit 1
              fi
              # Per-block snapshots ride the MeasureProfiler API (--use-api), which needs a
              # performance profiling session - timeline cannot bracket blocks.
              if [[ "${dottrace_mode}" == "timeline" ]]; then
                echo "trace_blocks cannot be combined with dottrace=timeline (per-block snapshots need a performance profiling session)."
                exit 1
              fi
              # tracing specific blocks implies dotTrace
              if [[ -z "${dottrace_mode}" ]]; then dottrace_mode="sampling"; fi
            fi
            if [[ -n "${dottrace_mode}" ]]; then dottrace="true"; else dottrace="false"; fi
            client_env="${DISPATCH_CLIENT_ENV:-}"
            measurement_mode="${DISPATCH_MEASUREMENT_MODE:-standard}"
            if [[ -n "${docker_images}" || "${enable_retrospective}" == "true" ]]; then
              mode="multi"
            fi
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_LABEL}" != "performance is good" ]]; then
              should_run="false"
            fi
            if [[ -n "${PR_HEAD_REPO:-}" && "${PR_HEAD_REPO}" != "${CURRENT_REPO}" ]]; then
              should_run="false"
            fi
            branch="${PR_HEAD_BRANCH}"
            state_layout="flat"
            payload_set="superblocks"
            payload_sets='["superblocks","realblocks","fusaka"]'
            expb_repo="NethermindEth/execution-payloads-benchmarks"
            expb_branch="main"
            arch="amd64"
            delay_seconds="0"
            amount=""
            additional_extra_flags=""
            cleanup_grace_seconds="90"
            rebuild_docker="true"
            run_count="1"
            dottrace="false"
            perf="false"
            dottrace_mode=""
            trace_blocks=""
            client_env=""
            measurement_mode="standard"
            client="nethermind"
            measurement_source="auto"
          else
            branch="${PUSH_BRANCH}"
            state_layout="flat"
            payload_set="superblocks"
            payload_sets='["superblocks","realblocks","fusaka"]'
            expb_repo="NethermindEth/execution-payloads-benchmarks"
            expb_branch="main"
            arch="amd64"
            delay_seconds="0"
            amount=""
            additional_extra_flags=""
            cleanup_grace_seconds="90"
            rebuild_docker="true"
            run_count="1"
            dottrace="false"
            perf="false"
            dottrace_mode=""
            trace_blocks=""
            client_env=""
            measurement_mode="standard"
            client="nethermind"
            measurement_source="auto"
          fi

          case "${client}" in
            nethermind|reth|geth) ;;
            *) echo "client must be nethermind, reth, or geth (got '${client}')."; exit 1 ;;
          esac
          case "${measurement_source}" in
            auto|engine-api) ;;
            *) echo "measurement_source must be auto or engine-api (got '${measurement_source}')."; exit 1 ;;
          esac

          if [[ "${client}" != "nethermind" ]]; then
            if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "client=${client} is available only for workflow_dispatch; automated runs use Nethermind."
              exit 1
            fi
            if [[ "${state_layout}" != "flat" ]]; then
              echo "::error::Reference client=${client} requires state_layout=flat (got '${state_layout}')."
              exit 1
            fi
            if [[ "${payload_set}" != "fusaka" ]]; then
              echo "client=${client} currently supports payload_set=fusaka only (got '${payload_set}')."
              exit 1
            fi
            if [[ -z "${docker_images}" ]]; then
              echo "client=${client} requires explicit docker_images; its image is never built by this workflow."
              exit 1
            fi
            if [[ "${enable_retrospective}" == "true" ]]; then
              echo "client=${client} does not support Nethermind retrospective image discovery; provide docker_images explicitly."
              exit 1
            fi
            if printf '%s' "${client_env}" | grep -Eq '[^[:space:],]'; then
              echo "client_env is Nethermind-only and cannot be passed to client=${client}."
              exit 1
            fi
            if printf '%s\n' "${expb_env}" | tr ',' '\n' | sed 's/^[[:space:]]*//' | grep -Eq '^EXPB_EVM_WARMUP[[:space:]]*='; then
              echo "EXPB_EVM_WARMUP is Nethermind-only and cannot be used with client=${client}."
              exit 1
            fi
            if [[ "${measurement_mode}" == "compute-warm" ]]; then
              echo "measurement_mode=compute-warm is Nethermind-only (it relies on EXPB_EVM_WARMUP) and cannot be used with client=${client}."
              exit 1
            fi
            if [[ -n "${trace_blocks}" ]]; then
              echo "trace_blocks requires client=nethermind (BlockProfiler is Nethermind-specific)."
              exit 1
            fi
            if [[ -n "${dottrace_mode}" ]]; then
              echo "dottrace requires client=nethermind (dotTrace integration is .NET-specific)."
              exit 1
            fi
            measurement_source="engine-api"
            rebuild_docker="false"
            snapshot_mount_path="/execution-data"
          fi

          # One switch drives the runner and every path that differs between the two boxes, so a
          # dispatch cannot end up on one runner holding the other's snapshot paths.
          case "${arch}" in
            arm64)
              runner_label="reproducible-benchmarks-arm"
              expb_data_dir="/data/expb-data"
              # This box carries a single flat snapshot and serves both config spellings from it.
              flat_snapshot_dir="/data/nethermind/nethermind-flat-25490000"
              flat_snapshot_block_dir="/data/nethermind/nethermind-flat-25490000"
              if [[ "${client}" != "nethermind" ]]; then
                client_snapshot_dir="/data/${client}/${client}-25490000"
              fi
              ;;
            amd64)
              runner_label="reproducible-benchmarks"
              expb_data_dir="/mnt/sda/expb-data"
              # Identity rewrites: the configs on this box already carry these paths.
              flat_snapshot_dir="/mnt/sda/nethermind-flat-snapshot"
              flat_snapshot_block_dir="/mnt/sda/nethermind-flat-25490000"
              if [[ "${client}" != "nethermind" ]]; then
                client_snapshot_dir="/mnt/sda/${client}-25490000"
              fi
              ;;
            *)
              echo "::error::Unsupported arch '${arch}' (expected amd64 or arm64)."
              exit 1
              ;;
          esac

          if [[ "${arch}" == "arm64" && "${client}" == "geth" ]]; then
            echo "::error::The reproducible-benchmarks-arm runner has the Reth snapshot only; client=geth requires arch=amd64."
            exit 1
          fi

          if [[ "${client}" == "geth" ]]; then
            snapshot_mount_path="/execution-data/geth"
          fi

          # The ARM box stocks only a flat snapshot, and the config render rewrites only the flat
          # paths, so a halfpath run there would fail deep inside expb instead of here in seconds.
          if [[ "${arch}" == "arm64" && "${state_layout}" != "flat" ]]; then
            echo "::error::The reproducible-benchmarks-arm runner only serves a flat snapshot - dispatch with arch=amd64 for halfpath."
            exit 1
          fi

          # Default the FlatDb write-buffer (memtable) floor for flat layout by routing it through the
          # extra-flags pipeline, so it actually reaches Nethermind (same path as additional_extra_flags).
          # Skipped for non-flat layouts, when disabled (empty), or when the caller already set it.
          if [[ "${client}" == "nethermind" && "${state_layout}" == "flat" && -n "${flat_write_buffer_floor:-}" ]]; then
            if ! printf '%s' "${additional_extra_flags}" | grep -qi "PersistenceWriteBufferFloor"; then
              floor_flag="--FlatDb.PersistenceWriteBufferFloor=${flat_write_buffer_floor}"
              if [[ -n "${additional_extra_flags}" ]]; then
                additional_extra_flags="${additional_extra_flags}, ${floor_flag}"
              else
                additional_extra_flags="${floor_flag}"
              fi
            fi
          fi

          branch="${branch#refs/heads/}"
          if [[ -z "${branch}" ]]; then
            echo "Failed to resolve branch for event '${EVENT_NAME}'."
            exit 1
          fi

          if ! [[ "${delay_seconds}" =~ ^-?[0-9]+(\.[0-9]+)?$ ]]; then
            echo "delay_seconds must be a number (integer or decimal seconds, e.g. 0.25), got '${delay_seconds}'."
            exit 1
          fi

          if ! [[ "${cleanup_grace_seconds}" =~ ^[0-9]+$ ]]; then
            echo "cleanup_grace_seconds must be a non-negative integer, got '${cleanup_grace_seconds}'."
            exit 1
          fi

          if [[ -n "${amount}" ]] && ! [[ "${amount}" =~ ^[1-9][0-9]*$ ]]; then
            echo "amount must be a positive integer when provided, got '${amount}'."
            exit 1
          fi

          if [[ "${rebuild_docker}" != "true" && "${rebuild_docker}" != "false" ]]; then
            echo "rebuild_docker must be true or false, got '${rebuild_docker}'."
            exit 1
          fi

          if ! [[ "${run_count}" =~ ^[0-9]+$ ]] || [[ "${run_count}" -lt 1 ]]; then
            echo "run_count must be a positive integer, got '${run_count}'."
            exit 1
          fi

          if [[ "${measurement_mode}" != "standard" && "${measurement_mode}" != "compute-warm" ]]; then
            echo "measurement_mode must be standard or compute-warm, got '${measurement_mode}'."
            exit 1
          fi

          # Build JSON array of run indices: [1] or [1,2,3] etc.
          run_indices="["
          for (( i=1; i<=run_count; i++ )); do
            if [[ "${i}" -gt 1 ]]; then run_indices+=","; fi
            run_indices+="${i}"
          done
          run_indices+="]"

          clean_branch="$(echo "${branch}" | sed 's/[^a-zA-Z0-9._-]/-/g')"

          should_trigger_publish_docker="true"
          should_wait_for_publish_docker="false"
          if [[ "${branch}" == "master" || "${branch}" == "paprika" || "${branch}" == "performance" || "${branch}" == release/* ]]; then
            should_trigger_publish_docker="false"
            # On push, publish-docker.yml runs in parallel — wait for it instead of triggering
            if [[ "${EVENT_NAME}" == "push" ]]; then
              should_wait_for_publish_docker="true"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${rebuild_docker}" != "true" ]]; then
            should_trigger_publish_docker="false"
          fi
          if [[ "${client}" != "nethermind" ]]; then
            should_trigger_publish_docker="false"
            should_wait_for_publish_docker="false"
          fi

          if [[ "${state_layout}" == "flat" && "${payload_set}" == "superblocks" ]]; then
            config_file="github-action-compressed-mainnet-flat.yaml"
          elif [[ "${state_layout}" == "flat" && "${payload_set}" == "realblocks" ]]; then
            config_file="github-action-mainnet-flat.yaml"
          elif [[ "${state_layout}" == "flat" && "${payload_set}" == "fusaka" ]]; then
            config_file="github-action-mainnet-fusaka-flat.yaml"
          elif [[ "${state_layout}" == "halfpath" && "${payload_set}" == "superblocks" ]]; then
            config_file="github-action-compressed-mainnet.yaml"
          elif [[ "${state_layout}" == "halfpath" && "${payload_set}" == "fusaka" ]]; then
            config_file="github-action-mainnet-fusaka.yaml"
          else
            config_file="github-action-mainnet.yaml"
          fi

          scenario_name="${client}-${state_layout}-${payload_set}-${clean_branch}-delay${delay_seconds}s"

          {
            echo "should_run=${should_run}"
            echo "branch=${branch}"
            echo "clean_branch=${clean_branch}"
            echo "should_trigger_publish_docker=${should_trigger_publish_docker}"
            echo "should_wait_for_publish_docker=${should_wait_for_publish_docker}"
            echo "rebuild_docker=${rebuild_docker}"
            echo "config_file=${config_file}"
            echo "image_label=nethermindeth/nethermind:${clean_branch}"
            echo "expb_repo=${expb_repo}"
            echo "expb_branch=${expb_branch}"
            echo "expb_data_dir=${expb_data_dir}"
            echo "runner_label=${runner_label}"
            echo "flat_snapshot_dir=${flat_snapshot_dir}"
            echo "flat_snapshot_block_dir=${flat_snapshot_block_dir}"
            echo "delay_seconds=${delay_seconds}"
            echo "amount=${amount}"
            echo "cleanup_grace_seconds=${cleanup_grace_seconds}"
            echo "mode=${mode}"
            echo "scenario_name=${scenario_name}"
            echo "run_count=${run_count}"
            echo "run_indices=${run_indices}"
            echo "docker_images=${docker_images:-}"
            echo "retrospective_last=${retrospective_last:-100}"
            echo "retrospective_step=${retrospective_step:-10}"
            echo "state_layout=${state_layout}"
            echo "payload_sets=${payload_sets}"
            echo "dottrace=${dottrace}"
            echo "perf=${perf:-false}"
            echo "dottrace_mode=${dottrace_mode}"
            echo "trace_blocks=${trace_blocks}"
            echo "client_env=${client_env}"
            echo "measurement_mode=${measurement_mode}"
            echo "client=${client}"
            echo "measurement_source=${measurement_source}"
            echo "client_snapshot_dir=${client_snapshot_dir}"
            echo "snapshot_mount_path=${snapshot_mount_path}"
            echo "additional_extra_flags<<EOF"
            printf '%s\n' "${additional_extra_flags}"
            echo "EOF"
            echo "expb_env<<EOF"
            printf '%s\n' "${expb_env}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  prepare-docker:
    needs: [resolve]
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.mode == 'single'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve-image.outputs.image }}
      image_revision: ${{ steps.resolve-image.outputs.revision }}
    steps:
      - name: Docker image source
        if: needs.resolve.outputs.should_trigger_publish_docker != 'true' && needs.resolve.outputs.should_wait_for_publish_docker != 'true'
        run: |
          echo "Skipping publish-docker.yml for branch '${{ needs.resolve.outputs.branch }}'."
          echo "Using existing image '${{ needs.resolve.outputs.image_label }}'."

      - name: Checkout repository
        if: needs.resolve.outputs.should_trigger_publish_docker == 'true'
        uses: actions/checkout@v6

      - name: Trigger publish-docker.yml
        if: needs.resolve.outputs.should_trigger_publish_docker == 'true'
        id: trigger-publish-docker
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: publish-docker.yml
          ref: ${{ needs.resolve.outputs.branch }}
          token: ${{ github.token }}
          inputs: '{
            "image-name": "nethermind",
            "tag": "${{ needs.resolve.outputs.clean_branch }}",
            "dockerfile": "Dockerfile",
            "build-config": "release"
            }'

      - name: Wait for publish-docker.yml to complete
        if: needs.resolve.outputs.should_trigger_publish_docker == 'true'
        id: wait-publish-docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_ID: publish-docker.yml
          MAX_WAIT_MINUTES: "10"
          INTERVAL: "10"
          TIMEOUT: "120"
          ORG_NAME: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Wait on the run we actually dispatched. Without this the script falls back to discovering a
          # run by workflow name + branch, which silently latches onto any other concurrent build of the
          # same branch and reports success for an image that was never produced.
          RUN_ID: ${{ steps.trigger-publish-docker.outputs.runId }}
          NAME_FILTER: Publish Docker image
          REF: ${{ needs.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          # An empty runId would silently fall back to run discovery - the exact false green this
          # guards against. benc-uk/workflow-dispatch returns without setting outputs (and without
          # failing) when the target workflow is disabled, and @v1 is a moving tag that could drop the
          # output, so make the bypass impossible rather than unlikely.
          if [ -z "${RUN_ID}" ]; then
            echo "::error::The dispatch step produced no runId; refusing to fall back to run discovery."
            exit 1
          fi
          chmod +x scripts/wait-for-workflow.sh
          ./scripts/wait-for-workflow.sh
          publish_head_sha=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${ORG_NAME}/${REPO_NAME}/actions/runs/${RUN_ID}" \
            | jq -r '.head_sha // empty')
          if ! [[ "${publish_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::publish-docker run ${RUN_ID} has no valid head_sha."
            exit 1
          fi
          echo "head_sha=${publish_head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Wait for parallel publish-docker.yml
        if: needs.resolve.outputs.should_wait_for_publish_docker == 'true'
        id: wait-parallel-publish-docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for parallel publish-docker.yml triggered by the same push (SHA: ${HEAD_SHA})..."

          max_discovery_seconds=300  # 5 min to discover the run
          poll_interval=15
          max_completion_seconds=7200  # 2 hours to complete

          # Phase 1: discover the parallel publish-docker run for this commit
          elapsed=0
          run_id=""
          while [[ -z "${run_id}" ]]; do
            response=$(curl -sf \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/publish-docker.yml/runs?head_sha=${HEAD_SHA}&per_page=5" \
              || echo '{"workflow_runs":[]}')

            run_id=$(echo "${response}" | jq -r '[.workflow_runs[] | select(.name | test("Publish Docker"))] | .[0].id // empty')

            if [[ -n "${run_id}" ]]; then
              echo "Found publish-docker run: ${run_id}"
              break
            fi

            elapsed=$(( elapsed + poll_interval ))
            if [[ "${elapsed}" -ge "${max_discovery_seconds}" ]]; then
              echo "No publish-docker.yml run found for SHA ${HEAD_SHA} within ${max_discovery_seconds}s."
              echo "This push may not include src/Nethermind changes. Proceeding with existing image."
              exit 0
            fi

            echo "No run found yet, retrying in ${poll_interval}s... (${elapsed}/${max_discovery_seconds}s)"
            sleep "${poll_interval}"
          done

          # Phase 2: wait for the run to complete
          elapsed=0
          while true; do
            run_data=$(curl -sf \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${run_id}" \
              || echo '{}')

            status=$(echo "${run_data}" | jq -r '.status // "unknown"')
            conclusion=$(echo "${run_data}" | jq -r '.conclusion // empty')

            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                publish_head_sha=$(echo "${run_data}" | jq -r '.head_sha // empty')
                if ! [[ "${publish_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  echo "::error::Parallel publish-docker run ${run_id} has no valid head_sha."
                  exit 1
                fi
                echo "head_sha=${publish_head_sha}" >> "${GITHUB_OUTPUT}"
                echo "Parallel publish-docker.yml completed successfully."
                echo "Run: https://github.com/${OWNER}/${REPO}/actions/runs/${run_id}"
                exit 0
              else
                echo "Parallel publish-docker.yml finished with conclusion: ${conclusion}"
                echo "Run: https://github.com/${OWNER}/${REPO}/actions/runs/${run_id}"
                echo "Benchmark will proceed but may use a stale Docker image."
                exit 1
              fi
            fi

            elapsed=$(( elapsed + poll_interval ))
            if [[ "${elapsed}" -ge "${max_completion_seconds}" ]]; then
              echo "Timeout waiting for publish-docker.yml run ${run_id} to complete (${max_completion_seconds}s)."
              exit 1
            fi

            echo "Run ${run_id} status: ${status} — waiting ${poll_interval}s... (${elapsed}/${max_completion_seconds}s)"
            sleep "${poll_interval}"
          done

      - name: Resolve immutable image and revision
        id: resolve-image
        env:
          IMAGE_LABEL: ${{ needs.resolve.outputs.image_label }}
          EXPECTED_REVISION: ${{ steps.wait-publish-docker.outputs.head_sha || steps.wait-parallel-publish-docker.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_LABEL}" ]]; then
            echo "::error::No Docker image label was resolved."
            exit 1
          fi

          inspect_output="$(docker buildx imagetools inspect "${IMAGE_LABEL}")"
          image_digest="$(printf '%s\n' "${inspect_output}" | awk '$1 == "Digest:" { print $2; exit }')"
          if ! [[ "${image_digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Could not resolve an immutable multiarch digest for ${IMAGE_LABEL}."
            exit 1
          fi
          image="${IMAGE_LABEL%%@*}@${image_digest}"
          echo "Resolved ${IMAGE_LABEL} to ${image}."

          docker pull "${image}"
          version_status=0
          version_output="$(docker run --rm --network none --platform linux/amd64 --entrypoint /nethermind/Nethermind.Runner "${image}" --version 2>&1)" || version_status=$?
          printf '%s\n' "${version_output}"
          if [[ "${version_status}" -ne 0 ]]; then
            echo "::error::Pinned image version probe failed with exit code ${version_status}."
            exit "${version_status}"
          fi
          revision="$(printf '%s\n' "${version_output}" | sed -nE 's/^Commit:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' | head -n 1)"
          if ! [[ "${revision}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Pinned image ${image} did not report a valid 40-character Commit revision."
            exit 1
          fi

          if [[ -n "${EXPECTED_REVISION}" ]]; then
            expected_lower="$(printf '%s' "${EXPECTED_REVISION}" | tr '[:upper:]' '[:lower:]')"
            revision_lower="$(printf '%s' "${revision}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${revision_lower}" != "${expected_lower}" ]]; then
              echo "::error::Pinned image reports commit ${revision}, but publish-docker produced ${EXPECTED_REVISION}."
              exit 1
            fi
          fi

          {
            echo "image=${image}"
            echo "revision=${revision}"
          } >> "${GITHUB_OUTPUT}"

  benchmark:
    name: benchmark (${{ matrix.payload_set }}${{ needs.resolve.outputs.run_count != '1' && format(', run {0}', matrix.run) || '' }})
    needs: [resolve, prepare-docker]
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.mode == 'single'
    strategy:
      matrix:
        run: ${{ fromJson(needs.resolve.outputs.run_indices) }}
        payload_set: ${{ fromJson(needs.resolve.outputs.payload_sets) }}
      max-parallel: 1
      fail-fast: false
    runs-on: [self-hosted, "${{ needs.resolve.outputs.runner_label }}"]
    timeout-minutes: 720
    env:
      EXPB_DATA_DIR: ${{ needs.resolve.outputs.expb_data_dir }}
      FLAT_SNAPSHOT_DIR: ${{ needs.resolve.outputs.flat_snapshot_dir }}
      FLAT_SNAPSHOT_BLOCK_DIR: ${{ needs.resolve.outputs.flat_snapshot_block_dir }}
      NETHERMIND_IMAGE: ${{ needs.prepare-docker.outputs.image }}
      IMAGE_REVISION: ${{ needs.prepare-docker.outputs.image_revision }}
      CLEANUP_GRACE_SECONDS: ${{ needs.resolve.outputs.cleanup_grace_seconds }}
      MEASUREMENT_MODE: ${{ needs.resolve.outputs.measurement_mode }}
      CLIENT: ${{ needs.resolve.outputs.client }}
      MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
    steps:
      - name: Resolve benchmark config for payload set
        id: resolve-config
        shell: bash
        env:
          STATE_LAYOUT: ${{ needs.resolve.outputs.state_layout }}
          PAYLOAD_SET: ${{ matrix.payload_set }}
          CLEAN_BRANCH: ${{ needs.resolve.outputs.clean_branch }}
          DELAY_SECONDS: ${{ needs.resolve.outputs.delay_seconds }}
          RUN: ${{ matrix.run }}
          RUN_COUNT: ${{ needs.resolve.outputs.run_count }}
          CLIENT: ${{ needs.resolve.outputs.client }}
        run: |
          set -euo pipefail
          if [[ "${STATE_LAYOUT}" == "flat" && "${PAYLOAD_SET}" == "superblocks" ]]; then
            config_file="github-action-compressed-mainnet-flat.yaml"
          elif [[ "${STATE_LAYOUT}" == "flat" && "${PAYLOAD_SET}" == "realblocks" ]]; then
            config_file="github-action-mainnet-flat.yaml"
          elif [[ "${STATE_LAYOUT}" == "flat" && "${PAYLOAD_SET}" == "fusaka" ]]; then
            config_file="github-action-mainnet-fusaka-flat.yaml"
          elif [[ "${STATE_LAYOUT}" == "halfpath" && "${PAYLOAD_SET}" == "superblocks" ]]; then
            config_file="github-action-compressed-mainnet.yaml"
          elif [[ "${STATE_LAYOUT}" == "halfpath" && "${PAYLOAD_SET}" == "fusaka" ]]; then
            config_file="github-action-mainnet-fusaka.yaml"
          else
            config_file="github-action-mainnet.yaml"
          fi
          scenario_name="${CLIENT}-${STATE_LAYOUT}-${PAYLOAD_SET}-${CLEAN_BRANCH}-delay${DELAY_SECONDS}s"
          if [[ "${RUN_COUNT}" -gt 1 ]]; then
            scenario_name="${scenario_name}-run${RUN}"
          fi
          echo "CONFIG_FILE=${config_file}" >> "${GITHUB_ENV}"
          echo "SCENARIO_NAME=${scenario_name}" >> "${GITHUB_ENV}"
          echo "config_file=${config_file}" >> "${GITHUB_OUTPUT}"
          echo "scenario_name=${scenario_name}" >> "${GITHUB_OUTPUT}"

      - name: Print resolved inputs
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Runner: ${{ needs.resolve.outputs.runner_label }}"
          echo "Payload set: ${{ matrix.payload_set }}"
          echo "Nethermind branch: ${{ needs.resolve.outputs.branch }}"
          echo "Docker image: ${NETHERMIND_IMAGE}"
          echo "Docker image revision: ${IMAGE_REVISION}"
          echo "Client: ${CLIENT}"
          echo "Measurement source: ${MEASUREMENT_SOURCE}"
          echo "Config file: ${EXPB_DATA_DIR}/${CONFIG_FILE}"
          echo "Delay placeholder value: ${{ needs.resolve.outputs.delay_seconds }}"
          echo "Rebuild docker requested: ${{ needs.resolve.outputs.rebuild_docker }}"
          echo "Publish docker workflow triggered: ${{ needs.resolve.outputs.should_trigger_publish_docker }}"
          echo "Cleanup grace period (s): ${CLEANUP_GRACE_SECONDS}"
          echo "Scenario name: ${SCENARIO_NAME}"

      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            run_as_root() { if [[ "${EUID}" -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
            run_as_root apt-get update
            run_as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            run_as_root systemctl start docker || run_as_root service docker start
          fi
          docker version

      - name: Restore cached master metrics
        id: restore-master-metrics
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: /tmp/expb-master-metrics-cache-${{ matrix.payload_set }}
          key: expb-master-metrics-v4-${{ matrix.payload_set }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            expb-master-metrics-v4-${{ matrix.payload_set }}-

      - name: Ensure EXPB config file exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${EXPB_DATA_DIR}/${CONFIG_FILE}" ]]; then
            echo "Config file '${EXPB_DATA_DIR}/${CONFIG_FILE}' does not exist."
            echo "Available github-action config files in '${EXPB_DATA_DIR}':"
            ls -1 "${EXPB_DATA_DIR}"/github-action*mainnet*.yaml || true
            exit 1
          fi

      - name: Render benchmark config
        id: render-config
        shell: bash
        env:
          SOURCE_CONFIG_FILE: ${{ env.EXPB_DATA_DIR }}/${{ env.CONFIG_FILE }}
          RENDERED_CONFIG_FILE: ${{ runner.temp }}/rendered-expb-config.yaml
          DOCKER_TAG: ${{ needs.prepare-docker.outputs.image }}
          IMAGE_REVISION: ${{ needs.prepare-docker.outputs.image_revision }}
          DELAY_SECONDS: ${{ needs.resolve.outputs.delay_seconds }}
          AMOUNT: ${{ needs.resolve.outputs.amount }}
          PAYLOAD_SET: ${{ matrix.payload_set }}
          SCENARIO_NAME: ${{ env.SCENARIO_NAME }}
          ADDITIONAL_EXTRA_FLAGS: ${{ needs.resolve.outputs.additional_extra_flags }}
          TRACE_BLOCKS: ${{ needs.resolve.outputs.trace_blocks }}
          CLIENT_ENV: ${{ needs.resolve.outputs.client_env }}
          EXPB_ENV_PASSTHROUGH: ${{ needs.resolve.outputs.expb_env }}
          MEASUREMENT_MODE: ${{ needs.resolve.outputs.measurement_mode }}
        run: |
          set -euo pipefail
          if [[ -z "${AMOUNT}" ]]; then
            if [[ "${PAYLOAD_SET}" == "realblocks" || "${PAYLOAD_SET}" == "fusaka" ]]; then
              AMOUNT="1000"
            else
              AMOUNT="100"
            fi
          fi
          flags_file="$(mktemp)"
          printf '%s' "${ADDITIONAL_EXTRA_FLAGS}" \
            | tr '\r' '\n' \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | awk '
                function emit_pending() {
                  if (pending != "") {
                    print pending
                    pending = ""
                  }
                }
                {
                  line = $0

                  # Convert "--Key Value" to "--Key=Value" to avoid bare value tokens.
                  if (match(line, /^--[^[:space:]=]+[[:space:]]+/)) {
                    key = substr(line, 1, RLENGTH)
                    sub(/[[:space:]]+$/, "", key)
                    value = substr(line, RLENGTH + 1)
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                    emit_pending()
                    print key "=" value
                    next
                  }

                  if (line ~ /^--/) {
                    emit_pending()
                    pending = line
                    next
                  }

                  if (pending != "") {
                    print pending "=" line
                    pending = ""
                  } else {
                    print line
                  }
                }
                END {
                  emit_pending()
                }
              ' \
            > "${flags_file}"

          if [[ "${MEASUREMENT_MODE}" == "compute-warm" ]]; then
            if printf '%s\n' "${ADDITIONAL_EXTRA_FLAGS}" | grep -Eiq -- '--JsonRpc[.]GasCap([=[:space:]]|$)'; then
              echo "::error::measurement_mode=compute-warm cannot be combined with a JsonRpc.GasCap override."
              exit 1
            fi
            if printf '%s\n' "${EXPB_ENV_PASSTHROUGH}" | tr ',' '\n' | grep -Eiq '^[[:space:]]*EXPB_EVM_WARMUP[[:space:]]*='; then
              echo "::error::measurement_mode=compute-warm cannot be combined with an EXPB_EVM_WARMUP override."
              exit 1
            fi
            printf '%s\n' '--JsonRpc.GasCap=1000000000000' >> "${flags_file}"
          fi

          YQ="${RUNNER_TEMP}/yq"
          case "$(uname -m)" in
            x86_64) yq_arch="amd64" ;;
            aarch64|arm64) yq_arch="arm64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 120 "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${yq_arch}" -o "${YQ}"
          chmod +x "${YQ}"
          yq_version="$("${YQ}" --version)"
          [[ "${yq_version}" == "yq "* ]] || { echo "Downloaded yq is not yq: ${yq_version}"; exit 1; }

          # Replace placeholders and rename scenario key with sed (preserves comments)
          sed \
            -e "s#nethermindeth/nethermind:<<DOCKER_TAG>>#${DOCKER_TAG}#g" \
            -e "s#<<DOCKER_TAG>>#${DOCKER_TAG}#g" \
            -e "s#<<DELAY>>#${DELAY_SECONDS}#g" \
            ${AMOUNT:+-e "s#<<AMOUNT>>#${AMOUNT}#g"} \
            -e "s#/mnt/sda/expb-data#${EXPB_DATA_DIR}#g" \
            -e "s#/mnt/sda/nethermind-flat-snapshot#${FLAT_SNAPSHOT_DIR}#g" \
            -e "s#/mnt/sda/nethermind-flat-25490000#${FLAT_SNAPSHOT_BLOCK_DIR}#g" \
            -e "s#^\([[:space:]]*\)nethermind:#\1${SCENARIO_NAME}:#g" \
            "${SOURCE_CONFIG_FILE}" > "${RENDERED_CONFIG_FILE}"

          # Limit the client by affinity instead of the CFS quota, whose throttling adds run-to-run
          # variance: keep resources.cpu CPUs of the cpuset, as whole cores so no SMT sibling is shared.
          expand_cpus() {
            local part
            local -a parts
            IFS=',' read -ra parts <<< "$1"
            for part in "${parts[@]}"; do
              if [[ "${part}" == *-* ]]; then seq "${part%-*}" "${part#*-}"; elif [[ -n "${part}" ]]; then echo "${part}"; fi
            done
          }
          topology="${CPU_TOPOLOGY_DIR:-/sys/devices/system/cpu}"
          cpu_count="$("${YQ}" -r '.resources.cpu // 0' "${RENDERED_CONFIG_FILE}")"
          cpuset="$("${YQ}" -r '.resources.cpuset // ""' "${RENDERED_CONFIG_FILE}")"
          [[ "${cpu_count}" =~ ^[0-9]+$ ]] || { echo "::error::resources.cpu must be a whole number of CPUs, got '${cpu_count}'."; exit 1; }
          if (( cpu_count > 0 )); then
            [[ -n "${cpuset}" ]] || { echo "::error::resources.cpu=${cpu_count} needs a resources.cpuset to pin the client to."; exit 1; }
            mapfile -t allowed < <(expand_cpus "${cpuset}")
            if (( cpu_count < ${#allowed[@]} )); then
              declare -A in_set=() taken=()
              for cpu in "${allowed[@]}"; do in_set[${cpu}]=1; done
              for cpu in "${allowed[@]}"; do
                [[ -n "${taken[${cpu}]:-}" ]] && continue
                siblings_file="${topology}/cpu${cpu}/topology/thread_siblings_list"
                [[ -r "${siblings_file}" ]] || { echo "::error::cannot read ${siblings_file} to pin whole cores."; exit 1; }
                core=()
                while read -r sibling; do
                  [[ -n "${in_set[${sibling}]:-}" ]] && core+=("${sibling}")
                done < <(expand_cpus "$(< "${siblings_file}")")
                (( ${#taken[@]} + ${#core[@]} <= cpu_count )) || continue
                for sibling in "${core[@]}"; do taken[${sibling}]=1; done
              done
              (( ${#taken[@]} == cpu_count )) || { echo "::error::cannot pick ${cpu_count} CPUs as whole cores from cpuset ${cpuset}."; exit 1; }
              cpuset="$(printf '%s\n' "${!taken[@]}" | sort -n | paste -sd, -)"
              C="${cpuset}" "${YQ}" -i '.resources.cpuset = strenv(C)' "${RENDERED_CONFIG_FILE}"
            fi
            echo "Pinned the client to CPUs ${cpuset} for resources.cpu=${cpu_count}."
          fi

          # Zero disables the CPU quota; omitting cpu would restore EXPB's default quota.
          "${YQ}" -i '.resources.cpu = 0' "${RENDERED_CONFIG_FILE}"

          scenario_key="${SCENARIO_NAME}"

          # Append extra flags using yq (proper YAML handling)
          while IFS= read -r flag; do
            [[ -z "${flag}" ]] && continue
            "${YQ}" -i ".scenarios.\"${scenario_key}\".extra_flags += [\"${flag}\"]" "${RENDERED_CONFIG_FILE}"
          done < "${flags_file}"

          # Targeted per-block dotTrace: tell the client (BlockProfiler plugin) which blocks to snapshot.
          if [[ -n "${TRACE_BLOCKS:-}" ]]; then
            SK="${scenario_key}" V="${TRACE_BLOCKS}" \
              "${YQ}" -i '.scenarios.[strenv(SK)].extra_env.NETHERMIND_PROFILE_BLOCKS = strenv(V)' "${RENDERED_CONFIG_FILE}"
            echo "Set NETHERMIND_PROFILE_BLOCKS=${TRACE_BLOCKS} for targeted dotTrace."
          fi

          # Extra client container env vars (KEY=VALUE, comma-separated), e.g. GC tuning experiments.
          # Keys/values go through strenv so quotes and yq metacharacters in values stay literal.
          if [[ -n "${CLIENT_ENV:-}" ]]; then
            IFS=',' read -ra client_env_entries <<< "${CLIENT_ENV}"
            for entry in "${client_env_entries[@]}"; do
              entry="${entry#"${entry%%[![:space:]]*}"}"
              entry="${entry%"${entry##*[![:space:]]}"}"
              [[ -z "${entry}" || "${entry}" != *"="* ]] && continue
              env_key="${entry%%=*}"
              env_value="${entry#*=}"
              SK="${scenario_key}" K="${env_key}" V="${env_value}" \
                "${YQ}" -i '.scenarios.[strenv(SK)].extra_env.[strenv(K)] = strenv(V)' "${RENDERED_CONFIG_FILE}"
              echo "Set client env ${env_key}=${env_value}."
            done
          fi

          expected_amount="$("${YQ}" -r ".scenarios.\"${scenario_key}\".amount // \"\"" "${RENDERED_CONFIG_FILE}")"
          echo "expected_amount=${expected_amount}" >> "${GITHUB_OUTPUT}"
          echo "rendered_config_file=${RENDERED_CONFIG_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Install or upgrade expb
        shell: bash
        env:
          EXPB_REPO: ${{ needs.resolve.outputs.expb_repo }}
          EXPB_BRANCH: ${{ needs.resolve.outputs.expb_branch }}
          PERF: ${{ needs.resolve.outputs.perf }}
          MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
        run: |
          set -euo pipefail

          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="${HOME}/.local/bin:${PATH}"
          fi

          if [[ "${EXPB_REPO}" == "NethermindEth/execution-payloads-benchmarks" && "${EXPB_BRANCH}" == "main" ]]; then
            expb_source="git+https://github.com/NethermindEth/execution-payloads-benchmarks"
          elif [[ -n "${EXPB_BRANCH}" ]]; then
            expb_source="git+https://github.com/${EXPB_REPO}@${EXPB_BRANCH}"
          elif [[ "${EXPB_REPO}" == "NethermindEth/execution-payloads-benchmarks" ]]; then
            expb_source="git+https://github.com/${EXPB_REPO}@main"
          else
            expb_source="git+https://github.com/${EXPB_REPO}"
          fi
          echo "Installing expb from ${expb_source}"
          uv tool install --force --from "${expb_source}" expb
          echo "EXPB_SOURCE=${expb_source}" >> "${GITHUB_ENV}"
          expb_bin="$(uv tool dir --bin)/expb"
          requested_flags=()
          if [[ "${PERF}" == "true" ]]; then requested_flags+=(--perf); fi
          if [[ "${MEASUREMENT_SOURCE}" == "engine-api" ]]; then requested_flags+=(--no-client-metrics); fi
          if [[ "${#requested_flags[@]}" -gt 0 ]]; then
            if ! capability_output="$(NO_COLOR=1 "${expb_bin}" execute-scenarios "${requested_flags[@]}" --help 2>&1)"; then
              echo "::error::Installed expb from ${expb_source} does not support requested capability flag(s): ${requested_flags[*]}."
              printf '%s\n' "${capability_output}"
              exit 1
            fi
          fi
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"

      - name: Reap leftover benchmark containers and networks
        shell: bash
        run: |
          set -uo pipefail
          # A hard-cancelled run leaves its container running: it holds the snapshot overlay the next
          # step unmounts - so the plain umount there would fall back to a lazy detach that leaves the
          # filesystem alive - and it holds the deterministic name, network and ports the replacement
          # run needs. arm-runner-maintenance.yml reaps containers ahead of the same sweep for this
          # reason; expb names and labels every container and network it creates `expb`. The rest of
          # the filter list matches that file, because the sweep is anchored on the whole benchmark
          # data dir and rpc-bench parks its scratch overlays under it too.
          for filter in name=expb label=expb name=rpcbench- name=nethermind-rpcbench name=ethcallchaos-bench name=jsonbench-; do
            docker ps -aq --filter "${filter}" | xargs -r docker rm -f || true
            # Orphaned expb networks fail scenario re-runs with a 409 on the name collision.
            docker network ls -q --filter "${filter}" | xargs -r docker network rm >/dev/null 2>&1 || true
          done
          exit 0

      - name: Reap stale expb overlay mounts
        shell: bash
        run: |
          set -uo pipefail
          # A cancelled run never unmounts its snapshot overlay, so the next `mount -t overlay` over the
          # same path fails with exit status 32 and the benchmark dies ~90s in; container, network and
          # volume pruning all leave the mount in place. Anchored on the benchmark data dir rather than on
          # expb's `paths.work` leaf, so renaming that cannot silently turn this into a no-op, and
          # rpc-bench's scratch overlays on the same box get swept too.
          #
          # This body is duplicated verbatim in arm-runner-maintenance.yml and in both benchmark jobs of
          # run-expb-reproducible-benchmarks.yml. Sharing it would take a composite action and therefore
          # actions/checkout, which none of the three jobs has and which arm-runner-maintenance.yml must
          # not depend on - it is the workflow you dispatch when the disk is full.
          # scripts/ci/test_reap_stale_overlays.py asserts the three copies are byte-identical and drives
          # this body against synthetic mount tables.
          # Positional, not an env var: GitHub invokes a `run:` block with no arguments after the
          # script path, so only that test can point this at a table it wrote.
          MOUNTS="${1:-/proc/self/mounts}"
          as_root() { if [[ "$(id -u)" -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
          # Any mount left on this target, whatever its type - the check that an unmount actually took.
          still_mounted() { awk -v t="$1" '$2 == t { found = 1 } END { exit !found }' "${MOUNTS}"; }

          # The sweep root is what every rm -rf below is bounded by, so canonicalize it - '..' or a
          # trailing slash must not widen it - and refuse '/' or a single top-level component outright.
          root="${EXPB_DATA_DIR:-}"
          [[ -n "${root}" ]] || { echo "::warning::EXPB_DATA_DIR is empty - skipping overlay reap."; exit 0; }
          root="$(realpath -m -- "${root}")" || { echo "::warning::cannot canonicalize EXPB_DATA_DIR - skipping overlay reap."; exit 0; }
          case "${root}" in
            /?*/?*) ;;
            *) echo "::warning::EXPB_DATA_DIR '${root}' is too shallow for a recursive sweep - skipping."; exit 0 ;;
          esac

          # Deepest first, so nested mounts unwind. Options are kept per mount line rather than per target:
          # stacked overlays share a target and `umount` pops one layer at a time, so a target's scratch
          # dirs must not be deleted until every layer on it is gone.
          declare -A scratch=()
          targets=()
          while IFS=$'\t' read -r mp opts; do
            [[ -n "${scratch[${mp}]+set}" ]] || targets+=("${mp}")
            scratch["${mp}"]+="${opts}"$'\n'
          done < <(awk -v d="${root}" -v OFS='\t' '$3 == "overlay" && index($2, d "/") == 1 { print $2, $4 }' "${MOUNTS}" | sort -r)

          if [[ "${#targets[@]}" -eq 0 ]]; then
            echo "No stale expb overlay mounts under ${root}."
            # Surface what we did not match, so layout drift shows up in the log instead of a reassuring
            # "clean"; docker's own overlays live under /var/lib and are not ours. Capped inside awk
            # rather than piped into `head`, whose early exit would SIGPIPE awk and - under the errexit
            # GitHub runs this body with - abort the step before the trailing `exit 0`.
            awk '$3 == "overlay" && index($2, "/var/lib/") != 1 && ++n <= 20 { print "  unmatched overlay: " $2 }' "${MOUNTS}"
            exit 0
          fi

          for mp in "${targets[@]}"; do
            # An octal-escaped target is unusable twice over: `awk -v` decodes the escape back, so
            # still_mounted cannot find the line and would report a phantom success, and `umount`
            # cannot address the literal path either. Refuse it like an escaped scratch path.
            if [[ "${mp}" == *"\\"* ]]; then
              echo "::warning::refusing escaped overlay mount target: ${mp}"
              continue
            fi
            # Plain unmount first: `umount -l` can report success while a container-held reference still
            # blocks the next mount. Lazy is the fallback for that case. The loop is bounded so that
            # stacked layers unwind and a `umount` that returns 0 without detaching cannot spin the step.
            for _ in 1 2 3 4 5 6 7 8; do
              still_mounted "${mp}" || break
              as_root umount "${mp}" 2>/dev/null || as_root umount -l "${mp}" 2>/dev/null || break
            done
            if still_mounted "${mp}"; then
              echo "::warning::${mp} is still mounted - leaving its overlay scratch dirs in place"
              continue
            fi
            echo "unmounted ${mp}"
            # upper/work hold the cancelled run's writes: the GB the unmount alone leaves behind, and state
            # the next overlay would silently layer on top of its snapshot. The paths come from the kernel's
            # own mount options rather than being guessed.
            while IFS= read -r d; do
              [[ -n "${d}" ]] || continue
              # /proc/self/mounts octal-escapes space, tab and backslash in paths; refuse rather than point
              # rm -rf at a path whose decoding we would have to assume.
              if [[ "${d}" == *"\\"* ]]; then
                echo "::warning::refusing escaped overlay scratch path: ${d}"
                continue
              fi
              c="$(realpath -m -- "${d}")" || { echo "::warning::cannot canonicalize scratch path: ${d}"; continue; }
              # Strict descendant only - a plain '$root/*' glob also matches the data dir itself, which
              # holds the snapshots this box exists for.
              if [[ "${c}" != "${root}"/?* ]]; then
                echo "::warning::refusing overlay scratch path outside ${root}: ${d}"
                continue
              fi
              if as_root rm -rf -- "${c}"; then
                echo "removed ${c}"
              else
                echo "::warning::failed to remove ${c}"
              fi
            done < <(printf '%s' "${scratch[${mp}]}" | tr ',' '\n' | sed -n 's/^\(upperdir\|workdir\)=//p' | sort -u)
          done
          exit 0

      - name: Run expb scenarios
        id: run-expb
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.EXPB_DATA_DIR }}
        env:
          RAW_RUN_LOG: ${{ runner.temp }}/expb-run.log
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          PERF: ${{ needs.resolve.outputs.perf }}
          DOTTRACE_MODE: ${{ needs.resolve.outputs.dottrace_mode }}
          EXPB_ENV_PASSTHROUGH: ${{ needs.resolve.outputs.expb_env }}
          MEASUREMENT_MODE: ${{ needs.resolve.outputs.measurement_mode }}
          MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
        run: |
          set -euo pipefail
          expb_pid=""
          : > "${RAW_RUN_LOG}"

          # Export caller-provided expb env tuning (comma- or newline-separated KEY=VALUE;
          # values containing commas must use the newline-separated form).
          if [[ -n "${EXPB_ENV_PASSTHROUGH:-}" ]]; then
            while IFS= read -r _kv; do
              _kv="$(printf '%s' "${_kv}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [[ -z "${_kv}" ]] && continue
              if [[ "${_kv}" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
                export "${_kv}"
                echo "Exported expb env: ${_kv%%=*}=<value>"
              else
                echo "::warning::Skipping invalid expb_env entry (expected KEY=VALUE): ${_kv}"
              fi
            done < <(printf '%s\n' "${EXPB_ENV_PASSTHROUGH}" | tr ',' '\n')
          fi

          if [[ "${MEASUREMENT_MODE}" == "compute-warm" ]]; then
            export EXPB_EVM_WARMUP=1
            echo "Enabled EXPB_EVM_WARMUP=1 for compute-warm measurement."
          fi

          on_terminate() {
            echo "Termination signal received. Waiting up to ${CLEANUP_GRACE_SECONDS}s for expb cleanup."
            if [[ -n "${expb_pid}" ]] && kill -0 "${expb_pid}" 2>/dev/null; then
              kill -TERM "${expb_pid}" 2>/dev/null || true

              remaining="${CLEANUP_GRACE_SECONDS}"
              while [[ "${remaining}" -gt 0 ]]; do
                if ! kill -0 "${expb_pid}" 2>/dev/null; then
                  echo "expb exited during cleanup grace period."
                  break
                fi
                sleep 1
                remaining=$((remaining - 1))
              done

              if kill -0 "${expb_pid}" 2>/dev/null; then
                echo "Cleanup grace period elapsed. Forcing expb shutdown."
                kill -KILL "${expb_pid}" 2>/dev/null || true
              fi
            fi
            exit 143
          }

          trap on_terminate TERM INT

          profiling_flags=()
          measurement_flags=()
          if [[ "${MEASUREMENT_SOURCE}" == "engine-api" ]]; then
            # Cross-client runs use the common K6 HTTP timing table. Avoid starting the
            # Nethermind-only SSE feed even when the selected image happens to be Nethermind.
            measurement_flags+=(--no-client-metrics)
          fi
          if [[ "${DOTTRACE}" == "true" ]]; then
            # dotnet-trace (EventPipe runtime events: gc/contention/threading/exception)
            # always rides along with dotTrace - different channel, adds the GC/lock story
            # the CPU profile cannot show. Requires expb with --dotnet-trace support.
            profiling_flags+=(--dottrace --dottrace-mode "${DOTTRACE_MODE:-sampling}" --dotnet-trace)
          fi
          if [[ "${PERF}" == "true" ]]; then
            # perf samples on the host; the client only needs the perf-map env, which
            # expb sets on the container. Nothing extra is required in the image.
            profiling_flags+=(--perf)
          fi

          if [[ "${#profiling_flags[@]}" -eq 0 ]]; then
            echo "expb profiling flags: none"
          else
            printf 'expb profiling flags:'
            printf ' %q' "${profiling_flags[@]}"
            printf '\n'
          fi
          if [[ "${#measurement_flags[@]}" -eq 0 ]]; then
            echo "expb measurement flags: client metrics enabled (measurement_source=${MEASUREMENT_SOURCE})"
          else
            echo "expb measurement flags: --no-client-metrics (measurement_source=${MEASUREMENT_SOURCE})"
          fi

          # Marker for profiling artifact collection — only files newer than this
          touch "${RUNNER_TEMP}/.expb-run-marker"

          fifo="${RUNNER_TEMP}/expb-pipe"
          mkfifo "${fifo}"
          tee "${RAW_RUN_LOG}" < "${fifo}" &
          tee_pid=$!

          expb execute-scenarios \
            --config-file "${{ steps.render-config.outputs.rendered_config_file }}" \
            --per-payload-metrics \
            --per-payload-metrics-logs \
            --print-logs \
            ${measurement_flags[@]+"${measurement_flags[@]}"} \
            ${profiling_flags[@]+"${profiling_flags[@]}"} \
            > "${fifo}" 2>&1 &
          expb_pid=$!

          set +e
          wait "${expb_pid}"
          expb_exit_code=$?
          set -e

          rm -f "${fifo}"
          wait "${tee_pid}"

          exit "${expb_exit_code}"

      - name: Analyze benchmark output
        id: analyze
        if: always()
        shell: bash
        env:
          RAW_RUN_LOG: ${{ runner.temp }}/expb-run.log
          MEASUREMENT_MODE: ${{ needs.resolve.outputs.measurement_mode }}
          MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
          EXPECTED_AMOUNT: ${{ steps.render-config.outputs.expected_amount }}
        run: |
          set -euo pipefail

          clean_log="${RUNNER_TEMP}/expb-run.clean.log"
          exception_lines="${RUNNER_TEMP}/expb-exceptions.log"
          invalid_block_lines="${RUNNER_TEMP}/expb-invalid-blocks.log"
          processing_ms="${RUNNER_TEMP}/expb-processing-ms.txt"
          processing_ms_sorted="${RUNNER_TEMP}/expb-processing-ms-sorted.txt"
          metrics_file="${RUNNER_TEMP}/expb-metrics.env"

          if [[ ! -f "${RAW_RUN_LOG}" ]]; then
            echo "Run output log '${RAW_RUN_LOG}' was not produced."
            exit 1
          fi

          sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "${RAW_RUN_LOG}" > "${clean_log}"

          warmup_status="not-requested"
          if [[ "${MEASUREMENT_MODE}" == "compute-warm" ]]; then
            measured_payload_indices="${RUNNER_TEMP}/expb-measured-payload-indices.txt"
            warmup_success_indices="${RUNNER_TEMP}/expb-warmup-success-indices.txt"
            warmup_failed_indices="${RUNNER_TEMP}/expb-warmup-failed-indices.txt"
            awk -F'|' '/^[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+(\.[0-9]+)?[[:space:]]*\|[[:space:]]*$/ { value = $2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value }' "${clean_log}" | LC_ALL=C sort -u > "${measured_payload_indices}"
            grep -Eio '\[payload-server\][[:space:]]+warmup[[:space:]]+block=[0-9]+[[:space:]]+ok\b' "${clean_log}" | sed -E 's/.*block=([0-9]+).*/\1/' | LC_ALL=C sort -u > "${warmup_success_indices}" || true
            grep -Eio '\[payload-server\][[:space:]]+warmup[[:space:]]+block=[0-9]+[[:space:]]+FAILED\b' "${clean_log}" | sed -E 's/.*block=([0-9]+).*/\1/' | LC_ALL=C sort -u > "${warmup_failed_indices}" || true
            missing_warmups=""
            if [[ -s "${measured_payload_indices}" ]]; then
              missing_warmups="$(LC_ALL=C comm -23 "${measured_payload_indices}" "${warmup_success_indices}")"
            else
              missing_warmups="no measured K6 payload rows"
            fi
            if [[ -s "${warmup_failed_indices}" ]]; then
              warmup_status="failed"
            elif [[ -z "${missing_warmups}" ]]; then
              warmup_status="ok"
            else
              warmup_status="missing"
              echo "Missing successful warmup records for measured payload indices: ${missing_warmups}"
            fi
          fi

          grep -in "Exception" "${clean_log}" > "${exception_lines}" || true
          exception_found="false"
          if [[ -s "${exception_lines}" ]]; then
            exception_found="true"
            echo "Found Exception lines in benchmark output:"
            head -n 40 "${exception_lines}"
          fi

          grep -Ein "invalid[[:space:]_-]*block" "${clean_log}" > "${invalid_block_lines}" || true
          invalid_block_found="false"
          if [[ -s "${invalid_block_lines}" ]]; then
            invalid_block_found="true"
            echo "Found invalid block lines in benchmark output:"
            head -n 40 "${invalid_block_lines}"
          fi

          # Flag additional severe runtime signals (warn, don't hard-fail)
          for pattern in "Unhandled" "Fatal" "^.*ERROR.*$"; do
            severe_lines=$(grep -in "${pattern}" "${clean_log}" | head -n 20) || true
            if [[ -n "${severe_lines}" ]]; then
              echo "::warning::Severe log pattern '${pattern}' detected in benchmark output"
              echo "${severe_lines}"
            fi
          done

          # Extract client-side processing times from SSE data feed unless the caller selected the
          # common Engine API timing source. The latter must use the K6 table even for Nethermind.
          client_ms="${RUNNER_TEMP}/expb-client-ms.txt"
          client_ms_sorted="${RUNNER_TEMP}/expb-client-ms-sorted.txt"
          if [[ "${MEASUREMENT_SOURCE}" == "engine-api" ]]; then
            : > "${client_ms}"
            echo "Using K6 TTFB data (measurement_source=engine-api)."
          else
            grep -oP '\[payload-server\] client_metric block_number=\d+ processing_ms=\K[0-9]+(\.[0-9]+)?' "${clean_log}" > "${client_ms}" || true
          fi

          if [[ -s "${client_ms}" ]]; then
            echo "Using SSE client_metric data ($(wc -l < "${client_ms}") samples)."
            cp "${client_ms}" "${processing_ms}"
          else
            [[ "${MEASUREMENT_SOURCE}" == "engine-api" ]] || echo "No SSE client_metric data found, falling back to K6 TTFB table."
            awk -F'|' '
              /^[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+(\.[0-9]+)?[[:space:]]*\|[[:space:]]*$/ {
                value = $4
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                if (value ~ /^[0-9]+(\.[0-9]+)?$/) {
                  print value
                }
              }
            ' "${clean_log}" > "${processing_ms}"
          fi

          count=$(wc -l < "${processing_ms}")
          count="${count//[[:space:]]/}"
          if [[ "${count}" -eq 0 ]]; then
            echo "Could not extract any processing_ms data from benchmark output."
            exit 1
          fi
          if [[ "${MEASUREMENT_SOURCE}" == "engine-api" ]]; then
            if [[ "${EXPECTED_AMOUNT}" =~ ^[0-9]+$ ]]; then
              if [[ "${count}" -ne "${EXPECTED_AMOUNT}" ]]; then
                echo "Expected ${EXPECTED_AMOUNT} K6 TTFB samples, extracted ${count}; refusing a partial engine-api measurement."
                exit 1
              fi
            else
              # The config carries no usable `amount`, so nothing can say whether the run is complete -
              # and a partial cross-client run biases the comparison it was dispatched to make.
              echo "::warning::No usable amount ('${EXPECTED_AMOUNT}') in the rendered config; the engine-api completeness check is disabled for this run."
            fi
          fi

          compute_percentiles() {
            local input_file="$1"
            local prefix="$2"
            local sorted_file="${input_file}.sorted"
            local n

            sort -n "${input_file}" > "${sorted_file}"
            n=$(wc -l < "${sorted_file}")
            n="${n//[[:space:]]/}"

            local min max avg median p90 p95 p99
            min=$(head -n 1 "${sorted_file}")
            max=$(tail -n 1 "${sorted_file}")
            avg=$(awk '{sum += $1} END {printf "%.2f", sum / NR}' "${sorted_file}")

            if (( n % 2 == 1 )); then
              local mi=$(( (n + 1) / 2 ))
              median=$(sed -n "${mi}p" "${sorted_file}")
            else
              local lo=$(( n / 2 ))
              local hi=$(( lo + 1 ))
              local lv hv
              lv=$(sed -n "${lo}p" "${sorted_file}")
              hv=$(sed -n "${hi}p" "${sorted_file}")
              median=$(awk -v a="${lv}" -v b="${hv}" 'BEGIN {printf "%.2f", (a + b) / 2}')
            fi

            local p90i=$(( (90 * n + 99) / 100 ))
            local p95i=$(( (95 * n + 99) / 100 ))
            local p99i=$(( (99 * n + 99) / 100 ))
            p90=$(sed -n "${p90i}p" "${sorted_file}")
            p95=$(sed -n "${p95i}p" "${sorted_file}")
            p99=$(sed -n "${p99i}p" "${sorted_file}")

            echo "${prefix}COUNT=${n}"
            echo "${prefix}AVG=${avg}"
            echo "${prefix}MEDIAN=${median}"
            echo "${prefix}P90=${p90}"
            echo "${prefix}P95=${p95}"
            echo "${prefix}P99=${p99}"
            echo "${prefix}MIN=${min}"
            echo "${prefix}MAX=${max}"
          }

          compute_percentiles "${processing_ms}" "" > "${metrics_file}"
          if [[ -s "${client_ms}" ]]; then echo "SOURCE=sse"; else echo "SOURCE=k6"; fi >> "${metrics_file}"

          # The k6 table carries the gas used per payload and is parsed whichever series is primary, so
          # the request and the processing series each get an MGas/s of their own.
          ttfb_table="${RUNNER_TEMP}/expb-ttfb-table.txt"
          ttfb_ms="${RUNNER_TEMP}/expb-ttfb-ms.txt"
          ttfb_gas="${RUNNER_TEMP}/expb-ttfb-gas.txt"
          awk -F'|' '
            /^[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+[[:space:]]*\|[[:space:]]*[0-9]+(\.[0-9]+)?[[:space:]]*\|[[:space:]]*$/ {
              gas = $3
              value = $4
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", gas)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              if (value ~ /^[0-9]+(\.[0-9]+)?$/) {
                print gas, value
              }
            }
          ' "${clean_log}" > "${ttfb_table}"
          awk '{ print $2 }' "${ttfb_table}" > "${ttfb_ms}"
          awk '{ print $1 }' "${ttfb_table}" > "${ttfb_gas}"

          # Throughput over one per-payload time series: the shared gas total over that series' total.
          # Row i of the k6 table is block i of the feed, and the feed reports a block when the next
          # payload is requested, so it can lack the last one; the limit holds both series to the same
          # payloads, so the two figures divide one shared gas total and are directly comparable.
          mgas_s_over() {
            awk -v limit="${2:-0}" '
              NR == FNR { gas[NR] = $1; paired = NR; next }
              FNR <= paired && (limit == 0 || FNR <= limit) { total_gas += gas[FNR]; total_ms += $1 }
              END { if (total_ms > 0) printf "%.2f", (total_gas / 1000000) / (total_ms / 1000) }
            ' "${ttfb_gas}" "${1}"
          }

          emit_mgas_s() {
            local value
            value="$(mgas_s_over "${2}" "${3:-0}")"
            if [[ -n "${value}" ]]; then
              echo "${1}MGAS_S=${value}" >> "${metrics_file}"
            fi
          }

          # n/a rather than an empty line when the series this divides by was not collected.
          read_mgas_s() {
            local value
            value="$(grep -E "^${1}MGAS_S=" "${metrics_file}" | head -n 1 | cut -d'=' -f2- || true)"
            printf '%s' "${value:-n/a}"
          }

          if [[ -s "${client_ms}" && -s "${ttfb_ms}" ]]; then
            compute_percentiles "${ttfb_ms}" "TTFB_" >> "${metrics_file}"
            paired_count=$(wc -l < "${client_ms}")
            paired_count="${paired_count//[[:space:]]/}"
            request_count=$(wc -l < "${ttfb_ms}")
            request_count="${request_count//[[:space:]]/}"
            # The prefix pairing holds only while the feed is complete or lacks just its last record; any
            # other gap sits mid-run and would shear every value after it. Same rule as collect_metrics in
            # scripts/expb/sequential_driver.py.
            if (( paired_count == request_count || paired_count == request_count - 1 )); then
              emit_mgas_s "" "${client_ms}" "${paired_count}"
              emit_mgas_s "TTFB_" "${ttfb_ms}" "${paired_count}"
              # Time outside processing per payload, from the same pairing.
              outside_ms="${RUNNER_TEMP}/expb-outside-ms.txt"
              awk 'NR == FNR { request[NR] = $1; paired = NR; next } FNR <= paired { printf "%.2f\n", request[FNR] - $1 }' "${ttfb_ms}" "${client_ms}" > "${outside_ms}"
              if [[ -s "${outside_ms}" ]]; then
                compute_percentiles "${outside_ms}" "OUTSIDE_" >> "${metrics_file}"
              fi
            else
              echo "::warning::${paired_count} feed records for ${request_count} k6 rows cannot be paired; processing MGas/s and request minus processing are n/a"
              # The request series pairs gas and time within each k6 row, so it keeps a throughput of its own.
              emit_mgas_s "TTFB_" "${ttfb_ms}"
            fi
          elif [[ -s "${ttfb_ms}" ]]; then
            # Without the client feed the unprefixed keys hold the k6 request table, and so does their
            # throughput; there is no processing or outside series to divide by.
            emit_mgas_s "" "${processing_ms}"
          fi

          # Print human-readable summary
          echo ""
          echo "========================================="
          if [[ -s "${client_ms}" ]]; then
            echo "  Block processing (Nethermind)"
          else
            echo "  newPayload request time (k6)"
          fi
          echo "========================================="
          grep -v "^SOURCE=\|^TTFB_\|^MGAS_S=\|^OUTSIDE_" "${metrics_file}" | while IFS='=' read -r key val; do
            printf "  %-10s %s ms\n" "${key}" "${val}"
          done
          printf "  %-10s %s MGas/s\n" "MGAS_S" "$(read_mgas_s "")"
          if [[ -s "${client_ms}" ]] && grep -q "^TTFB_AVG=" "${metrics_file}" 2>/dev/null; then
            echo "-----------------------------------------"
            echo "  newPayload request time (k6)"
            echo "-----------------------------------------"
            grep "^TTFB_" "${metrics_file}" | grep -v "^TTFB_MGAS_S=" | while IFS='=' read -r key val; do
              printf "  %-10s %s ms\n" "${key#TTFB_}" "${val}"
            done
            printf "  %-10s %s MGas/s\n" "MGAS_S" "$(read_mgas_s "TTFB_")"
            echo "-----------------------------------------"
            echo "  Request minus processing"
            echo "-----------------------------------------"
            if grep -q "^OUTSIDE_" "${metrics_file}"; then
              grep "^OUTSIDE_" "${metrics_file}" | while IFS='=' read -r key val; do
                printf "  %-10s %s ms\n" "${key#OUTSIDE_}" "${val}"
              done
            else
              echo "  n/a (the feed and the k6 table could not be paired)"
            fi
          fi
          echo "========================================="
          echo ""

          # Populate GITHUB_OUTPUT
          {
            echo "exception_found=${exception_found}"
            echo "exception_lines_file=${exception_lines}"
            echo "invalid_block_found=${invalid_block_found}"
            echo "invalid_block_lines_file=${invalid_block_lines}"
            echo "warmup_status=${warmup_status}"
            echo "metrics_file=${metrics_file}"
            while IFS= read -r line; do
              key="${line%%=*}"
              val="${line#*=}"
              echo "${key,,}=${val}"
            done < "${metrics_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expb-single-metrics-${{ matrix.payload_set }}-run${{ matrix.run }}
          path: ${{ steps.analyze.outputs.metrics_file }}
          retention-days: 30

      - name: Prepare master metrics cache
        if: github.event_name == 'push' && github.ref_name == 'master' && steps.analyze.outputs.exception_found != 'true' && steps.analyze.outputs.invalid_block_found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/expb-master-metrics-cache-${{ matrix.payload_set }}"
          cp "${{ steps.analyze.outputs.metrics_file }}" "/tmp/expb-master-metrics-cache-${{ matrix.payload_set }}/master-metrics.env"

      - name: Save master metrics cache
        if: github.event_name == 'push' && github.ref_name == 'master' && steps.analyze.outputs.exception_found != 'true' && steps.analyze.outputs.invalid_block_found != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/expb-master-metrics-cache-${{ matrix.payload_set }}
          key: expb-master-metrics-v4-${{ matrix.payload_set }}-${{ github.run_id }}

      - name: Enforce run quality gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.run-expb.outcome }}" != "success" ]]; then
            echo "expb execute-scenarios did not finish successfully."
            exit 1
          fi

          if [[ "${{ steps.analyze.outputs.exception_found }}" == "true" ]]; then
            echo "Exceptions were detected in run output. Failing workflow."
            if [[ -f "${{ steps.analyze.outputs.exception_lines_file }}" ]]; then
              head -n 40 "${{ steps.analyze.outputs.exception_lines_file }}"
            fi
            exit 1
          fi

          if [[ "${{ steps.analyze.outputs.invalid_block_found }}" == "true" ]]; then
            echo "Invalid block lines were detected in run output. Failing workflow."
            if [[ -f "${{ steps.analyze.outputs.invalid_block_lines_file }}" ]]; then
              head -n 40 "${{ steps.analyze.outputs.invalid_block_lines_file }}"
            fi
            exit 1
          fi

          if [[ "${{ needs.resolve.outputs.measurement_mode }}" == "compute-warm" && "${{ steps.analyze.outputs.warmup_status }}" != "ok" ]]; then
            echo "Compute-warm measurement did not complete all requested warmups (status: ${{ steps.analyze.outputs.warmup_status || 'missing' }})."
            exit 1
          fi

      - name: Collect and upload profiling artifacts
        id: collect-profiling
        if: always() && (needs.resolve.outputs.dottrace == 'true' || needs.resolve.outputs.perf == 'true')
        shell: bash
        env:
          ARTIFACT_SUFFIX: ${{ matrix.payload_set }}-run${{ matrix.run }}
          MARKER: ${{ runner.temp }}/.expb-run-marker
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          PERF: ${{ needs.resolve.outputs.perf }}
        run: |
          set -euo pipefail

          if [[ "${PERF}" == "true" ]]; then
            artifact_prefix="profiling"
          else
            artifact_prefix="dottrace"
          fi
          artifact_name="${artifact_prefix}-${ARTIFACT_SUFFIX}"
          archive="${RUNNER_TEMP}/${artifact_name}.zip"
          {
            echo "artifact_name=${artifact_name}"
            echo "archive=${archive}"
          } >> "${GITHUB_OUTPUT}"

          mapfile -t profiling_dirs < <(find "${EXPB_DATA_DIR}/outputs" -type d \( -name 'dottrace' -o -name 'dotnet-trace' -o -name 'perf' \) -newer "${MARKER}" 2>/dev/null)
          if [[ "${#profiling_dirs[@]}" -eq 0 ]]; then
            if [[ "${PERF}" == "true" ]]; then
              echo "::error::perf was requested but no profiling output directories were produced."
              exit 1
            fi
            echo "::warning::Profiling was requested (dottrace=${DOTTRACE}, perf=${PERF}) but no profiling output directories were produced."
            exit 0
          fi

          echo "Collecting from ${#profiling_dirs[@]} profiling director(ies):"
          printf '  %s\n' "${profiling_dirs[@]}"

          file_count=0
          for d in "${profiling_dirs[@]}"; do
            file_count=$(( file_count + $(find "${d}" -type f | wc -l) ))
          done
          if [[ "${file_count}" -eq 0 ]]; then
            if [[ "${PERF}" == "true" ]]; then
              echo "::error::perf was requested but profiling output directories are empty."
              exit 1
            fi
            echo "::warning::Profiling output directories are empty, skipping zip."
            exit 0
          fi

          perf_validation_failed=false
          if [[ "${PERF}" == "true" ]]; then
            mapfile -t folded_profiles < <(find "${profiling_dirs[@]}" -type f -name 'perf.folded' -newer "${MARKER}" 2>/dev/null)
            valid_folded_profiles=()
            for folded_profile in "${folded_profiles[@]}"; do
              if bash scripts/validate-folded-profile.sh "${folded_profile}"; then
                valid_folded_profiles+=("${folded_profile}")
              else
                echo "::warning::Ignoring invalid perf.folded profile: ${folded_profile}"
              fi
            done
            if [[ "${#valid_folded_profiles[@]}" -eq 0 ]]; then
              echo "::error::perf was requested but no perf.folded profile with a positive sample count was produced."
              perf_validation_failed=true
            else
              echo "Validated positive-sample perf.folded profile(s):"
              printf '  %s\n' "${valid_folded_profiles[@]}"
            fi
          fi

          zip -9r "${archive}" "${profiling_dirs[@]}" -x '*/perf.data'

          if [[ "${perf_validation_failed}" == "true" ]]; then
            exit 1
          fi

      - name: Upload profiling artifact
        if: always() && (needs.resolve.outputs.dottrace == 'true' || needs.resolve.outputs.perf == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect-profiling.outputs.artifact_name }}
          path: ${{ steps.collect-profiling.outputs.archive }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Stage benchmark logs
        if: always()
        shell: bash
        env:
          RAW_RUN_LOG: ${{ runner.temp }}/expb-run.log
          CLEAN_RUN_LOG: ${{ runner.temp }}/expb-run.clean.log
          METRICS_FILE: ${{ steps.analyze.outputs.metrics_file }}
          RENDERED_CONFIG_FILE: ${{ steps.render-config.outputs.rendered_config_file }}
          YQ_BIN: ${{ runner.temp }}/yq
          LOG_ARTIFACT_DIR: ${{ runner.temp }}/expb-single-logs-${{ matrix.payload_set }}-run${{ matrix.run }}
        run: |
          set -euo pipefail
          mkdir -p "${LOG_ARTIFACT_DIR}"
          [[ -f "${RAW_RUN_LOG}" ]] && cp "${RAW_RUN_LOG}" "${LOG_ARTIFACT_DIR}/combined.log" || true
          [[ -f "${CLEAN_RUN_LOG}" ]] && cp "${CLEAN_RUN_LOG}" "${LOG_ARTIFACT_DIR}/combined.clean.log" || true
          [[ -n "${METRICS_FILE}" && -f "${METRICS_FILE}" ]] && cp "${METRICS_FILE}" "${LOG_ARTIFACT_DIR}/metrics.env" || true
          if [[ -n "${RENDERED_CONFIG_FILE}" && -f "${RENDERED_CONFIG_FILE}" ]]; then
            [[ -x "${YQ_BIN}" ]] || { echo "::error::yq is required to sanitize the rendered config before artifact staging."; exit 1; }
            sanitized_config="$(mktemp "${LOG_ARTIFACT_DIR}/.rendered-config.XXXXXX")"
            trap 'rm -f "${sanitized_config}"' EXIT
            "${YQ_BIN}" 'del(.export)' "${RENDERED_CONFIG_FILE}" > "${sanitized_config}"
            mv "${sanitized_config}" "${LOG_ARTIFACT_DIR}/rendered-config.yaml"
            trap - EXIT
          fi
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "event=${{ github.event_name }}"
            echo "payload_set=${{ matrix.payload_set }}"
            echo "run=${{ matrix.run }}"
            echo "run_count=${{ needs.resolve.outputs.run_count }}"
            echo "measurement_mode=${{ needs.resolve.outputs.measurement_mode }}"
            echo "expb_source=${EXPB_SOURCE:-unknown}"
          } > "${LOG_ARTIFACT_DIR}/metadata.txt"

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expb-single-logs-${{ matrix.payload_set }}-run${{ matrix.run }}
          path: ${{ runner.temp }}/expb-single-logs-${{ matrix.payload_set }}-run${{ matrix.run }}
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup rendered config
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          # Always remove the deterministic rendered config path
          rm -f "${RUNNER_TEMP}/rendered-expb-config.yaml" || true

          # Also remove the path reported by render-config (if any and different)
          rendered_config_file="${{ steps.render-config.outputs.rendered_config_file }}"
          if [[ -n "${rendered_config_file}" && "${rendered_config_file}" != "${RUNNER_TEMP}/rendered-expb-config.yaml" ]]; then
            rm -f "${rendered_config_file}" || true
          fi

  # ---------------------------------------------------------------------------
  # PR comment: aggregates metrics from all payload_set matrix entries
  # ---------------------------------------------------------------------------

  report:
    needs: [resolve, prepare-docker, benchmark]
    if: always() && github.event_name == 'pull_request' && needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.mode == 'single'
    runs-on: ubuntu-latest
    concurrency:
      group: expb-report-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Download all metrics artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/all-metrics
          pattern: expb-single-metrics-*

      - name: Restore master metrics (superblocks)
        id: restore-master-superblocks
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/expb-master-metrics-cache-superblocks
          key: expb-master-metrics-v4-superblocks-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            expb-master-metrics-v4-superblocks-

      - name: Restore master metrics (realblocks)
        id: restore-master-realblocks
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/expb-master-metrics-cache-realblocks
          key: expb-master-metrics-v4-realblocks-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            expb-master-metrics-v4-realblocks-

      - name: Restore master metrics (fusaka)
        id: restore-master-fusaka
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/expb-master-metrics-cache-fusaka
          key: expb-master-metrics-v4-fusaka-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            expb-master-metrics-v4-fusaka-

      - name: Build PR comparison comment
        id: pr-comment
        shell: bash
        env:
          METRICS_DIR: ${{ runner.temp }}/all-metrics
          MASTER_SUPERBLOCKS: /tmp/expb-master-metrics-cache-superblocks/master-metrics.env
          MASTER_REALBLOCKS: /tmp/expb-master-metrics-cache-realblocks/master-metrics.env
          MASTER_FUSAKA: /tmp/expb-master-metrics-cache-fusaka/master-metrics.env
          PAYLOAD_SETS: ${{ needs.resolve.outputs.payload_sets }}
          STATE_LAYOUT: ${{ needs.resolve.outputs.state_layout }}
          CLEAN_BRANCH: ${{ needs.resolve.outputs.clean_branch }}
          DELAY_SECONDS: ${{ needs.resolve.outputs.delay_seconds }}
          IMAGE: ${{ needs.prepare-docker.outputs.image }}
          IMAGE_REVISION: ${{ needs.prepare-docker.outputs.image_revision }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLIENT: ${{ needs.resolve.outputs.client }}
        run: |
          set -euo pipefail

          marker="<!-- expb-reproducible-benchmark-report -->"
          comment_file="${RUNNER_TEMP}/expb-pr-comment.md"
          : > "${comment_file}"
          if ! [[ "${IMAGE_REVISION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::No valid revision was reported by the pinned benchmark image; refusing to publish a misleading benchmark comment."
            exit 1
          fi

          load_metric() {
            local file="$1"
            local key="$2"
            if [[ -f "${file}" ]]; then
              grep -E "^${key}=" "${file}" | head -n 1 | cut -d'=' -f2- || true
            fi
          }

          # Which measurement the unprefixed keys hold. Files written before SOURCE existed carried k6
          # keys under TTFB_ only when the client feed was present, so that presence implies sse; without
          # either key the file could hold either measurement.
          metrics_source() {
            local file="$1"
            local source
            source="$(load_metric "${file}" "SOURCE")"
            if [[ -z "${source}" && -n "$(load_metric "${file}" "TTFB_AVG")" ]]; then
              source="sse"
            fi
            printf '%s' "${source:-unknown}"
          }

          percentage_delta() {
            local current="$1"
            local baseline="$2"
            if [[ -z "${current}" || -z "${baseline}" ]]; then
              echo "n/a"
              return
            fi
            awk -v c="${current}" -v b="${baseline}" 'BEGIN { if (b == 0) { print "n/a"; } else { printf "%+.0f%%", ((c - b) / b) * 100; } }'
          }

          append_line() {
            printf '%s\n' "$1" >> "${comment_file}"
          }

          append_blank() {
            printf '\n' >> "${comment_file}"
          }

          # Whole milliseconds read fine above 100 ms; the small payload sets need the decimal.
          format_ms() {
            local value="$1"
            if [[ -z "${value}" ]]; then
              printf 'n/a'
              return
            fi
            awk -v v="${value}" 'BEGIN { if (v + 0 >= 100 || v + 0 <= -100) printf "%.0f", v; else printf "%.1f", v }'
          }

          cell() {
            printf ' %s |' "$1"
          }

          # Master, PR and delta cells for one metric of one column group. An empty master path or a
          # prefix that no file carries renders as n/a, which keeps the table one shape in every case.
          group_cells() {
            local current_metrics="$1"
            local master_metrics="$2"
            local prefix="$3"
            local master_prefix="$4"
            local metric="$5"
            local cv="" mv=""
            cv="$(load_metric "${current_metrics}" "${prefix}${metric}")"
            if [[ -n "${master_metrics}" ]]; then
              mv="$(load_metric "${master_metrics}" "${master_prefix}${metric}")"
            fi
            cell "$(format_ms "${mv}")"
            cell "$(format_ms "${cv}")"
            cell "$(percentage_delta "${cv}" "${mv}")"
          }

          build_table() {
            local payload_set="$1"
            local current_metrics="$2"
            local master_metrics="$3"
            local scenario_name="${CLIENT}-${STATE_LAYOUT}-${payload_set}-${CLEAN_BRANCH}-delay${DELAY_SECONDS}s"

            local metrics=("MIN" "AVG" "MEDIAN" "P90" "P99" "MAX")
            local labels=("Min" "Avg" "P50" "P90" "P99" "Max")

            append_blank
            append_line "#### ${payload_set}"
            append_blank

            if [[ ! -f "${current_metrics}" ]]; then
              append_line "No metrics were produced for \`${scenario_name}\`."
              return
            fi

            append_line "Scenario: \`${scenario_name}\`"

            if [[ ! -f "${master_metrics}" ]]; then
              append_line "No cached master baseline for \`${payload_set}\`. A baseline will be created from the next successful \`master\` push run."
            fi

            # The request time is what the consensus client waits for; the processing time isolates EVM
            # and state work; their per-payload difference is the request path and GC. Without client
            # metrics the unprefixed keys hold the k6 table instead, on either side, so each column picks
            # its request-time prefix from its own source and is compared only against the same
            # measurement.
            local current_source master_source
            current_source="$(metrics_source "${current_metrics}")"
            master_source="none"
            if [[ -f "${master_metrics}" ]]; then
              master_source="$(metrics_source "${master_metrics}")"
            fi
            local request_master="${master_metrics}" processing_master="${master_metrics}"
            local request_prefix="" master_request_prefix="" processing_prefix="NONE_"
            if [[ "${current_source}" == "sse" ]]; then
              request_prefix="TTFB_"
              processing_prefix=""
            fi
            case "${master_source}" in
              sse) master_request_prefix="TTFB_" ;;
              k6) processing_master="" ;;
              *) request_master=""; processing_master="" ;;
            esac

            # Markdown has one header row and no spans: each group name sits over its Master column and
            # a bold sub-header row names the three columns.
            append_blank
            append_line "| ms | Request (k6) | | | Processing | | | Request - processing | | |"
            append_line "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|"
            append_line "| | **Master** | **PR** | **%** | **Master** | **PR** | **%** | **Master** | **PR** | **%** |"
            local i row
            for i in "${!metrics[@]}"; do
              row="| ${labels[$i]} |"
              row="${row}$(group_cells "${current_metrics}" "${request_master}" "${request_prefix}" "${master_request_prefix}" "${metrics[$i]}")"
              row="${row}$(group_cells "${current_metrics}" "${processing_master}" "${processing_prefix}" "" "${metrics[$i]}")"
              row="${row}$(group_cells "${current_metrics}" "${processing_master}" "OUTSIDE_" "OUTSIDE_" "${metrics[$i]}")"
              append_line "${row}"
            done
            # The same gas over each window's own time. The third group is a residue rather than a
            # window gas is delivered in, so a throughput over it would not describe anything.
            row="| MGas/s |"
            row="${row}$(group_cells "${current_metrics}" "${request_master}" "${request_prefix}" "${master_request_prefix}" "MGAS_S")"
            row="${row}$(group_cells "${current_metrics}" "${processing_master}" "${processing_prefix}" "" "MGAS_S")"
            row="${row} | | |"
            append_line "${row}"

            # Both figures are a property of the columns, not of the comparison, so the note is
            # printed whenever the run has them; the delta direction below needs a baseline.
            if [[ -n "$(load_metric "${current_metrics}" "MGAS_S")" && -n "$(load_metric "${current_metrics}" "TTFB_MGAS_S")" ]]; then
              append_blank
              append_line "_Both MGas/s figures divide the same gas total by their own group's time over the same payloads: the request figure is the throughput a consensus client sees, the processing figure the client's own._"
            fi

            if [[ "${master_source}" == "sse" ]]; then
              append_blank
              append_line "_Timing rows: a positive delta is slower. MGas/s: a positive delta is more throughput._"
            elif [[ "${master_source}" == "k6" && "${current_source}" == "sse" ]]; then
              append_blank
              append_line "_The cached master run has no client processing data, so the processing columns are PR-only._"
            elif [[ "${master_source}" == "unknown" ]]; then
              append_blank
              append_line "_The cached master run predates source tracking and could hold either measurement, so the comparison is PR-only until the next \`master\` push refreshes the cache._"
            fi
          }

          append_line "${marker}"
          append_line "Tested image: \`${IMAGE}\`"
          append_line "Tested against commit: ${IMAGE_REVISION}"
          append_line "### EXPB Benchmark Comparison"
          append_blank
          append_line "Run: [View workflow run](${RUN_URL})"

          # Iterate over each payload_set from the matrix
          mapfile -t payload_sets < <(echo "${PAYLOAD_SETS}" | jq -r '.[]')

          for ps in "${payload_sets[@]}"; do
            # Find the PR metrics artifact (run 1 by default)
            current_metrics="${METRICS_DIR}/expb-single-metrics-${ps}-run1/expb-metrics.env"

            # Master metrics from cache
            case "${ps}" in
              superblocks) master_metrics="${MASTER_SUPERBLOCKS}" ;;
              fusaka) master_metrics="${MASTER_FUSAKA}" ;;
              *) master_metrics="${MASTER_REALBLOCKS}" ;;
            esac

            build_table "${ps}" "${current_metrics}" "${master_metrics}"
          done

          {
            echo "body<<EOF"
            cat "${comment_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish PR comparison comment
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ steps.pr-comment.outputs.body }}
        with:
          script: |
            const marker = '<!-- expb-reproducible-benchmark-report -->';
            const body = process.env.COMMENT_BODY;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.filter((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body && comment.body.includes(marker),
            );

            for (const comment of existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

  # ---------------------------------------------------------------------------
  # Single-image summary: aggregates all runs × payload_sets into GITHUB_STEP_SUMMARY
  # ---------------------------------------------------------------------------

  single-summary:
    needs: [resolve, benchmark]
    if: always() && needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.mode == 'single'
    runs-on: ubuntu-latest
    steps:
      - name: Download all metrics artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/all-metrics
          pattern: expb-single-metrics-*

      - name: Build summary
        shell: bash
        env:
          METRICS_DIR: ${{ runner.temp }}/all-metrics
          PAYLOAD_SETS: ${{ needs.resolve.outputs.payload_sets }}
          RUN_COUNT: ${{ needs.resolve.outputs.run_count }}
          STATE_LAYOUT: ${{ needs.resolve.outputs.state_layout }}
          CLEAN_BRANCH: ${{ needs.resolve.outputs.clean_branch }}
          DELAY_SECONDS: ${{ needs.resolve.outputs.delay_seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLIENT: ${{ needs.resolve.outputs.client }}
        run: |
          set -euo pipefail

          summary_file="${RUNNER_TEMP}/single-summary.md"
          run_count="${RUN_COUNT:-1}"

          load_metric() {
            local file="$1"
            local key="$2"
            if [[ -f "${file}" ]]; then
              grep -E "^${key}=" "${file}" | head -n 1 | cut -d'=' -f2- || true
            fi
          }

          # Which measurement the unprefixed keys hold. Files written before SOURCE existed carried k6
          # keys under TTFB_ only when the client feed was present, so that presence implies sse; without
          # either key the file could hold either measurement.
          metrics_source() {
            local file="$1"
            local source
            source="$(load_metric "${file}" "SOURCE")"
            if [[ -z "${source}" && -n "$(load_metric "${file}" "TTFB_AVG")" ]]; then
              source="sse"
            fi
            printf '%s' "${source:-unknown}"
          }

          mapfile -t payload_sets < <(echo "${PAYLOAD_SETS}" | jq -r '.[]')

          {
            echo "## EXPB Benchmark Results"
            echo ""
            echo "Branch: \`${CLEAN_BRANCH}\` | Layout: \`${STATE_LAYOUT}\` | Delay: \`${DELAY_SECONDS}s\` | Runs: \`${run_count}\`"
            echo ""
            echo "Run: [View workflow run](${RUN_URL})"
          } > "${summary_file}"

          for ps in "${payload_sets[@]}"; do
            scenario_name="${CLIENT}-${STATE_LAYOUT}-${ps}-${CLEAN_BRANCH}-delay${DELAY_SECONDS}s"

            {
              echo ""
              echo "### ${ps}"
              echo ""
              echo "Scenario: \`${scenario_name}\`"
              echo ""
            } >> "${summary_file}"

            # Detect metrics source from first available run
            source_label=""
            for (( r=1; r<=run_count; r++ )); do
              mf="${METRICS_DIR}/expb-single-metrics-${ps}-run${r}/expb-metrics.env"
              if [[ -f "${mf}" ]]; then
                if [[ "$(metrics_source "${mf}")" == "sse" ]]; then
                  source_label="SSE"
                else
                  source_label="TTFB"
                fi
                break
              fi
            done

            if [[ "${run_count}" -gt 1 ]]; then
              # Per-run table
              {
                echo "| Run | Source | AVG (ms) | Median (ms) | P90 (ms) | P95 (ms) | P99 (ms) | Min (ms) | Max (ms) |"
                echo "|---:|--------|----------|-------------|----------|----------|----------|----------|----------|"
              } >> "${summary_file}"

              avg_values=""
              median_values=""
              p90_values=""
              p95_values=""
              p99_values=""
              min_values=""
              max_values=""
              valid_runs=0

              for (( r=1; r<=run_count; r++ )); do
                mf="${METRICS_DIR}/expb-single-metrics-${ps}-run${r}/expb-metrics.env"
                if [[ ! -f "${mf}" ]]; then
                  echo "| ${r} | - | - | - | - | - | - | - | - |" >> "${summary_file}"
                  continue
                fi

                src=""
                if [[ "$(metrics_source "${mf}")" == "sse" ]]; then src="SSE"; else src="TTFB"; fi

                avg=$(load_metric "${mf}" "AVG")
                median=$(load_metric "${mf}" "MEDIAN")
                p90=$(load_metric "${mf}" "P90")
                p95=$(load_metric "${mf}" "P95")
                p99=$(load_metric "${mf}" "P99")
                min_val=$(load_metric "${mf}" "MIN")
                max_val=$(load_metric "${mf}" "MAX")

                echo "| ${r} | ${src} | ${avg} | ${median} | ${p90} | ${p95} | ${p99} | ${min_val} | ${max_val} |" >> "${summary_file}"

                if [[ -n "${avg}" ]]; then
                  valid_runs=$(( valid_runs + 1 ))
                  avg_values="${avg_values} ${avg}"
                  median_values="${median_values} ${median}"
                  p90_values="${p90_values} ${p90}"
                  p95_values="${p95_values} ${p95}"
                  p99_values="${p99_values} ${p99}"
                  min_values="${min_values} ${min_val}"
                  max_values="${max_values} ${max_val}"
                fi
              done

              # Cross-run aggregate
              if [[ "${valid_runs}" -gt 1 ]]; then
                compute_mean() {
                  echo "$@" | tr ' ' '\n' | awk 'NF {sum += $1; n++} END {if (n>0) printf "%.2f", sum/n; else print "n/a"}'
                }
                compute_min_of() {
                  echo "$@" | tr ' ' '\n' | awk 'NF {if (min=="" || $1+0 < min+0) min=$1} END {print (min != "" ? min : "n/a")}'
                }
                compute_max_of() {
                  echo "$@" | tr ' ' '\n' | awk 'NF {if (max=="" || $1+0 > max+0) max=$1} END {print (max != "" ? max : "n/a")}'
                }

                {
                  echo ""
                  echo "**Aggregate across ${valid_runs} runs:**"
                  echo ""
                  echo "| Stat | AVG (ms) | Median (ms) | P90 (ms) | P95 (ms) | P99 (ms) | Min (ms) | Max (ms) |"
                  echo "|------|----------|-------------|----------|----------|----------|----------|----------|"
                  echo "| Mean | $(compute_mean ${avg_values}) | $(compute_mean ${median_values}) | $(compute_mean ${p90_values}) | $(compute_mean ${p95_values}) | $(compute_mean ${p99_values}) | $(compute_mean ${min_values}) | $(compute_mean ${max_values}) |"
                  echo "| Best | $(compute_min_of ${avg_values}) | $(compute_min_of ${median_values}) | $(compute_min_of ${p90_values}) | $(compute_min_of ${p95_values}) | $(compute_min_of ${p99_values}) | $(compute_min_of ${min_values}) | $(compute_min_of ${max_values}) |"
                  echo "| Worst | $(compute_max_of ${avg_values}) | $(compute_max_of ${median_values}) | $(compute_max_of ${p90_values}) | $(compute_max_of ${p95_values}) | $(compute_max_of ${p99_values}) | $(compute_max_of ${min_values}) | $(compute_max_of ${max_values}) |"
                } >> "${summary_file}"
              fi
            else
              # Single run — simple table
              mf="${METRICS_DIR}/expb-single-metrics-${ps}-run1/expb-metrics.env"
              if [[ ! -f "${mf}" ]]; then
                echo "No metrics were produced." >> "${summary_file}"
              else
                src=""
                ttfb_check=$(load_metric "${mf}" "TTFB_AVG")
                if [[ "$(metrics_source "${mf}")" == "sse" ]]; then src=" (SSE)"; fi

                {
                  echo "| Metric | Value${src} |"
                  echo "|---|---:|"
                  echo "| AVG (ms) | $(load_metric "${mf}" "AVG") |"
                  echo "| Median (ms) | $(load_metric "${mf}" "MEDIAN") |"
                  echo "| P90 (ms) | $(load_metric "${mf}" "P90") |"
                  echo "| P95 (ms) | $(load_metric "${mf}" "P95") |"
                  echo "| P99 (ms) | $(load_metric "${mf}" "P99") |"
                  echo "| Min (ms) | $(load_metric "${mf}" "MIN") |"
                  echo "| Max (ms) | $(load_metric "${mf}" "MAX") |"
                } >> "${summary_file}"

                if [[ -n "${ttfb_check}" ]]; then
                  {
                    echo ""
                    echo "<details><summary>newPayload request time (k6)</summary>"
                    echo ""
                    echo "| Metric | Value |"
                    echo "|---|---:|"
                    echo "| AVG (ms) | $(load_metric "${mf}" "TTFB_AVG") |"
                    echo "| Median (ms) | $(load_metric "${mf}" "TTFB_MEDIAN") |"
                    echo "| P90 (ms) | $(load_metric "${mf}" "TTFB_P90") |"
                    echo "| P95 (ms) | $(load_metric "${mf}" "TTFB_P95") |"
                    echo "| P99 (ms) | $(load_metric "${mf}" "TTFB_P99") |"
                    echo "| Min (ms) | $(load_metric "${mf}" "TTFB_MIN") |"
                    echo "| Max (ms) | $(load_metric "${mf}" "TTFB_MAX") |"
                    echo ""
                    echo "</details>"
                  } >> "${summary_file}"
                fi
              fi
            fi
          done

          echo "--- Single Benchmark Summary ---"
          cat "${summary_file}"
          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Multi-image path: retrospective or explicit docker_images
  # ---------------------------------------------------------------------------

  resolve-images:
    needs: [resolve]
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.mode == 'multi'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - name: Resolve Docker images
        id: resolve
        shell: bash
        env:
          DOCKER_IMAGES: ${{ needs.resolve.outputs.docker_images }}
          LAST: ${{ needs.resolve.outputs.retrospective_last }}
          STEP: ${{ needs.resolve.outputs.retrospective_step }}
        run: |
          set -euo pipefail

          all_tags=()
          all_images=()
          all_dates=()

          if [[ -n "${DOCKER_IMAGES}" ]]; then
            echo "Parsing explicit docker images: ${DOCKER_IMAGES}"
            IFS=',' read -ra raw_images <<< "${DOCKER_IMAGES}"
            for raw in "${raw_images[@]}"; do
              image="${raw#"${raw%%[![:space:]]*}"}"
              image="${image%"${image##*[![:space:]]}"}"
              [[ -n "${image}" ]] || continue
              if [[ "${image}" == *@* ]]; then
                tag="${image##*@}"
              else
                tag="${image##*:}"
              fi
              all_images+=("${image}")
              all_tags+=("${tag}")
              all_dates+=("n/a")
            done
            if [[ "${#all_images[@]}" -eq 0 ]]; then
              echo "::error::docker_images must contain at least one non-empty image reference."
              exit 1
            fi
            echo "Parsed ${#all_images[@]} explicit docker images."
          else
            if ! [[ "${LAST}" =~ ^[0-9]+$ ]] || [[ "${LAST}" -lt 1 ]]; then
              echo "retrospective_last must be a positive integer, got '${LAST}'."
              exit 1
            fi
            if ! [[ "${STEP}" =~ ^[0-9]+$ ]] || [[ "${STEP}" -lt 1 ]]; then
              echo "retrospective_step must be a positive integer, got '${STEP}'."
              exit 1
            fi

            echo "Fetching last ${LAST} master-* Docker images from Docker Hub (step=${STEP})..."
            page=1
            page_size=100
            remaining="${LAST}"
            while [[ "${remaining}" -gt 0 ]]; do
              url="https://hub.docker.com/v2/repositories/nethermindeth/nethermind/tags?page_size=${page_size}&page=${page}&name=master-"
              response=$(curl -sf "${url}" || echo '{"results":[]}')
              mapfile -t page_tags < <(echo "${response}" | jq -r '.results[] | select(.name | test("^master-[0-9a-f]{7}$")) | .name')
              mapfile -t page_dates < <(echo "${response}" | jq -r '.results[] | select(.name | test("^master-[0-9a-f]{7}$")) | .last_updated[:10]')
              [[ "${#page_tags[@]}" -gt 0 ]] || break
              for i in "${!page_tags[@]}"; do
                all_tags+=("${page_tags[$i]}")
                all_images+=("nethermindeth/nethermind:${page_tags[$i]}")
                all_dates+=("${page_dates[$i]}")
              done
              remaining=$(( remaining - page_size ))
              page=$(( page + 1 ))
            done

            if [[ "${#all_tags[@]}" -gt "${LAST}" ]]; then
              all_tags=("${all_tags[@]:0:LAST}")
              all_images=("${all_images[@]:0:LAST}")
              all_dates=("${all_dates[@]:0:LAST}")
            fi
            selected_tags=()
            selected_images=()
            selected_dates=()
            for (( i=0; i<${#all_tags[@]}; i+=STEP )); do
              selected_tags+=("${all_tags[$i]}")
              selected_images+=("${all_images[$i]}")
              selected_dates+=("${all_dates[$i]}")
            done
            all_tags=("${selected_tags[@]}")
            all_images=("${selected_images[@]}")
            all_dates=("${selected_dates[@]}")
          fi

          [[ "${#all_images[@]}" -gt 0 ]] || { echo "No images to benchmark."; exit 1; }
          images_json='[]'
          for i in "${!all_images[@]}"; do
            image="${all_images[$i]}"
            tag="${all_tags[$i]}"
            date="${all_dates[$i]}"
            digest=$(printf '%s' "${image}" | sha256sum | cut -c1-12)
            image_id="image-$((i + 1))-${digest}"
            images_json=$(jq -cn --argjson current "${images_json}" --arg id "${image_id}" --arg tag "${tag}" --arg image "${image}" --arg date "${date}" '$current + [{id: $id, tag: $tag, image: $image, date: $date}]')
            echo "${image_id}: ${image} (${date})"
          done

          echo "images=${images_json}" >> "${GITHUB_OUTPUT}"
  generate-dottrace-reports:
    needs: [resolve, benchmark, benchmark-multi]
    # Timeline snapshots cannot be converted by Reporter.exe - they ship as the raw .dtp artifact only.
    if: >-
      always()
      && needs.resolve.outputs.dottrace == 'true'
      && needs.resolve.outputs.dottrace_mode != 'timeline'
      && needs.resolve.outputs.should_run == 'true'
      && (needs.benchmark.result == 'success' || needs.benchmark-multi.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.resolve.outputs.perf == 'true' && 'profiling-*' || 'dottrace-*' }}
          path: snapshots/
          merge-multiple: true

      - name: Install dotTrace Reporter
        shell: pwsh
        run: |
          $url = 'https://www.nuget.org/api/v2/package/JetBrains.dotTrace.CommandLineTools.windows-x64/2026.1.0.1'
          Write-Host "Downloading dotTrace CommandLineTools from NuGet..."
          Invoke-WebRequest -Uri $url -OutFile dottrace-clt.zip
          Expand-Archive -Path dottrace-clt.zip -DestinationPath dottrace-clt
          $reporter = Get-ChildItem -Path dottrace-clt -Recurse -Filter 'Reporter.exe' | Select-Object -First 1
          if (-not $reporter) {
            Write-Error "Reporter.exe not found in package"
            exit 1
          }
          Write-Host "Found Reporter.exe at $($reporter.FullName)"
          echo "REPORTER=$($reporter.FullName)" >> $env:GITHUB_ENV

      - name: Generate XML reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports, extracted | Out-Null

          # Pattern file: match all methods, include full call stacks
          $patternFile = 'pattern.xml'
          @'
          <Patterns>
            <Pattern PrintCallstacks="Full">.*</Pattern>
          </Patterns>
          '@ | Set-Content -Path $patternFile

          # Extract all snapshot zips
          Get-ChildItem -Path snapshots -Filter '*.zip' | ForEach-Object {
            $dest = Join-Path extracted $_.BaseName
            Write-Host "Extracting $($_.Name) -> $dest"
            Expand-Archive -Path $_.FullName -DestinationPath $dest
          }

          # Find .dtp files (exact extension, not .dtp.0000 chunks)
          $snapshots = Get-ChildItem -Path extracted -Recurse | Where-Object { $_.Extension -eq '.dtp' }

          if ($snapshots.Count -eq 0) {
            Write-Host "No .dtp snapshot files found after extraction."
            exit 0
          }

          foreach ($dtp in $snapshots) {
            $name = $dtp.BaseName
            $outFile = "reports/${name}-report.xml"
            Write-Host "::group::Generating report for $name"
            Write-Host "  $($dtp.FullName) -> $outFile"
            & $env:REPORTER report $dtp.FullName --pattern=$patternFile --save-to=$outFile
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Reporter failed for $name with exit code $LASTEXITCODE"
            }
            Write-Host "::endgroup::"
          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dottrace-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
  benchmark-multi:
    name: benchmark (multi-image sequential)
    needs: [resolve, resolve-images]
    if: needs.resolve.outputs.should_run == 'true' && needs.resolve.outputs.mode == 'multi'
    runs-on: [self-hosted, "${{ needs.resolve.outputs.runner_label }}"]
    timeout-minutes: 720
    env:
      EXPB_DATA_DIR: ${{ needs.resolve.outputs.expb_data_dir }}
      FLAT_SNAPSHOT_DIR: ${{ needs.resolve.outputs.flat_snapshot_dir }}
      FLAT_SNAPSHOT_BLOCK_DIR: ${{ needs.resolve.outputs.flat_snapshot_block_dir }}
      CONFIG_FILE: ${{ needs.resolve.outputs.config_file }}
      CLEANUP_GRACE_SECONDS: ${{ needs.resolve.outputs.cleanup_grace_seconds }}
      RUN_COUNT: ${{ needs.resolve.outputs.run_count }}
      MEASUREMENT_MODE: ${{ needs.resolve.outputs.measurement_mode }}
      CLIENT: ${{ needs.resolve.outputs.client }}
      MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
      CLIENT_SNAPSHOT_DIR: ${{ needs.resolve.outputs.client_snapshot_dir }}
      SNAPSHOT_MOUNT_PATH: ${{ needs.resolve.outputs.snapshot_mount_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            run_as_root() { if [[ "${EUID}" -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
            run_as_root apt-get update
            run_as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            run_as_root systemctl start docker || run_as_root service docker start
          fi
          docker version
      - name: Ensure EXPB config file exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EXPB_DATA_DIR}/${CONFIG_FILE}"

      - name: Verify client snapshot and provenance
        if: needs.resolve.outputs.client != 'nethermind'
        shell: bash
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          SNAPSHOT_SOURCE: ${{ needs.resolve.outputs.client_snapshot_dir }}
          SNAPSHOT_MOUNT_PATH: ${{ needs.resolve.outputs.snapshot_mount_path }}
        run: |
          set -euo pipefail
          [[ -n "${SNAPSHOT_SOURCE}" && -d "${SNAPSHOT_SOURCE}" ]] || {
            echo "::error::Snapshot source '${SNAPSHOT_SOURCE}' for client=${CLIENT} does not exist on this runner."
            exit 1
          }
          if [[ "${CLIENT}" == "geth" && ! -d "${SNAPSHOT_SOURCE}/chaindata" ]]; then
            echo "::error::Geth snapshot '${SNAPSHOT_SOURCE}' does not contain chaindata contents."
            exit 1
          fi
          if [[ "${CLIENT}" == "reth" && ! -d "${SNAPSHOT_SOURCE}/db" ]]; then
            echo "::error::Reth snapshot '${SNAPSHOT_SOURCE}' does not contain the db directory."
            exit 1
          fi
          echo "Snapshot provenance: client=${CLIENT} source=${SNAPSHOT_SOURCE} mount=${SNAPSHOT_MOUNT_PATH} backend=overlay"
          stat --printf='Snapshot stat: device=%D inode=%i mtime=%y\n' "${SNAPSHOT_SOURCE}"
          for sidecar in _snapshot_metadata.json _snapshot_web3_clientVersion.json; do
            if [[ -f "${SNAPSHOT_SOURCE}/${sidecar}" ]]; then
              echo "Snapshot ${sidecar}: $(tr -d '\n' < "${SNAPSHOT_SOURCE}/${sidecar}" | cut -c1-300)"
            fi
          done
          find "${SNAPSHOT_SOURCE}" -mindepth 1 -maxdepth 1 -printf 'Snapshot entry: %f\n' | sort

      - name: Reap leftover benchmark containers and networks
        shell: bash
        run: |
          set -uo pipefail
          # A hard-cancelled run leaves its container running: it holds the snapshot overlay the next
          # step unmounts - so the plain umount there would fall back to a lazy detach that leaves the
          # filesystem alive - and it holds the deterministic name, network and ports the replacement
          # run needs. arm-runner-maintenance.yml reaps containers ahead of the same sweep for this
          # reason; expb names and labels every container and network it creates `expb`. The rest of
          # the filter list matches that file, because the sweep is anchored on the whole benchmark
          # data dir and rpc-bench parks its scratch overlays under it too.
          for filter in name=expb label=expb name=rpcbench- name=nethermind-rpcbench name=ethcallchaos-bench name=jsonbench-; do
            docker ps -aq --filter "${filter}" | xargs -r docker rm -f || true
            # Orphaned expb networks fail scenario re-runs with a 409 on the name collision.
            docker network ls -q --filter "${filter}" | xargs -r docker network rm >/dev/null 2>&1 || true
          done
          exit 0

      - name: Reap stale expb overlay mounts
        shell: bash
        run: |
          set -uo pipefail
          # A cancelled run never unmounts its snapshot overlay, so the next `mount -t overlay` over the
          # same path fails with exit status 32 and the benchmark dies ~90s in; container, network and
          # volume pruning all leave the mount in place. Anchored on the benchmark data dir rather than on
          # expb's `paths.work` leaf, so renaming that cannot silently turn this into a no-op, and
          # rpc-bench's scratch overlays on the same box get swept too.
          #
          # This body is duplicated verbatim in arm-runner-maintenance.yml and in both benchmark jobs of
          # run-expb-reproducible-benchmarks.yml. Sharing it would take a composite action and therefore
          # actions/checkout, which none of the three jobs has and which arm-runner-maintenance.yml must
          # not depend on - it is the workflow you dispatch when the disk is full.
          # scripts/ci/test_reap_stale_overlays.py asserts the three copies are byte-identical and drives
          # this body against synthetic mount tables.
          # Positional, not an env var: GitHub invokes a `run:` block with no arguments after the
          # script path, so only that test can point this at a table it wrote.
          MOUNTS="${1:-/proc/self/mounts}"
          as_root() { if [[ "$(id -u)" -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
          # Any mount left on this target, whatever its type - the check that an unmount actually took.
          still_mounted() { awk -v t="$1" '$2 == t { found = 1 } END { exit !found }' "${MOUNTS}"; }

          # The sweep root is what every rm -rf below is bounded by, so canonicalize it - '..' or a
          # trailing slash must not widen it - and refuse '/' or a single top-level component outright.
          root="${EXPB_DATA_DIR:-}"
          [[ -n "${root}" ]] || { echo "::warning::EXPB_DATA_DIR is empty - skipping overlay reap."; exit 0; }
          root="$(realpath -m -- "${root}")" || { echo "::warning::cannot canonicalize EXPB_DATA_DIR - skipping overlay reap."; exit 0; }
          case "${root}" in
            /?*/?*) ;;
            *) echo "::warning::EXPB_DATA_DIR '${root}' is too shallow for a recursive sweep - skipping."; exit 0 ;;
          esac

          # Deepest first, so nested mounts unwind. Options are kept per mount line rather than per target:
          # stacked overlays share a target and `umount` pops one layer at a time, so a target's scratch
          # dirs must not be deleted until every layer on it is gone.
          declare -A scratch=()
          targets=()
          while IFS=$'\t' read -r mp opts; do
            [[ -n "${scratch[${mp}]+set}" ]] || targets+=("${mp}")
            scratch["${mp}"]+="${opts}"$'\n'
          done < <(awk -v d="${root}" -v OFS='\t' '$3 == "overlay" && index($2, d "/") == 1 { print $2, $4 }' "${MOUNTS}" | sort -r)

          if [[ "${#targets[@]}" -eq 0 ]]; then
            echo "No stale expb overlay mounts under ${root}."
            # Surface what we did not match, so layout drift shows up in the log instead of a reassuring
            # "clean"; docker's own overlays live under /var/lib and are not ours. Capped inside awk
            # rather than piped into `head`, whose early exit would SIGPIPE awk and - under the errexit
            # GitHub runs this body with - abort the step before the trailing `exit 0`.
            awk '$3 == "overlay" && index($2, "/var/lib/") != 1 && ++n <= 20 { print "  unmatched overlay: " $2 }' "${MOUNTS}"
            exit 0
          fi

          for mp in "${targets[@]}"; do
            # An octal-escaped target is unusable twice over: `awk -v` decodes the escape back, so
            # still_mounted cannot find the line and would report a phantom success, and `umount`
            # cannot address the literal path either. Refuse it like an escaped scratch path.
            if [[ "${mp}" == *"\\"* ]]; then
              echo "::warning::refusing escaped overlay mount target: ${mp}"
              continue
            fi
            # Plain unmount first: `umount -l` can report success while a container-held reference still
            # blocks the next mount. Lazy is the fallback for that case. The loop is bounded so that
            # stacked layers unwind and a `umount` that returns 0 without detaching cannot spin the step.
            for _ in 1 2 3 4 5 6 7 8; do
              still_mounted "${mp}" || break
              as_root umount "${mp}" 2>/dev/null || as_root umount -l "${mp}" 2>/dev/null || break
            done
            if still_mounted "${mp}"; then
              echo "::warning::${mp} is still mounted - leaving its overlay scratch dirs in place"
              continue
            fi
            echo "unmounted ${mp}"
            # upper/work hold the cancelled run's writes: the GB the unmount alone leaves behind, and state
            # the next overlay would silently layer on top of its snapshot. The paths come from the kernel's
            # own mount options rather than being guessed.
            while IFS= read -r d; do
              [[ -n "${d}" ]] || continue
              # /proc/self/mounts octal-escapes space, tab and backslash in paths; refuse rather than point
              # rm -rf at a path whose decoding we would have to assume.
              if [[ "${d}" == *"\\"* ]]; then
                echo "::warning::refusing escaped overlay scratch path: ${d}"
                continue
              fi
              c="$(realpath -m -- "${d}")" || { echo "::warning::cannot canonicalize scratch path: ${d}"; continue; }
              # Strict descendant only - a plain '$root/*' glob also matches the data dir itself, which
              # holds the snapshots this box exists for.
              if [[ "${c}" != "${root}"/?* ]]; then
                echo "::warning::refusing overlay scratch path outside ${root}: ${d}"
                continue
              fi
              if as_root rm -rf -- "${c}"; then
                echo "removed ${c}"
              else
                echo "::warning::failed to remove ${c}"
              fi
            done < <(printf '%s' "${scratch[${mp}]}" | tr ',' '\n' | sed -n 's/^\(upperdir\|workdir\)=//p' | sort -u)
          done
          exit 0
      - name: Check benchmark disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h / "${EXPB_DATA_DIR}"
          root_available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          data_available_kb="$(df -Pk "${EXPB_DATA_DIR}" | awk 'NR == 2 { print $4 }')"
          if ! [[ "${root_available_kb}" =~ ^[0-9]+$ && "${data_available_kb}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine free space for the runner root or ${EXPB_DATA_DIR}."
            exit 1
          fi
          if (( root_available_kb < 2 * 1024 * 1024 )); then
            echo "::error::Only ${root_available_kb} KiB is free on the runner root filesystem; at least 2 GiB is required before starting a campaign."
            echo "::error::Inspect runner diagnostics and other root-volume files before retrying."
            exit 1
          fi
          if (( data_available_kb < 10 * 1024 * 1024 )); then
            echo "::error::Only ${data_available_kb} KiB is free on ${EXPB_DATA_DIR}; at least 10 GiB is required before starting a campaign."
            echo "::error::Inspect existing campaign artifacts on the data volume and choose a runner with more free space."
            exit 1
          fi

      - name: Install or upgrade expb and yq
        shell: bash
        env:
          EXPB_REPO: ${{ needs.resolve.outputs.expb_repo }}
          EXPB_BRANCH: ${{ needs.resolve.outputs.expb_branch }}
          PERF: ${{ needs.resolve.outputs.perf }}
          MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="${HOME}/.local/bin:${PATH}"
          fi
          if [[ -n "${EXPB_BRANCH}" ]]; then
            expb_source="git+https://github.com/${EXPB_REPO}@${EXPB_BRANCH}"
          elif [[ "${EXPB_REPO}" == "NethermindEth/execution-payloads-benchmarks" ]]; then
            expb_source="git+https://github.com/${EXPB_REPO}@main"
          else
            expb_source="git+https://github.com/${EXPB_REPO}"
          fi
          uv tool install --force --from "${expb_source}" expb
          echo "EXPB_SOURCE=${expb_source}" >> "${GITHUB_ENV}"
          expb_bin="$(uv tool dir --bin)/expb"
          requested_flags=()
          if [[ "${PERF}" == "true" ]]; then requested_flags+=(--perf); fi
          if [[ "${MEASUREMENT_SOURCE}" == "engine-api" ]]; then requested_flags+=(--no-client-metrics); fi
          if [[ "${#requested_flags[@]}" -gt 0 ]]; then
            if ! capability_output="$(NO_COLOR=1 "${expb_bin}" execute-scenarios "${requested_flags[@]}" --help 2>&1)"; then
              echo "::error::Installed expb from ${expb_source} does not support requested capability flag(s): ${requested_flags[*]}."
              printf '%s\n' "${capability_output}"
              exit 1
            fi
          fi
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"
          yq="${RUNNER_TEMP}/yq"
          case "$(uname -m)" in
            x86_64) yq_arch=amd64 ;;
            aarch64|arm64) yq_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 120 "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${yq_arch}" -o "${yq}"
          chmod +x "${yq}"
          yq_version="$("${yq}" --version)"
          [[ "${yq_version}" == "yq "* ]] || { echo "Downloaded yq is not yq: ${yq_version}"; exit 1; }
      - name: Run sequential EXPB campaign
        id: run-campaign
        continue-on-error: true
        shell: bash
        env:
          EXPB_IMAGES_JSON: ${{ needs.resolve-images.outputs.images }}
          # An explicit `docker_images` dispatch is an A/B: one bad arm invalidates the comparison, so
          # the campaign stops. A retrospective sweep bisects across many master builds and its other
          # images stay useful, so there only the failed image is abandoned.
          CAMPAIGN_FAIL_FAST: ${{ needs.resolve.outputs.docker_images != '' }}
          EXPB_CONFIG_TEMPLATE: ${{ needs.resolve.outputs.expb_data_dir }}/${{ needs.resolve.outputs.config_file }}
          EXPB_CAMPAIGN_DIR: ${{ needs.resolve.outputs.expb_data_dir }}/campaigns/${{ github.run_id }}/${{ github.run_attempt }}
          FLAT_SNAPSHOT_DIR: ${{ needs.resolve.outputs.flat_snapshot_dir }}
          FLAT_SNAPSHOT_BLOCK_DIR: ${{ needs.resolve.outputs.flat_snapshot_block_dir }}
          YQ_BIN: ${{ runner.temp }}/yq
          EXPB_DATA_DIR: ${{ needs.resolve.outputs.expb_data_dir }}
          RUN_COUNT: ${{ needs.resolve.outputs.run_count }}
          CLEANUP_GRACE_SECONDS: ${{ needs.resolve.outputs.cleanup_grace_seconds }}
          MEASUREMENT_MODE: ${{ needs.resolve.outputs.measurement_mode }}
          DELAY_SECONDS: ${{ needs.resolve.outputs.delay_seconds }}
          AMOUNT: ${{ needs.resolve.outputs.amount }}
          ADDITIONAL_EXTRA_FLAGS: ${{ needs.resolve.outputs.additional_extra_flags }}
          CLIENT_ENV: ${{ needs.resolve.outputs.client_env }}
          TRACE_BLOCKS: ${{ needs.resolve.outputs.trace_blocks }}
          EXPB_ENV_PASSTHROUGH: ${{ needs.resolve.outputs.expb_env }}
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          DOTTRACE_MODE: ${{ needs.resolve.outputs.dottrace_mode }}
          PERF: ${{ needs.resolve.outputs.perf }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          MEASUREMENT_SOURCE: ${{ needs.resolve.outputs.measurement_source }}
          CLIENT_SNAPSHOT_DIR: ${{ needs.resolve.outputs.client_snapshot_dir }}
          SNAPSHOT_MOUNT_PATH: ${{ needs.resolve.outputs.snapshot_mount_path }}
        run: |
          set -euo pipefail
          echo "Client: ${CLIENT}"
          echo "Measurement source: ${MEASUREMENT_SOURCE}"
          if [[ -n "${CLIENT_SNAPSHOT_DIR}" ]]; then echo "Client snapshot: ${CLIENT_SNAPSHOT_DIR} (mount ${SNAPSHOT_MOUNT_PATH})"; fi
          mkdir -p "${EXPB_CAMPAIGN_DIR}"
          touch "${RUNNER_TEMP}/.expb-run-marker"
          python3 "${GITHUB_WORKSPACE}/scripts/expb/sequential_driver.py"
      - name: Upload campaign artifact
        id: upload-campaign
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expb-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ needs.resolve.outputs.expb_data_dir }}/campaigns/${{ github.run_id }}/${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
      - name: Remove uploaded campaign directory
        if: always() && steps.upload-campaign.outcome == 'success'
        shell: bash
        env:
          EXPB_DATA_DIR: ${{ needs.resolve.outputs.expb_data_dir }}
          CAMPAIGN_RUN_ID: ${{ github.run_id }}
          CAMPAIGN_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # A failed upload intentionally leaves the campaign directory available for diagnosis.
          if ! [[ "${CAMPAIGN_RUN_ID}" =~ ^[0-9]+$ && "${CAMPAIGN_RUN_ATTEMPT}" =~ ^[0-9]+$ ]]; then
            echo "::error::Campaign identifiers must be numeric before cleanup."
            exit 1
          fi
          campaigns_root_input="${EXPB_DATA_DIR}/campaigns"
          [[ ! -L "${campaigns_root_input}" ]] || { echo "::error::Refusing symlinked campaigns root: ${campaigns_root_input}"; exit 1; }
          if [[ ! -e "${campaigns_root_input}" ]]; then
            echo "Campaigns root already absent: ${campaigns_root_input}"
            exit 0
          fi
          campaigns_root="$(realpath -e -- "${campaigns_root_input}")"
          [[ -d "${campaigns_root}" ]] || { echo "::error::Campaigns root is not a directory: ${campaigns_root}"; exit 1; }
          target_input="${campaigns_root}/${CAMPAIGN_RUN_ID}/${CAMPAIGN_RUN_ATTEMPT}"
          if [[ -L "${target_input}" ]]; then
            echo "::error::Refusing symlinked campaign directory: ${target_input}"
            exit 1
          fi
          run_dir_input="${campaigns_root}/${CAMPAIGN_RUN_ID}"
          [[ ! -L "${run_dir_input}" ]] || { echo "::error::Refusing symlinked campaign run directory: ${run_dir_input}"; exit 1; }
          if [[ ! -e "${target_input}" ]]; then
            echo "Campaign directory already absent: ${target_input}"
            exit 0
          fi
          [[ -d "${target_input}" ]] || { echo "::error::Campaign path is not a directory: ${target_input}"; exit 1; }
          target="$(realpath -e -- "${target_input}")"
          [[ "${target}" == "${campaigns_root}"/* ]] || { echo "::error::Campaign directory escaped campaigns root: ${target}"; exit 1; }
          nested_symlink="$(find -P "${target}" -type l -print -quit 2>/dev/null)"
          [[ -z "${nested_symlink}" ]] || { echo "::error::Refusing campaign cleanup with nested symlink: ${nested_symlink}"; exit 1; }
          command -v findmnt >/dev/null 2>&1 || { echo "::error::findmnt is required for safe campaign cleanup."; exit 1; }
          mounted_targets="$(findmnt --raw --submounts --noheadings --output TARGET --target "${target}")"
          while IFS= read -r mount_target; do
            [[ -n "${mount_target}" ]] || continue
            mount_target="$(realpath -m -- "${mount_target}")"
            if [[ "${mount_target}" == "${target}" || "${mount_target}" == "${target}"/* ]]; then
              echo "::error::Refusing to remove campaign directory containing mount: ${mount_target}"
              exit 1
            fi
          done <<< "${mounted_targets}"
          rm -rf -- "${target}"
          rmdir --ignore-fail-on-non-empty -- "$(dirname -- "${target}")"
          echo "Removed uploaded campaign directory: ${target}"
      - name: Collect and upload profiling artifacts
        id: collect-profiling
        if: always() && (needs.resolve.outputs.dottrace == 'true' || needs.resolve.outputs.perf == 'true')
        shell: bash
        env:
          EXPB_DATA_DIR: ${{ needs.resolve.outputs.expb_data_dir }}
          MARKER: ${{ runner.temp }}/.expb-run-marker
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          PERF: ${{ needs.resolve.outputs.perf }}
        run: |
          set -euo pipefail
          if [[ "${PERF}" == "true" ]]; then
            artifact_prefix="profiling"
          else
            artifact_prefix="dottrace"
          fi
          artifact_name="${artifact_prefix}-campaign"
          archive="${RUNNER_TEMP}/${artifact_name}.zip"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          mapfile -t profiling_dirs < <(find "${EXPB_DATA_DIR}/outputs" -type d \( -name dottrace -o -name dotnet-trace -o -name perf \) -newer "${MARKER}" 2>/dev/null)
          if [[ "${#profiling_dirs[@]}" -eq 0 ]]; then
            if [[ "${PERF}" == "true" ]]; then echo "::error::perf produced no profile."; exit 1; fi
            echo "::warning::No profiling output was produced."
            exit 0
          fi
          perf_validation_failed=false
          if [[ "${PERF}" == "true" ]]; then
            mapfile -t perf_dirs < <(find "${profiling_dirs[@]}" -type d -name perf -newer "${MARKER}" 2>/dev/null)
            if [[ "${#perf_dirs[@]}" -eq 0 ]]; then
              echo "::error::perf was requested but no perf output directory was produced."
              perf_validation_failed=true
            fi
            for perf_dir in "${perf_dirs[@]}"; do
              profile_ok=false
              mapfile -t folded_profiles < <(find "${perf_dir}" -type f -name perf.folded -newer "${MARKER}" 2>/dev/null)
              for folded_profile in "${folded_profiles[@]}"; do
                if bash scripts/validate-folded-profile.sh "${folded_profile}"; then
                  profile_ok=true
                  break
                fi
              done
              if [[ "${profile_ok}" != "true" ]]; then
                echo "::error::perf directory '${perf_dir}' has no nonempty perf.folded profile."
                perf_validation_failed=true
              fi
            done
          fi
          zip -9r "${archive}" "${profiling_dirs[@]}" -x '*/perf.data'
          if [[ "${perf_validation_failed}" == "true" ]]; then
            exit 1
          fi

      - name: Upload profiling artifact
        if: always() && (needs.resolve.outputs.dottrace == 'true' || needs.resolve.outputs.perf == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect-profiling.outputs.artifact_name }}
          path: ${{ steps.collect-profiling.outputs.archive }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Enforce campaign quality gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.run-campaign.outcome }}" != "success" ]]; then
            echo "::error::The EXPB campaign failed; inspect the campaign artifact."
            exit 1
          fi

  multi-campaign-summary:
    needs: [resolve, benchmark-multi]
    if: always() && needs.resolve.outputs.mode == 'multi'
    runs-on: ubuntu-latest
    steps:
      - name: Download campaign artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: expb-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
          merge-multiple: true
      - name: Publish campaign summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$(find "${RUNNER_TEMP}/campaign" -type f -name summary.md -print -quit 2>/dev/null || true)"
          if [[ -n "${summary_file}" ]]; then
            cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No campaign summary artifact was produced." >> "${GITHUB_STEP_SUMMARY}"
          fi
