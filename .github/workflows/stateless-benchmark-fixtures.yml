# Runs the tests-zkevm-benchmark worst-case blocks through the ZisK guest and reports their cost.
#
# The release ships one archive per block gas value, each with ~1,200 compute benchmarks. A 30M block
# emulates in 5-15 s on one core, and emulation time grows roughly with gas, so the blocks are spread
# over shards whose count scales with the gas value, and each shard runs one block per core. The
# host-side job runs the same archives through nethtest, which also covers the setup blocks the guest
# jobs skip.
name: Stateless benchmark fixtures

on:
  push:
    branches: ['test/zkevm-benchmark-fixtures**']
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      release:
        description: Release tag
        default: tests-zkevm-benchmark@v21.0.5
        type: string
      gas_values:
        description: Gas values
        default: 30M,60M,100M,150M,200M
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIXTURES_REPOSITORY: ethereum/execution-specs
  RELEASE: ${{ inputs.release || 'tests-zkevm-benchmark@v21.0.5' }}
  GUEST_DIR: src/Nethermind/Nethermind.Stateless.ZiskGuest

jobs:
  matrix:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      gas_values: ${{ steps.plan.outputs.gas_values }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_counts: ${{ steps.plan.outputs.shard_counts }}
    steps:
      - name: Plan shards
        id: plan
        env:
          GAS_VALUES: ${{ inputs.gas_values || (github.event_name == 'push' && '30M') || '30M,60M,100M,150M,200M' }}
        run: |
          set -euo pipefail
          # Eight shards per 30M of gas; GitHub caps a matrix at 256 jobs.
          jq -cn --arg values "$GAS_VALUES" '
            [$values | split(",")[] | gsub("\\s"; "") | select(length > 0)
              | if test("^[0-9]+M$") then . else error("invalid gas value: \(.)") end] | unique
            | map({gas: ., shards: ((((.[:-1] | tonumber) * 8 + 29) / 30) | floor)}) as $plan
            | {
                gas_values: ($plan | map(.gas)),
                shards: [$plan[] | .gas as $gas | .shards as $n | range($n) | {gas: $gas, shard: ., shards: $n}],
                shard_counts: ($plan | map({(.gas): .shards}) | add)
              }
            | if (.shards | length) > 256 then error("more than 256 shards") else . end
          ' > "$RUNNER_TEMP/plan.json"
          for key in gas_values shards shard_counts; do
            echo "$key=$(jq -c ".$key" "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          done
          jq . "$RUNNER_TEMP/plan.json"

  build:
    name: Build ZisK guest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Build Nethermind
        working-directory: ${{ env.GUEST_DIR }}
        run: make build

      - name: Upload guest binary
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-zisk
          path: ${{ env.GUEST_DIR }}/bin/nethermind
          if-no-files-found: error
          retention-days: 1

  host:
    name: Host ${{ matrix.gas }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gas: ${{ fromJSON(needs.matrix.outputs.gas_values) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Build nethtest
        working-directory: src/Nethermind
        run: dotnet build Nethermind.Test.Runner/Nethermind.Test.Runner.csproj -c release

      - name: Download fixtures
        env:
          GAS: ${{ matrix.gas }}
        run: |
          set -euo pipefail
          archive="fixtures_zkevm-benchmark_$(printf '%04d' "${GAS%M}")M.tar.gz"
          mkdir -p "$RUNNER_TEMP/fixtures"
          curl -fsSL --retry 3 "https://github.com/$FIXTURES_REPOSITORY/releases/download/$RELEASE/$archive" \
            | tar -xz -C "$RUNNER_TEMP/fixtures"

      - name: Run nethtest
        working-directory: src/Nethermind
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/nethtest.json"
          artifacts/bin/Nethermind.Test.Runner/release/nethtest --zkevmTest -p 4 \
            -i "$RUNNER_TEMP/fixtures/fixtures/blockchain_tests" > "$results"
          # nethtest exits zero on failed cases, so the verdict comes from its JSON.
          jq -r '.[] | select(.pass != true) | "::error::\(.name): \(.error // "failed")"' "$results"
          total=$(jq 'length' "$results")
          failed=$(jq '[.[] | select(.pass != true)] | length' "$results")
          echo "Host stateless execution: $((total - failed)) of $total blocks passed" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$total" -gt 0 && "$failed" -eq 0 ]]

  guest:
    name: ZisK ${{ matrix.gas }} ${{ matrix.shard }}
    needs: [matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.shards) }}
    env:
      GAS: ${{ matrix.gas }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Download guest binary
        uses: actions/download-artifact@v8
        with:
          name: nethermind-zisk
          path: ${{ env.GUEST_DIR }}/bin

      - name: Prepare inputs
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/fixtures.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/$FIXTURES_REPOSITORY/releases/download/$RELEASE/fixtures_zkevm-benchmark_$(printf '%04d' "${GAS%M}")M.tar.gz" \
            -o "$archive"
          fixtures="$RUNNER_TEMP/fixtures"
          mkdir -p "$fixtures"
          tar -xzf "$archive" -C "$fixtures" fixtures/.meta/index.json
          # Only this shard's files: the 200M archive alone unpacks to several gigabytes.
          scripts/zkevm-benchmark/inputs.cs paths \
            --index "$fixtures/fixtures/.meta/index.json" --shard "$SHARD" --shards "$SHARDS" \
            | sed 's|^|fixtures/|' > "$RUNNER_TEMP/paths.txt"
          tar -xzf "$archive" -C "$fixtures" -T "$RUNNER_TEMP/paths.txt"
          rm "$archive"
          scripts/zkevm-benchmark/inputs.cs frame \
            --index "$fixtures/fixtures/.meta/index.json" --shard "$SHARD" --shards "$SHARDS" \
            --root "$fixtures/fixtures" --out "$GUEST_DIR/bin" --manifest "$RUNNER_TEMP/manifest.json"
          rm -rf "$fixtures"
          chmod +x "$GUEST_DIR/bin/nethermind"

      - name: Measure
        working-directory: ${{ env.GUEST_DIR }}
        run: |
          set -euo pipefail
          # ziskemu is single-threaded, so one block runs per core. Each writes only its own directory
          # and the logs are printed afterwards in manifest order, so concurrent runs never interleave.
          measure() {
            local input=$1 output=$2 dir="$RUNNER_TEMP/blocks/$1" status=0 verdict=ok
            mkdir -p "$dir"
            timeout 15m make stats INPUT="$input" < /dev/null > "$dir/stats.log" 2>&1 || status=$?
            if [[ "$status" -ne 0 ]]; then
              verdict="the guest exited with $status"
            elif ! grep -Fxq "$output" "$dir/stats.log"; then
              verdict="output mismatch"
            elif grep -qE 'Exception|Invalid Block' "$dir/stats.log"; then
              verdict="the run logged an exception or an invalid block"
            elif ! python3 -I "$GITHUB_WORKSPACE/scripts/zisk-bench/parse-stats.py" \
              --input "$input" --log "$dir/stats.log" --into "$dir/row.json"; then
              verdict="no cost figures in the log"
            fi
            echo "$verdict" > "$dir/verdict"
            rm -f "bin/$input"
          }
          export -f measure
          jq -r '.[] | "\(.input) \(.output)"' "$RUNNER_TEMP/manifest.json" \
            | xargs -P "$(nproc)" -L 1 bash -c 'measure "$@"' _

          failed=0
          while read -r input id; do
            dir="$RUNNER_TEMP/blocks/$input"
            echo "::group::${input} ${id}"
            cat "$dir/stats.log" 2> /dev/null || true
            echo "::endgroup::"
            verdict=$(cat "$dir/verdict" 2> /dev/null || echo "the run produced no verdict")
            [[ "$verdict" == ok ]] || { echo "::error::${id}: ${verdict}"; failed=$((failed + 1)); }
          done < <(jq -r '.[] | "\(.input) \(.id)"' "$RUNNER_TEMP/manifest.json")
          [[ "$failed" -eq 0 ]] || { echo "::error::$failed block(s) failed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/results"
          jq -s --arg gas "$GAS" --slurpfile manifest "$RUNNER_TEMP/manifest.json" '
            ($manifest[0] | INDEX(.input)) as $ids | add | map({gas: $gas, id: $ids[.input].id} + del(.input))
          ' "$RUNNER_TEMP"/blocks/*/row.json > "$RUNNER_TEMP/results/$GAS-$SHARD.json"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.gas }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 1

  report:
    name: Report
    needs: [matrix, guest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Summarize
        env:
          SHARD_COUNTS: ${{ needs.matrix.outputs.shard_counts }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          scripts/zkevm-benchmark/summarize.cs \
            --results "$RUNNER_TEMP/results" --release "$RELEASE" --commit "$GITHUB_SHA" \
            --shards "$SHARD_COUNTS" --into "$RUNNER_TEMP/zkevm-benchmark.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: zkevm-benchmark-results
          path: ${{ runner.temp }}/zkevm-benchmark.json
          if-no-files-found: warn
          retention-days: 90
