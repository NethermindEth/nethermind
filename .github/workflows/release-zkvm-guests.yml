name: Release zkVM guests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_DIR: guests
  # Provers use ere-server, so the verification keys come from it. Bump together with the
  # ere_digests
  ERE_VERSION: 0.19.3

jobs:
  # The tested binaries are what gets released, so nothing unexecuted is ever signed
  test:
    name: Test
    uses: ./.github/workflows/stateless-tests.yml
    permissions:
      contents: read
      id-token: write

  release:
    name: Draft release on GitHub
    runs-on: ubuntu-latest
    needs: test
    permissions:
      attestations: write
      contents: read
      id-token: write
    # Concurrent runs would claim the same release number
    concurrency:
      group: ${{ github.workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download guest binaries
        uses: actions/download-artifact@v8
        with:
          pattern: nethermind-*
          path: ${{ env.PACKAGE_DIR }}

      - name: Detect version
        id: version
        working-directory: src/Nethermind
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          version_suffix=$(sed -n 's|.*<VersionSuffix>\(.*\)</VersionSuffix>.*|\1|p' Directory.Build.props)
          version=$version_prefix${version_suffix:+-$version_suffix}
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Generate verification keys and sign
        id: sign
        env:
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          GPG_SECRET_KEY: ${{ secrets.PPA_GPG_SECRET_KEY }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          declare -A names=([zisk]=ZisK [sp1]=SP1 [openvm]=OpenVM)
          declare -A guests=([zisk]=Zisk [sp1]=Sp1 [openvm]=OpenVM)
          declare -A ere_digests=(
            [zisk]=sha256:039a8927e870e131601caed52f456b6ad199187576a51207e7e23e75adb2a00f
            [sp1]=sha256:3776341c362dd30c473376fd25c75d17e19e12e4473410aa15c5964bc461c301
          )
          mtime=$(git log -1 --format=%ct)
          assets=()
          digests=

          printf '%s' "$GPG_SECRET_KEY" | base64 --decode | gpg --import --no-tty --batch --yes

          for vm in zisk sp1 openvm; do
            dir=nethermind-$vm
            # The zkVM version is the tag of the image the guest is run with
            zkvm_version=$(sed -n 's/^[A-Z0-9]*_IMAGE ?= [^:]*:v\{0,1\}\([^@]*\)@.*/\1/p' \
              "../src/Nethermind/Nethermind.Stateless.${guests[$vm]}Guest/Makefile")
            name=stateless-validator-nethermind-$vm-v${zkvm_version:?}
            digests+="- **${names[$vm]} $zkvm_version**"$'\n'"  - ELF: \`$(sha256sum "$dir/nethermind" | cut -d ' ' -f 1)\`"$'\n'

            # ere-server's OpenVM rejects the guest's entrypoint, so that guest gets no VK. It
            # cannot run without the config it was built against, so the two ship as one archive
            if [[ "$vm" == openvm ]]; then
              # Artifacts are zipped, which drops the executable bit
              chmod +x "$dir/nethermind"
              cp ../src/Nethermind/Nethermind.Stateless.OpenVMGuest/openvm.toml "$dir"

              # Without these flags tar records mtime/uid/gid, so two archives of a
              # byte-identical guest differ
              tar --sort=name --owner=0 --group=0 --numeric-owner \
                --mtime="@$mtime" -czf "$name.tar.gz" -C "$dir" nethermind openvm.toml
              tar -tzf "$name.tar.gz"
              files=("$name.tar.gz")
            else
              mv "$dir/nethermind" "$name.elf"
              # The container sees only a read-only ELF, so it cannot alter what gets signed
              out=$(mktemp -d)
              docker run --rm -v "$PWD/$name.elf:/input/$name.elf:ro" -v "$out:/output" \
                "ghcr.io/eth-act/ere/ere-server-$vm:$ERE_VERSION@${ere_digests[$vm]}" \
                --elf-path "/input/$name.elf" keygen --program-vk-path "/output/$name.vk"
              mv "$out/$name.vk" .
              files=("$name.elf" "$name.vk")
              # A proof verifies against the VK, which commits to the ELF
              digests+="  - VK: \`$(sha256sum "$name.vk" | cut -d ' ' -f 1)\`"$'\n'
            fi

            assets+=("${files[@]}")
          done

          # One signature over the checksums covers every file
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
          gpg --no-tty --batch --yes --pinentry-mode loopback \
            --passphrase-file <(printf '%s' "$GPG_PASSPHRASE") \
            -o SHA256SUMS.asc -ab SHA256SUMS

          echo "$digests" >> $GITHUB_STEP_SUMMARY
          delimiter=$(openssl rand -hex 16)
          printf 'guest-digests<<%s\n%s\n%s\n' "$delimiter" "$digests" "$delimiter" >> $GITHUB_OUTPUT

      # Unlike the key signature, the attestation binds each file to this workflow and commit
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ env.PACKAGE_DIR }}/SHA256SUMS

      # The release is left as a draft on purpose: publishing it, once the notes
      # are filled in, is a manual step in the UI
      - name: Draft
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.gh-app.outputs.token }}
          TAG_BASE: zkvm-guests-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          relnotes=$(cat <<'EOF'
          # Release notes

          ### [CONTENT PLACEHOLDER]

          #### Guest binaries

          Built from `${{ github.sha }}`, with verification keys generated by ere-server ${{ env.ERE_VERSION }}. The SHA-256 checksums are listed below; the OpenVM ELF is the one inside its archive:

          ${{ steps.sign.outputs.guest-digests }}

          #### Build signature

          `SHA256SUMS` lists every file and is signed with the following OpenPGP key: `AD12 7976 5093 C675 9CD8 A400 24A7 7461 6F1E 617E`

          Each file listed in `SHA256SUMS` also has a build provenance attestation: `gh attestation verify <file> --repo ${{ github.repository }}`
          EOF
          )

          # Drafts have no git tag yet, so releases are listed instead of tags
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.tag_name | startswith(env.TAG_BASE))
              | select(.tag_name | ltrimstr(env.TAG_BASE) | test("^[+][0-9]+$"))
              | "\(.tag_name) \(.draft) \(.target_commitish)"')
          existing=$(awk -v sha="$GITHUB_SHA" '$3 == sha' <<< "$releases")

          if [[ -z "$existing" ]]; then
            # A deleted release can leave its tag behind, which a new one would reuse
            last=$({ cut -d ' ' -f 1 <<< "$releases"; git ls-remote --tags origin "$TAG_BASE+*" | cut -f 2; } \
              | sed -n 's/.*+\([0-9]\+\)$/\1/p' | sort -n | tail -n 1)
            git_tag=$TAG_BASE+$((${last:-0} + 1))
            echo "Drafting release $git_tag"
            gh release create "$git_tag" --target "$GITHUB_SHA" -d -p --latest=false \
              -t "zkVM guests v${{ steps.version.outputs.version }}" -F <(printf '%s' "$relnotes")
          else
            read -r git_tag draft _ <<< "$existing"
            [[ "$draft" == true ]] || \
              { echo "::error::$GITHUB_SHA is already released as $git_tag"; exit 1; }

            # A re-run rebuilds the guests, so the notes must follow the new digests
            echo "Refreshing the notes of $git_tag"
            gh release edit "$git_tag" -F <(printf '%s' "$relnotes")
          fi

          echo "Uploading assets"
          gh release upload "$git_tag" *.elf *.vk *.tar.gz SHA256SUMS SHA256SUMS.asc --clobber

          echo "Drafting completed. Review and publish the release manually."
