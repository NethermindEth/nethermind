name: Release zkVM guests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_DIR: guests

jobs:
  # The tested binaries are what gets released, so nothing unexecuted is ever signed
  test:
    name: Test
    uses: ./.github/workflows/stateless-tests.yml

  release:
    name: Draft release on GitHub
    runs-on: ubuntu-latest
    needs: test
    # Concurrent runs would claim the same release number
    concurrency:
      group: ${{ github.workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download guest binaries
        uses: actions/download-artifact@v8
        with:
          pattern: nethermind-*
          path: ${{ env.PACKAGE_DIR }}

      - name: Detect version
        id: version
        working-directory: src/Nethermind
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          version_suffix=$(sed -n 's|.*<VersionSuffix>\(.*\)</VersionSuffix>.*|\1|p' Directory.Build.props)
          version=$version_prefix${version_suffix:+-$version_suffix}
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "suffix=$version_suffix" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

      - name: Archive and sign
        id: archive
        env:
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          GPG_SECRET_KEY: ${{ secrets.PPA_GPG_SECRET_KEY }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          declare -A names=([zisk]=ZisK [sp1]=SP1 [openvm]=OpenVM)
          mtime=$(git log -1 --format=%ct)
          digests=$'| zkVM | SHA-256 |\n| --- | --- |'

          printf '%s' "$GPG_SECRET_KEY" | base64 --decode | gpg --import --no-tty --batch --yes

          for vm in zisk sp1 openvm; do
            dir=nethermind-$vm
            archive_name=nethermind-guest-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit }}-$vm.tar.gz

            # Artifacts are zipped, which drops the executable bit
            chmod +x "$dir/nethermind"

            # For a zkVM guest the ELF is the program commitment, so anyone verifying
            # a proof needs its digest
            digest=$(sha256sum "$dir/nethermind" | cut -d ' ' -f 1)
            digests+=$'\n'"| ${names[$vm]} | \`$digest\` |"

            files=(nethermind)
            # The OpenVM guest cannot run without the config it was built against
            if [[ "$vm" == openvm ]]; then
              cp ../src/Nethermind/Nethermind.Stateless.OpenVMGuest/openvm.toml "$dir"
              files+=(openvm.toml)
            fi

            # Without these flags tar records mtime/uid/gid, so two archives of a
            # byte-identical guest differ
            tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$mtime" -czf "$archive_name" -C "$dir" "${files[@]}"
            tar -tzf "$archive_name"

            gpg --no-tty --batch --yes --pinentry-mode loopback \
              --passphrase-file <(printf '%s' "$GPG_PASSPHRASE") \
              -o "$archive_name.asc" -ab "$archive_name"
          done

          echo "$digests" >> $GITHUB_STEP_SUMMARY
          delimiter=$(openssl rand -hex 16)
          printf 'guest-digests<<%s\n%s\n%s\n' "$delimiter" "$digests" "$delimiter" >> $GITHUB_OUTPUT

      # The release is left as a draft on purpose: publishing it, once the notes
      # are filled in, is a manual step in the UI
      - name: Draft
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.gh-app.outputs.token }}
          TAG_BASE: zkvm-guests-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          relnotes=$(cat <<'EOF'
          # Release notes

          ### [CONTENT PLACEHOLDER]

          #### Guest binaries

          Built from `${{ github.sha }}` with the following SHA-256 checksums:

          ${{ steps.archive.outputs.guest-digests }}

          #### Build signature

          The packages are signed with the following OpenPGP key: `AD12 7976 5093 C675 9CD8 A400 24A7 7461 6F1E 617E`
          EOF
          )

          # Stable versions are released once, so they are not numbered
          suffix="${{ steps.version.outputs.suffix }}"
          export TAG_REST=$([[ -n "$suffix" ]] && echo '^\.[0-9]+$' || echo '^$')

          # Drafts have no git tag yet, so releases are listed instead of tags
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.tag_name | startswith(env.TAG_BASE))
              | select(.tag_name | ltrimstr(env.TAG_BASE) | test(env.TAG_REST))
              | "\(.tag_name) \(.draft) \(.target_commitish)"')
          existing=$(awk -v sha="$GITHUB_SHA" '$3 == sha' <<< "$releases")

          if [[ -z "$existing" ]]; then
            if [[ -n "$suffix" ]]; then
              last=$(cut -d ' ' -f 1 <<< "$releases" | sed 's/.*\.//' | sort -n | tail -n 1)
              git_tag=$TAG_BASE.$((${last:-0} + 1))
            else
              [[ -z "$releases" ]] || \
                { echo "::error::$TAG_BASE is already released from another commit"; exit 1; }
              git_tag=$TAG_BASE
            fi

            echo "Drafting release $git_tag"
            gh release create "$git_tag" --target "$GITHUB_SHA" -d -p --latest=false \
              -t "zkVM guests v${git_tag#zkvm-guests-}" -F <(printf '%s' "$relnotes")
          else
            read -r git_tag draft _ <<< "$existing"
            [[ "$draft" == true ]] || \
              { echo "::error::$GITHUB_SHA is already released as $git_tag"; exit 1; }

            # A re-run rebuilds the guests, so the notes must follow the new digests
            echo "Refreshing the notes of $git_tag"
            gh release edit "$git_tag" -F <(printf '%s' "$relnotes")
          fi

          echo "Uploading assets"
          gh release upload "$git_tag" *.tar.gz *.tar.gz.asc --clobber

          echo "Drafting completed. Review and publish the release manually."
