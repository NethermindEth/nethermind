name: Benchmark

# Runs BenchmarkDotNet benchmarks of Nethermind.Benchmark.Runner at a base and a head commit in one job on one runner,
# and writes a comparison table to the job summary. Timings are only comparable within a run.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit, branch or tag to compare against. Defaults to the head's merge base with master.
        required: false
        type: string
      head:
        description: Commit, branch or tag to measure. Defaults to the dispatching ref.
        required: false
        type: string
      filter:
        # Required: without a filter, BenchmarkDotNet asks interactively which benchmarks to run.
        description: Space-separated BenchmarkDotNet filter patterns, e.g. "*RlpxRoundTripBenchmarks* *Keccak256Benchmarks*".
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.head || github.ref }}
  cancel-in-progress: true

env:
  # The runner service enables invariant globalization, under which the culture-bound [GeneratedRegex] in Nethermind.Core fails to compile.
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  create-runner:
    name: Create benchmark runner
    if: github.repository_owner == 'NethermindEth'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate Admin App
        id: gh-admin-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          repositories: "nethermind"

      - name: Create a runner
        uses: ./.github/actions/gcp-runner
        with:
          action: create
          runner_label: bdn-benchmark-${{ github.run_id }}
          github_token: ${{ steps.gh-admin-app.outputs.token }}
          machine_type: c2-standard-4
          local_ssd_count: 1
          provisioning_model: SPOT
          spot_fallback_to_standard: true
          max_run_duration: 4h
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  benchmark:
    name: Benchmarks
    needs: create-runner
    if: github.repository_owner == 'NethermindEth'
    runs-on: bdn-benchmark-${{ github.run_id }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out head
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head || github.sha }}
          # Full history so the base can be any commit-ish and the merge base can be computed.
          fetch-depth: 0
          persist-credentials: false
          path: head

      # Before anything that can fail, so the comparison step always has a runtime.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: head/global.json

      - name: Resolve base
        id: refs
        working-directory: head
        env:
          # Not the tip of master, which may hold commits the head lacks.
          BASE_INPUT: ${{ inputs.base }}
        # Assignments rather than substitutions inside echo, so that a revision that fails to resolve fails the step
        # instead of writing an empty output, which the base checkout would read as the dispatching ref.
        run: |
          if [[ -z "${BASE_INPUT}" ]]; then
            base=$(git merge-base origin/master HEAD)
          else
            # Branches other than the checked-out one exist only as remote-tracking branches.
            base=$(git rev-parse --verify --quiet "${BASE_INPUT}^{commit}" || git rev-parse --verify --quiet "origin/${BASE_INPUT}^{commit}") ||
              { echo "::error::Cannot resolve the base '${BASE_INPUT}'"; exit 1; }
          fi
          head=$(git rev-parse HEAD)
          {
            echo "base=${base}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"

      # A checkout rather than a worktree: the self-hosted runner keeps its workspace between runs, and
      # checkout cleans what a previous run left in the directory.
      - name: Check out base
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.refs.outputs.base }}
          persist-credentials: false
          path: base

      - name: Set up .NET for base
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: base/global.json

      - name: Run benchmarks at base
        id: run-base
        continue-on-error: true
        working-directory: base/src/Nethermind/Nethermind.Benchmark.Runner
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          read -ra patterns <<< "${FILTER}"
          dotnet run -c Release -- --filter "${patterns[@]}" --join --buildTimeout 900 --artifacts "${RUNNER_TEMP}/bdn-base"

      - name: Run benchmarks at head
        id: run-head
        continue-on-error: true
        working-directory: head/src/Nethermind/Nethermind.Benchmark.Runner
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          read -ra patterns <<< "${FILTER}"
          dotnet run -c Release -- --filter "${patterns[@]}" --join --buildTimeout 900 --artifacts "${RUNNER_TEMP}/bdn-head"

      - name: Compare
        if: always()
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          BASE_OUTCOME: ${{ steps.run-base.outcome }}
          HEAD_OUTCOME: ${{ steps.run-head.outcome }}
        run: head/scripts/benchmark/compare.cs "${RUNNER_TEMP}/bdn-base" "${RUNNER_TEMP}/bdn-head" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ steps.refs.outputs.head }}
          path: |
            ${{ runner.temp }}/bdn-base
            ${{ runner.temp }}/bdn-head
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if the head run failed
        if: steps.run-head.outcome != 'success'
        run: exit 1

  destroy-runner:
    name: Destroy benchmark runner
    needs: [create-runner, benchmark]
    # Also runs on cancellation. A failed create still needs teardown: creation may have got part way.
    if: always() && needs.create-runner.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate Admin App
        id: gh-admin-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          repositories: "nethermind"

      - name: Destroy runner
        uses: ./.github/actions/gcp-runner
        with:
          action: destroy
          runner_label: bdn-benchmark-${{ github.run_id }}
          github_token: ${{ steps.gh-admin-app.outputs.token }}
          expect_instance: ${{ needs.create-runner.result == 'success' }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
