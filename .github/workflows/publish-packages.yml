name: Publish packages

on:
  release:
    types: [published]

env:
  TAG_NAME: ${{ github.event.release.tag_name }}
  ASSETS_URL: ${{ github.event.release.assets_url }}

jobs:
  publish-ppa:
    name: Publish on PPA
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'bootnode-') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}
      - name: Set up GPG
        env:
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          GPG_SECRET_KEY: ${{ secrets.PPA_GPG_SECRET_KEY }}
        run: |
          echo $GPG_SECRET_KEY > SECRET_KEY
          echo $GPG_PASSPHRASE > $GITHUB_WORKSPACE/PASSPHRASE
          echo "Import GPG key"
          base64 --decode -i SECRET_KEY | gpg --import --no-tty --batch --yes
          echo "Import GPG owner trust"
          echo ${{ secrets.GPG_OWNERTRUST }} | base64 --decode | gpg --import-ownertrust
      - name: Install PPA dependencies
        run: sudo apt-get update && sudo apt-get install build-essential debhelper devscripts -y
      - name: Submit package
        env:
          PPA_GPG_KEYID: ${{ secrets.PPA_GPG_KEYID }}
        working-directory: scripts/build/ppa
        run: |
          version="$TAG_NAME"
          json=$(curl -sL "$ASSETS_URL")
          arm64_url=$(echo "$json" | jq -r '.[].browser_download_url | select(endswith("linux-arm64.zip"))')
          arm64_hash=$(curl -sL $arm64_url | sha256sum | awk '{print $1}')
          x64_url=$(echo "$json" | jq -r '.[].browser_download_url | select(endswith("linux-x64.zip"))')
          x64_hash=$(curl -sL $x64_url | sha256sum | awk '{print $1}')
          awk -i inplace -v n=1 '/url/ { if (++count == n) sub(/url.*/, "url='$arm64_url'"); } 1' debian/postinst
          awk -i inplace -v n=2 '/url/ { if (++count == n) sub(/url.*/, "url='$x64_url'"); } 1' debian/postinst
          awk -i inplace -v n=1 '/hash/ { if (++count == n) sub(/hash.*/, "hash='$arm64_hash'"); } 1' debian/postinst
          awk -i inplace -v n=2 '/hash/ { if (++count == n) sub(/hash.*/, "hash='$x64_hash'"); } 1' debian/postinst

          changelog="nethermind ($version) jammy; urgency=high\n"
          changelog+="  * Nethermind v$version\n"
          changelog+=" -- Nethermind <devops@nethermind.io>  $(date -R)"
          echo -e "$changelog" > debian/changelog

          debuild -S -uc -us
          cd ..
          debsign -p "gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-file $GITHUB_WORKSPACE/PASSPHRASE" \
            -S -k$PPA_GPG_KEYID nethermind_${version}_source.changes
          dput -f ppa:nethermindeth/nethermind nethermind_${version}_source.changes

  copy-ppa:
    name: Copy PPA package
    runs-on: ubuntu-latest
    needs: publish-ppa
    steps:
      - name: Wait for PPA package to be published
        if: github.run_attempt == 1
        run: sleep 2h
      - name: Install PPA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install debhelper devscripts ubuntu-dev-tools -y
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Install launchpadlib
        run: pip install launchpadlib --upgrade
      - name: Copy to other series
        env:
          LP_CREDENTIALS_FILE: /tmp/lp_credentials
        run: |
          echo ${{ secrets.PPA_COPY_TOKEN }} | base64 --decode > /tmp/lp_credentials
          git clone https://git.launchpad.net/ubuntu-archive-tools
          cd ubuntu-archive-tools
          for release in "noble" "resolute"; do
            python3 copy-package -y -b -p nethermindeth --ppa-name=nethermind -s jammy --to-suite=$release nethermind
          done
          rm -f /tmp/lp_credentials

  publish-winget:
    name: Publish on Windows Package Manager
    runs-on: windows-latest
    if: ${{ !github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'bootnode-') }}
    steps:
      - name: Submit package
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $releaseInfo = curl -sL $env:ASSETS_URL | ConvertFrom-Json
          $releaseUrl = $releaseInfo | Where-Object -Property name -like '*windows-x64.zip' | Select-Object -ExpandProperty browser_download_url
          curl -sL https://aka.ms/wingetcreate/latest -o wingetcreate.exe
          ./wingetcreate update Nethermind.Nethermind -s -v $env:TAG_NAME -u $releaseUrl

  publish-homebrew:
    name: Publish on Homebrew
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'bootnode-') }}
    env:
      FORMULA: nethermind.rb
    steps:
      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: homebrew-nethermind

      - name: Check out homebrew-nethermind repository
        uses: actions/checkout@v7
        with:
          repository: NethermindEth/homebrew-nethermind
          token: ${{ steps.gh-app.outputs.token }}

      - name: Update formula file
        run: |
          json=$(curl -sL "$ASSETS_URL")
          arm64_url=$(echo "$json" | jq -r '.[].browser_download_url | select(endswith("macos-arm64.zip"))')
          arm64_hash=$(curl -sL $arm64_url | shasum -a 256 | awk '{print $1}')
          x64_url=$(echo "$json" | jq -r '.[].browser_download_url | select(endswith("macos-x64.zip"))')
          x64_hash=$(curl -sL $x64_url | shasum -a 256 | awk '{print $1}')
          sed -i "s/version .*/version \"$TAG_NAME\"/" $FORMULA
          awk -i inplace -v n=1 '/url/ { if (++count == n) sub(/url.*/, "url \"'$x64_url'\""); } 1' $FORMULA
          awk -i inplace -v n=2 '/url/ { if (++count == n) sub(/url.*/, "url \"'$arm64_url'\""); } 1' $FORMULA
          awk -i inplace -v n=1 '/sha256/ { if (++count == n) sub(/sha256.*/, "sha256 \"'$x64_hash'\""); } 1' $FORMULA
          awk -i inplace -v n=2 '/sha256/ { if (++count == n) sub(/sha256.*/, "sha256 \"'$arm64_hash'\""); } 1' $FORMULA

      - name: Submit package
        env:
          GH_TOKEN: ${{ steps.gh-app.outputs.token }}
        run: |
          head_branch=feature/v$TAG_NAME-${{ github.run_number }}-${{ github.run_attempt }}
          message="Update for v$TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $head_branch
          git add $FORMULA
          git commit -am "$message"
          git push origin $head_branch
          gh pr create -B main -H $head_branch -t "$message" -b "Auto-updated Homebrew formula for Nethermind v$TAG_NAME"

  publish-nuget:
    name: Publish NuGet packages
    if: ${{ !github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'bootnode-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_HOST: 'https://www.nuget.org'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Download Nethermind reference assemblies
        id: download
        run: |
          json=$(curl -s "$ASSETS_URL")
          asset=$(echo "$json" | jq -r '.[] | select(.name | contains("ref-assemblies"))')
          name=$(echo "$asset" | jq -r '.name')
          url=$(echo "$asset" | jq -r '.browser_download_url')
          curl -sL $url -o refasm.zip
          unzip refasm.zip -d src/Nethermind/Nethermind.ReferenceAssemblies/ref
          echo "asset-name=$name" >> $GITHUB_OUTPUT

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_HOST }}
          token-service-url: ${{ env.NUGET_HOST }}/api/v2/token

      - name: Submit package
        working-directory: src/Nethermind
        run: |
          package_output="$(mktemp -d)"
          dotnet pack Nethermind.ReferenceAssemblies/Nethermind.ReferenceAssemblies.csproj -c release -p:SaveDiskSpace=true --output "$package_output"
          dotnet pack Nethermind.Kademlia/Nethermind.Kademlia.csproj -c release -p:SaveDiskSpace=true --output "$package_output"
          test -n "$(find "$package_output" -maxdepth 1 -name 'Nethermind.ReferenceAssemblies.*.nupkg' -print -quit)"
          test -n "$(find "$package_output" -maxdepth 1 -name 'Nethermind.Kademlia.*.nupkg' -print -quit)"
          test -n "$(find "$package_output" -maxdepth 1 -name 'Nethermind.Kademlia.*.snupkg' -print -quit)"
          dotnet nuget push "$package_output/*.nupkg" --skip-duplicate \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_HOST }}/api/v2/package

      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Delete asset from release
        env:
          GITHUB_TOKEN: ${{ steps.gh-app.outputs.token }}
        run: gh release delete-asset "$TAG_NAME" "${{ steps.download.outputs.asset-name }}" -y
