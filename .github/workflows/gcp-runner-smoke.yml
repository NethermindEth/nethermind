name: GCP Runner Smoke Test

on:
  workflow_dispatch:
    inputs:
      machine_type:
        description: "GCE machine type"
        default: "c2-standard-8"
        required: true
      local_ssd_count:
        description: "Number of 375 GB NVMe Local SSD partitions (>1 is RAID0'd)"
        default: "2"
        required: true
      provisioning_model:
        description: "SPOT or STANDARD"
        type: choice
        options:
          - SPOT
          - STANDARD
        default: SPOT
        required: true

jobs:
  create_a_runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      runner_label: ${{ steps.label.outputs.value }}
    steps:
      - name: Derive runner label
        id: label
        run: echo "value=smoke-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Create a Runner
        uses: ./.github/actions/gcp-runner
        with:
          action: create
          runner_label: ${{ steps.label.outputs.value }}
          github_token: ${{ steps.gh-app.outputs.token }}
          machine_type: ${{ inputs.machine_type }}
          local_ssd_count: ${{ inputs.local_ssd_count }}
          provisioning_model: ${{ inputs.provisioning_model }}
          max_run_duration: 40m
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  inspect:
    needs: [create_a_runner]
    runs-on: ${{ needs.create_a_runner.outputs.runner_label }}
    timeout-minutes: 35
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Machine shape
        run: |
          nproc; free -g; lsblk; df -h "$GITHUB_WORKSPACE"

      - name: Egress address matches the instance external address
        run: |
          meta=$(curl -sf -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip)
          seen=$(curl -sf --max-time 10 https://api.ipify.org)
          echo "metadata=${meta} egress=${seen}"
          [[ -n "$meta" && "$meta" == "$seen" ]] || { echo "::error::egress address differs from the instance address"; exit 1; }

      - name: Outbound JSON-RPC on 8545 is not blocked
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://portquiz.net:8545/ || true)
          echo "portquiz.net:8545 -> HTTP ${code}"
          [[ "$code" == "200" ]] || { echo "::error::outbound tcp/8545 failed"; exit 1; }

      - name: Check out repository
        if: inputs.provisioning_model == 'SPOT'
        uses: actions/checkout@v6

      - name: Set up .NET
        if: inputs.provisioning_model == 'SPOT'
        uses: actions/setup-dotnet@v6

      - name: Invariant globalization breaks the Nethermind.Core build (control)
        if: inputs.provisioning_model == 'SPOT'
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          if dotnet build src/Nethermind/Nethermind.Core/Nethermind.Core.csproj -c Release > core-invariant.log 2>&1; then
            echo "::warning::Nethermind.Core built under invariant globalization"
          else
            grep -m3 -E "error" core-invariant.log || tail -20 core-invariant.log
          fi
          dotnet build-server shutdown

      - name: Build and run a block-processing benchmark with the override
        if: inputs.provisioning_model == 'SPOT'
        run: |
          dotnet build src/Nethermind/Nethermind.Evm.Benchmark/Nethermind.Evm.Benchmark.csproj -c Release
          dotnet run -c Release --no-build --project src/Nethermind/Nethermind.Evm.Benchmark/Nethermind.Evm.Benchmark.csproj \
            -- --filter '*BlockProcessingBenchmark.SingleTransfer*' --exporters json --artifacts "${RUNNER_TEMP}/bdn"
          ls "${RUNNER_TEMP}/bdn/results"

      - name: Check out rpc-tests
        if: inputs.provisioning_model == 'STANDARD'
        uses: actions/checkout@v6
        with:
          repository: NethermindEth/rpc-tests
          path: rpc-tests

      - name: Set up Go
        if: inputs.provisioning_model == 'STANDARD'
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Build rpc_int
        if: inputs.provisioning_model == 'STANDARD'
        working-directory: rpc-tests
        run: make rpc_int && ./build/bin/rpc_int -h | head -5 || true

  destroy_runner:
    needs: [create_a_runner, inspect]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Destroy Runner
        id: destroy
        uses: ./.github/actions/gcp-runner
        with:
          action: destroy
          runner_label: ${{ needs.create_a_runner.outputs.runner_label }}
          github_token: ${{ steps.gh-app.outputs.token }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

      - name: Report teardown
        env:
          TERMINATED_BY: ${{ steps.destroy.outputs.terminated_by }}
          PREEMPTED: ${{ steps.destroy.outputs.preempted }}
        run: |
          echo "terminated_by=${TERMINATED_BY}"
          echo "preempted=${PREEMPTED}"
