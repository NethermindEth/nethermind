name: Nethermind extra test variants

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm

defaults:
  run:
    shell: bash

permissions:
  # actions: read lets the select job download the test selection model from test-selection.yml.
  actions: read
  contents: read

jobs:
  build:
    needs: select
    if: needs.select.outputs.any == 'true'
    uses: ./.github/workflows/build-test-artifacts.yml
    with:
      matrix: '{"include":[{"rid":"linux-x64","os":"ubuntu-latest","variant":"release","build_args":""},{"rid":"linux-x64","os":"ubuntu-latest","variant":"checked","build_args":"-p:DefineConstants=TRACE%3BDEBUG"}]}'

  # Pull requests run only the test projects their change can affect (.github/actions/select-tests); every
  # other event runs every project. The matrices live in scripts/ci/test-matrices.json.
  select:
    name: Select test projects
    runs-on: ubuntu-latest
    outputs:
      matrices: ${{ steps.select.outputs.matrices }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select test projects
        id: select
        uses: ./.github/actions/select-tests
        with:
          workflow: nethermind-tests-checked

  tests:
    name: Run ${{ matrix.project }} [${{ matrix.variant.label }}]
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_GCConserveMemory: 9
      # Only these fixture tests read the src/tests submodule at runtime.
      FIXTURE_PROJECTS: '["Ethereum.Blockchain.Block.Test","Ethereum.Legacy.Blockchain.Block.Test","Ethereum.Legacy.Blockchain.Test","Ethereum.Legacy.Transition.Test","Ethereum.Legacy.VM.Test"]'
    strategy:
      fail-fast: false
      # The Keccak batch kernels are four lanes wide without AVX-512 and eight with it, and the
      # code that feeds them differs too, so the default runners cover only one of the two.
      # Hosted runners have AVX2, so no other lane runs the x64 128-bit nibble and hex loops.
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ contains(fromJSON(env.FIXTURE_PROJECTS), matrix.project) && 'recursive' || 'false' }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: ${{ matrix.variant.artifact }}

      - name: ${{ matrix.project }}
        id: test
        working-directory: src/Nethermind/${{ matrix.project }}
        env:
          DOTNET_EnableHWIntrinsic: ${{ matrix.variant.hw-intrinsic }}
          DOTNET_EnableAVX2: ${{ matrix.variant.avx2 }}
          DOTNET_EnableAVX512: ${{ matrix.variant.avx512 }}
          NETHERMIND_TEST_REQUIRE_AVX2: ${{ matrix.variant.require-avx2 }}
          NETHERMIND_TEST_REQUIRE_AVX512: ${{ matrix.variant.require-avx512 }}
          NETHERMIND_TEST_REQUIRE_NO_AVX2: ${{ matrix.variant.require-no-avx2 }}
        run: |
          core_tests='KeccakTests|KeccakCacheTests|BytesTests|Nethermind.Core.Test.Json.'
          if [[ "${{ matrix.variant.label }}" == "avx512" ]]; then
            for flag in avx512f avx512cd avx512bw avx512dq avx512vl; do
              if ! grep -qw "$flag" /proc/cpuinfo; then
                echo "::warning::AVX-512 tests skipped: this hosted runner lacks $flag."
                echo "AVX-512 tests skipped: hosted runner lacks $flag; no AVX-512 coverage on this run." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            # Without VBMI the hex tests would pass down the AVX2 fallback while reporting AVX-512 coverage.
            # With it, the instruction set checks in those fixtures assert that VBMI is in force.
            if grep -qw avx512vbmi /proc/cpuinfo; then
              export NETHERMIND_TEST_REQUIRE_AVX512VBMI=1
            else
              echo "::warning::This hosted runner lacks avx512vbmi, so the VBMI hex kernels are not covered on this run."
              core_tests='KeccakTests|KeccakCacheTests'
            fi
          fi
          if [[ "${{ matrix.variant.label }}" == "avx2" || "${{ matrix.variant.label }}" == "avx512" ]]; then
            for target in \
              "Nethermind.Core.Test:$core_tests" \
              'Nethermind.Evm.Test:KeyedNonceManagerTests' \
              'Ethereum.Trie.Test:StorageTrieTests' \
              'Nethermind.State.Flat.History.Test:NodeViewsTests' \
              'Nethermind.Trie.Test:TrieNodeTests|DirtyNodeHasherTests' \
              'Nethermind.State.Test:StateTreeTests|ScopeProviderTests|AccountProofCollectorTests' \
              'Nethermind.Blockchain.Test:TxTrieTests|ReceiptTrieTests|WithdrawalTrieTests'; do
              project="${target%%:*}"
              names="${target#*:}"
              filter="FullyQualifiedName~${names//|/|FullyQualifiedName~}"
              "../artifacts/bin/$project/release/$project" --results-directory "../$project/TestResults" \
                --hangdump --hangdump-timeout 8m --hangdump-type Mini \
                --crashdump --crashdump-type Mini --crash-report-if-supported --filter "$filter"
            done
            echo "${{ matrix.variant.label }}: all selected test projects passed with runtime ISA assertions enabled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A hung test host is killed with a dump of every thread instead of running into the job
          # timeout, which kills the job without one. The timeout counts inactivity, not runtime, and
          # a mini dump keeps the write and upload inside whatever job budget the hang leaves.
          # A host that dies mid-run leaves a dump, a crash report where the runtime writes one, and a
          # sequence log of the tests in flight; on its own, exit code 7 names neither test nor cause.
          test_args=(--results-directory TestResults
            --hangdump --hangdump-timeout 8m --hangdump-type Mini
            --crashdump --crashdump-type Mini --crash-report-if-supported)
          if [[ "${{ matrix.variant.label }}" == "no-avx2" ]]; then
            test_args+=(--filter "FullyQualifiedName~HexPrefixTests|FullyQualifiedName~NibbleTests|FullyQualifiedName~BytesTests|FullyQualifiedName~Nethermind.Core.Test.Json.")
          fi

          ../artifacts/bin/${{ matrix.project }}/release/${{ matrix.project }} "${test_args[@]}"

      - name: Upload dumps
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-${{ matrix.variant.label }}-dumps
          # The ISA lanes run several projects, each writing into its own TestResults.
          path: |
            src/Nethermind/*/TestResults/*_hang.*
            src/Nethermind/*/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

  tests-chunked:
    name: Run ${{ matrix.test.project }} (${{ matrix.test.chunk }}) [${{ matrix.variant.label }}]
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests-chunked != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_GCConserveMemory: 9
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-chunked }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: ${{ matrix.variant.artifact }}

      - name: ${{ matrix.test.project }} (${{ matrix.test.chunk }})
        id: test
        working-directory: src/Nethermind/${{ matrix.test.project }}
        env:
          DOTNET_EnableHWIntrinsic: ${{ matrix.variant.hw-intrinsic }}
          TEST_CHUNK: ${{ matrix.test.chunk }}
          TEST_SKIP_HEAVY: 1
        run: |
          # A hung test host is killed with a dump of every thread instead of running into the job
          # timeout, which kills the job without one. The timeout counts inactivity, not runtime, and
          # a mini dump keeps the write and upload inside whatever job budget the hang leaves.
          # A host that dies mid-run leaves a dump, a crash report where the runtime writes one, and a
          # sequence log of the tests in flight; on its own, exit code 7 names neither test nor cause.
          test_args=(--results-directory TestResults
            --hangdump --hangdump-timeout 8m --hangdump-type Mini
            --crashdump --crashdump-type Mini --crash-report-if-supported)

          ../artifacts/bin/${{ matrix.test.project }}/release/${{ matrix.test.project }} "${test_args[@]}"

      - name: Upload dumps
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test.project }}-${{ matrix.test.chunk }}-${{ matrix.variant.label }}-dumps
          path: |
            src/Nethermind/${{ matrix.test.project }}/TestResults/*_hang.*
            src/Nethermind/${{ matrix.test.project }}/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

  # The pyspec fixtures under the build variants now run through the reusable nethtest
  # workflow instead of the Ethereum.Blockchain.Pyspec.Test NUnit shards. Matches the
  # NUnit TEST_SKIP_HEAVY=1 scope those variant jobs used: the heavy engine / sync /
  # Amsterdam-BAL fixtures are skipped (build-config bugs live in the EVM + crypto, which
  # blockTest exercises as well as engineTest), leaving block + state + tx. Sequential
  # (patricia) config, coarsely chunked, once per variant. checked builds the runner with
  # DEBUG defines; no-intrinsics disables hardware intrinsics at run time.
  pyspec-checked:
    name: EEST nethtest (checked)
    uses: ./.github/workflows/run-nethtest.yml
    with:
      test_types: blockTest,stateTest,txTest
      setup_group: sequential
      variant: checked

  pyspec-no-intrinsics:
    name: EEST nethtest (no-intrinsics)
    uses: ./.github/workflows/run-nethtest.yml
    with:
      test_types: blockTest,stateTest,txTest
      setup_group: sequential
      variant: no-intrinsics

  tests-summary:
    name: Tests summary
    needs: [select, tests, tests-chunked, pyspec-checked, pyspec-no-intrinsics]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          MATRICES: ${{ needs.select.outputs.matrices }}
        run: |
          # A test job may be skipped only when the selection left it nothing to run; skipped for any other
          # reason (a failed build, a failed selection) is a failure.
          job_ok() {
            [[ "$2" == "success" ]] || [[ "$2" == "skipped" && "$(jq -r --arg job "$1" '.[$job] == null' <<< "$MATRICES")" == "true" ]]
          }
          [[ "${{ needs.select.result }}" == "success" ]]
          job_ok tests "${{ needs.tests.result }}"
          job_ok tests-chunked "${{ needs.tests-chunked.result }}"
          [[ "${{ needs.pyspec-checked.result }}" == "success" ]]
          [[ "${{ needs.pyspec-no-intrinsics.result }}" == "success" ]]