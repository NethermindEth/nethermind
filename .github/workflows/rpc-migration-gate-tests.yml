name: RPC migration gate script tests

on:
  push:
    branches: [perf/getlogs-migration-gate-20261028, perf/getlogs-night3-phases-20261028, perf/getlogs-prepared-snapshot-20261029]
    paths:
      - scripts/rpc-bench/**
      - .github/workflows/rpc-migration-gate-tests.yml
      - .github/workflows/run-rpc-benchmarks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Migration gate regression tests
        run: dotnet run --file scripts/rpc-bench/test-receipt-migration.cs
      - name: Sweep regression tests
        run: dotnet run --file scripts/rpc-bench/test-rpc-sweep.cs
      - name: Workflow contracts
        run: dotnet run --file scripts/rpc-bench/test-workflow-contracts.cs
      - name: JSON benchmark phases and reuse
        run: dotnet run --file scripts/rpc-bench/test-json-bench-reuse.cs
      - name: Resource sampling
        run: dotnet run --file scripts/rpc-bench/test-sample-resources.cs
      - name: Analyze changed scripts
        run: |
          for script in start-node stop-node run-json-bench run-rpc-sweep sample-resources test-json-bench-reuse test-rpc-sweep test-sample-resources test-workflow-contracts; do
            dotnet run --file scripts/ci/run-script-tests.cs -- --check "scripts/rpc-bench/${script}.cs"
          done
