name: Run Frame Transaction Measurements

on:
  workflow_dispatch:
    inputs:
      harness:
        description: Which measurement harness to run
        required: true
        type: choice
        options:
          - both
          - verify
          - mempool
          - flood
          - producer-retry
          - prefix-retry
        default: both
      groth16_artifacts_version:
        description: >-
          NethermindEth/frame-verify-gas release tag (vMAJOR.MINOR.PATCH) to download the Groth16 sweep artifacts
          from. Required for both, mempool and flood; ignored by the other harnesses. Drafts and prereleases are
          refused.
        required: false
        type: string
        default: ''
      raise_verify_gas_const:
        description: >-
          Patch Eip8141Constants.MaxVerifyGas to this value before building, so the 500k sweep points can run.
          Empty means a stock build, on which they self-ignore. Use 500000 for the complete sweep. The patch
          and its diff are recorded in PROVENANCE.txt beside the results.
        required: false
        type: string
        default: ''

# Deliberate: no github.ref in the group, so all dispatches share one runner slot; don't "fix" to the repo default.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure the frame-transaction validation prefix
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 120
    steps:
      # Must run before checkout, or a checkout/setup failure skips the wipe while the always() steps below still fire.
      - name: Resolve the output directory
        run: |
          echo "OUTPUT_DIR=${RUNNER_TEMP}/frame-tx-measurements" >> "${GITHUB_ENV}"
          rm -rf "${RUNNER_TEMP}/frame-tx-measurements"
          mkdir -p "${RUNNER_TEMP}/frame-tx-measurements"

      - name: Fetch the Groth16 sweep artifacts
        if: inputs.harness == 'both' || inputs.harness == 'mempool' || inputs.harness == 'flood'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.groth16_artifacts_version }}
        run: |
          set -uo pipefail

          REPO=NethermindEth/frame-verify-gas
          LABELS=(236k 300k 500k soispoke)

          version="${REQUESTED_VERSION//[[:space:]]/}"
          if [[ -z "${version}" ]]; then
            echo "::error::groth16_artifacts_version is empty, so FrameTxMempoolDosMeasurement and FrameTxFloodMeasurement would have no Groth16 artifacts. Supply a ${REPO} release tag such as v1.0.0."
            exit 1
          fi
          if [[ ! "${version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::groth16_artifacts_version '${version}' is not a release tag of the form vMAJOR.MINOR.PATCH. Names like 'latest' and prerelease suffixes are refused; supply a published ${REPO} release tag."
            exit 1
          fi
          for tool in gh python3 sha256sum tar; do
            if ! command -v "${tool}" >/dev/null; then
              echo "::error::${tool} is not available on this runner, so the Groth16 artifacts cannot be fetched and verified. Install it on the runner."
              exit 1
            fi
          done
          if [[ -z "${RUNNER_TOOL_CACHE:-}" ]]; then
            echo "::error::RUNNER_TOOL_CACHE is not set, so there is no persistent directory to cache the Groth16 artifacts in. Check the runner configuration."
            exit 1
          fi

          work=$(mktemp -d "${RUNNER_TEMP}/frame-verify-gas-groth16.XXXXXX") || exit 1
          trap 'rm -rf "${work}"' EXIT
          assets="${work}/assets"
          mkdir "${assets}" || exit 1

          if ! state=$(gh release view "${version}" --repo "${REPO}" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>"${work}/gh.err"); then
            echo "::error::release ${version} could not be looked up on ${REPO}: $(paste -sd ' ' "${work}/gh.err"). Check that the tag exists there and is published."
            exit 1
          fi
          case "${state}" in
            'false false') ;;
            'true '*) echo "::error::release ${version} on ${REPO} is a draft, so its artifacts have not been published for review. Supply a published release tag."; exit 1 ;;
            *' true') echo "::error::release ${version} on ${REPO} is a prerelease. Only full releases are accepted; supply a published release tag."; exit 1 ;;
            *) echo "::error::release ${version} on ${REPO} reported an unexpected draft/prerelease state '${state}'."; exit 1 ;;
          esac

          # SHA256SUMS is always fetched fresh, so a cached tarball is only ever used after matching the release.
          if ! gh release download "${version}" --repo "${REPO}" --dir "${assets}" --pattern SHA256SUMS 2>"${work}/gh.err" || [[ ! -f "${assets}/SHA256SUMS" ]]; then
            echo "::error::SHA256SUMS could not be downloaded from release ${version} on ${REPO}: $(paste -sd ' ' "${work}/gh.err"). The release must carry a SHA256SUMS asset covering the four sweep tarballs."
            exit 1
          fi
          expected_names=$(for label in "${LABELS[@]}"; do echo "sweep-${label}.tar.gz"; done | sort)
          listed_names=$(sed -E 's/^[0-9a-f]{64} [ *]//' "${assets}/SHA256SUMS" | sort)
          malformed=$(grep -cvE '^[0-9a-f]{64} [ *]sweep-(236k|300k|500k|soispoke)\.tar\.gz$' "${assets}/SHA256SUMS" || true)
          if [[ "${malformed}" != "0" || "${listed_names}" != "${expected_names}" ]]; then
            echo "::error::SHA256SUMS of release ${version} on ${REPO} does not list exactly one checksum for each of $(tr '\n' ' ' <<< "${expected_names}")and nothing else. Refusing to use this release; report it on ${REPO}."
            exit 1
          fi

          # RUNNER_TEMP is emptied at every job start, so only the tool cache survives between dispatches.
          cache_dir="${RUNNER_TOOL_CACHE}/frame-verify-gas-groth16/${version}"
          downloaded=0
          if [[ -d "${cache_dir}" ]]; then
            if cp "${cache_dir}"/sweep-*.tar.gz "${assets}/" && (cd "${assets}" && sha256sum --strict -c SHA256SUMS); then
              echo "Using the cached tarballs in ${cache_dir}, re-verified against SHA256SUMS of release ${version}."
            else
              echo "::warning::the cached Groth16 tarballs in ${cache_dir} do not match SHA256SUMS of release ${version}; discarding the cache and downloading again. If this recurs, the release assets changed after publication."
              rm -rf "${cache_dir}" "${assets}"/sweep-*.tar.gz || exit 1
            fi
          fi
          if [[ ! -d "${cache_dir}" ]]; then
            patterns=()
            for label in "${LABELS[@]}"; do
              patterns+=(--pattern "sweep-${label}.tar.gz")
            done
            if ! gh release download "${version}" --repo "${REPO}" --dir "${assets}" "${patterns[@]}" 2>"${work}/gh.err"; then
              echo "::error::the sweep tarballs could not be downloaded from release ${version} on ${REPO}: $(paste -sd ' ' "${work}/gh.err"). Check the release page and re-dispatch."
              exit 1
            fi
            if ! (cd "${assets}" && sha256sum --strict -c SHA256SUMS); then
              echo "::error::the sweep tarballs downloaded from release ${version} on ${REPO} do not match its SHA256SUMS. Refusing to use them; re-dispatch, and report it on ${REPO} if it recurs."
              exit 1
            fi
            downloaded=1
          fi

          artifacts="${RUNNER_TEMP}/frame-verify-gas-groth16"
          rm -rf "${artifacts}" && mkdir -p "${artifacts}" || exit 1
          for label in "${LABELS[@]}"; do
            sweep="sweep-${label}"
            tarball="${assets}/${sweep}.tar.gz"
            if ! names=$(tar -tzf "${tarball}") || ! listing=$(tar -tvzf "${tarball}"); then
              echo "::error::${sweep}.tar.gz from release ${version} on ${REPO} is not a readable gzip tarball. Refusing to use this release; report it on ${REPO}."
              exit 1
            fi
            # tar escapes control characters in listings, so one line is one member and the patterns see every byte of its name.
            if [[ -z "${names}" ]] \
              || grep -qvE "^${sweep}(/[A-Za-z0-9._-]+)*/?\$" <<< "${names}" \
              || grep -qE '(^|/)\.\.?(/|$)' <<< "${names}" \
              || grep -qv '^[-d]' <<< "${listing}" \
              || [[ "$(wc -l <<< "${names}")" != "$(wc -l <<< "${listing}")" ]]; then
              echo "::error::${sweep}.tar.gz from release ${version} on ${REPO} has a member that is not a plain file or directory under ${sweep}/ (an absolute path, '..', a link or a special file). Refusing to extract it; report it on ${REPO}."
              exit 1
            fi
            mkdir "${work}/${sweep}" || exit 1
            if ! tar -xzf "${tarball}" -C "${work}/${sweep}" --no-same-owner --no-same-permissions \
              || [[ "$(ls -A "${work}/${sweep}")" != "${sweep}" ]] \
              || [[ -n "$(find "${work}/${sweep}" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
              echo "::error::${sweep}.tar.gz from release ${version} on ${REPO} did not extract to plain files under ${sweep}/ alone. Refusing to use it; report it on ${REPO}."
              exit 1
            fi
            mv "${work}/${sweep}/${sweep}" "${artifacts}/${sweep}" || exit 1
            for file in verifier.hex calldata-invalid.hex gas.txt; do
              if [[ ! -f "${artifacts}/${sweep}/${file}" ]]; then
                echo "::error::${sweep}.tar.gz from release ${version} on ${REPO} has no ${sweep}/${file}, so the harnesses would self-ignore that sweep point. Supply a release that carries it."
                exit 1
              fi
            done
          done

          # A checksum only proves the release is intact, not that it holds a Groth16 verifier. This is a
          # plausibility bound, not an audit: size within EIP-170, and an opcode walk (skipping PUSH data) that
          # finds PUSH1 of each BN254 precompile address (0x06 ecAdd, 0x07 ecMul, 0x08 ecPairing) and a STATICCALL.
          if ! python3 - "${artifacts}" "${LABELS[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          HEX = re.compile(r"0x(?:[0-9a-fA-F]{2})+")
          PRECOMPILES = {0x06: "ecAdd", 0x07: "ecMul", 0x08: "ecPairing"}
          PUSH1, PUSH32, STATICCALL = 0x60, 0x7F, 0xFA
          root = Path(sys.argv[1])
          problems = []

          def read_hex(sweep, name):
              text = (root / sweep / name).read_text(encoding="ascii", errors="replace").strip()
              if not HEX.fullmatch(text):
                  problems.append(f"{sweep}/{name} is not 0x-prefixed, byte-aligned hex.")
                  return None
              return bytes.fromhex(text[2:])

          for label in sys.argv[2:]:
              sweep = f"sweep-{label}"
              code = read_hex(sweep, "verifier.hex")
              if code is not None:
                  if not 1024 <= len(code) <= 24576:
                      problems.append(f"{sweep}/verifier.hex is {len(code)} bytes, outside the 1024 to 24576 (EIP-170) bytes expected of a Groth16 verifier.")
                  pushed, staticcall, pc = set(), False, 0
                  while pc < len(code):
                      op = code[pc]
                      if op == PUSH1 and pc + 1 < len(code):
                          pushed.add(code[pc + 1])
                      staticcall |= op == STATICCALL
                      pc += 1 + (op - PUSH1 + 1 if PUSH1 <= op <= PUSH32 else 0)
                  missing = [f"0x{a:02x} {n}" for a, n in PRECOMPILES.items() if a not in pushed]
                  if missing:
                      problems.append(f"{sweep}/verifier.hex never pushes the precompile address {', '.join(missing)}, so it cannot be a BN254 Groth16 verifier.")
                  if not staticcall:
                      problems.append(f"{sweep}/verifier.hex has no STATICCALL, so it cannot call the BN254 precompiles.")
              calldata = read_hex(sweep, "calldata-invalid.hex")
              if calldata is not None and len(calldata) < 4:
                  problems.append(f"{sweep}/calldata-invalid.hex is shorter than a function selector.")
              gas = (root / sweep / "gas.txt").read_text(encoding="ascii", errors="replace").strip()
              if not re.fullmatch(r"[1-9][0-9]{0,8}", gas):
                  problems.append(f"{sweep}/gas.txt is not a positive integer gas figure.")

          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
          then
            echo "::error::the Groth16 artifacts of release ${version} on ${REPO} failed the plausibility checks above. Refusing to measure with them; report it on ${REPO}."
            exit 1
          fi

          # Cached only once every check has passed, and moved into place atomically so no dispatch sees a partial copy.
          if (( downloaded )); then
            mkdir -p "${cache_dir%/*}" || exit 1
            staging=$(mktemp -d "${cache_dir%/*}/.incoming.XXXXXX") || exit 1
            if cp "${assets}"/sweep-*.tar.gz "${assets}/SHA256SUMS" "${staging}/" && mv -T "${staging}" "${cache_dir}"; then
              echo "Cached the verified tarballs in ${cache_dir}."
            else
              rm -rf "${staging}"
              echo "::warning::the verified Groth16 tarballs could not be cached in ${cache_dir}; the next dispatch will download them again."
            fi
          fi

          cp "${assets}/SHA256SUMS" "${artifacts}/SHA256SUMS" || exit 1
          {
            echo "FRAME_GROTH16_ARTIFACTS=${artifacts}"
            echo "GROTH16_ARTIFACTS_VERSION=${version}"
            echo "GROTH16_ARTIFACTS_SHA256SUMS_DIGEST=$(sha256sum "${assets}/SHA256SUMS" | cut -d' ' -f1)"
          } >> "${GITHUB_ENV}"
          echo "Groth16 artifacts of ${REPO}@${version} verified and extracted to ${artifacts}."

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Run measurement harnesses
        id: measure
        working-directory: src/Nethermind
        env:
          HARNESS: ${{ inputs.harness }}
          RAISE_VERIFY_GAS: ${{ inputs.raise_verify_gas_const }}
        run: |
          set -uo pipefail

          # Guards against a leftover value from a prior run on this persistent runner.
          unset FRAME_FLOOD_ALLOW_MULTICORE

          projects=()
          case "${HARNESS}" in
            both)           projects=(Nethermind.TxPool.Test Nethermind.Blockchain.Test) ;;
            verify)         projects=(Nethermind.Evm.Test) ;;
            mempool)        projects=(Nethermind.TxPool.Test) ;;
            flood|producer-retry) projects=(Nethermind.Blockchain.Test) ;;
            prefix-retry)   projects=(Nethermind.TxPool.Test) ;;
            *)              echo "::error::no build mapping for harness '${HARNESS}'"; exit 1 ;;
          esac

          if [[ "${HARNESS}" == "both" || "${HARNESS}" == "flood" ]] && ! command -v taskset >/dev/null; then
            echo "::error::taskset is not available, so FrameTxFloodMeasurement cannot be confined to one CPU and its figures would describe an uncontended node."
            exit 1
          fi
          # Safe to patch: this constant only gates the mempool's prefix simulator, never block validity.
          CONST_FILE=Nethermind.Core/Eip8141Constants.cs
          STOCK_LITERAL='MaxVerifyGas = 300_000'
          {
            echo "ref=${GITHUB_REF_NAME}"
            echo "sha=${GITHUB_SHA}"
          } > "${OUTPUT_DIR}/PROVENANCE.txt"
          if [[ -n "${GROTH16_ARTIFACTS_VERSION:-}" ]]; then
            {
              echo "groth16_artifacts=NethermindEth/frame-verify-gas@${GROTH16_ARTIFACTS_VERSION} sha256sums_sha256=${GROTH16_ARTIFACTS_SHA256SUMS_DIGEST}"
              cat "${FRAME_GROTH16_ARTIFACTS}/SHA256SUMS"
            } >> "${OUTPUT_DIR}/PROVENANCE.txt"
          fi
          RAISE_VERIFY_GAS="${RAISE_VERIFY_GAS//[[:space:]]/}"
          if [[ -n "${RAISE_VERIFY_GAS}" ]]; then
            if [[ ! "${RAISE_VERIFY_GAS}" =~ ^[1-9][0-9]{5,8}$ ]]; then
              echo "::error::raise_verify_gas_const '${RAISE_VERIFY_GAS}' is not a plain integer of 6 to 9 digits."
              exit 1
            fi
            if (( RAISE_VERIFY_GAS < 500000 )); then
              echo "::error::raise_verify_gas_const ${RAISE_VERIFY_GAS} unlocks no sweep point: both harnesses skip a ceiling strictly greater than the constant, and the smallest declared point above stock 300000 is 500000."
              exit 1
            fi
            if [[ ! -f "${CONST_FILE}" ]]; then
              echo "::error::${CONST_FILE} is not present on ${GITHUB_REF_NAME}, so there is no constant to raise. Dispatch against a ref that carries EIP-8141."
              exit 1
            fi
            hits=$(grep -c -- "${STOCK_LITERAL}" "${CONST_FILE}" || true)
            if [[ "${hits}" != "1" ]]; then
              echo "::error::expected exactly one '${STOCK_LITERAL}' in ${CONST_FILE}, found ${hits}. Refusing to patch."
              exit 1
            fi
            sed -i "s/${STOCK_LITERAL}/MaxVerifyGas = ${RAISE_VERIFY_GAS}/" "${CONST_FILE}" || exit 1
            {
              echo "eip8141_max_verify_gas_patched_from=300000 to=${RAISE_VERIFY_GAS}"
              echo "# Every RESULT row in this artifact came from a build carrying the diff below."
              git --no-pager diff -- "${CONST_FILE}"
            } >> "${OUTPUT_DIR}/PROVENANCE.txt"
            echo "::warning::Eip8141Constants.MaxVerifyGas patched 300000 -> ${RAISE_VERIFY_GAS} for this run. These figures are not from a stock build; see PROVENANCE.txt in the artifact."
          else
            {
              echo "eip8141_max_verify_gas=300000 (stock, unpatched)"
              echo "# The 500k sweep points self-ignore on this build. Re-dispatch with raise_verify_gas_const=500000 to measure them."
            } >> "${OUTPUT_DIR}/PROVENANCE.txt"
          fi

          for project in "${projects[@]}"; do
            dotnet build "${project}/${project}.csproj" -c release || exit 1
          done

          ran=0
          run_harness() {
            local project=$1 fixture=$2 rc=0
            shift 2
            local -a required=("$@")
            ran=$((ran + 1))
            if [[ -z "$(find "${project}" -name "${fixture}.cs" -print -quit)" ]]; then
              echo "::error::${fixture} is not present on ${GITHUB_REF_NAME}. Dispatch this workflow against a ref that carries the harness."
              return 1
            fi
            echo "::group::${fixture}"

            # Microsoft.Testing.Platform swallows console writers; harnesses report to a file instead.
            local results="${OUTPUT_DIR}/${fixture}-results.txt"
            export FRAME_MEMPOOL_DOS_OUT="${results}"
            export FRAME_RETRY_OUT="${results}"
            export FRAME_FLOOD_OUT="${results}"

            dotnet build-server shutdown || true

            local -a cmd=(
              dotnet test --project "${project}/${project}.csproj" -c release --no-build --no-restore
              --no-ansi --output Detailed -- --filter "FullyQualifiedName~${fixture}"
            )
            if [[ "${fixture}" == "FrameTxFloodMeasurement" ]]; then
              cmd=(taskset -c 0 "${cmd[@]}")
            fi

            "${cmd[@]}" 2>&1 | tee "${OUTPUT_DIR}/${fixture}.log" || rc=$?

            if ! grep -q '^RESULT ' "${results}" 2>/dev/null; then
              echo "::error::${fixture} produced no RESULT lines. Check that its inputs are present on the runner."
              rc=1
            fi

            local marker
            for marker in ${required[@]+"${required[@]}"}; do
              if ! grep -qF -- "${marker}" "${results}" 2>/dev/null; then
                echo "::error::${fixture} reported no '${marker}' rows, though this run was configured to produce them. Check that its inputs are present on the runner."
                rc=1
              fi
            done

            echo "::endgroup::"
            return "${rc}"
          }

          # Named so a self-ignored case fails loudly instead of quietly shrinking the sweep.
          mempool_markers=('shape=groth16-' 'shape=groth16-soispoke' 'case=signature_reject')
          flood_markers=('case=flood_delay' 'shape=groth16-' 'shape=groth16-soispoke' 'shape=signature-stuffed')
          if (( RAISE_VERIFY_GAS >= 500000 )); then
            mempool_markers+=('verify_gas=500000' 'shape=groth16-500k')
            flood_markers+=('shape=groth16-500k')
          fi

          status=0
          if [[ "${HARNESS}" == "verify" ]]; then
            run_harness Nethermind.Evm.Test FrameTxVerifyDosMeasurement || status=1
          fi
          if [[ "${HARNESS}" == "both" || "${HARNESS}" == "mempool" ]]; then
            run_harness Nethermind.TxPool.Test FrameTxMempoolDosMeasurement "${mempool_markers[@]}" || status=1
          fi
          if [[ "${HARNESS}" == "both" || "${HARNESS}" == "flood" ]]; then
            run_harness Nethermind.Blockchain.Test FrameTxFloodMeasurement "${flood_markers[@]}" || status=1
          fi
          if [[ "${HARNESS}" == "both" || "${HARNESS}" == "producer-retry" ]]; then
            producer_retry_markers=('case=k_retry_sweep')
            run_harness Nethermind.Blockchain.Test FrameTxProducerRetryMeasurement "${producer_retry_markers[@]}" || status=1
          fi
          if [[ "${HARNESS}" == "prefix-retry" ]]; then
            run_harness Nethermind.TxPool.Test FrameTxPrefixRetryMeasurement || status=1
          fi

          if [[ "${ran}" -eq 0 ]]; then
            echo "::error::harness '${HARNESS}' ran no fixture. It has a build mapping but no dispatch block."
            status=1
          fi

          exit "${status}"

      - name: Publish the reported figures to the run summary
        if: always() && env.OUTPUT_DIR != ''
        env:
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          set -uo pipefail
          if [[ "${MEASURE_OUTCOME}" != "success" ]]; then
            echo '> **This run failed. The rows below are partial; see the job log.**' >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f "${OUTPUT_DIR}/PROVENANCE.txt" ]]; then
            {
              echo '## Provenance'
              echo '```'
              cat "${OUTPUT_DIR}/PROVENANCE.txt"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          for report in "${OUTPUT_DIR}"/*-results.txt; do
            [[ -f "${report}" ]] || continue
            {
              echo "## $(basename "${report}" -results.txt)"
              echo '```'
              grep 'RESULT' "${report}" || echo 'no RESULT lines; see the uploaded artifact'
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload the measurement output
        if: always() && env.OUTPUT_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: frame-tx-measurements
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
