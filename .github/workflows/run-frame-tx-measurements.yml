name: Run Frame Transaction Measurements

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          Suite to run, one per dispatch. cost: idle reject cost, retry law, shape guard (~5 min).
          producer / import: block-building / block-import delay at fixed gas/s (~16 / ~23 min).
          import-tails: import with 60 s windows (~100 min, agree a slot first). honest: honest txs lost to the budget (~6 min).
        required: true
        type: choice
        options:
          - cost
          - producer
          - import
          - import-tails
          - honest
        default: cost
      groth16_artifacts_version:
        description: frame-verify-gas release tag for the Groth16 artifacts, e.g. v2.0.0. Needed by cost only.
        required: false
        type: string
        default: ''
      raise_verify_gas_const:
        description: Build with MaxVerifyGas raised to this value, e.g. 500000, so ceilings above 300k run. Empty is a stock build.
        required: false
        type: string
        default: ''
      runner:
        description: Runner the job must land on, e.g. benchmark-3. The job stops at once on any other. Empty accepts any and records it.
        required: false
        type: string
        default: ''

# Deliberate: no github.ref in the group, so dispatches never overlap; don't "fix" to the repo default.
# A third dispatch replaces the pending second one, so dispatch one at a time and wait for it to finish.
# The runner pool is shared with other benchmarks: keep each suite short, and never re-dispatch after a cancel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure the frame-transaction validation prefix
    runs-on: [self-hosted, benchmark]
    # Suite budget plus build and setup; see the campaign SPEC.
    timeout-minutes: ${{ fromJSON('{"cost":20,"producer":35,"import":40,"import-tails":120,"honest":20}')[inputs.suite] }}
    steps:
      # Numbers belong to the machine that measured them, and the pool holds several: a run on another one would
      # not compare with the runs it is meant to repeat.
      - name: Check the runner
        env:
          EXPECTED_RUNNER: ${{ inputs.runner }}
        run: |
          if [[ -n "${EXPECTED_RUNNER}" && "${RUNNER_NAME}" != "${EXPECTED_RUNNER}" ]]; then
            echo "::error::this job landed on ${RUNNER_NAME}, not ${EXPECTED_RUNNER}. Stopping before any work; dispatch again for that runner."
            exit 1
          fi
          echo "runner=${RUNNER_NAME} cpu=$(lscpu | sed -n 's/^Model name: *//p')"

      # Must run before checkout, or a checkout/setup failure skips the wipe while the always() steps below still fire.
      - name: Resolve the output directory
        run: |
          echo "OUTPUT_DIR=${RUNNER_TEMP}/frame-tx-measurements" >> "${GITHUB_ENV}"
          rm -rf "${RUNNER_TEMP}/frame-tx-measurements"
          mkdir -p "${RUNNER_TEMP}/frame-tx-measurements"

      - name: Capture runner hardware profile
        shell: bash
        run: |
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_NAME}"
            echo "machine=$(hostname)"
            echo "kernel=$(uname -sr)"
            echo
            echo '## cpu'
            lscpu 2>&1 || true
            echo
            echo '## process affinity'
            taskset -pc "$$" 2>&1 || true
            echo
            echo '## memory'
            free -h 2>&1 || true
            echo
            echo '## block devices'
            lsblk -d -o NAME,MODEL,SIZE,ROTA,TRAN 2>&1 || true
            echo
            echo '## relevant mounts'
            for path in "${RUNNER_TEMP}" /mnt/sda; do
              if [[ -e "${path}" ]]; then
                findmnt -T "${path}" || true
              fi
            done
            echo
            echo '## cpu frequency'
            if command -v cpupower >/dev/null; then
              cpupower frequency-info 2>&1 || true
            else
              echo 'cpupower unavailable'
            fi
            echo
            # The harness is pinned to CPU 0, so its governor, boost and SMT sibling decide what one core means.
            echo '## cpu 0'
            for file in cpu0/cpufreq/scaling_governor cpu0/cpufreq/scaling_cur_freq cpu0/topology/thread_siblings_list cpufreq/boost; do
              path="/sys/devices/system/cpu/${file}"
              if [[ -r "${path}" ]]; then
                echo "${file}=$(cat "${path}" 2>/dev/null)"
              fi
            done
            echo
            echo '## cgroup limits'
            for file in cpu.max cpuset.cpus.effective memory.max io.max; do
              path="/sys/fs/cgroup/${file}"
              if [[ -r "${path}" ]]; then
                printf '%s=' "${file}"
                tr '\n' ' ' < "${path}"
                echo
              fi
            done
            echo
            echo '## host load'
            uptime 2>&1 || true
            echo
            echo '## process counts (name only; no command-line arguments)'
            { ps -eo comm= | sort | uniq -c | sort -nr | head -n 20; } 2>&1 || true
          } > "${OUTPUT_DIR}/HARDWARE_PROFILE.txt"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch the Groth16 sweep artifacts
        if: inputs.suite == 'cost'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.groth16_artifacts_version }}
        run: scripts/frame-verify-gas/fetch-artifacts.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Run measurement harnesses
        id: measure
        working-directory: src/Nethermind
        env:
          SUITE: ${{ inputs.suite }}
          RAISE_VERIFY_GAS: ${{ inputs.raise_verify_gas_const }}
        run: |
          set -uo pipefail

          # Guards against a leftover value from a prior run on this persistent runner.
          unset FRAME_FLOOD_ALLOW_MULTICORE

          projects=()
          case "${SUITE}" in
            cost)                   projects=(Nethermind.TxPool.Test Nethermind.Blockchain.Test) ;;
            producer|import|import-tails|honest) projects=(Nethermind.Blockchain.Test) ;;
            *)                      echo "::error::no build mapping for suite '${SUITE}'"; exit 1 ;;
          esac

          if [[ "${SUITE}" != "cost" ]] && ! command -v taskset >/dev/null; then
            echo "::error::taskset is not available, so the ${SUITE} suite cannot be confined to one CPU and its figures would describe an uncontended node."
            exit 1
          fi
          # Safe to patch: this constant only gates the mempool's prefix simulator, never block validity.
          CONST_FILE=Nethermind.Core/Eip8141Constants.cs
          STOCK_LITERAL='MaxVerifyGas = 300_000'
          {
            echo "ref=${GITHUB_REF_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "suite=${SUITE}"
            echo "runner=${RUNNER_NAME}"
            echo "cpu_model=$(lscpu | sed -n 's/^Model name: *//p')"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "${OUTPUT_DIR}/PROVENANCE.txt"
          if [[ -n "${GROTH16_ARTIFACTS_VERSION:-}" ]]; then
            {
              echo "groth16_artifacts=NethermindEth/frame-verify-gas@${GROTH16_ARTIFACTS_VERSION} sha256sums_sha256=${GROTH16_ARTIFACTS_SHA256SUMS_DIGEST}"
              echo "soispoke_commit=${GROTH16_SOISPOKE_COMMIT}"
              cat "${GROTH16_ARTIFACTS_SHA256SUMS}"
            } >> "${OUTPUT_DIR}/PROVENANCE.txt"
          fi
          RAISE_VERIFY_GAS="${RAISE_VERIFY_GAS//[[:space:]]/}"
          if [[ -n "${RAISE_VERIFY_GAS}" ]]; then
            if [[ ! "${RAISE_VERIFY_GAS}" =~ ^[1-9][0-9]{5,8}$ ]]; then
              echo "::error::raise_verify_gas_const '${RAISE_VERIFY_GAS}' is not a plain integer of 6 to 9 digits."
              exit 1
            fi
            if (( RAISE_VERIFY_GAS < 400000 )); then
              echo "::error::raise_verify_gas_const ${RAISE_VERIFY_GAS} unlocks no sweep point: both harnesses skip a ceiling strictly greater than the constant, and the smallest declared point above stock 300000 is 400000."
              exit 1
            fi
            if [[ ! -f "${CONST_FILE}" ]]; then
              echo "::error::${CONST_FILE} is not present on ${GITHUB_REF_NAME}, so there is no constant to raise. Dispatch against a ref that carries EIP-8141."
              exit 1
            fi
            hits=$(grep -c -- "${STOCK_LITERAL}" "${CONST_FILE}" || true)
            if [[ "${hits}" != "1" ]]; then
              echo "::error::expected exactly one '${STOCK_LITERAL}' in ${CONST_FILE}, found ${hits}. Refusing to patch."
              exit 1
            fi
            sed -i "s/${STOCK_LITERAL}/MaxVerifyGas = ${RAISE_VERIFY_GAS}/" "${CONST_FILE}" || exit 1
            {
              echo "eip8141_max_verify_gas_patched_from=300000 to=${RAISE_VERIFY_GAS}"
              echo "# Every RESULT row in this artifact came from a build carrying the diff below."
              git --no-pager diff -- "${CONST_FILE}"
            } >> "${OUTPUT_DIR}/PROVENANCE.txt"
            echo "::warning::Eip8141Constants.MaxVerifyGas patched 300000 -> ${RAISE_VERIFY_GAS} for this run. These figures are not from a stock build; see PROVENANCE.txt in the artifact."
          else
            {
              echo "eip8141_max_verify_gas=300000 (stock, unpatched)"
              echo "# The 400k and 500k sweep points self-ignore on this build. Re-dispatch with raise_verify_gas_const=400000 or 500000 to measure them."
            } >> "${OUTPUT_DIR}/PROVENANCE.txt"
          fi

          {
            echo
            echo '## dotnet'
            dotnet --info 2>&1 || true
          } >> "${OUTPUT_DIR}/HARDWARE_PROFILE.txt"

          for project in "${projects[@]}"; do
            dotnet build "${project}/${project}.csproj" -c release || exit 1
          done

          ran=0
          # run_harness PROJECT LABEL FILTER PIN [REQUIRED_MARKER ...]
          run_harness() {
            local project=$1 label=$2 filter=$3 pin=$4 rc=0
            shift 4
            local -a required=("$@")
            ran=$((ran + 1))
            echo "::group::${label}"

            # Microsoft.Testing.Platform swallows console writers; harnesses report to a file instead.
            local results="${OUTPUT_DIR}/${label}-results.txt"
            export FRAME_MEMPOOL_DOS_OUT="${results}"
            export FRAME_RETRY_OUT="${results}"
            export FRAME_FLOOD_OUT="${results}"

            dotnet build-server shutdown || true

            local -a cmd=(
              dotnet test --project "${project}/${project}.csproj" -c release --no-build --no-restore
              --no-ansi --output Detailed -- --filter "${filter}"
            )
            if [[ "${pin}" == "pin" ]]; then
              cmd=(taskset -c 0 "${cmd[@]}")
            fi

            "${cmd[@]}" 2>&1 | tee "${OUTPUT_DIR}/${label}.log" || rc=$?

            if ! grep -q '^RESULT ' "${results}" 2>/dev/null; then
              echo "::error::${label} produced no RESULT lines. Check that its inputs are present on the runner."
              rc=1
            fi

            local marker
            for marker in ${required[@]+"${required[@]}"}; do
              if ! grep -qF -- "${marker}" "${results}" 2>/dev/null; then
                echo "::error::${label} reported no '${marker}' rows, though this run was configured to produce them."
                rc=1
              fi
            done

            echo "::endgroup::"
            return "${rc}"
          }

          # Named so a self-ignored case fails loudly instead of quietly shrinking the suite.
          compiled_max_verify_gas=${RAISE_VERIFY_GAS:-300000}
          status=0
          case "${SUITE}" in
            cost)
              mempool_markers=('shape=groth16-250k' 'shape=groth16-300k' 'shape=groth16-soispoke-v2' 'case=signature_reject')
              (( compiled_max_verify_gas >= 400000 )) && mempool_markers+=('verify_gas=400000' 'shape=groth16-400k')
              (( compiled_max_verify_gas >= 500000 )) && mempool_markers+=('verify_gas=500000' 'shape=groth16-500k')
              run_harness Nethermind.TxPool.Test FrameTxMempoolDosMeasurement "FullyQualifiedName~FrameTxMempoolDosMeasurement" nopin "${mempool_markers[@]}" || status=1
              run_harness Nethermind.Blockchain.Test FrameTxProducerRetryMeasurement "FullyQualifiedName~FrameTxProducerRetryMeasurement" nopin 'case=k_retry_sweep' || status=1
              run_harness Nethermind.Blockchain.Test FrameTxShapeGuard "TestCategory=frame-tx-cost" nopin || status=1
              ;;
            producer|import|import-tails|honest)
              row_case="${SUITE//-/_}_level"
              run_harness Nethermind.Blockchain.Test "FrameTx-${SUITE}" "TestCategory=frame-tx-${SUITE}" pin "case=${row_case}" || status=1
              results="${OUTPUT_DIR}/FrameTx-${SUITE}-results.txt"
              # Every cell the build can reach must have produced one row per level. EVM shapes self-ignore above
              # the compiled constant; signature stuffing is refused before the cap and runs on every build.
              paths=('')
              case "${SUITE}" in
                producer)            ceilings=(100000 235800 250000 300000 400000 500000); shapes=(keccak-wide signature-stuffed); levels=8 ;;
                import|import-tails) ceilings=(235800 250000 300000 400000); shapes=(keccak-wide signature-stuffed); paths=(direct protected); levels=4 ;;
                honest)              ceilings=(235800 300000); shapes=(keccak-wide); levels=5 ;;
              esac
              for shape in "${shapes[@]}"; do
                for ceiling in "${ceilings[@]}"; do
                  if [[ "${shape}" != signature-stuffed ]] && (( ceiling > compiled_max_verify_gas )); then
                    continue
                  fi
                  for path in "${paths[@]}"; do
                    cell="shape=${shape} ceiling=${ceiling}${path:+ gossip_path=${path}}"
                    cell_rows=$(grep -E "^RESULT case=${row_case} shape=${shape} ceiling=${ceiling} " "${results}" 2>/dev/null \
                      | grep -F -- "${path:+ gossip_path=${path} }" || true)
                    n=$(grep -c '^RESULT' <<< "${cell_rows}" || true)
                    if [[ "${n}" != "${levels}" ]]; then
                      echo "::error::the ${SUITE} suite has ${n} of ${levels} level rows for ${cell}; inspect its log."
                      status=1
                    elif grep -Eq "[[:space:]]valid=no([[:space:]]|$)" <<< "${cell_rows}"; then
                      echo "::warning::${cell} has valid=no rows: its bracketing baselines' medians drifted."
                    fi
                  done
                done
              done
              ;;
          esac

          if [[ "${ran}" -eq 0 ]]; then
            echo "::error::suite '${SUITE}' ran no fixture. It has a build mapping but no dispatch block."
            status=1
          fi

          exit "${status}"

      - name: Publish the reported figures to the run summary
        if: always() && env.OUTPUT_DIR != ''
        env:
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          set -uo pipefail
          if [[ "${MEASURE_OUTCOME}" != "success" ]]; then
            echo '> **This run failed. The rows below are partial; see the job log.**' >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f "${OUTPUT_DIR}/PROVENANCE.txt" ]]; then
            {
              echo '## Provenance'
              echo '```'
              cat "${OUTPUT_DIR}/PROVENANCE.txt"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          for report in "${OUTPUT_DIR}"/*-results.txt; do
            [[ -f "${report}" ]] || continue
            {
              echo "## $(basename "${report}" -results.txt)"
              echo '```'
              grep 'RESULT' "${report}" || echo 'no RESULT lines; see the uploaded artifact'
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload the measurement output
        if: always() && env.OUTPUT_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: frame-tx-measurements
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
