name: RPC owned failure evidence
run-name: RPC read-only recovery evidence ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-rpc-native-capability
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rpc-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Retain encrypted read-only evidence of failed owned attempt
        id: evidence
        run: python3 -B rpc-recovery-${{ github.run_id }}-${{ github.run_attempt }}/scripts/rpc-recovery/capture.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rpc-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.public }}/
          if-no-files-found: error
          retention-days: 30
