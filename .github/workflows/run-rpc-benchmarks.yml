name: Run RPC Benchmarks

# Benchmark a client's JSON-RPC on a self-hosted benchmark runner, reusing its DB snapshots.
# The `arch` input picks the box: amd64 -> `reproducible-benchmarks`, arm64 -> `reproducible-benchmarks-arm`.
# Only read-only RPCs are benchmarked (eth_call/getBalance/trace/debug — none change state); each snapshot is fingerprinted before/after. Under overlay/copy the snapshot is never mounted writable, so any change FAILS the job.
# reth's 'direct' mode mounts the snapshot read-write, where the node's DB-engine startup writes are expected — there the tripwire warns instead of failing. See scripts/rpc-bench/README.md.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: >-
          Which self-hosted benchmark runner to use, and with it every path that differs between the
          boxes. amd64 = `reproducible-benchmarks` (EPYC 4344P, snapshots under /mnt/sda, all clients
          and both layouts); arm64 = `reproducible-benchmarks-arm` (Axion, snapshots under /data,
          Nethermind + flat only, prebuilt images only). Timings from the two boxes are NOT comparable.
        required: false
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      benchmark_tool:
        description: Load-testing tool to use (with reference_client, flood runs --equality and jsonbench runs compare)
        required: true
        type: choice
        options:
          - flood
          - ethcallchaos
          - jsonbench
          - jsonbench-sweep
        default: flood
      client:
        description: Client to benchmark (geth/reth use their upstream images and the runner's <client>-<block> snapshot set)
        required: true
        type: choice
        options:
          - nethermind
          - geth
          - reth
        default: nethermind
      reference_client:
        description: Start a second client from its same-block snapshot and compare responses (flood/jsonbench only)
        required: true
        type: choice
        options:
          - none
          - geth
          - nethermind
          - reth
        default: none
      snapshot_block:
        description: >-
          Snapshot set tag: picks <snapshot root>/<client>-<tag> on the selected runner (nethermind resolves to
          nethermind-flat-<tag>). Empty = the expb snapshot for
          nethermind, and 25490000 for geth/reth or whenever reference_client is set
          (a comparison needs both nodes at the same head).
        required: false
        default: ""
      docker_image:
        description: >-
          Use a specific Docker image for the benchmarked client instead of the
          default (e.g. nethermindeth/nethermind:master-21f1dca). Empty =
          auto-resolve from the branch (nethermind) or the upstream image
          (geth/reth). The reference client's image is node_config.reference_image.
        required: false
        default: ""
      dottrace:
        description: >-
          dotTrace profiling of the node (nethermind only, works with any image). sampling/tracing
          snapshots are post-processed to XML reports; timeline captures a UI-only snapshot (Reporter
          cannot convert it). Line-by-line is not offered - it needs PDBs the docker images do not carry.
          'true' is accepted as a legacy alias for sampling.
        required: false
        type: choice
        options:
          - "false"
          - sampling
          - tracing
          - timeline
        default: "false"
      perf:
        description: >-
          Record a Linux perf profile of the node (nethermind only). perf samples on the host and
          resolves managed frames from the runtime's perf map plus native frames from the container's
          shared objects, so time inside the interpreter, the allocator, memory zeroing and the GC is
          attributed instead of collapsing into dotTrace's single '[Native or optimized code]' node.
          Ships perf.folded and recorder logs; raw perf.data is excluded. Read it with scripts/perf-report.sh. Independent of
          dottrace; enabling both samples the node twice and perturbs latency, so use perf runs for
          attribution and not for reported numbers.
        required: false
        type: boolean
        default: false
      dotnet_trace:
        description: >-
          Collect a dotnet-trace EventPipe .nettrace of runtime events (GC pauses, lock contention with
          owner stacks, thread pool, exceptions) from the node during the measured phase only (nethermind,
          single-node tools). Attached inside the container after the warm-up, so it coexists with dottrace
          and perf. Ships as the dotnet-trace-rpcbench artifact; read it with PerfView/TraceEvent.
        required: false
        type: boolean
        default: false
      state_layout:
        description: State layout — picks the Nethermind DB snapshot and layout flags (expb convention); ignored for geth/reth
        required: true
        type: choice
        options:
          - halfpath
          - flat
        default: flat
      additional_nethermind_flags:
        description: "Extra Nethermind flags appended to the node command (e.g. --Pruning.CacheMb=4000)"
        required: false
        default: ""
      tool_config:
        description: >-
          Tool config as JSON — empty is fine for defaults. Common recipes:
          (1) cross-client sweep: {"clients":"nethermind reth","rps_list":"50 100","duration":"60s"} —
          clients take an optional @image (nethermind@nethermindeth/nethermind:master reth@ghcr.io/paradigmxyz/reth:v2.2.0), run one at a time;
          (2) PRIVATE corpus sweep (latency + response parity on every eth-call-corpus*.jsonl.gz found on the runner; call contents never reach logs/artifacts — see README "Private eth_call corpus"):
          {"eth_call_corpus":true,"clients":"nethermind reth","rps_list":"10 100","duration":"120s"} — first client is the parity baseline;
          (3) single-node jsonbench: {"benchmark_config":"ethcall-contracts-head","rps":"50","duration":"60s"} (add "eth_call_corpus":true to use the default private corpus instead of the config's calls);
          (4) flood: {"tests":"eth_call eth_getBalance","rates":"10 100 500","duration":30};
          (5) ethcallchaos: {"rate":50,"parallel":8,"duration":300}.
          All jsonbench keys: ref/mode/benchmark_config/compare_config/rps/duration/vus/concurrency/timeout/validate_schema/html_report/fail_on_diff/max_fail_rate_pct/deep_check/eth_call_corpus/corpus_file (corpus for this path; the sweep equivalent is corpus_glob)/corpus_warmup_duration (discarded warm-up before the measured cell, profilers start after it; default 0)/corpus_warmup_rps (default 400)/extra_args.
          All sweep keys: clients/rps_list/duration/snapshot_block/state_layout/benchmark_config/ref/iso_configs/iso_duration/eth_call_corpus/corpus_dir/corpus_glob (filename filter, e.g. a single corpus file)/corpus_requests (absolute requests per corpus cell, replaces duration)/corpus_passes (requests as a multiple of the corpus record count)/max_corpus_records (raise the 10k parity guard rail)/timings_passes+timings_rps+timings_concurrency (per-record latency matrix; empty rps_list skips the k6 cells)/parity_diffs (characterise each divergence word by word — response-derived, opt in)/max_divergence_indexes (raise the 200 cap on recorded divergence indexes)/db_isolation_all (force one isolation mode for every client — copy|overlay, so storage counters are comparable; direct is refused unless db_isolation_allow_snapshot_mutation=true because it rewrites the shared snapshot)/db_isolation_allow_snapshot_mutation (consent flag for direct on a private snapshot)/node_env_vars (extra docker -e KEY=VALUE assignments applied to every swept node, space-separated — for opt-in experiment gates like NETHERMIND_EXPERIMENTAL_SVE2_KECCAK=1)/corpus_warmup_duration (discarded warm-up per corpus per client, default 240s; 0 measures cold — cold p99 runs ~60% high)/resource_sampling (cgroup counters per cell, default true).
          In sweep mode the single-client inputs above (client, reference_client, snapshot_block, state_layout, docker_image) are superseded by tool_config.
        required: false
        default: ""
      node_config:
        description: >-
          Advanced node/runner overrides as JSON:
          {"db_source":"","db_isolation":"overlay|copy|readonly-bind|direct","scratch_root":"<defaults to the runner's expb data dir>",
          "network":"mainnet","jsonrpc_modules":"Eth,...","health_timeout_minutes":30,"cpuset":"2-7,10-15","memory":"64g",
          "reference_db_source":"","reference_image":"","reference_flags":"","reference_db_isolation":""}.
          Leave empty for defaults (db_source resolved from client/state_layout/snapshot_block; db_isolation defaults to 'direct' for reth — RW mount, no overlay copy-up — else 'overlay').
        required: false
        default: ""
  pull_request:
    types: [labeled]

# No concurrency group: cancel-in-progress=false would keep only the newest PENDING run, silently cancelling queued requests.
# The self-hosted runner serializes benchmark jobs naturally.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Normalize inputs and decide how the Docker image is obtained.
  resolve:
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && contains(fromJSON('["rpc-benchmark","performance is good"]'), github.event.label.name) && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      branch: ${{ steps.resolve.outputs.branch }}
      clean_branch: ${{ steps.resolve.outputs.clean_branch }}
      benchmark_tool: ${{ steps.resolve.outputs.benchmark_tool }}
      client: ${{ steps.resolve.outputs.client }}
      reference_client: ${{ steps.resolve.outputs.reference_client }}
      comparison: ${{ steps.resolve.outputs.comparison }}
      dottrace: ${{ steps.resolve.outputs.dottrace }}
      perf: ${{ steps.resolve.outputs.perf }}
      dotnet_trace: ${{ steps.resolve.outputs.dotnet_trace }}
      dotnet_trace_max_seconds: ${{ steps.resolve.outputs.dotnet_trace_max_seconds }}
      dottrace_mode: ${{ steps.resolve.outputs.dottrace_mode }}
      image_mode: ${{ steps.resolve.outputs.image_mode }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      ref_image_ref: ${{ steps.resolve.outputs.ref_image_ref }}
      db_source: ${{ steps.resolve.outputs.db_source }}
      ref_db_source: ${{ steps.resolve.outputs.ref_db_source }}
      db_isolation: ${{ steps.resolve.outputs.db_isolation }}
      ref_db_isolation: ${{ steps.resolve.outputs.ref_db_isolation }}
      scratch_root: ${{ steps.resolve.outputs.scratch_root }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      corpus_dir: ${{ steps.resolve.outputs.corpus_dir }}
      snapshot_root: ${{ steps.resolve.outputs.snapshot_root }}
      network: ${{ steps.resolve.outputs.network }}
      jsonrpc_modules: ${{ steps.resolve.outputs.jsonrpc_modules }}
      layout_flags: ${{ steps.resolve.outputs.layout_flags }}
      ref_layout_flags: ${{ steps.resolve.outputs.ref_layout_flags }}
      additional_flags: ${{ steps.resolve.outputs.additional_flags }}
      ref_additional_flags: ${{ steps.resolve.outputs.ref_additional_flags }}
      health_timeout: ${{ steps.resolve.outputs.health_timeout }}
      node_cpuset: ${{ steps.resolve.outputs.node_cpuset }}
      node_memory: ${{ steps.resolve.outputs.node_memory }}
      eth_call_corpus: ${{ steps.resolve.outputs.eth_call_corpus }}
      warmup_seconds: ${{ steps.resolve.outputs.warmup_seconds }}
      warmup_rps: ${{ steps.resolve.outputs.warmup_rps }}
      tool_config: ${{ steps.resolve.outputs.tool_config }}
    steps:
      - name: Resolve configuration
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABEL: ${{ github.event.label.name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          IN_TOOL: ${{ inputs.benchmark_tool }}
          IN_CLIENT: ${{ inputs.client }}
          IN_REFERENCE_CLIENT: ${{ inputs.reference_client }}
          IN_SNAPSHOT_BLOCK: ${{ inputs.snapshot_block }}
          IN_DOCKER_IMAGE: ${{ inputs.docker_image }}
          IN_DOTTRACE: ${{ inputs.dottrace }}
          IN_PERF: ${{ inputs.perf }}
          IN_DOTNET_TRACE: ${{ inputs.dotnet_trace }}
          IN_STATE_LAYOUT: ${{ inputs.state_layout }}
          IN_ARCH: ${{ inputs.arch }}
          IN_FLAGS: ${{ inputs.additional_nethermind_flags }}
          IN_TOOL_CONFIG: ${{ inputs.tool_config }}
          IN_NODE_CONFIG: ${{ inputs.node_config }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            branch="${PUSH_BRANCH}"
            benchmark_tool="${IN_TOOL:-flood}"
            client="${IN_CLIENT:-nethermind}"
            reference_client="${IN_REFERENCE_CLIENT:-none}"
            snapshot_block="${IN_SNAPSHOT_BLOCK:-}"
            docker_image="${IN_DOCKER_IMAGE:-}"
            dottrace="${IN_DOTTRACE:-false}"
            perf="${IN_PERF:-false}"
            dotnet_trace="${IN_DOTNET_TRACE:-false}"
            state_layout="${IN_STATE_LAYOUT:-flat}"
            additional_flags="${IN_FLAGS:-}"
            tool_config="${IN_TOOL_CONFIG:-}"
            node_config="${IN_NODE_CONFIG:-}"
          elif [[ "${PR_LABEL}" == "performance is good" ]]; then
            # PR labeled 'performance is good': fixed eth_call corpus A/B against master. The
            # config is hard-coded rather than read from an input so every PR is measured
            # identically and results stay comparable across PRs and over time.
            branch="${PR_HEAD_BRANCH}"
            benchmark_tool="jsonbench-sweep"
            client="nethermind"
            reference_client="none"
            snapshot_block="25490000"
            docker_image=""
            dottrace="false"
            perf="false"
            dotnet_trace="false"
            state_layout="flat"
            additional_flags=""
            tool_config='{"eth_call_corpus":true,"clients":"nethermind@nethermindeth/nethermind:master nethermind","rps_list":"100","duration":"120s","corpus_glob":"eth-call-corpus-20260805T104605Z-497-safe.jsonl.gz"}'
            node_config=""
          else
            # PR labeled with 'rpc-benchmark': run flood on common read methods.
            branch="${PR_HEAD_BRANCH}"
            benchmark_tool="flood"
            client="nethermind"
            reference_client="none"
            snapshot_block=""
            docker_image=""
            dottrace="false"
            perf="false"
            dotnet_trace="false"
            state_layout="flat"
            additional_flags=""
            tool_config='{"tests":"eth_call eth_getBalance eth_getCode eth_getStorageAt eth_getTransactionCount eth_getBlockByNumber","rates":"10 100 500","duration":30}'
            node_config=""
          fi

          case "${client}" in
            nethermind|geth|reth) ;;
            *) echo "Unknown client '${client}'."; exit 1;;
          esac
          case "${reference_client}" in
            none|nethermind|geth|reth) ;;
            *) echo "Unknown reference_client '${reference_client}'."; exit 1;;
          esac

          # One switch drives the runner label and every path that differs between the two boxes, so a
          # dispatch can never land on one runner carrying the other's snapshot paths.
          arch="${IN_ARCH:-amd64}"
          case "${arch}" in
            arm64)
              runner_label="reproducible-benchmarks-arm"
              snapshot_root="/data/nethermind"
              bench_data_dir="/data/expb-data"
              ;;
            amd64)
              runner_label="reproducible-benchmarks"
              snapshot_root="/mnt/sda"
              bench_data_dir="/mnt/sda/expb-data"
              ;;
            *)
              echo "::error::Unsupported arch '${arch}' (expected amd64 or arm64)."
              exit 1
              ;;
          esac

          # The ARM box stocks Nethermind flat snapshots only, so its narrower capabilities are checked
          # against the selected runner instead of being removed from the inputs for everyone.
          if [[ "${arch}" == "arm64" ]] && [[ "${client}" != "nethermind" || "${reference_client}" != "none" ]]; then
            echo "::error::The reproducible-benchmarks-arm runner only supports a single Nethermind client - dispatch with arch=amd64 for geth/reth or a reference client."
            exit 1
          fi
          comparison="false"
          [[ "${reference_client}" != "none" ]] && comparison="true"
          if [[ "${comparison}" == "true" && "${benchmark_tool}" == "ethcallchaos" ]]; then
            echo "reference_client comparison is supported for flood and jsonbench only (EthCallChaos drives a single node)."
            exit 1
          fi
          # Normalize the profiling selector: legacy boolean 'true' means sampling.
          case "${dottrace}" in
            true|sampling) dottrace_mode="sampling" ;;
            tracing|timeline) dottrace_mode="${dottrace}" ;;
            false|"") dottrace_mode="" ;;
            *) echo "dottrace must be false, sampling, tracing, or timeline (got '${dottrace}')."; exit 1;;
          esac
          if [[ -n "${dottrace_mode}" ]]; then dottrace="true"; else dottrace="false"; fi
          if [[ "${dottrace}" == "true" && "${client}" != "nethermind" ]]; then
            echo "dottrace requires client=nethermind (dotTrace is .NET-specific)."
            exit 1
          fi
          if [[ "${perf}" == "true" && "${benchmark_tool}" == "jsonbench-sweep" ]]; then
            echo "::error::perf=true is not supported with benchmark_tool=jsonbench-sweep. Use a single-node benchmark tool; sweep capture needs per-cell profile isolation."
            exit 1
          fi
          case "${dotnet_trace}" in
            true|false) ;;
            *) echo "dotnet_trace must be true or false (got '${dotnet_trace}')."; exit 1;;
          esac
          if [[ "${dotnet_trace}" == "true" && "${client}" != "nethermind" ]]; then
            echo "dotnet_trace requires client=nethermind (EventPipe is .NET-specific)."
            exit 1
          fi
          if [[ "${dotnet_trace}" == "true" && "${benchmark_tool}" == "jsonbench-sweep" ]]; then
            echo "::error::dotnet_trace=true is not supported with benchmark_tool=jsonbench-sweep. Use a single-node benchmark tool; sweep capture needs per-cell profile isolation."
            exit 1
          fi
          if [[ -n "${snapshot_block}" ]] && ! [[ "${snapshot_block}" =~ ^[0-9]+$ ]]; then
            echo "snapshot_block must be a block number tag (e.g. 25490000), got '${snapshot_block}'."
            exit 1
          fi

          branch="${branch#refs/heads/}"
          [[ -n "${branch}" ]] || { echo "Failed to resolve branch."; exit 1; }
          clean_branch="$(echo "${branch}" | sed 's/[^a-zA-Z0-9._-]/-/g')"

          [[ -z "${tool_config}" ]] && tool_config="{}"
          if ! echo "${tool_config}" | jq -e . >/dev/null 2>&1; then
            echo "tool_config is not valid JSON: ${tool_config}"
            exit 1
          fi
          if ! echo "${tool_config}" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "tool_config must be a JSON object."
            exit 1
          fi
          # Private eth_call corpus mode (jsonbench/jsonbench-sweep benchmark only): call contents
          # stay on the runner; the artifact carries aggregate summaries and parity counts only.
          # Single source of truth for corpus mode. A present-but-non-Boolean value (e.g. the string
          # "true") previously read as false here while the sweep's tostring read it as true, which
          # ran the private corpus with log redaction, restricted staging and the raised gas cap all
          # disabled. Reject it rather than guess, and pass this resolved value downstream.
          corpus_raw="$(echo "${tool_config}" | jq -r 'if has("eth_call_corpus") then (.eth_call_corpus|type) else "absent" end')"
          case "${corpus_raw}" in
            absent|boolean) ;;
            *) echo "eth_call_corpus must be a JSON boolean (true/false), got ${corpus_raw}."; exit 1;;
          esac
          eth_call_corpus="$(echo "${tool_config}" | jq -r 'if .eth_call_corpus == true then "true" else "false" end')"
          if [[ "${eth_call_corpus}" == "true" ]]; then
            case "${benchmark_tool}" in
              jsonbench|jsonbench-sweep) ;;
              *) echo "eth_call_corpus requires benchmark_tool=jsonbench or jsonbench-sweep."; exit 1;;
            esac
            if [[ "${comparison}" == "true" ]]; then
              echo "eth_call_corpus is benchmark-only; leave reference_client=none (a corpus sweep compares its clients itself)."
              exit 1
            fi
          fi
          # Single-node jsonbench warm-up (discarded load before the measured cell, after which the
          # profilers start). The sweep reads the same key itself (default 240s there); here the
          # default stays 0 so an unconfigured run measures what it always did.
          warmup_seconds="0"
          warmup_rps="400"
          if [[ "${benchmark_tool}" == "jsonbench" && "${comparison}" != "true" ]]; then
            warmup_raw="$(echo "${tool_config}" | jq -r '.corpus_warmup_duration // empty')"
            if [[ -n "${warmup_raw}" ]]; then
              if ! [[ "${warmup_raw}" =~ ^[0-9]+s?$ ]]; then
                echo "::error::corpus_warmup_duration must be integer seconds (optional 's' suffix), got '${warmup_raw}'."
                exit 1
              fi
              warmup_seconds="$(( 10#${warmup_raw%s} ))"
            fi
            warmup_rps_raw="$(echo "${tool_config}" | jq -r '.corpus_warmup_rps // empty')"
            if [[ -n "${warmup_rps_raw}" ]]; then
              if ! [[ "${warmup_rps_raw}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::corpus_warmup_rps must be a positive integer, got '${warmup_rps_raw}'."
                exit 1
              fi
              warmup_rps="${warmup_rps_raw}"
            fi
          elif [[ "${benchmark_tool}" != "jsonbench-sweep" ]] \
              && [[ "$(echo "${tool_config}" | jq -r 'has("corpus_warmup_duration") or has("corpus_warmup_rps")')" == "true" ]]; then
            echo "::error::corpus_warmup_duration/corpus_warmup_rps apply to benchmark_tool=jsonbench (benchmark mode, no reference_client) and jsonbench-sweep only."
            exit 1
          fi
          # dotnet-trace safety net: cap the collector at the measured cell's duration plus a margin, so
          # a hung cell cannot grow the .nettrace until the job times out. Only a plain <n>[s|m|h]
          # tool_config.duration of a single-cell tool is parsed (flood runs one cell per rate);
          # anything else leaves the session uncapped and stop-node.sh ends it.
          dotnet_trace_max_seconds=""
          if [[ "${dotnet_trace}" == "true" && "${benchmark_tool}" != "flood" ]]; then
            cell_duration="$(echo "${tool_config}" | jq -r '.duration // empty')"
            if [[ "${cell_duration}" =~ ^([0-9]+)([smh]?)$ ]]; then
              case "${BASH_REMATCH[2]}" in m) unit=60 ;; h) unit=3600 ;; *) unit=1 ;; esac
              dotnet_trace_max_seconds="$(( 10#${BASH_REMATCH[1]} * unit + 600 ))"
            fi
          fi
          [[ -z "${node_config}" ]] && node_config="{}"
          if ! echo "${node_config}" | jq -e . >/dev/null 2>&1; then
            echo "node_config is not valid JSON: ${node_config}"
            exit 1
          fi

          nc() { echo "${node_config}" | jq -r "$1 // empty"; }

          if [[ "${arch}" == "arm64" && "${state_layout}" != "flat" ]]; then
            echo "::error::The reproducible-benchmarks-arm runner only supports the flat state layout - dispatch with arch=amd64 for halfpath."
            exit 1
          fi

          # Named snapshot sets follow <snapshot_root>/<client>-<block>; without a tag nethermind falls back to the expb snapshots.
          # geth/reth and comparison runs need same-head sets, so they default to the standing 25490000 tag.
          DEFAULT_SNAPSHOT_BLOCK="25490000"
          if [[ -z "${snapshot_block}" ]] && { [[ "${comparison}" == "true" ]] || [[ "${client}" != "nethermind" ]]; }; then
            snapshot_block="${DEFAULT_SNAPSHOT_BLOCK}"
            echo "snapshot_block not set — defaulting to ${DEFAULT_SNAPSHOT_BLOCK} (required for geth/reth and comparisons)."
          fi

          snapshot_path() {
            local c="$1"
            if [[ -n "${snapshot_block}" ]]; then
              if [[ "${c}" == "nethermind" ]]; then
                if [[ "${state_layout}" == "flat" ]]; then
                  echo "${snapshot_root}/nethermind-flat-${snapshot_block}"
                else
                  echo "${snapshot_root}/nethermind-${snapshot_block}"
                fi
              else
                echo "${snapshot_root}/${c}-${snapshot_block}"
              fi
            else
              # Legacy expb snapshots exist for nethermind only (guarded above).
              if [[ "${state_layout}" == "flat" ]]; then
                echo "${snapshot_root}/nethermind-flat-snapshot"
              else
                echo "${snapshot_root}/nethermind-snapshot"
              fi
            fi
          }

          client_layout_flags() {
            # --FlatDb.Enabled applies to any nethermind instance on the flat snapshot.
            if [[ "$1" == "nethermind" && "${state_layout}" == "flat" ]]; then
              echo "--FlatDb.Enabled=true"
            fi
          }
          layout_flags="$(client_layout_flags "${client}")"
          ref_layout_flags=""
          [[ "${comparison}" == "true" ]] && ref_layout_flags="$(client_layout_flags "${reference_client}")"

          db_source="$(nc '.db_source')";           [[ -z "${db_source}" ]] && db_source="$(snapshot_path "${client}")"
          ref_db_source=""
          ref_additional_flags=""
          if [[ "${comparison}" == "true" ]]; then
            ref_db_source="$(nc '.reference_db_source')"
            [[ -z "${ref_db_source}" ]] && ref_db_source="$(snapshot_path "${reference_client}")"
            ref_additional_flags="$(nc '.reference_flags')"
          fi
          # reth defaults to 'direct' (RW bind): overlayfs copy-up of its large mdbx.dat costs ~200s. NM/geth stay 'overlay'
          # (tiny copy-up, and their snapshots are shared with expb — keep pristine). Override via node_config.
          db_isolation="$(nc '.db_isolation')"
          if [[ -z "${db_isolation}" ]]; then
            if [[ "${client}" == "reth" ]]; then db_isolation="direct"; else db_isolation="overlay"; fi
          fi
          scratch_root="$(nc '.scratch_root')";     [[ -z "${scratch_root}" ]] && scratch_root="${bench_data_dir}/rpc-bench-scratch"
          network="$(nc '.network')";               [[ -z "${network}" ]] && network="mainnet"
          jsonrpc_modules="$(nc '.jsonrpc_modules')"
          [[ -z "${jsonrpc_modules}" ]] && jsonrpc_modules="Eth,Subscribe,Trace,TxPool,Web3,Proof,Net,Parity,Health,Rpc,Debug"
          # Corpus runs only ever issue eth_call — serve the minimal module set.
          [[ "${eth_call_corpus}" == "true" ]] && jsonrpc_modules="Eth"
          health_min="$(nc '.health_timeout_minutes')"; [[ -z "${health_min}" ]] && health_min="30"
          node_cpuset="$(nc '.cpuset')"
          node_memory="$(nc '.memory')"

          if ! [[ "${health_min}" =~ ^[0-9]+$ ]] || [[ "${health_min}" -lt 1 ]]; then
            echo "node_config.health_timeout_minutes must be a positive integer, got '${health_min}'."
            exit 1
          fi
          health_timeout=$(( health_min * 60 ))

          # The reference node's isolation derives from ITS client, not the primary's — an NM/geth reference must NOT inherit
          # a reth-primary's 'direct' (would mutate its shared snapshot). Override via node_config.reference_db_isolation.
          ref_db_isolation="$(nc '.reference_db_isolation')"
          if [[ -z "${ref_db_isolation}" ]]; then
            if [[ "${reference_client}" == "reth" ]]; then ref_db_isolation="direct"; else ref_db_isolation="overlay"; fi
          fi

          for iso in "${db_isolation}" "${ref_db_isolation}"; do
            case "${iso}" in
              overlay|copy|readonly-bind|direct) ;;
              *) echo "db_isolation must be overlay | copy | readonly-bind | direct, got '${iso}'."; exit 1;;
            esac
          done

          # Same client on both sides sharing one snapshot under 'direct' = two concurrent read-write binds on one DB = corruption.
          # Same-client A/B must go through jsonbench-sweep, which brings up one node at a time. See scripts/rpc-bench/README.md "direct" caveats.
          if [[ "${comparison}" == "true" && "${client}" == "${reference_client}" && "${db_source}" == "${ref_db_source}" ]] \
             && { [[ "${db_isolation}" == "direct" ]] || [[ "${ref_db_isolation}" == "direct" ]]; }; then
            echo "Refusing to run ${client} vs ${reference_client} side by side on the same 'direct' snapshot (${db_source}): two concurrent read-write mounts corrupt the DB."
            echo "Use benchmark_tool=jsonbench-sweep for same-client comparison (it runs each node sequentially), or set a distinct node_config.reference_db_source / non-'direct' isolation."
            exit 1
          fi

          # These paths reach root-privileged mount/rm on the runner — enforce a
          # strict shape here (the scripts canonicalize and guard again).
          validate_runner_path() {
            local label="$1" p="$2"
            if ! [[ "${p}" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "${p}" == *..* ]]; then
              echo "${label} '${p}' must be an absolute path of [A-Za-z0-9._/-] without '..'."
              exit 1
            fi
            local trimmed="${p#/}"; trimmed="${trimmed%/}"
            if [[ -z "${trimmed}" || "${trimmed}" != */* ]]; then
              echo "${label} '${p}' is too shallow (need at least two path components)."
              exit 1
            fi
          }
          validate_runner_path "node_config.db_source" "${db_source}"
          validate_runner_path "node_config.scratch_root" "${scratch_root}"
          if [[ "${db_source}/" == "${scratch_root}"/* || "${scratch_root}/" == "${db_source}"/* ]]; then
            echo "db_source and scratch_root must be disjoint (scratch is wiped on teardown)."
            exit 1
          fi
          if [[ -n "${ref_db_source}" ]]; then
            validate_runner_path "node_config.reference_db_source" "${ref_db_source}"
            if [[ "${ref_db_source}/" == "${scratch_root}"/* || "${scratch_root}/" == "${ref_db_source}"/* ]]; then
              echo "reference_db_source and scratch_root must be disjoint (scratch is wiped on teardown)."
              exit 1
            fi
          fi

          # Default upstream images for non-Nethermind clients. The snapshot sidecar (_snapshot_web3_clientVersion.json)
          # is logged at startup so version mismatch is visible; pin via docker_image / node_config.reference_image.
          default_client_image() {
            case "$1" in
              geth) echo "ethereum/client-go:stable" ;;
              reth) echo "ghcr.io/paradigmxyz/reth:latest" ;;
              nethermind) echo "nethermindeth/nethermind:master" ;;
            esac
          }

          # Decide how to get the client's image: provided = docker_image/upstream default verbatim; reuse = pull prebuilt
          # Docker Hub image for master/release; build = build locally from Dockerfile. dotTrace works with any NM image.
          if [[ -n "${docker_image}" ]]; then
            image_mode="provided"
            image_ref="${docker_image}"
          elif [[ "${client}" != "nethermind" ]]; then
            # geth/reth are references to compare against, not the code under
            # test — branch resolution/builds do not apply to them.
            image_mode="provided"
            image_ref="$(default_client_image "${client}")"
          elif [[ "${branch}" == "master" || "${branch}" == "performance" || "${branch}" == "paprika" || "${branch}" == release/* ]]; then
            image_mode="reuse"
            image_ref="nethermindeth/nethermind:${clean_branch}"
          else
            image_mode="build"
            image_ref="nethermind-rpcbench:${clean_branch}"
          fi

          # Building Nethermind on this box fills its ~19G root disk, which kills the runner daemon and
          # takes the runner offline until someone restarts it over SSH (2026-08-18, 2026-08-19 twice).
          # Fail in seconds instead: images belong on Docker Hub, built by publish-docker.
          if [[ "${arch}" == "arm64" && "${image_mode}" == "build" ]]; then
            echo "::error::The reproducible-benchmarks-arm runner does not support building images (branch '${branch}' has no prebuilt image)."
            echo "Build one first, then pass it explicitly:"
            echo "  gh workflow run publish-docker.yml --ref ${branch} -f image-name=nethermind -f tag=<tag> -f dockerfile=Dockerfile -f build-config=release"
            echo "  gh workflow run run-rpc-benchmarks.yml --ref ${branch} -f docker_image=nethermindeth/nethermind:<tag> ..."
            echo "Note: tool_config 'clients' @image entries do NOT cover this — the top-level docker_image is prepared regardless."
            exit 1
          fi

          ref_image_ref=""
          if [[ "${comparison}" == "true" ]]; then
            ref_image_ref="$(nc '.reference_image')"
            [[ -z "${ref_image_ref}" ]] && ref_image_ref="$(default_client_image "${reference_client}")"
          fi

          {
            echo "should_run=true"
            echo "branch=${branch}"
            echo "clean_branch=${clean_branch}"
            echo "benchmark_tool=${benchmark_tool}"
            echo "client=${client}"
            echo "reference_client=${reference_client}"
            echo "comparison=${comparison}"
            echo "dottrace=${dottrace}"
            echo "perf=${perf:-false}"
            echo "dotnet_trace=${dotnet_trace:-false}"
            echo "dotnet_trace_max_seconds=${dotnet_trace_max_seconds}"
            echo "dottrace_mode=${dottrace_mode}"
            echo "image_mode=${image_mode}"
            echo "image_ref=${image_ref}"
            echo "ref_image_ref=${ref_image_ref}"
            echo "db_source=${db_source}"
            echo "ref_db_source=${ref_db_source}"
            echo "db_isolation=${db_isolation}"
            echo "ref_db_isolation=${ref_db_isolation}"
            echo "scratch_root=${scratch_root}"
            echo "runner_label=${runner_label}"
            echo "corpus_dir=${bench_data_dir}/rpc-bench"
            echo "snapshot_root=${snapshot_root}"
            echo "network=${network}"
            echo "jsonrpc_modules=${jsonrpc_modules}"
            echo "layout_flags=${layout_flags}"
            echo "ref_layout_flags=${ref_layout_flags}"
            echo "additional_flags=${additional_flags}"
            echo "ref_additional_flags=${ref_additional_flags}"
            echo "health_timeout=${health_timeout}"
            echo "node_cpuset=${node_cpuset}"
            echo "node_memory=${node_memory}"
            echo "eth_call_corpus=${eth_call_corpus}"
            echo "warmup_seconds=${warmup_seconds}"
            echo "warmup_rps=${warmup_rps}"
            echo "tool_config<<TOOLCFG"
            echo "${tool_config}"
            echo "TOOLCFG"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved: tool=${benchmark_tool} client=${client} reference=${reference_client} branch=${branch} layout=${state_layout} snapshot_block=${snapshot_block:-<expb default>} image_mode=${image_mode} image=${image_ref} dottrace=${dottrace} dottrace_mode=${dottrace_mode:-none} perf=${perf} dotnet_trace=${dotnet_trace} warmup=${warmup_seconds}s@${warmup_rps}rps"

  # Run the benchmark on the self-hosted runner that holds the DB snapshot.
  benchmark:
    needs: [resolve]
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: [self-hosted, "${{ needs.resolve.outputs.runner_label }}"]
    timeout-minutes: 800
    env:
      # NB: the `runner` context is not available in job-level env, so OUT_DIR /
      # STATE_DIR are exported from $RUNNER_TEMP in the "Set up run paths" step.
      DIAG_DIR: ${{ needs.resolve.outputs.scratch_root }}/diag
      CONTAINER_NAME: rpcbench-primary-${{ github.run_id }}
      REF_CONTAINER_NAME: rpcbench-reference-${{ github.run_id }}
      ECC_CONTAINER_NAME: ethcallchaos-bench-${{ github.run_id }}
      JB_CONTAINER_NAME: jsonbench-bench-${{ github.run_id }}
      RPC_PORT: "8545"
      REF_RPC_PORT: "8546"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/rpc-bench/*.sh

      - name: Verify perf profiling prerequisites
        if: needs.resolve.outputs.perf == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/rpc-bench/lib.sh
          require_perf_access

      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            run_as_root() { if [[ "${EUID}" -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
            run_as_root apt-get update
            run_as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            run_as_root systemctl start docker || run_as_root service docker start
          fi
          docker version

      - name: Set up run paths
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/rpcbench-out" >> "$GITHUB_ENV"
          echo "STATE_DIR=$RUNNER_TEMP/rpcbench-state" >> "$GITHUB_ENV"

      - name: Print resolved configuration
        run: |
          echo "Runner:      ${{ needs.resolve.outputs.runner_label }}"
          echo "Tool:        ${{ needs.resolve.outputs.benchmark_tool }}"
          echo "Client:      ${{ needs.resolve.outputs.client }}"
          echo "Reference:   ${{ needs.resolve.outputs.reference_client }} (comparison: ${{ needs.resolve.outputs.comparison }})"
          echo "Branch:      ${{ needs.resolve.outputs.branch }}"
          echo "Image mode:  ${{ needs.resolve.outputs.image_mode }}"
          echo "Image ref:   ${{ needs.resolve.outputs.image_ref }}"
          echo "Ref image:   ${{ needs.resolve.outputs.ref_image_ref }}"
          echo "dotTrace:    ${{ needs.resolve.outputs.dottrace }}"
          echo "dotTrace mode: ${{ needs.resolve.outputs.dottrace_mode || 'none' }}"
          echo "perf:        ${{ needs.resolve.outputs.perf }}"
          echo "dotnet-trace: ${{ needs.resolve.outputs.dotnet_trace }} (session cap: ${{ needs.resolve.outputs.dotnet_trace_max_seconds || 'none' }}s)"
          echo "Warm-up:     ${{ needs.resolve.outputs.warmup_seconds }}s at ${{ needs.resolve.outputs.warmup_rps }} rps (single-node jsonbench; 0 = none: perf starts once RPC is ready, dotTrace collects from launch)"
          echo "DB source:   ${{ needs.resolve.outputs.db_source }}"
          echo "Ref DB:      ${{ needs.resolve.outputs.ref_db_source }}"
          echo "Isolation:   ${{ needs.resolve.outputs.db_isolation }}"
          echo "Scratch:     ${{ needs.resolve.outputs.scratch_root }}"
          echo "Corpus dir:  ${{ needs.resolve.outputs.corpus_dir }}"
          echo "Layout flags: ${{ needs.resolve.outputs.layout_flags }}"

      - name: Prepare scratch and output dirs
        run: mkdir -p "${OUT_DIR}" "${STATE_DIR}"

      - name: Reclaim root disk before pulling
        # Only the ARM box has the ~19G root disk this protects; see its rationale below.
        if: needs.resolve.outputs.runner_label == 'reproducible-benchmarks-arm'
        shell: bash
        # The box has a ~19G root disk. A pull that runs it out of space kills the docker daemon and the
        # runner with it, so reclaim first and only refuse to start if the disk is still tight afterwards.
        env:
          KEEP_IMAGES: |
            ${{ needs.resolve.outputs.image_ref }}
            ${{ needs.resolve.outputs.ref_image_ref }}
          KEEP_TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
        run: |
          set -uo pipefail
          MIN_FREE_GB=6
          avail_gb() { df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          report() { df -h /; du -xsh /var/lib/containerd /var/lib/docker 2>/dev/null || true; }

          echo "== before =="; report
          echo "Free before reclaim: $(avail_gb)G"

          # Cheap, always-safe garbage first.
          docker container prune -f || true
          docker network prune -f || true
          docker builder prune -af || true
          docker image prune -f || true
          # 'volume prune' only removes anonymous volumes; named expb volumes outlive their output dirs
          # and later fail mounts with a 500.
          docker volume ls -q | grep -E '^expb-' | xargs -r docker volume rm -f || true
          find /root/actions-runner/_diag -type f -name '*.log' -mtime +1 -delete 2>/dev/null || true
          rm -rf /root/actions-runner/_work/_temp/* 2>/dev/null || true
          apt-get clean 2>/dev/null || true
          journalctl --vacuum-size=200M 2>/dev/null || true

          # Stale benchmark images are the monotonic consumer: every campaign pushes multi-GB tags and
          # nothing retires them. Docker here uses the CONTAINERD image store, so that content lands in
          # /var/lib/containerd and `docker image prune -a --filter until=<age>` reports 0B against it
          # (`docker system df` even reports a negative reclaimable) — an explicit `docker rmi` is the
          # only thing that frees it. Drop unused tags oldest-first, and only as many as needed, so
          # pinned A/B images survive whenever there is already room.
          if (( $(avail_gb) < MIN_FREE_GB )); then
            # Sweep arms come from tool_config.clients as `ctype@image`, and run-rpc-sweep.sh treats a
            # failed pull as "probably local" — so dropping one of those yields a silently partial matrix
            # rather than an error. Keep them too.
            sweep_keep="$(printf '%s' "${KEEP_TOOL_CONFIG:-}" | jq -r '.clients // empty' 2>/dev/null \
              | tr ' ' '\n' | sed 's/.*@//' | grep -v '^$' || true)"
            keep_re="$(printf '%s\n%s\n' "${KEEP_IMAGES}" "${sweep_keep}" | tr -d ' ' | grep -v '^$' | sort -u | paste -sd'|' -)"
            echo "Reclaiming stale images (keeping: ${keep_re:-none})"
            while IFS= read -r img; do
              (( $(avail_gb) >= MIN_FREE_GB )) && break
              [[ -z "${img}" || "${img}" == *'<none>'* ]] && continue
              [[ -n "${keep_re}" ]] && [[ "${img}" =~ ^(${keep_re})$ ]] && continue
              # Never touch an image a container still references (another queued job may be mid-run).
              [[ -n "$(docker ps -aq --filter "ancestor=${img}" 2>/dev/null)" ]] && continue
              if docker rmi "${img}" >/dev/null 2>&1; then echo "  dropped ${img}"; fi
            done < <(docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' | sort | cut -f2-)
          fi

          free="$(avail_gb)"
          echo "== after =="; report
          echo "Free after reclaim: ${free}G (need ${MIN_FREE_GB}G)"
          if (( free < MIN_FREE_GB )); then
            echo "::error::Only ${free}G free on / after reclaim — refusing to start rather than risk killing the runner daemon."
            echo "Everything reclaimable is already gone; the remaining usage needs a look over SSH."
            du -xh --max-depth=2 /var /usr /root 2>/dev/null | sort -rh | head -15 || true
            exit 1
          fi

      - name: Prepare Docker image
        env:
          IMAGE_MODE: ${{ needs.resolve.outputs.image_mode }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          COMMIT_HASH: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${IMAGE_MODE}" in
            provided)
              echo "Using provided image ${IMAGE_REF} (pulling if remote)..."
              docker pull "${IMAGE_REF}" || echo "Pull failed — assuming ${IMAGE_REF} is a local image."
              ;;
            reuse)
              echo "Reusing prebuilt image ${IMAGE_REF}..."
              docker pull "${IMAGE_REF}"
              ;;
            build)
              echo "Building ${IMAGE_REF} from Dockerfile..."
              docker build . \
                -f Dockerfile \
                -t "${IMAGE_REF}" \
                --build-arg BUILD_CONFIG=release \
                --build-arg CI=true \
                --build-arg COMMIT_HASH="${COMMIT_HASH}" \
                --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
              ;;
            *)
              echo "Unknown image mode '${IMAGE_MODE}'."; exit 1;;
          esac

      - name: Pull reference client image
        if: needs.resolve.outputs.comparison == 'true'
        env:
          REF_IMAGE: ${{ needs.resolve.outputs.ref_image_ref }}
        run: docker pull "${REF_IMAGE}" || echo "Pull failed — assuming ${REF_IMAGE} is a local image."

      - name: Start node
        if: needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          INSTANCE: primary
          NODE_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          DB_SOURCE: ${{ needs.resolve.outputs.db_source }}
          DB_ISOLATION: ${{ needs.resolve.outputs.db_isolation }}
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          NETWORK: ${{ needs.resolve.outputs.network }}
          JSONRPC_MODULES: ${{ needs.resolve.outputs.jsonrpc_modules }}
          LAYOUT_FLAGS: ${{ needs.resolve.outputs.layout_flags }}
          ADDITIONAL_FLAGS: ${{ needs.resolve.outputs.additional_flags }}
          HEALTH_TIMEOUT: ${{ needs.resolve.outputs.health_timeout }}
          # Same raised cap as corpus sweep cells, so both dispatch modes agree (empty = script default).
          RPC_GAS_CAP: ${{ needs.resolve.outputs.eth_call_corpus == 'true' && '1000000000000' || '' }}
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          PERF: ${{ needs.resolve.outputs.perf }}
          DOTNET_TRACE: ${{ needs.resolve.outputs.dotnet_trace }}
          DOTNET_TRACE_MAX_SECONDS: ${{ needs.resolve.outputs.dotnet_trace_max_seconds }}
          DOTTRACE_MODE: ${{ needs.resolve.outputs.dottrace_mode }}
          # With a warm-up the profilers start in 'Start profilers' below, after it, so they cover only the measured cell.
          PROFILE_AFTER_WARMUP: ${{ needs.resolve.outputs.warmup_seconds != '0' && 'true' || 'false' }}
          NODE_CPUSET: ${{ needs.resolve.outputs.node_cpuset }}
          NODE_MEMORY: ${{ needs.resolve.outputs.node_memory }}
        run: ./scripts/rpc-bench/start-node.sh

      - name: Start reference node
        if: needs.resolve.outputs.comparison == 'true'
        env:
          CLIENT: ${{ needs.resolve.outputs.reference_client }}
          INSTANCE: reference
          NODE_IMAGE: ${{ needs.resolve.outputs.ref_image_ref }}
          CONTAINER_NAME: ${{ env.REF_CONTAINER_NAME }}
          RPC_PORT: ${{ env.REF_RPC_PORT }}
          DB_SOURCE: ${{ needs.resolve.outputs.ref_db_source }}
          DB_ISOLATION: ${{ needs.resolve.outputs.ref_db_isolation }}
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          NETWORK: ${{ needs.resolve.outputs.network }}
          JSONRPC_MODULES: ${{ needs.resolve.outputs.jsonrpc_modules }}
          LAYOUT_FLAGS: ${{ needs.resolve.outputs.ref_layout_flags }}
          ADDITIONAL_FLAGS: ${{ needs.resolve.outputs.ref_additional_flags }}
          HEALTH_TIMEOUT: ${{ needs.resolve.outputs.health_timeout }}
          DOTTRACE: "false"
          PERF: "false"
          DOTNET_TRACE: "false"
          NODE_MEMORY: ${{ needs.resolve.outputs.node_memory }}
        run: ./scripts/rpc-bench/start-node.sh

      - name: Run flood benchmark
        id: run-flood
        if: needs.resolve.outputs.benchmark_tool == 'flood'
        continue-on-error: true
        env:
          RPC_URL: http://localhost:8545
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          RESOLVED_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          COMPARISON: ${{ needs.resolve.outputs.comparison }}
          REFERENCE_CLIENT: ${{ needs.resolve.outputs.reference_client }}
        shell: bash
        run: |
          set -euo pipefail
          cfg="${TOOL_CONFIG}"; [[ -z "${cfg}" ]] && cfg='{}'
          get() { echo "${cfg}" | jq -r "$1 // empty"; }
          export RATES="$(get '.rates')";        [[ -z "${RATES}" ]] && export RATES="10 100 500"
          export DURATION="$(get '.duration')";   [[ -z "${DURATION}" ]] && export DURATION="30"
          export DEEP_CHECK="$(get '.deep_check')";[[ -z "${DEEP_CHECK}" ]] && export DEEP_CHECK="false"
          export TESTS="$(get '.tests')"
          export LABEL="$(get '.label')";          [[ -z "${LABEL}" ]] && export LABEL="${CLIENT}"
          export EXTRA_ARGS="$(get '.extra_args')"
          if [[ "${COMPARISON}" == "true" ]]; then
            # Switches run-flood.sh into equality (differential) mode.
            export REFERENCE_RPC_URL="http://localhost:${REF_RPC_PORT}"
            export REFERENCE_LABEL="${REFERENCE_CLIENT}"
          fi
          ./scripts/rpc-bench/run-flood.sh

      - name: Warm up node
        if: needs.resolve.outputs.benchmark_tool == 'jsonbench' && needs.resolve.outputs.warmup_seconds != '0'
        env:
          RPC_URL: http://localhost:8545
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          RESOLVED_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
          RESOLVED_CORPUS_DIR: ${{ needs.resolve.outputs.corpus_dir }}
          CLIENT_TYPE: ${{ needs.resolve.outputs.client }}
          WARMUP_SECONDS: ${{ needs.resolve.outputs.warmup_seconds }}
          WARMUP_RPS: ${{ needs.resolve.outputs.warmup_rps }}
          # Leave the json-bench checkout, runner image and corpus fixture for the measured cell.
          JB_REUSE_PREPARED: "true"
        shell: bash
        run: |
          set -euo pipefail
          cfg="${TOOL_CONFIG}"; [[ -z "${cfg}" ]] && cfg='{}'
          get() { echo "${cfg}" | jq -r "$1 // empty"; }
          # A fresh node answers eth_blockNumber long before it serves eth_call warm: snapshot
          # persistence still writes for minutes and the JIT has not tiered up. This discarded cell
          # replays the measured cell's workload first; only workload identity is taken from
          # tool_config — report/gate knobs are forced off because nothing here is published.
          jb_ref="$(get '.ref')";                        [[ -n "${jb_ref}" ]] && export JB_REF="${jb_ref}"
          export JB_BENCHMARK_CONFIG="$(get '.benchmark_config')"
          jb_vus="$(get '.vus')";                        [[ -n "${jb_vus}" ]] && export JB_VUS="${jb_vus}"
          export JB_ETH_CALL_CORPUS="${RESOLVED_ETH_CALL_CORPUS}"
          jb_corpus="$(get '.corpus_file')"
          [[ -z "${jb_corpus}" && -n "${RESOLVED_CORPUS_DIR:-}" ]] && jb_corpus="${RESOLVED_CORPUS_DIR}/eth-call-corpus.jsonl.gz"
          [[ -n "${jb_corpus}" ]] && export JB_ETH_CALL_CORPUS_FILE="${jb_corpus}"
          max_records="$(get '.max_corpus_records')"; [[ -n "${max_records}" ]] && export RPC_BENCH_MAX_CORPUS_RECORDS="${max_records}"
          export JB_EXTRA_ARGS="$(get '.extra_args')"
          # Discarded output stays OUT of OUT_DIR so it is never staged or published; the
          # fail-rate gate is lifted because absorbing the cold failures is the point of this cell.
          export OUT_DIR="${SCRATCH_ROOT}/warmup-cell/single"
          export JB_MODE="benchmark" JB_RPS="${WARMUP_RPS}" JB_DURATION="${WARMUP_SECONDS}s"
          export JB_DEEP_CHECK="false" JB_HTML_REPORT="false" JB_MAX_FAIL_RATE_PCT="100"
          echo "-- WARMUP @ rps=${WARMUP_RPS} for ${WARMUP_SECONDS}s (discarded) --"
          ./scripts/rpc-bench/run-jsonbench.sh \
            || echo "::warning::warm-up failed — the measured cell and its profiles may be cold"

      - name: Start profilers
        # Only after the warm-up: without one, start-node.sh started them when RPC became ready.
        if: needs.resolve.outputs.benchmark_tool == 'jsonbench' && needs.resolve.outputs.warmup_seconds != '0' && (needs.resolve.outputs.perf == 'true' || needs.resolve.outputs.dottrace == 'true' || needs.resolve.outputs.dotnet_trace == 'true')
        env:
          DOTNET_TRACE_MAX_SECONDS: ${{ needs.resolve.outputs.dotnet_trace_max_seconds }}
        run: ./scripts/rpc-bench/start-profilers.sh

      - name: Run json-bench benchmark
        id: run-jsonbench
        if: needs.resolve.outputs.benchmark_tool == 'jsonbench'
        continue-on-error: true
        env:
          RPC_URL: http://localhost:8545
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          RESOLVED_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
          RESOLVED_CORPUS_DIR: ${{ needs.resolve.outputs.corpus_dir }}
          CLIENT_TYPE: ${{ needs.resolve.outputs.client }}
          COMPARISON: ${{ needs.resolve.outputs.comparison }}
          REFERENCE_CLIENT: ${{ needs.resolve.outputs.reference_client }}
          # After a warm-up the tool is already prepared; re-preparing it would leave the profilers
          # started above recording an idle node for the re-clone, rebuild and corpus re-conversion.
          JB_REUSE_PREPARED: ${{ needs.resolve.outputs.warmup_seconds != '0' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          cfg="${TOOL_CONFIG}"; [[ -z "${cfg}" ]] && cfg='{}'
          get() { echo "${cfg}" | jq -r "$1 // empty"; }
          # For booleans '// empty' would swallow an explicit false — test null instead.
          getb() { echo "${cfg}" | jq -r "$1 | if . == null then \"\" else tostring end"; }
          # Only override when set; otherwise the script's pinned/default values
          # apply (single source of truth for the pin).
          jb_ref="$(get '.ref')";                        [[ -n "${jb_ref}" ]] && export JB_REF="${jb_ref}"
          export JB_MODE="$(get '.mode')"
          export JB_BENCHMARK_CONFIG="$(get '.benchmark_config')"
          jb_cmp="$(get '.compare_config')";             [[ -n "${jb_cmp}" ]] && export JB_COMPARE_CONFIG="${jb_cmp}"
          jb_rps="$(get '.rps')";                        [[ -n "${jb_rps}" ]] && export JB_RPS="${jb_rps}"
          jb_dur="$(get '.duration')";                   [[ -n "${jb_dur}" ]] && export JB_DURATION="${jb_dur}"
          jb_vus="$(get '.vus')";                        [[ -n "${jb_vus}" ]] && export JB_VUS="${jb_vus}"
          jb_conc="$(get '.concurrency')";               [[ -n "${jb_conc}" ]] && export JB_CONCURRENCY="${jb_conc}"
          jb_to="$(get '.timeout')";                     [[ -n "${jb_to}" ]] && export JB_TIMEOUT="${jb_to}"
          export JB_VALIDATE_SCHEMA="$(getb '.validate_schema')"
          export JB_DEEP_CHECK="$(getb '.deep_check')"
          export JB_ETH_CALL_CORPUS="${RESOLVED_ETH_CALL_CORPUS}"   # resolved once in `resolve`
          # Which corpus to replay. The sweep picks one with corpus_glob; this path had no
          # equivalent and always replayed the default file, so a profile taken here could not be
          # compared against a sweep measured on a different corpus.
          # Default to the selected runner's corpus dir; only an explicit corpus_file overrides it.
          jb_corpus="$(get '.corpus_file')"
          [[ -z "${jb_corpus}" && -n "${RESOLVED_CORPUS_DIR:-}" ]] && jb_corpus="${RESOLVED_CORPUS_DIR}/eth-call-corpus.jsonl.gz"
          [[ -n "${jb_corpus}" ]] && export JB_ETH_CALL_CORPUS_FILE="${jb_corpus}"
          jb_html="$(getb '.html_report')";              [[ -n "${jb_html}" ]] && export JB_HTML_REPORT="${jb_html}"
          export JB_FAIL_ON_DIFF="$(getb '.fail_on_diff')"
          # getb: '// empty' would swallow an explicit 0 (jq treats it as truthy-false).
          jb_mfr="$(getb '.max_fail_rate_pct')";         [[ -n "${jb_mfr}" ]] && export JB_MAX_FAIL_RATE_PCT="${jb_mfr}"
          export JB_EXTRA_ARGS="$(get '.extra_args')"
          # The record cap is a property of the corpus, not of the dispatch mode: without this the
          # sweep accepts a raised cap while this path still rejects the same corpus at 10k.
          max_records="$(get '.max_corpus_records')"; [[ -n "${max_records}" ]] && export RPC_BENCH_MAX_CORPUS_RECORDS="${max_records}"
          if [[ "${COMPARISON}" == "true" ]]; then
            export REFERENCE_RPC_URL="http://localhost:${REF_RPC_PORT}"
            export REFERENCE_CLIENT_TYPE="${REFERENCE_CLIENT}"
          fi
          ./scripts/rpc-bench/run-jsonbench.sh

      - name: Run EthCallChaos benchmark
        id: run-ecc
        if: needs.resolve.outputs.benchmark_tool == 'ethcallchaos'
        continue-on-error: true
        env:
          RPC_URL: http://localhost:8545
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          RESOLVED_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
        shell: bash
        run: |
          set -euo pipefail
          cfg="${TOOL_CONFIG}"; [[ -z "${cfg}" ]] && cfg='{}'
          get() { echo "${cfg}" | jq -r "$1 // empty"; }
          # Only override when a ref is supplied; otherwise the script's pinned
          # commit default applies (single source of truth for the pin).
          ecc_ref="$(get '.ref')";                            [[ -n "${ecc_ref}" ]] && export ECC_REF="${ecc_ref}"
          export ECC_CORPUS_DB="$(get '.corpus_db')"
          corpus_url="$(get '.corpus_url')"; [[ -n "${corpus_url}" ]] && export ECC_CORPUS_URL="${corpus_url}"
          export ECC_RATE="$(get '.rate')";                   [[ -z "${ECC_RATE}" ]] && export ECC_RATE="50"
          export ECC_PARALLEL="$(get '.parallel')";           [[ -z "${ECC_PARALLEL}" ]] && export ECC_PARALLEL="8"
          export ECC_DURATION="$(get '.duration')";           [[ -z "${ECC_DURATION}" ]] && export ECC_DURATION="300"
          export ECC_LEADERBOARD_TOP="$(get '.leaderboard_top')"; [[ -z "${ECC_LEADERBOARD_TOP}" ]] && export ECC_LEADERBOARD_TOP="50"
          export ECC_API_PORT="$(get '.api_port')";           [[ -z "${ECC_API_PORT}" ]] && export ECC_API_PORT="5000"
          export ECC_MIN_MEAN_MS="$(get '.min_mean_ms')";     [[ -z "${ECC_MIN_MEAN_MS}" ]] && export ECC_MIN_MEAN_MS="1"
          export ECC_MAX_CV="$(get '.max_cv')";               [[ -z "${ECC_MAX_CV}" ]] && export ECC_MAX_CV="10"
          ./scripts/rpc-bench/run-ethcallchaos.sh

      - name: Stop reference node and verify DB integrity
        if: always() && needs.resolve.outputs.comparison == 'true'
        env:
          STOP_GRACE: "180"
        run: NODE_ENV_FILE="${STATE_DIR}/node-reference.env" ./scripts/rpc-bench/stop-node.sh

      - name: Run RPC sweep
        id: run-sweep
        if: needs.resolve.outputs.benchmark_tool == 'jsonbench-sweep'
        env:
          NM_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          JSONRPC_MODULES: ${{ needs.resolve.outputs.jsonrpc_modules }}
          HEALTH_TIMEOUT: ${{ needs.resolve.outputs.health_timeout }}
          NETWORK: ${{ needs.resolve.outputs.network }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          RESOLVED_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
          RESOLVED_CORPUS_DIR: ${{ needs.resolve.outputs.corpus_dir }}
          SNAPSHOT_ROOT: ${{ needs.resolve.outputs.snapshot_root }}
        shell: bash
        run: |
          set -euo pipefail
          cfg="${TOOL_CONFIG}"; [[ -z "${cfg}" ]] && cfg='{}'
          get() { echo "${cfg}" | jq -r "$1 // empty"; }
          # For booleans '// empty' would swallow an explicit false — test null instead.
          getb() { echo "${cfg}" | jq -r "$1 | if . == null then \"\" else tostring end"; }
          export JB_ETH_CALL_CORPUS="${RESOLVED_ETH_CALL_CORPUS}"   # resolved once in `resolve`
          corpus_dir="$(get '.corpus_dir')";               [[ -z "${corpus_dir}" ]] && corpus_dir="${RESOLVED_CORPUS_DIR}"
          [[ -n "${corpus_dir}" ]] && export CORPUS_DIR="${corpus_dir}"
          corpus_glob="$(get '.corpus_glob')";             [[ -n "${corpus_glob}" ]] && export CORPUS_GLOB="${corpus_glob}"
          # Sweep mode resolves one Nethermind flat snapshot, so the geth/reth default it used to carry
          # made a bare dispatch fail its own guard. Cross-client work belongs in single-node mode.
          export CLIENTS="$(get '.clients')";              [[ -z "${CLIENTS}" ]] && export CLIENTS="nethermind"
          # An ABSENT rps_list means "use the default"; an explicitly EMPTY one means "no k6 cells"
          # (corpus runs that only want parity/timings). `// empty` cannot tell those apart.
          if [[ "$(echo "${cfg}" | jq -r 'has("rps_list")')" == "true" ]]; then
            export RPS_LIST="$(echo "${cfg}" | jq -r '.rps_list // ""')"
          else
            export RPS_LIST="100 250 500"
          fi
          export SNAPSHOT_BLOCK="$(get '.snapshot_block')";[[ -z "${SNAPSHOT_BLOCK}" ]] && export SNAPSHOT_BLOCK="25490000"
          export STATE_LAYOUT="$(get '.state_layout')";    [[ -z "${STATE_LAYOUT}" ]] && export STATE_LAYOUT="flat"
          export JB_BENCHMARK_CONFIG="$(get '.benchmark_config')"; [[ -z "${JB_BENCHMARK_CONFIG}" ]] && export JB_BENCHMARK_CONFIG="config/benchmark/ethcallchaos-percategory-validated.yaml"
          export JB_REF="$(get '.ref')";                   [[ -z "${JB_REF}" ]] && export JB_REF="b0a0112c51ce918041c2e110fcd0d056773f1735"
          export JB_DURATION="$(get '.duration')";         [[ -z "${JB_DURATION}" ]] && export JB_DURATION="60s"
          export ISO_CONFIGS="$(get '.iso_configs')"
          export ISO_DURATION="$(get '.iso_duration')";    [[ -z "${ISO_DURATION}" ]] && export ISO_DURATION="20s"
          # Force one isolation mode for every client so storage counters are comparable.
          iso_all="$(get '.db_isolation_all')"; [[ -n "${iso_all}" ]] && export DB_ISOLATION_ALL="${iso_all}"
          # Consent flag for db_isolation_all=direct; without a tool_config route the documented
          # option was unreachable (the guard names an env var no dispatcher could set).
          iso_mut="$(getb '.db_isolation_allow_snapshot_mutation')"; [[ -n "${iso_mut}" ]] && export DB_ISOLATION_ALLOW_SNAPSHOT_MUTATION="${iso_mut}"
          rsamp="$(getb '.resource_sampling')"; [[ -n "${rsamp}" ]] && export CORPUS_RESOURCE_SAMPLING="${rsamp}"
          # Size corpus cells by request count rather than wall time (rate is still rps_list).
          corpus_requests="$(get '.corpus_requests')"; [[ -n "${corpus_requests}" ]] && export CORPUS_REQUESTS="${corpus_requests}"
          corpus_passes="$(get '.corpus_passes')";     [[ -n "${corpus_passes}" ]] && export CORPUS_PASSES="${corpus_passes}"
          # 0 measures a cold node deliberately — the cold/warm gap is itself a result worth having.
          corpus_warmup="$(get '.corpus_warmup_duration')"; [[ -n "${corpus_warmup}" ]] && export CORPUS_WARMUP_DURATION="${corpus_warmup}"
          # Parity holds every record in memory; raising this is a deliberate act, not a default.
          max_records="$(get '.max_corpus_records')"; [[ -n "${max_records}" ]] && export RPC_BENCH_MAX_CORPUS_RECORDS="${max_records}"
          # Per-record latency matrix; bypasses k6, so it is how a large corpus runs at a high rate.
          t_passes="$(get '.timings_passes')";  [[ -n "${t_passes}" ]] && export CORPUS_TIMINGS_PASSES="${t_passes}"
          t_rps="$(get '.timings_rps')";        [[ -n "${t_rps}" ]] && export CORPUS_TIMINGS_RPS="${t_rps}"
          t_conc="$(get '.timings_concurrency')"; [[ -n "${t_conc}" ]] && export CORPUS_TIMINGS_CONCURRENCY="${t_conc}"
          pdiffs="$(getb '.parity_diffs')";     [[ "${pdiffs}" == "true" ]] && export CORPUS_PARITY_DIFFS=true
          max_div="$(get '.max_divergence_indexes')"; [[ -n "${max_div}" ]] && export RPC_BENCH_MAX_DIVERGENCE_INDEXES="${max_div}"
          # Extra docker -e assignments for every swept node (start-node.sh reads NODE_ENV_VARS from
          # the environment), e.g. opt-in experiment gates like NETHERMIND_EXPERIMENTAL_SVE2_KECCAK=1.
          node_env="$(get '.node_env_vars')"; [[ -n "${node_env}" ]] && export NODE_ENV_VARS="${node_env}"
          export STATE_ROOT="${STATE_DIR}/sweep"
          ./scripts/rpc-bench/run-rpc-sweep.sh

      - name: Stop node and verify DB integrity
        if: always() && needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        env:
          STOP_GRACE: "180"
        run: ./scripts/rpc-bench/stop-node.sh

      - name: Collect dotTrace snapshots
        if: always() && needs.resolve.outputs.dottrace == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/dottrace-rpcbench.zip
        run: |
          set -euo pipefail
          if [[ -d "${DIAG_DIR}/dottrace" ]] && [[ -n "$(find "${DIAG_DIR}/dottrace" -type f 2>/dev/null)" ]]; then
            ( cd "${DIAG_DIR}" && zip -9r "${ARCHIVE}" dottrace )
            echo "Archived dotTrace snapshots to ${ARCHIVE}"
          else
            echo "No dotTrace snapshots found under ${DIAG_DIR}/dottrace."
          fi

      - name: Collect perf profile
        if: always() && needs.resolve.outputs.perf == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/perf-rpcbench.zip
        run: |
          set -euo pipefail
          if bash scripts/validate-folded-profile.sh "${DIAG_DIR}/perf/perf.folded"; then
            ( cd "${DIAG_DIR}" && zip -9r "${ARCHIVE}" perf -x '*/perf.data' )
            echo "Archived perf profile to ${ARCHIVE}"
          else
            echo "::error::perf was requested but no positive-sample ${DIAG_DIR}/perf/perf.folded was produced."
            exit 1
          fi

      - name: Collect dotnet-trace
        if: always() && needs.resolve.outputs.dotnet_trace == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/dotnet-trace-rpcbench.zip
        run: |
          set -euo pipefail
          if [[ -s "${DIAG_DIR}/dotnet-trace/rpcbench.nettrace" ]]; then
            ( cd "${DIAG_DIR}" && zip -9r "${ARCHIVE}" dotnet-trace )
            echo "Archived dotnet-trace to ${ARCHIVE}"
          else
            echo "::error::dotnet_trace was requested but no ${DIAG_DIR}/dotnet-trace/rpcbench.nettrace was produced."
            exit 1
          fi

      - name: Scan node logs for errors
        id: scan
        if: always() && needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          PERF: ${{ needs.resolve.outputs.perf }}
          # Corpus runs print match COUNTS only — log lines could quote private call data.
          ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
        shell: bash
        run: |
          set -euo pipefail
          node_log="${STATE_DIR}/node.log"
          if [[ ! -f "${node_log}" ]]; then
            echo "No node log captured."
            echo "exception_found=false" >> "${GITHUB_OUTPUT}"
            echo "invalid_block_found=false" >> "${GITHUB_OUTPUT}"
            echo "clean_shutdown=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          clean="${RUNNER_TEMP}/node.clean.log"
          sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "${node_log}" > "${clean}"

          # "Incorrect JSON RPC parameters" errors come from the CALLER's malformed input, not node health. Key on that
          # message text ONLY — matching a frame name would also exclude genuine node bugs whose stack passes through it.
          benign_rpc_exc='Incorrect JSON RPC parameters'
          # Detect via a match file — piping through 'head' under pipefail can SIGPIPE the first grep on a match storm and
          # silently flip the gate to false. Truncate only when printing.
          exc_matches="${RUNNER_TEMP}/node.exceptions.log"
          grep -in "Exception" "${clean}" | grep -vF "${benign_rpc_exc}" > "${exc_matches}" || true
          exception_found="false"
          if [[ -s "${exc_matches}" ]]; then
            exception_found="true"
            echo "::warning::Exception lines detected in node log ($(wc -l < "${exc_matches}" | tr -d ' ') line(s))"
            [[ "${ETH_CALL_CORPUS}" != "true" ]] && { head -n 40 "${exc_matches}" || true; }
          fi

          invalid_block_found="false"
          if grep -qEi "invalid[[:space:]_-]*block" "${clean}"; then
            invalid_block_found="true"
            echo "::warning::Invalid block lines detected in node log"
            [[ "${ETH_CALL_CORPUS}" != "true" ]] && { grep -Ein "invalid[[:space:]_-]*block" "${clean}" | head -n 40 || true; }
          fi

          for pattern in "Unhandled" "Fatal" "ERROR"; do
            if grep -qi "${pattern}" "${clean}"; then
              echo "::warning::Severe log pattern '${pattern}' detected in node log ($(grep -ci "${pattern}" "${clean}") line(s))"
              [[ "${ETH_CALL_CORPUS}" != "true" ]] && { grep -in "${pattern}" "${clean}" | head -n 10 || true; }
            fi
          done

          # A missing shutdown marker means docker SIGKILLed a hung node (or shutdown crashed) — run untrustworthy. Marker is
          # Nethermind-specific (geth/reth not gated); under dotTrace the Ctrl+C flow skips it so it isn't required either.
          clean_shutdown="true"
          if [[ "${CLIENT}" == "nethermind" && "${DOTTRACE}" != "true" ]] && ! grep -q "Nethermind is shut down" "${clean}"; then
            clean_shutdown="false"
            echo "::warning::'Nethermind is shut down' marker not found in node log — the node did not shut down cleanly."
          fi

          echo "exception_found=${exception_found}" >> "${GITHUB_OUTPUT}"
          echo "invalid_block_found=${invalid_block_found}" >> "${GITHUB_OUTPUT}"
          echo "clean_shutdown=${clean_shutdown}" >> "${GITHUB_OUTPUT}"

          # The reference node is not the code under test — scan warn-only so a
          # noisy upstream image cannot fail a Nethermind benchmark run.
          ref_log="${STATE_DIR}/node-reference.log"
          if [[ -f "${ref_log}" ]]; then
            ref_clean="${RUNNER_TEMP}/node-reference.clean.log"
            sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "${ref_log}" > "${ref_clean}"
            for pattern in "Exception" "Unhandled" "Fatal" "ERROR"; do
              if grep -qi "${pattern}" "${ref_clean}"; then
                echo "::warning::'${pattern}' lines detected in the REFERENCE node log (first 10):"
                grep -in "${pattern}" "${ref_clean}" | head -n 10 || true
              fi
            done
          fi

      - name: Publish step summary
        if: always()
        shell: bash
        env:
          DOTNET_TRACE: ${{ needs.resolve.outputs.dotnet_trace }}
        run: |
          set -euo pipefail
          {
            echo "# RPC Benchmark — ${{ needs.resolve.outputs.benchmark_tool }}"
            echo ""
            echo "Client: \`${{ needs.resolve.outputs.client }}\` | branch: \`${{ needs.resolve.outputs.branch }}\` | image: \`${{ needs.resolve.outputs.image_ref }}\` | dotTrace: \`${{ needs.resolve.outputs.dottrace }}\`"
            if [[ "${{ needs.resolve.outputs.comparison }}" == "true" ]]; then
              echo ""
              echo "Reference: \`${{ needs.resolve.outputs.reference_client }}\` | image: \`${{ needs.resolve.outputs.ref_image_ref }}\`"
            fi
            if [[ "${DOTNET_TRACE}" == "true" ]]; then
              nettrace="${DIAG_DIR}/dotnet-trace/rpcbench.nettrace"
              echo ""
              if [[ -s "${nettrace}" ]]; then
                echo "dotnet-trace: \`rpcbench.nettrace\` $(du -h "${nettrace}" | cut -f1) (artifact \`dotnet-trace-rpcbench\`)"
              else
                echo "dotnet-trace: **no .nettrace was produced**"
              fi
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          shopt -s nullglob
          for md in "${OUT_DIR}"/*-summary.md; do
            cat "${md}" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload benchmark results
        if: always() && needs.resolve.outputs.eth_call_corpus != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpcbench-results-${{ needs.resolve.outputs.benchmark_tool }}
          path: |
            ${{ runner.temp }}/rpcbench-out/
            ${{ runner.temp }}/rpcbench-state/node.log
            ${{ runner.temp }}/rpcbench-state/node-reference.log
            ${{ runner.temp }}/rpcbench-state/db-baseline.txt
            ${{ runner.temp }}/rpcbench-state/db-final.txt
            ${{ runner.temp }}/rpcbench-state/db-baseline-reference.txt
            ${{ runner.temp }}/rpcbench-state/db-final-reference.txt
            ${{ runner.temp }}/rpcbench-state/sweep/
          retention-days: 30
          if-no-files-found: warn

      # Corpus runs publish an allowlist-staged artifact instead: sanitized aggregate summaries,
      # counts-only parity reports, and our own generated markdown — never node logs, raw tool
      # output, or per-call files.
      - name: Stage private corpus results
        id: stage-corpus-results
        if: always() && needs.resolve.outputs.eth_call_corpus == 'true'
        shell: bash
        run: python3 scripts/rpc-bench/corpus_results.py stage "${OUT_DIR}" "${RUNNER_TEMP}/rpcbench-corpus-results"

      # Built from the STAGED tree, so everything in a public PR comment has already passed the
      # aggregate-only validator. Never posts raw output.
      - name: Comment corpus comparison on the PR
        if: always() && github.event_name == 'pull_request' && github.event.label.name == 'performance is good' && steps.stage-corpus-results.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/rpc-bench/corpus_results.py comment \
            "${RUNNER_TEMP}/rpcbench-corpus-results" \
            --baseline nethermind_master --candidate nethermind > comment.md
          {
            echo
            echo "<sub>[workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})</sub>"
          } >> comment.md
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file comment.md

      - name: Upload private corpus results
        if: always() && needs.resolve.outputs.eth_call_corpus == 'true' && steps.stage-corpus-results.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rpcbench-results-${{ needs.resolve.outputs.benchmark_tool }}
          path: ${{ runner.temp }}/rpcbench-corpus-results/
          retention-days: 30
          if-no-files-found: error

      - name: Upload dotTrace snapshot
        if: always() && needs.resolve.outputs.dottrace == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dottrace-rpcbench
          path: ${{ runner.temp }}/dottrace-rpcbench.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload perf profile
        if: always() && needs.resolve.outputs.perf == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: perf-rpcbench
          path: ${{ runner.temp }}/perf-rpcbench.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload dotnet-trace
        if: always() && needs.resolve.outputs.dotnet_trace == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-trace-rpcbench
          path: ${{ runner.temp }}/dotnet-trace-rpcbench.zip
          retention-days: 30
          if-no-files-found: error

      - name: Defensive cleanup
        if: always()
        shell: bash
        env:
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          DB_SOURCE: ${{ needs.resolve.outputs.db_source }}
        # Belt-and-suspenders: reaps stale containers, unmounts and wipes scratch subtrees — same canonical-path guards as
        # start-node.sh, so it can never reach the snapshot. Never fails the job.
        run: ./scripts/rpc-bench/cleanup.sh || true

      - name: Reclaim root disk after the run
        if: always() && needs.resolve.outputs.runner_label == 'reproducible-benchmarks-arm'
        shell: bash
        # Leave / no fuller than we found it, so disk pressure cannot accumulate run over run into the
        # daemon death this workflow used to cause. Tagged images survive; only garbage is dropped.
        run: |
          set -uo pipefail
          docker container prune -f || true
          docker network prune -f || true
          docker builder prune -af || true
          docker image prune -f || true
          docker volume ls -q | grep -E '^expb-' | xargs -r docker volume rm -f || true
          rm -rf /root/actions-runner/_work/_temp/* 2>/dev/null || true
          df -h / || true
          docker system df || true

      - name: Enforce quality gates
        if: always() && needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        shell: bash
        run: |
          set -euo pipefail
          # The tool steps use continue-on-error so teardown and the integrity
          # check always run — their real outcome is enforced here instead.
          if [[ "${{ steps.run-flood.outcome }}" == "failure" || "${{ steps.run-ecc.outcome }}" == "failure" || "${{ steps.run-jsonbench.outcome }}" == "failure" ]]; then
            echo "The benchmark tool step failed — failing the job."
            exit 1
          fi
          if [[ "${{ steps.scan.outputs.exception_found }}" == "true" ]]; then
            echo "Exceptions detected in node log — failing."
            exit 1
          fi
          if [[ "${{ steps.scan.outputs.invalid_block_found }}" == "true" ]]; then
            echo "Invalid block lines detected in node log — failing."
            exit 1
          fi
          if [[ "${{ steps.scan.outputs.clean_shutdown }}" == "false" ]]; then
            echo "Node did not shut down cleanly (shutdown marker missing) — failing."
            exit 1
          fi

  # dotTrace XML report generation (Windows-only Reporter.exe). Mirrors the EXPB reproducible-benchmarks workflow.
  generate-dottrace-reports:
    needs: [resolve, benchmark]
    # Run whenever the benchmark executed (success OR failure): an errored node still leaves a .dtp, often most valuable then.
    # Only skip if benchmark was skipped/cancelled. Missing snapshot artifacts are tolerated downstream.
    # Timeline snapshots cannot be converted by Reporter.exe - they ship as the raw .dtt artifact only.
    if: always() && needs.resolve.outputs.dottrace == 'true' && needs.resolve.outputs.dottrace_mode != 'timeline' && needs.benchmark.result != 'skipped' && needs.benchmark.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dottrace-*
          path: snapshots/
          merge-multiple: true

      - name: Install dotTrace Reporter
        shell: pwsh
        run: |
          $url = 'https://www.nuget.org/api/v2/package/JetBrains.dotTrace.CommandLineTools.windows-x64/2026.1.0.1'
          Write-Host "Downloading dotTrace CommandLineTools from NuGet..."
          Invoke-WebRequest -Uri $url -OutFile dottrace-clt.zip
          Expand-Archive -Path dottrace-clt.zip -DestinationPath dottrace-clt
          $reporter = Get-ChildItem -Path dottrace-clt -Recurse -Filter 'Reporter.exe' | Select-Object -First 1
          if (-not $reporter) {
            Write-Error "Reporter.exe not found in package"
            exit 1
          }
          Write-Host "Found Reporter.exe at $($reporter.FullName)"
          echo "REPORTER=$($reporter.FullName)" >> $env:GITHUB_ENV

      - name: Generate XML reports
        shell: pwsh
        run: |
          # Pattern-mode download with zero matches leaves no 'snapshots' dir (node produced no .dtp) — skip cleanly
          # instead of failing on the enumeration below.
          if (-not (Test-Path snapshots)) {
            Write-Host "No dotTrace snapshot artifacts were downloaded — nothing to report."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path reports, extracted | Out-Null

          $patternFile = 'pattern.xml'
          @'
          <Patterns>
            <Pattern PrintCallstacks="Full">.*</Pattern>
          </Patterns>
          '@ | Set-Content -Path $patternFile

          Get-ChildItem -Path snapshots -Filter '*.zip' | ForEach-Object {
            $dest = Join-Path extracted $_.BaseName
            Write-Host "Extracting $($_.Name) -> $dest"
            Expand-Archive -Path $_.FullName -DestinationPath $dest
          }

          $snapshots = Get-ChildItem -Path extracted -Recurse | Where-Object { $_.Extension -eq '.dtp' }
          if ($snapshots.Count -eq 0) {
            Write-Host "No .dtp snapshot files found after extraction."
            exit 0
          }

          foreach ($dtp in $snapshots) {
            $name = $dtp.BaseName
            $outFile = "reports/${name}-report.xml"
            Write-Host "::group::Generating report for $name"
            Write-Host "  $($dtp.FullName) -> $outFile"
            & $env:REPORTER report $dtp.FullName --pattern=$patternFile --save-to=$outFile
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Reporter failed for $name with exit code $LASTEXITCODE"
            }
            Write-Host "::endgroup::"
          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dottrace-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # Surface the dotTrace hot spots in the job summary for quick iteration.
  dottrace-summary:
    needs: [resolve, generate-dottrace-reports]
    if: always() && needs.resolve.outputs.dottrace == 'true' && needs.resolve.outputs.dottrace_mode != 'timeline' && needs.generate-dottrace-reports.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download dotTrace reports
        # The reports artifact does not exist when no .dtp was captured (if-no-files-found: ignore upstream) — tolerate the
        # failed download; the summarize step handles an empty/missing reports dir.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dottrace-reports
          path: reports/

      - name: Summarize hot spots
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/dottrace-report.sh
          shopt -s nullglob
          xmls=(reports/*.xml)
          if [[ "${#xmls[@]}" -eq 0 ]]; then
            echo "No XML reports found." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "## dotTrace hot spots (top 40 by OwnTime)"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          for xml in "${xmls[@]}"; do
            {
              echo "<details><summary>$(basename "${xml}")</summary>"
              echo ""
              echo '```'
              ./scripts/dottrace-report.sh top "${xml}" 40 || true
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          done
