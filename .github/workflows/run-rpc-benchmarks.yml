name: RPC release audited owned reservation
run-name: RPC release recovered reservation ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-rpc-native-capability
  cancel-in-progress: false
jobs:
  release:
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rpc-release-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Release independently audited reservation with final live checks
        run: python3 -B rpc-release-${{ github.run_id }}-${{ github.run_attempt }}/scripts/rpc-recovery/release.py
