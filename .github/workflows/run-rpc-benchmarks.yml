name: Run RPC Benchmarks

# Read-only JSON-RPC benchmarks against a DB snapshot on a self-hosted runner (amd64 or arm64 box, picked by `arch`).
# Snapshots are fingerprinted before/after; any change fails the job (warn-only under reth's read-write `direct` mode).
# The default preset needs no JSON: it A/Bs this branch against master on the private eth_call corpus.
# Templates and the advanced keys: scripts/rpc-bench/README.md, "Triggering".

on:
  workflow_dispatch:
    inputs:
      benchmark_tool:
        description: >-
          corpus-ab = fixed private eth_call corpus A/B of docker_image vs baseline_image (seeded requests, ABBA rounds,
          per-record replay, parity). jsonbench-sweep = same two-arm sweep on a json-bench workload. jsonbench / flood /
          ethcallchaos = single node (client, reference_client, state_layout apply).
        required: true
        type: choice
        options:
          - corpus-ab
          - jsonbench-sweep
          - jsonbench
          - flood
          - ethcallchaos
        default: corpus-ab
      arch:
        description: >-
          Runner. amd64 = EPYC box (all clients/layouts, builds images); arm64 = Axion box (Nethermind flat only,
          prebuilt images only). Never compare timings across boxes.
        required: false
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      docker_image:
        description: >-
          Image under test (sweep candidate / single-node client), e.g. nethermindeth/nethermind:master-21f1dca.
          Empty = this branch (prebuilt tag for master/release, otherwise built on the runner — refused on arm64).
        required: false
        default: ""
      baseline_image:
        description: Sweep baseline and parity reference (corpus-ab, jsonbench-sweep).
        required: false
        default: nethermindeth/nethermind:master
      rps:
        description: Request rate(s), space-separated. Sweeps run one cell per rate; single-node tools take the first.
        required: false
        default: "100"
      requests_per_cell:
        description: corpus-ab — requests per cell (cell length = requests / rps). 0 = time the cell with duration instead.
        required: false
        type: number
        default: 20000
      rounds:
        description: Sweep rounds. 2 = A B B A, which also yields the A/A control printed next to every delta.
        required: false
        type: number
        default: 2
      timings_passes:
        description: corpus-ab — passes of the closed-loop per-record replay per arm (paired comparison). 0 = skip.
        required: false
        type: number
        default: 40
      warmup:
        description: corpus-ab — discarded warm-up seconds per node at 400 rps. 0 = measure cold.
        required: false
        type: number
        default: 60
      corpus:
        description: corpus-ab — corpus filename (glob) in the runner's rpc-bench dir. Empty = every eth-call-corpus*.jsonl.gz.
        required: false
        default: eth-call-corpus-20260805T104605Z-497-safe.jsonl.gz
      duration:
        description: Seconds per cell/test where cells are timed (jsonbench-sweep, jsonbench, flood, ethcallchaos, corpus-ab with requests_per_cell=0).
        required: false
        type: number
        default: 60
      snapshot_block:
        description: Snapshot set tag (<root>/<client>-<tag>; nethermind = nethermind-flat-<tag>). Empty = 25490000 for sweeps/geth/reth/comparisons, the expb snapshot otherwise.
        required: false
        default: ""
      dottrace:
        description: dotTrace profiling of the node (nethermind only). sampling/tracing produce XML reports; timeline is UI-only.
        required: false
        type: choice
        options:
          - "false"
          - sampling
          - tracing
          - timeline
        default: "false"
      client:
        description: Single-node tools — client to benchmark.
        required: false
        type: choice
        options:
          - nethermind
          - geth
          - reth
        default: nethermind
      reference_client:
        description: Single-node tools — second client from its same-block snapshot to compare responses against (flood/jsonbench).
        required: false
        type: choice
        options:
          - none
          - geth
          - nethermind
          - reth
        default: none
      state_layout:
        description: Single-node tools — Nethermind DB layout (sweeps are flat only).
        required: false
        type: choice
        options:
          - flat
          - halfpath
        default: flat
      additional_nethermind_flags:
        description: Extra Nethermind flags for single-node runs (e.g. --Pruning.CacheMb=4000).
        required: false
        default: ""
      tool_config:
        description: Advanced — JSON merged over the values derived from the inputs above (its keys win). Templates and all keys in README "Triggering".
        required: false
        default: ""
      node_config:
        description: Advanced — node/runner JSON (db_source, db_isolation, scratch_root, cpuset, memory, cpu_max_freq_khz, reference_*). See README.
        required: false
        default: ""
  pull_request:
    types: [labeled]

# No concurrency group: cancel-in-progress=false keeps only the newest pending run. The runner serializes jobs itself.
permissions:
  contents: read

jobs:
  resolve:
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'rpc-benchmark' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      branch: ${{ steps.resolve.outputs.branch }}
      clean_branch: ${{ steps.resolve.outputs.clean_branch }}
      benchmark_tool: ${{ steps.resolve.outputs.benchmark_tool }}
      client: ${{ steps.resolve.outputs.client }}
      reference_client: ${{ steps.resolve.outputs.reference_client }}
      comparison: ${{ steps.resolve.outputs.comparison }}
      dottrace: ${{ steps.resolve.outputs.dottrace }}
      dottrace_mode: ${{ steps.resolve.outputs.dottrace_mode }}
      image_mode: ${{ steps.resolve.outputs.image_mode }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      ref_image_ref: ${{ steps.resolve.outputs.ref_image_ref }}
      db_source: ${{ steps.resolve.outputs.db_source }}
      ref_db_source: ${{ steps.resolve.outputs.ref_db_source }}
      db_isolation: ${{ steps.resolve.outputs.db_isolation }}
      ref_db_isolation: ${{ steps.resolve.outputs.ref_db_isolation }}
      scratch_root: ${{ steps.resolve.outputs.scratch_root }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      corpus_dir: ${{ steps.resolve.outputs.corpus_dir }}
      snapshot_root: ${{ steps.resolve.outputs.snapshot_root }}
      network: ${{ steps.resolve.outputs.network }}
      jsonrpc_modules: ${{ steps.resolve.outputs.jsonrpc_modules }}
      layout_flags: ${{ steps.resolve.outputs.layout_flags }}
      ref_layout_flags: ${{ steps.resolve.outputs.ref_layout_flags }}
      additional_flags: ${{ steps.resolve.outputs.additional_flags }}
      ref_additional_flags: ${{ steps.resolve.outputs.ref_additional_flags }}
      health_timeout: ${{ steps.resolve.outputs.health_timeout }}
      node_cpuset: ${{ steps.resolve.outputs.node_cpuset }}
      node_memory: ${{ steps.resolve.outputs.node_memory }}
      cpu_max_freq_khz: ${{ steps.resolve.outputs.cpu_max_freq_khz }}
      eth_call_corpus: ${{ steps.resolve.outputs.eth_call_corpus }}
      tool_config: ${{ steps.resolve.outputs.tool_config }}
    steps:
      - name: Resolve configuration
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUSH_BRANCH: ${{ github.ref_name }}
          IN_TOOL: ${{ inputs.benchmark_tool }}
          IN_ARCH: ${{ inputs.arch }}
          IN_DOCKER_IMAGE: ${{ inputs.docker_image }}
          IN_BASELINE_IMAGE: ${{ inputs.baseline_image }}
          IN_RPS: ${{ inputs.rps }}
          IN_REQUESTS: ${{ inputs.requests_per_cell }}
          IN_ROUNDS: ${{ inputs.rounds }}
          IN_TIMINGS_PASSES: ${{ inputs.timings_passes }}
          IN_WARMUP: ${{ inputs.warmup }}
          IN_CORPUS: ${{ inputs.corpus }}
          IN_DURATION: ${{ inputs.duration }}
          IN_SNAPSHOT_BLOCK: ${{ inputs.snapshot_block }}
          IN_DOTTRACE: ${{ inputs.dottrace }}
          IN_CLIENT: ${{ inputs.client }}
          IN_REFERENCE_CLIENT: ${{ inputs.reference_client }}
          IN_STATE_LAYOUT: ${{ inputs.state_layout }}
          IN_FLAGS: ${{ inputs.additional_nethermind_flags }}
          IN_TOOL_CONFIG: ${{ inputs.tool_config }}
          IN_NODE_CONFIG: ${{ inputs.node_config }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # A PR labeled `rpc-benchmark` runs the default preset: this branch vs master on the corpus.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then branch="${PUSH_BRANCH}"; else branch="${PR_HEAD_BRANCH}"; fi
          preset="${IN_TOOL:-corpus-ab}"
          arch="${IN_ARCH:-amd64}"
          docker_image="${IN_DOCKER_IMAGE:-}"
          baseline_image="${IN_BASELINE_IMAGE:-nethermindeth/nethermind:master}"
          rps="${IN_RPS:-100}"
          requests="${IN_REQUESTS:-20000}"
          rounds="${IN_ROUNDS:-2}"
          timings_passes="${IN_TIMINGS_PASSES:-40}"
          warmup="${IN_WARMUP:-60}"
          corpus="${IN_CORPUS-eth-call-corpus-20260805T104605Z-497-safe.jsonl.gz}"
          duration="${IN_DURATION:-60}"
          snapshot_block="${IN_SNAPSHOT_BLOCK:-}"
          dottrace="${IN_DOTTRACE:-false}"
          client="${IN_CLIENT:-nethermind}"
          reference_client="${IN_REFERENCE_CLIENT:-none}"
          state_layout="${IN_STATE_LAYOUT:-flat}"
          additional_flags="${IN_FLAGS:-}"
          user_tool_config="${IN_TOOL_CONFIG:-}"
          node_config="${IN_NODE_CONFIG:-}"

          for pair in "requests_per_cell=${requests}" "rounds=${rounds}" "timings_passes=${timings_passes}" "warmup=${warmup}" "duration=${duration}"; do
            [[ "${pair#*=}" =~ ^[0-9]+$ ]] || fail "${pair%%=*} must be a non-negative integer, got '${pair#*=}'."
          done
          [[ "${rps}" =~ ^[1-9][0-9]*( [1-9][0-9]*)*$ ]] || fail "rps must be space-separated positive integers, got '${rps}'."
          (( rounds >= 1 )) || fail "rounds must be at least 1."
          (( duration >= 1 )) || fail "duration must be at least 1 second."
          case "${client}" in nethermind|geth|reth) ;; *) fail "Unknown client '${client}'." ;; esac
          case "${reference_client}" in none|nethermind|geth|reth) ;; *) fail "Unknown reference_client '${reference_client}'." ;; esac
          case "${arch}" in
            arm64) runner_label="reproducible-benchmarks-arm"; snapshot_root="/data/nethermind"; bench_data_dir="/data/expb-data"; default_freq="" ;;
            amd64) runner_label="reproducible-benchmarks"; snapshot_root="/mnt/sda"; bench_data_dir="/mnt/sda/expb-data"; default_freq="3800000" ;;
            *) fail "Unsupported arch '${arch}' (expected amd64 or arm64)." ;;
          esac

          sweep="false"
          case "${preset}" in
            corpus-ab|jsonbench-sweep) benchmark_tool="jsonbench-sweep"; sweep="true"; client="nethermind"; reference_client="none"; state_layout="flat" ;;
            jsonbench|flood|ethcallchaos) benchmark_tool="${preset}" ;;
            *) fail "Unknown benchmark_tool '${preset}'." ;;
          esac
          if [[ "${arch}" == "arm64" ]] && [[ "${client}" != "nethermind" || "${reference_client}" != "none" ]]; then
            fail "The arm64 runner only supports a single Nethermind client — use arch=amd64 for geth/reth or a reference client."
          fi
          [[ "${arch}" != "arm64" || "${state_layout}" == "flat" ]] || fail "The arm64 runner only supports the flat state layout."
          comparison="false"; [[ "${reference_client}" != "none" ]] && comparison="true"
          [[ "${comparison}" != "true" || "${benchmark_tool}" != "ethcallchaos" ]] || fail "reference_client comparison is supported for flood and jsonbench only."
          case "${dottrace}" in
            true|sampling) dottrace_mode="sampling" ;;
            tracing|timeline) dottrace_mode="${dottrace}" ;;
            false|"") dottrace_mode="" ;;
            *) fail "dottrace must be false, sampling, tracing, or timeline (got '${dottrace}')." ;;
          esac
          dottrace="$([[ -n "${dottrace_mode}" ]] && echo true || echo false)"
          [[ "${dottrace}" != "true" || "${client}" == "nethermind" ]] || fail "dottrace requires client=nethermind."
          [[ -z "${snapshot_block}" || "${snapshot_block}" =~ ^[0-9]+$ ]] || fail "snapshot_block must be a block number tag, got '${snapshot_block}'."

          branch="${branch#refs/heads/}"
          [[ -n "${branch}" ]] || fail "Failed to resolve branch."
          clean_branch="$(echo "${branch}" | sed 's/[^a-zA-Z0-9._-]/-/g')"

          default_client_image() {
            case "$1" in
              geth) echo "ethereum/client-go:stable" ;;
              reth) echo "ghcr.io/paradigmxyz/reth:latest" ;;
              nethermind) echo "nethermindeth/nethermind:master" ;;
            esac
          }
          if [[ -n "${docker_image}" ]]; then
            image_mode="provided"; image_ref="${docker_image}"
          elif [[ "${client}" != "nethermind" ]]; then
            image_mode="provided"; image_ref="$(default_client_image "${client}")"
          elif [[ "${branch}" == "master" || "${branch}" == "performance" || "${branch}" == "paprika" || "${branch}" == release/* ]]; then
            image_mode="reuse"; image_ref="nethermindeth/nethermind:${clean_branch}"
          else
            image_mode="build"; image_ref="nethermind-rpcbench:${clean_branch}"
          fi
          # A build fills the ARM box's ~19G root disk and takes the runner offline.
          if [[ "${arch}" == "arm64" && "${image_mode}" == "build" ]]; then
            echo "::error::The arm64 runner does not build images (branch '${branch}' has no prebuilt image). Build one first:"
            echo "  gh workflow run publish-docker.yml --ref ${branch} -f image-name=nethermind -f tag=<tag> -f dockerfile=Dockerfile -f build-config=release"
            echo "  gh workflow run run-rpc-benchmarks.yml --ref ${branch} -f docker_image=nethermindeth/nethermind:<tag> ..."
            exit 1
          fi

          # tool_config = preset-derived keys, then the user's JSON on top.
          first_rps="${rps%% *}"
          case "${preset}" in
            corpus-ab)
              preset_cfg="$(jq -n --arg clients "nethermind@${baseline_image} nethermind@${image_ref}" --arg rps "${rps}" \
                --argjson rounds "${rounds}" --argjson requests "${requests}" --argjson passes "${timings_passes}" \
                --arg warmup "${warmup}s" --arg duration "${duration}s" --arg corpus "${corpus}" \
                '{eth_call_corpus: true, clients: $clients, rps_list: $rps, rounds: $rounds, corpus_warmup_duration: $warmup}
                 + (if $requests > 0 then {corpus_requests: $requests} else {duration: $duration} end)
                 + (if $passes > 0 then {timings_passes: $passes} else {} end)
                 + (if $corpus != "" then {corpus_glob: $corpus} else {} end)')" ;;
            jsonbench-sweep)
              preset_cfg="$(jq -n --arg clients "nethermind@${baseline_image} nethermind@${image_ref}" --arg rps "${rps}" \
                --argjson rounds "${rounds}" --arg duration "${duration}s" '{clients: $clients, rps_list: $rps, rounds: $rounds, duration: $duration}')" ;;
            jsonbench) preset_cfg="$(jq -n --arg rps "${first_rps}" --arg duration "${duration}s" '{rps: $rps, duration: $duration}')" ;;
            flood) preset_cfg="$(jq -n --arg rates "${rps}" --argjson duration "${duration}" '{rates: $rates, duration: $duration}')" ;;
            ethcallchaos) preset_cfg="$(jq -n --argjson rate "${first_rps}" --argjson duration "${duration}" '{rate: $rate, duration: $duration}')" ;;
          esac
          [[ -n "${user_tool_config}" ]] || user_tool_config="{}"
          echo "${user_tool_config}" | jq -e 'type == "object"' >/dev/null 2>&1 || fail "tool_config must be a JSON object: ${user_tool_config}"
          tool_config="$(jq -c -n --argjson a "${preset_cfg}" --argjson b "${user_tool_config}" '$a * $b')"
          corpus_raw="$(echo "${tool_config}" | jq -r 'if has("eth_call_corpus") then (.eth_call_corpus|type) else "absent" end')"
          case "${corpus_raw}" in absent|boolean) ;; *) fail "eth_call_corpus must be a JSON boolean, got ${corpus_raw}." ;; esac
          eth_call_corpus="$(echo "${tool_config}" | jq -r 'if .eth_call_corpus == true then "true" else "false" end')"
          if [[ "${eth_call_corpus}" == "true" ]]; then
            case "${benchmark_tool}" in jsonbench|jsonbench-sweep) ;; *) fail "eth_call_corpus requires benchmark_tool=jsonbench or jsonbench-sweep." ;; esac
            [[ "${comparison}" != "true" ]] || fail "eth_call_corpus is benchmark-only; leave reference_client=none."
          fi
          [[ -n "${node_config}" ]] || node_config="{}"
          echo "${node_config}" | jq -e . >/dev/null 2>&1 || fail "node_config is not valid JSON: ${node_config}"
          nc() { echo "${node_config}" | jq -r "$1 // empty"; }

          DEFAULT_SNAPSHOT_BLOCK="25490000"
          if [[ -z "${snapshot_block}" ]] && { [[ "${comparison}" == "true" || "${sweep}" == "true" ]] || [[ "${client}" != "nethermind" ]]; }; then
            snapshot_block="${DEFAULT_SNAPSHOT_BLOCK}"
          fi
          snapshot_path() {
            if [[ -n "${snapshot_block}" ]]; then
              if [[ "$1" == "nethermind" ]]; then
                [[ "${state_layout}" == "flat" ]] && echo "${snapshot_root}/nethermind-flat-${snapshot_block}" || echo "${snapshot_root}/nethermind-${snapshot_block}"
              else
                echo "${snapshot_root}/$1-${snapshot_block}"
              fi
            else
              [[ "${state_layout}" == "flat" ]] && echo "${snapshot_root}/nethermind-flat-snapshot" || echo "${snapshot_root}/nethermind-snapshot"
            fi
          }
          client_layout_flags() { [[ "$1" == "nethermind" && "${state_layout}" == "flat" ]] && echo "--FlatDb.Enabled=true" || true; }
          layout_flags="$(client_layout_flags "${client}")"
          ref_layout_flags=""; [[ "${comparison}" == "true" ]] && ref_layout_flags="$(client_layout_flags "${reference_client}")"

          db_source="$(nc '.db_source')"; [[ -n "${db_source}" ]] || db_source="$(snapshot_path "${client}")"
          ref_db_source=""; ref_additional_flags=""
          if [[ "${comparison}" == "true" ]]; then
            ref_db_source="$(nc '.reference_db_source')"; [[ -n "${ref_db_source}" ]] || ref_db_source="$(snapshot_path "${reference_client}")"
            ref_additional_flags="$(nc '.reference_flags')"
          fi
          # reth defaults to direct (overlay copy-up of its mdbx.dat costs ~200s); NM/geth snapshots are expb-shared and stay pristine.
          db_isolation="$(nc '.db_isolation')"; [[ -n "${db_isolation}" ]] || db_isolation="$([[ "${client}" == "reth" ]] && echo direct || echo overlay)"
          ref_db_isolation="$(nc '.reference_db_isolation')"; [[ -n "${ref_db_isolation}" ]] || ref_db_isolation="$([[ "${reference_client}" == "reth" ]] && echo direct || echo overlay)"
          for iso in "${db_isolation}" "${ref_db_isolation}"; do
            case "${iso}" in overlay|copy|readonly-bind|direct) ;; *) fail "db_isolation must be overlay | copy | readonly-bind | direct, got '${iso}'." ;; esac
          done
          if [[ "${comparison}" == "true" && "${client}" == "${reference_client}" && "${db_source}" == "${ref_db_source}" ]] \
             && { [[ "${db_isolation}" == "direct" ]] || [[ "${ref_db_isolation}" == "direct" ]]; }; then
            fail "Two concurrent read-write mounts of one 'direct' snapshot corrupt the DB — use a sweep for same-client comparison."
          fi
          scratch_root="$(nc '.scratch_root')"; [[ -n "${scratch_root}" ]] || scratch_root="${bench_data_dir}/rpc-bench-scratch"
          network="$(nc '.network')"; [[ -n "${network}" ]] || network="mainnet"
          jsonrpc_modules="$(nc '.jsonrpc_modules')"; [[ -n "${jsonrpc_modules}" ]] || jsonrpc_modules="Eth,Subscribe,Trace,TxPool,Web3,Proof,Net,Parity,Health,Rpc,Debug"
          [[ "${eth_call_corpus}" != "true" ]] || jsonrpc_modules="Eth"
          health_min="$(nc '.health_timeout_minutes')"; [[ -n "${health_min}" ]] || health_min="30"
          [[ "${health_min}" =~ ^[0-9]+$ && "${health_min}" -ge 1 ]] || fail "node_config.health_timeout_minutes must be a positive integer, got '${health_min}'."
          health_timeout=$(( health_min * 60 ))
          node_cpuset="$(nc '.cpuset')"
          node_memory="$(nc '.memory')"
          cpu_max_freq_khz="$(nc '.cpu_max_freq_khz')"; [[ -n "${cpu_max_freq_khz}" ]] || cpu_max_freq_khz="${default_freq}"
          [[ "${cpu_max_freq_khz}" =~ ^[0-9]*$ ]] || fail "node_config.cpu_max_freq_khz must be an integer (kHz), got '${cpu_max_freq_khz}'."
          [[ "${cpu_max_freq_khz}" != "0" ]] || cpu_max_freq_khz=""

          # These paths reach root-privileged mount/rm on the runner.
          validate_runner_path() {
            [[ "$2" =~ ^/[A-Za-z0-9._/-]+$ && "$2" != *..* ]] || fail "$1 '$2' must be an absolute path of [A-Za-z0-9._/-] without '..'."
            local trimmed="${2#/}"; trimmed="${trimmed%/}"
            [[ -n "${trimmed}" && "${trimmed}" == */* ]] || fail "$1 '$2' is too shallow (need at least two path components)."
          }
          validate_runner_path "node_config.db_source" "${db_source}"
          validate_runner_path "node_config.scratch_root" "${scratch_root}"
          [[ "${db_source}/" != "${scratch_root}"/* && "${scratch_root}/" != "${db_source}"/* ]] || fail "db_source and scratch_root must be disjoint."
          if [[ -n "${ref_db_source}" ]]; then
            validate_runner_path "node_config.reference_db_source" "${ref_db_source}"
            [[ "${ref_db_source}/" != "${scratch_root}"/* && "${scratch_root}/" != "${ref_db_source}"/* ]] || fail "reference_db_source and scratch_root must be disjoint."
          fi
          ref_image_ref=""
          if [[ "${comparison}" == "true" ]]; then
            ref_image_ref="$(nc '.reference_image')"; [[ -n "${ref_image_ref}" ]] || ref_image_ref="$(default_client_image "${reference_client}")"
          fi

          {
            echo "should_run=true"
            echo "branch=${branch}"
            echo "clean_branch=${clean_branch}"
            echo "benchmark_tool=${benchmark_tool}"
            echo "client=${client}"
            echo "reference_client=${reference_client}"
            echo "comparison=${comparison}"
            echo "dottrace=${dottrace}"
            echo "dottrace_mode=${dottrace_mode}"
            echo "image_mode=${image_mode}"
            echo "image_ref=${image_ref}"
            echo "ref_image_ref=${ref_image_ref}"
            echo "db_source=${db_source}"
            echo "ref_db_source=${ref_db_source}"
            echo "db_isolation=${db_isolation}"
            echo "ref_db_isolation=${ref_db_isolation}"
            echo "scratch_root=${scratch_root}"
            echo "runner_label=${runner_label}"
            echo "corpus_dir=${bench_data_dir}/rpc-bench"
            echo "snapshot_root=${snapshot_root}"
            echo "network=${network}"
            echo "jsonrpc_modules=${jsonrpc_modules}"
            echo "layout_flags=${layout_flags}"
            echo "ref_layout_flags=${ref_layout_flags}"
            echo "additional_flags=${additional_flags}"
            echo "ref_additional_flags=${ref_additional_flags}"
            echo "health_timeout=${health_timeout}"
            echo "node_cpuset=${node_cpuset}"
            echo "node_memory=${node_memory}"
            echo "cpu_max_freq_khz=${cpu_max_freq_khz}"
            echo "eth_call_corpus=${eth_call_corpus}"
            echo "tool_config<<TOOLCFG"
            echo "${tool_config}"
            echo "TOOLCFG"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved: preset=${preset} tool=${benchmark_tool} client=${client} reference=${reference_client} branch=${branch} layout=${state_layout} snapshot_block=${snapshot_block:-<expb default>} image_mode=${image_mode} image=${image_ref} dottrace=${dottrace} cpu_max_freq_khz=${cpu_max_freq_khz:-none}"
          echo "tool_config: ${tool_config}"

  benchmark:
    needs: [resolve]
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: [self-hosted, "${{ needs.resolve.outputs.runner_label }}"]
    timeout-minutes: 800
    env:
      DIAG_DIR: ${{ needs.resolve.outputs.scratch_root }}/diag
      CONTAINER_NAME: rpcbench-primary-${{ github.run_id }}
      REF_CONTAINER_NAME: rpcbench-reference-${{ github.run_id }}
      ECC_CONTAINER_NAME: ethcallchaos-bench-${{ github.run_id }}
      JB_CONTAINER_NAME: jsonbench-bench-${{ github.run_id }}
      RPC_PORT: "8545"
      REF_RPC_PORT: "8546"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Ensure Docker is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            run_as_root() { if [[ "${EUID}" -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
            run_as_root apt-get update
            run_as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
            run_as_root systemctl start docker || run_as_root service docker start
          fi
          docker version

      - name: Set up run paths
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/rpcbench-out" >> "$GITHUB_ENV"
          echo "STATE_DIR=$RUNNER_TEMP/rpcbench-state" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rpcbench-out" "$RUNNER_TEMP/rpcbench-state"
          chmod +x scripts/rpc-bench/*.sh

      - name: Print resolved configuration
        run: |
          echo "Runner:      ${{ needs.resolve.outputs.runner_label }}"
          echo "Tool:        ${{ needs.resolve.outputs.benchmark_tool }}"
          echo "Client:      ${{ needs.resolve.outputs.client }}"
          echo "Reference:   ${{ needs.resolve.outputs.reference_client }} (comparison: ${{ needs.resolve.outputs.comparison }})"
          echo "Branch:      ${{ needs.resolve.outputs.branch }}"
          echo "Image mode:  ${{ needs.resolve.outputs.image_mode }}"
          echo "Image ref:   ${{ needs.resolve.outputs.image_ref }}"
          echo "Ref image:   ${{ needs.resolve.outputs.ref_image_ref }}"
          echo "dotTrace:    ${{ needs.resolve.outputs.dottrace }}"
          echo "DB source:   ${{ needs.resolve.outputs.db_source }}"
          echo "Ref DB:      ${{ needs.resolve.outputs.ref_db_source }}"
          echo "Isolation:   ${{ needs.resolve.outputs.db_isolation }}"
          echo "Scratch:     ${{ needs.resolve.outputs.scratch_root }}"
          echo "Corpus dir:  ${{ needs.resolve.outputs.corpus_dir }}"
          echo "Layout flags: ${{ needs.resolve.outputs.layout_flags }}"
          echo "CPU cap kHz: ${{ needs.resolve.outputs.cpu_max_freq_khz }}"
          echo "tool_config: ${{ needs.resolve.outputs.tool_config }}"

      - name: Reclaim root disk before pulling
        if: needs.resolve.outputs.runner_label == 'reproducible-benchmarks-arm'
        shell: bash
        env:
          KEEP_IMAGES: |
            ${{ needs.resolve.outputs.image_ref }}
            ${{ needs.resolve.outputs.ref_image_ref }}
          KEEP_TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
        # The ARM box has a ~19G root disk; running it out kills the docker daemon and the runner with it. Docker uses the
        # containerd image store there, so `image prune` frees nothing — only an explicit `docker rmi` does.
        run: |
          set -uo pipefail
          MIN_FREE_GB=6
          avail_gb() { df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          report() { df -h /; du -xsh /var/lib/containerd /var/lib/docker 2>/dev/null || true; }
          echo "== before =="; report
          docker container prune -f || true
          docker network prune -f || true
          docker builder prune -af || true
          docker image prune -f || true
          docker volume ls -q | grep -E '^expb-' | xargs -r docker volume rm -f || true
          find /root/actions-runner/_diag -type f -name '*.log' -mtime +1 -delete 2>/dev/null || true
          rm -rf /root/actions-runner/_work/_temp/* 2>/dev/null || true
          apt-get clean 2>/dev/null || true
          journalctl --vacuum-size=200M 2>/dev/null || true
          if (( $(avail_gb) < MIN_FREE_GB )); then
            sweep_keep="$(printf '%s' "${KEEP_TOOL_CONFIG:-}" | jq -r '.clients // empty' 2>/dev/null | tr ' ' '\n' | sed 's/.*@//' | grep -v '^$' || true)"
            keep_re="$(printf '%s\n%s\n' "${KEEP_IMAGES}" "${sweep_keep}" | tr -d ' ' | grep -v '^$' | sort -u | paste -sd'|' -)"
            echo "Reclaiming stale images (keeping: ${keep_re:-none})"
            while IFS= read -r img; do
              (( $(avail_gb) >= MIN_FREE_GB )) && break
              [[ -z "${img}" || "${img}" == *'<none>'* ]] && continue
              [[ -n "${keep_re}" ]] && [[ "${img}" =~ ^(${keep_re})$ ]] && continue
              [[ -n "$(docker ps -aq --filter "ancestor=${img}" 2>/dev/null)" ]] && continue
              docker rmi "${img}" >/dev/null 2>&1 && echo "  dropped ${img}"
            done < <(docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' | sort | cut -f2-)
          fi
          free="$(avail_gb)"
          echo "== after =="; report
          echo "Free after reclaim: ${free}G (need ${MIN_FREE_GB}G)"
          if (( free < MIN_FREE_GB )); then
            echo "::error::Only ${free}G free on / after reclaim — refusing to start rather than risk killing the runner daemon."
            du -xh --max-depth=2 /var /usr /root 2>/dev/null | sort -rh | head -15 || true
            exit 1
          fi

      - name: Prepare Docker image
        env:
          IMAGE_MODE: ${{ needs.resolve.outputs.image_mode }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          COMMIT_HASH: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${IMAGE_MODE}" in
            provided) docker pull "${IMAGE_REF}" || echo "Pull failed — assuming ${IMAGE_REF} is a local image." ;;
            reuse) docker pull "${IMAGE_REF}" ;;
            build)
              docker build . -f Dockerfile -t "${IMAGE_REF}" --build-arg BUILD_CONFIG=release --build-arg CI=true \
                --build-arg COMMIT_HASH="${COMMIT_HASH}" --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
              ;;
            *) echo "Unknown image mode '${IMAGE_MODE}'."; exit 1 ;;
          esac

      - name: Pull reference client image
        if: needs.resolve.outputs.comparison == 'true'
        env:
          REF_IMAGE: ${{ needs.resolve.outputs.ref_image_ref }}
        run: docker pull "${REF_IMAGE}" || echo "Pull failed — assuming ${REF_IMAGE} is a local image."

      - name: Stabilize CPU frequency
        env:
          CPU_MAX_FREQ_KHZ: ${{ needs.resolve.outputs.cpu_max_freq_khz }}
        run: ./scripts/rpc-bench/cpu-stabilize.sh apply

      - name: Start node
        if: needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          INSTANCE: primary
          NODE_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          DB_SOURCE: ${{ needs.resolve.outputs.db_source }}
          DB_ISOLATION: ${{ needs.resolve.outputs.db_isolation }}
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          NETWORK: ${{ needs.resolve.outputs.network }}
          JSONRPC_MODULES: ${{ needs.resolve.outputs.jsonrpc_modules }}
          LAYOUT_FLAGS: ${{ needs.resolve.outputs.layout_flags }}
          ADDITIONAL_FLAGS: ${{ needs.resolve.outputs.additional_flags }}
          HEALTH_TIMEOUT: ${{ needs.resolve.outputs.health_timeout }}
          RPC_GAS_CAP: ${{ needs.resolve.outputs.eth_call_corpus == 'true' && '1000000000000' || '' }}
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          DOTTRACE_MODE: ${{ needs.resolve.outputs.dottrace_mode }}
          NODE_CPUSET: ${{ needs.resolve.outputs.node_cpuset }}
          NODE_MEMORY: ${{ needs.resolve.outputs.node_memory }}
        run: ./scripts/rpc-bench/start-node.sh

      - name: Start reference node
        if: needs.resolve.outputs.comparison == 'true'
        env:
          CLIENT: ${{ needs.resolve.outputs.reference_client }}
          INSTANCE: reference
          NODE_IMAGE: ${{ needs.resolve.outputs.ref_image_ref }}
          CONTAINER_NAME: ${{ env.REF_CONTAINER_NAME }}
          RPC_PORT: ${{ env.REF_RPC_PORT }}
          DB_SOURCE: ${{ needs.resolve.outputs.ref_db_source }}
          DB_ISOLATION: ${{ needs.resolve.outputs.ref_db_isolation }}
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          NETWORK: ${{ needs.resolve.outputs.network }}
          JSONRPC_MODULES: ${{ needs.resolve.outputs.jsonrpc_modules }}
          LAYOUT_FLAGS: ${{ needs.resolve.outputs.ref_layout_flags }}
          ADDITIONAL_FLAGS: ${{ needs.resolve.outputs.ref_additional_flags }}
          HEALTH_TIMEOUT: ${{ needs.resolve.outputs.health_timeout }}
          DOTTRACE: "false"
          NODE_MEMORY: ${{ needs.resolve.outputs.node_memory }}
        run: ./scripts/rpc-bench/start-node.sh

      - name: Run flood benchmark
        id: run-flood
        if: needs.resolve.outputs.benchmark_tool == 'flood'
        continue-on-error: true
        env:
          RPC_URL: http://localhost:8545
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          COMPARISON: ${{ needs.resolve.outputs.comparison }}
          REFERENCE_CLIENT: ${{ needs.resolve.outputs.reference_client }}
        shell: bash
        run: |
          set -euo pipefail
          get() { echo "${TOOL_CONFIG}" | jq -r "$1 // empty"; }
          export RATES="$(get '.rates')";         [[ -n "${RATES}" ]] || export RATES="10 100 500"
          export DURATION="$(get '.duration')";   [[ -n "${DURATION}" ]] || export DURATION="30"
          export DEEP_CHECK="$(get '.deep_check')"; [[ -n "${DEEP_CHECK}" ]] || export DEEP_CHECK="false"
          export TESTS="$(get '.tests')"
          export LABEL="$(get '.label')";         [[ -n "${LABEL}" ]] || export LABEL="${CLIENT}"
          export EXTRA_ARGS="$(get '.extra_args')"
          if [[ "${COMPARISON}" == "true" ]]; then
            export REFERENCE_RPC_URL="http://localhost:${REF_RPC_PORT}"
            export REFERENCE_LABEL="${REFERENCE_CLIENT}"
          fi
          ./scripts/rpc-bench/run-flood.sh

      - name: Run json-bench benchmark
        id: run-jsonbench
        if: needs.resolve.outputs.benchmark_tool == 'jsonbench'
        continue-on-error: true
        env:
          RPC_URL: http://localhost:8545
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          JB_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
          RESOLVED_CORPUS_DIR: ${{ needs.resolve.outputs.corpus_dir }}
          CLIENT_TYPE: ${{ needs.resolve.outputs.client }}
          COMPARISON: ${{ needs.resolve.outputs.comparison }}
          REFERENCE_CLIENT: ${{ needs.resolve.outputs.reference_client }}
        shell: bash
        run: |
          set -euo pipefail
          get() { echo "${TOOL_CONFIG}" | jq -r "$1 // empty"; }
          getb() { echo "${TOOL_CONFIG}" | jq -r "$1 | if . == null then \"\" else tostring end"; }
          # Only override what is set; the script defaults (incl. the json-bench pin) apply otherwise.
          for pair in ref:JB_REF compare_config:JB_COMPARE_CONFIG rps:JB_RPS duration:JB_DURATION vus:JB_VUS seed:JB_SEED \
                      concurrency:JB_CONCURRENCY timeout:JB_TIMEOUT max_corpus_records:RPC_BENCH_MAX_CORPUS_RECORDS; do
            v="$(get ".${pair%%:*}")"; [[ -z "${v}" ]] || export "${pair#*:}=${v}"
          done
          for pair in html_report:JB_HTML_REPORT max_fail_rate_pct:JB_MAX_FAIL_RATE_PCT; do
            v="$(getb ".${pair%%:*}")"; [[ -z "${v}" ]] || export "${pair#*:}=${v}"
          done
          export JB_MODE="$(get '.mode')"
          export JB_BENCHMARK_CONFIG="$(get '.benchmark_config')"
          export JB_VALIDATE_SCHEMA="$(getb '.validate_schema')"
          export JB_DEEP_CHECK="$(getb '.deep_check')"
          export JB_FAIL_ON_DIFF="$(getb '.fail_on_diff')"
          export JB_EXTRA_ARGS="$(get '.extra_args')"
          jb_corpus="$(get '.corpus_file')"; [[ -n "${jb_corpus}" ]] || jb_corpus="${RESOLVED_CORPUS_DIR}/eth-call-corpus.jsonl.gz"
          export JB_ETH_CALL_CORPUS_FILE="${jb_corpus}"
          if [[ "${COMPARISON}" == "true" ]]; then
            export REFERENCE_RPC_URL="http://localhost:${REF_RPC_PORT}"
            export REFERENCE_CLIENT_TYPE="${REFERENCE_CLIENT}"
          fi
          ./scripts/rpc-bench/run-jsonbench.sh

      - name: Run EthCallChaos benchmark
        id: run-ecc
        if: needs.resolve.outputs.benchmark_tool == 'ethcallchaos'
        continue-on-error: true
        env:
          RPC_URL: http://localhost:8545
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
        shell: bash
        run: |
          set -euo pipefail
          get() { echo "${TOOL_CONFIG}" | jq -r "$1 // empty"; }
          for pair in ref:ECC_REF corpus_url:ECC_CORPUS_URL rate:ECC_RATE parallel:ECC_PARALLEL duration:ECC_DURATION \
                      leaderboard_top:ECC_LEADERBOARD_TOP api_port:ECC_API_PORT min_mean_ms:ECC_MIN_MEAN_MS max_cv:ECC_MAX_CV; do
            v="$(get ".${pair%%:*}")"; [[ -z "${v}" ]] || export "${pair#*:}=${v}"
          done
          export ECC_CORPUS_DB="$(get '.corpus_db')"
          ./scripts/rpc-bench/run-ethcallchaos.sh

      - name: Stop reference node and verify DB integrity
        if: always() && needs.resolve.outputs.comparison == 'true'
        env:
          STOP_GRACE: "180"
        run: NODE_ENV_FILE="${STATE_DIR}/node-reference.env" ./scripts/rpc-bench/stop-node.sh

      - name: Run RPC sweep
        id: run-sweep
        if: needs.resolve.outputs.benchmark_tool == 'jsonbench-sweep'
        env:
          NM_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          JSONRPC_MODULES: ${{ needs.resolve.outputs.jsonrpc_modules }}
          HEALTH_TIMEOUT: ${{ needs.resolve.outputs.health_timeout }}
          NETWORK: ${{ needs.resolve.outputs.network }}
          TOOL_CONFIG: ${{ needs.resolve.outputs.tool_config }}
          JB_ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
          CORPUS_DIR: ${{ needs.resolve.outputs.corpus_dir }}
          SNAPSHOT_ROOT: ${{ needs.resolve.outputs.snapshot_root }}
        shell: bash
        run: |
          set -euo pipefail
          get() { echo "${TOOL_CONFIG}" | jq -r "$1 // empty"; }
          getb() { echo "${TOOL_CONFIG}" | jq -r "$1 | if . == null then \"\" else tostring end"; }
          for pair in corpus_dir:CORPUS_DIR corpus_glob:CORPUS_GLOB clients:CLIENTS rounds:ROUNDS seed:JB_SEED snapshot_block:SNAPSHOT_BLOCK \
                      state_layout:STATE_LAYOUT benchmark_config:JB_BENCHMARK_CONFIG ref:JB_REF duration:JB_DURATION iso_configs:ISO_CONFIGS \
                      iso_duration:ISO_DURATION db_isolation_all:DB_ISOLATION_ALL corpus_requests:CORPUS_REQUESTS corpus_passes:CORPUS_PASSES \
                      corpus_warmup_duration:CORPUS_WARMUP_DURATION corpus_warmup_rps:CORPUS_WARMUP_RPS corpus_warmup_rps_max:CORPUS_WARMUP_RPS_MAX max_corpus_records:RPC_BENCH_MAX_CORPUS_RECORDS \
                      timings_passes:CORPUS_TIMINGS_PASSES timings_rps:CORPUS_TIMINGS_RPS timings_concurrency:CORPUS_TIMINGS_CONCURRENCY \
                      max_divergence_indexes:RPC_BENCH_MAX_DIVERGENCE_INDEXES node_env_vars:NODE_ENV_VARS; do
            v="$(get ".${pair%%:*}")"; [[ -z "${v}" ]] || export "${pair#*:}=${v}"
          done
          for pair in db_isolation_allow_snapshot_mutation:DB_ISOLATION_ALLOW_SNAPSHOT_MUTATION resource_sampling:CORPUS_RESOURCE_SAMPLING parity_diffs:CORPUS_PARITY_DIFFS \
                      vus:JB_VUS max_fail_rate_pct:JB_MAX_FAIL_RATE_PCT; do
            v="$(getb ".${pair%%:*}")"; [[ -z "${v}" ]] || export "${pair#*:}=${v}"
          done
          # An absent rps_list means the default; an explicitly empty one means no k6 cells.
          if [[ "$(echo "${TOOL_CONFIG}" | jq -r 'has("rps_list")')" == "true" ]]; then
            export RPS_LIST="$(echo "${TOOL_CONFIG}" | jq -r '.rps_list // ""')"
          else
            export RPS_LIST="100 250 500"
          fi
          export CLIENTS="${CLIENTS:-nethermind}"
          export SNAPSHOT_BLOCK="${SNAPSHOT_BLOCK:-25490000}"
          export JB_BENCHMARK_CONFIG="${JB_BENCHMARK_CONFIG:-config/benchmark/ethcallchaos-percategory-validated.yaml}"
          export STATE_ROOT="${STATE_DIR}/sweep"
          ./scripts/rpc-bench/run-rpc-sweep.sh

      - name: Stop node and verify DB integrity
        if: always() && needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        env:
          STOP_GRACE: "180"
        run: ./scripts/rpc-bench/stop-node.sh

      - name: Restore CPU frequency
        if: always()
        run: ./scripts/rpc-bench/cpu-stabilize.sh restore || true

      - name: Collect dotTrace snapshots
        if: always() && needs.resolve.outputs.dottrace == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/dottrace-rpcbench.zip
        run: |
          set -euo pipefail
          if [[ -d "${DIAG_DIR}/dottrace" ]] && [[ -n "$(find "${DIAG_DIR}/dottrace" -type f 2>/dev/null)" ]]; then
            ( cd "${DIAG_DIR}" && zip -9r "${ARCHIVE}" dottrace )
            echo "Archived dotTrace snapshots to ${ARCHIVE}"
          else
            echo "No dotTrace snapshots found under ${DIAG_DIR}/dottrace."
          fi

      - name: Scan node logs for errors
        id: scan
        if: always() && needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          DOTTRACE: ${{ needs.resolve.outputs.dottrace }}
          ETH_CALL_CORPUS: ${{ needs.resolve.outputs.eth_call_corpus }}
        shell: bash
        run: |
          set -euo pipefail
          node_log="${STATE_DIR}/node.log"
          exception_found=false; invalid_block_found=false; clean_shutdown=true
          if [[ -f "${node_log}" ]]; then
            clean="${RUNNER_TEMP}/node.clean.log"
            sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "${node_log}" > "${clean}"
            show=true; [[ "${ETH_CALL_CORPUS}" == "true" ]] && show=false   # corpus runs print counts only
            exc_matches="${RUNNER_TEMP}/node.exceptions.log"
            grep -in "Exception" "${clean}" | grep -vF 'Incorrect JSON RPC parameters' > "${exc_matches}" || true
            if [[ -s "${exc_matches}" ]]; then
              exception_found=true
              echo "::warning::Exception lines detected in node log ($(wc -l < "${exc_matches}" | tr -d ' ') line(s))"
              [[ "${show}" == "false" ]] || head -n 40 "${exc_matches}" || true
            fi
            if grep -qEi "invalid[[:space:]_-]*block" "${clean}"; then
              invalid_block_found=true
              echo "::warning::Invalid block lines detected in node log"
              [[ "${show}" == "false" ]] || { grep -Ein "invalid[[:space:]_-]*block" "${clean}" | head -n 40 || true; }
            fi
            for pattern in "Unhandled" "Fatal" "ERROR"; do
              if grep -qi "${pattern}" "${clean}"; then
                echo "::warning::Severe log pattern '${pattern}' detected in node log ($(grep -ci "${pattern}" "${clean}") line(s))"
                [[ "${show}" == "false" ]] || { grep -in "${pattern}" "${clean}" | head -n 10 || true; }
              fi
            done
            # Nethermind-specific marker; dotTrace's Ctrl+C flow skips it.
            if [[ "${CLIENT}" == "nethermind" && "${DOTTRACE}" != "true" ]] && ! grep -q "Nethermind is shut down" "${clean}"; then
              clean_shutdown=false
              echo "::warning::'Nethermind is shut down' marker not found — the node did not shut down cleanly."
            fi
          else
            echo "No node log captured."
          fi
          echo "exception_found=${exception_found}" >> "${GITHUB_OUTPUT}"
          echo "invalid_block_found=${invalid_block_found}" >> "${GITHUB_OUTPUT}"
          echo "clean_shutdown=${clean_shutdown}" >> "${GITHUB_OUTPUT}"
          ref_log="${STATE_DIR}/node-reference.log"
          if [[ -f "${ref_log}" ]]; then
            ref_clean="${RUNNER_TEMP}/node-reference.clean.log"
            sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "${ref_log}" > "${ref_clean}"
            for pattern in "Exception" "Unhandled" "Fatal" "ERROR"; do
              if grep -qi "${pattern}" "${ref_clean}"; then
                echo "::warning::'${pattern}' lines detected in the REFERENCE node log (first 10):"
                grep -in "${pattern}" "${ref_clean}" | head -n 10 || true
              fi
            done
          fi

      - name: Publish step summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# RPC Benchmark — ${{ needs.resolve.outputs.benchmark_tool }}"
            echo ""
            echo "Client: \`${{ needs.resolve.outputs.client }}\` | branch: \`${{ needs.resolve.outputs.branch }}\` | image: \`${{ needs.resolve.outputs.image_ref }}\` | dotTrace: \`${{ needs.resolve.outputs.dottrace }}\`"
            if [[ "${{ needs.resolve.outputs.comparison }}" == "true" ]]; then
              echo ""
              echo "Reference: \`${{ needs.resolve.outputs.reference_client }}\` | image: \`${{ needs.resolve.outputs.ref_image_ref }}\`"
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          shopt -s nullglob
          for md in "${OUT_DIR}"/*-summary.md; do
            cat "${md}" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload benchmark results
        if: always() && needs.resolve.outputs.eth_call_corpus != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rpcbench-results-${{ needs.resolve.outputs.benchmark_tool }}
          path: |
            ${{ runner.temp }}/rpcbench-out/
            ${{ runner.temp }}/rpcbench-state/node.log
            ${{ runner.temp }}/rpcbench-state/node-reference.log
            ${{ runner.temp }}/rpcbench-state/db-baseline.txt
            ${{ runner.temp }}/rpcbench-state/db-final.txt
            ${{ runner.temp }}/rpcbench-state/db-baseline-reference.txt
            ${{ runner.temp }}/rpcbench-state/db-final-reference.txt
            ${{ runner.temp }}/rpcbench-state/sweep/
          retention-days: 30
          if-no-files-found: warn

      - name: Stage private corpus results
        id: stage-corpus-results
        if: always() && needs.resolve.outputs.eth_call_corpus == 'true'
        shell: bash
        run: python3 scripts/rpc-bench/corpus_results.py stage "${OUT_DIR}" "${RUNNER_TEMP}/rpcbench-corpus-results"

      - name: Upload private corpus results
        if: always() && needs.resolve.outputs.eth_call_corpus == 'true' && steps.stage-corpus-results.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rpcbench-results-${{ needs.resolve.outputs.benchmark_tool }}
          path: ${{ runner.temp }}/rpcbench-corpus-results/
          retention-days: 30
          if-no-files-found: error

      - name: Upload dotTrace snapshot
        if: always() && needs.resolve.outputs.dottrace == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dottrace-rpcbench
          path: ${{ runner.temp }}/dottrace-rpcbench.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Defensive cleanup
        if: always()
        shell: bash
        env:
          SCRATCH_ROOT: ${{ needs.resolve.outputs.scratch_root }}
          DB_SOURCE: ${{ needs.resolve.outputs.db_source }}
        run: ./scripts/rpc-bench/cleanup.sh || true

      - name: Reclaim root disk after the run
        if: always() && needs.resolve.outputs.runner_label == 'reproducible-benchmarks-arm'
        shell: bash
        run: |
          set -uo pipefail
          docker container prune -f || true
          docker network prune -f || true
          docker builder prune -af || true
          docker image prune -f || true
          docker volume ls -q | grep -E '^expb-' | xargs -r docker volume rm -f || true
          rm -rf /root/actions-runner/_work/_temp/* 2>/dev/null || true
          df -h / || true
          docker system df || true

      - name: Enforce quality gates
        if: always() && needs.resolve.outputs.benchmark_tool != 'jsonbench-sweep'
        shell: bash
        run: |
          set -euo pipefail
          # Tool steps use continue-on-error so teardown and the integrity check always run; their outcome is enforced here.
          if [[ "${{ steps.run-flood.outcome }}" == "failure" || "${{ steps.run-ecc.outcome }}" == "failure" || "${{ steps.run-jsonbench.outcome }}" == "failure" ]]; then
            echo "The benchmark tool step failed — failing the job."; exit 1
          fi
          [[ "${{ steps.scan.outputs.exception_found }}" != "true" ]] || { echo "Exceptions detected in node log — failing."; exit 1; }
          [[ "${{ steps.scan.outputs.invalid_block_found }}" != "true" ]] || { echo "Invalid block lines detected in node log — failing."; exit 1; }
          [[ "${{ steps.scan.outputs.clean_shutdown }}" != "false" ]] || { echo "Node did not shut down cleanly — failing."; exit 1; }

  # dotTrace XML reports need the Windows-only Reporter.exe; timeline snapshots cannot be converted.
  generate-dottrace-reports:
    needs: [resolve, benchmark]
    if: always() && needs.resolve.outputs.dottrace == 'true' && needs.resolve.outputs.dottrace_mode != 'timeline' && needs.benchmark.result != 'skipped' && needs.benchmark.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download snapshot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dottrace-*
          path: snapshots/
          merge-multiple: true

      - name: Install dotTrace Reporter
        shell: pwsh
        run: |
          $url = 'https://www.nuget.org/api/v2/package/JetBrains.dotTrace.CommandLineTools.windows-x64/2026.1.0.1'
          Invoke-WebRequest -Uri $url -OutFile dottrace-clt.zip
          Expand-Archive -Path dottrace-clt.zip -DestinationPath dottrace-clt
          $reporter = Get-ChildItem -Path dottrace-clt -Recurse -Filter 'Reporter.exe' | Select-Object -First 1
          if (-not $reporter) { Write-Error "Reporter.exe not found in package"; exit 1 }
          echo "REPORTER=$($reporter.FullName)" >> $env:GITHUB_ENV

      - name: Generate XML reports
        shell: pwsh
        run: |
          if (-not (Test-Path snapshots)) { Write-Host "No dotTrace snapshot artifacts were downloaded — nothing to report."; exit 0 }
          New-Item -ItemType Directory -Force -Path reports, extracted | Out-Null
          $patternFile = 'pattern.xml'
          @'
          <Patterns>
            <Pattern PrintCallstacks="Full">.*</Pattern>
          </Patterns>
          '@ | Set-Content -Path $patternFile
          Get-ChildItem -Path snapshots -Filter '*.zip' | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath (Join-Path extracted $_.BaseName)
          }
          $snapshots = Get-ChildItem -Path extracted -Recurse | Where-Object { $_.Extension -eq '.dtp' }
          if ($snapshots.Count -eq 0) { Write-Host "No .dtp snapshot files found after extraction."; exit 0 }
          foreach ($dtp in $snapshots) {
            $outFile = "reports/$($dtp.BaseName)-report.xml"
            Write-Host "::group::Generating report for $($dtp.BaseName)"
            & $env:REPORTER report $dtp.FullName --pattern=$patternFile --save-to=$outFile
            if ($LASTEXITCODE -ne 0) { Write-Warning "Reporter failed for $($dtp.BaseName) with exit code $LASTEXITCODE" }
            Write-Host "::endgroup::"
          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dottrace-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  dottrace-summary:
    needs: [resolve, generate-dottrace-reports]
    if: always() && needs.resolve.outputs.dottrace == 'true' && needs.resolve.outputs.dottrace_mode != 'timeline' && needs.generate-dottrace-reports.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download dotTrace reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dottrace-reports
          path: reports/

      - name: Summarize hot spots
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/dottrace-report.sh
          shopt -s nullglob
          xmls=(reports/*.xml)
          if [[ "${#xmls[@]}" -eq 0 ]]; then
            echo "No XML reports found." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          { echo "## dotTrace hot spots (top 40 by OwnTime)"; echo ""; } >> "${GITHUB_STEP_SUMMARY}"
          for xml in "${xmls[@]}"; do
            {
              echo "<details><summary>$(basename "${xml}")</summary>"
              echo ""
              echo '```'
              ./scripts/dottrace-report.sh top "${xml}" 40 || true
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          done
