name: RPC prospective provenance inventory
run-name: RPC read-only provenance ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-rpc-native-capability
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rpc-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Read fixed inputs without node, mount, workload or CPU changes
        env:
          CHECKOUT: rpc-provenance-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B "$CHECKOUT/scripts/rpc-native/test_inventory.py"
          python3 -B "$CHECKOUT/scripts/rpc-native/inventory.py" --repository "$CHECKOUT" --out "$RUNNER_TEMP/rpc-provenance-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rpc-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rpc-provenance-result-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
