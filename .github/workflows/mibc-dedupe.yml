# Diagnostic, dispatch-only: dedupe the committed .mibc with dotnet-pgo merge.
# The committed profile contains a duplicate method record that crashes crossgen2's
# MIbcProfileParser (ArgumentException: duplicate dictionary key). Remove this
# workflow once the profile is regenerated by the collection pipeline.
name: MIBC Dedupe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dedupe:
    name: Dedupe nethermind.mibc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          cache: false

      - name: Build dotnet-pgo from source
        shell: bash
        run: |
          set -euo pipefail
          # Pin to v10.0.5 — matches the SDK/runtime in our Docker base images
          git clone --depth 1 --branch v10.0.5 \
            https://github.com/dotnet/runtime.git "${RUNNER_TEMP}/dotnet-runtime"
          cd "${RUNNER_TEMP}/dotnet-runtime"
          ./build.sh -c Release \
            --projects "$(pwd)/src/coreclr/tools/dotnet-pgo/dotnet-pgo.csproj"

          dotnet_pgo_dir=$(find "${RUNNER_TEMP}/dotnet-runtime/artifacts" -type d -name "dotnet-pgo" -path "*/bin/*" | head -1)
          if [[ -z "${dotnet_pgo_dir}" ]] || [[ ! -f "${dotnet_pgo_dir}/dotnet-pgo.dll" ]]; then
            echo "dotnet-pgo was not produced under artifacts/"
            exit 1
          fi
          echo "PGO_TOOL=${dotnet_pgo_dir}/dotnet-pgo.dll" >> "${GITHUB_ENV}"

      - name: Dedupe mibc via merge
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          mibc="src/Nethermind/Nethermind.Runner/pgo/nethermind.mibc"
          out="${RUNNER_TEMP}/nethermind.mibc"

          dotnet "${PGO_TOOL}" merge --input "${mibc}" --output "${out}" 2>&1 | tee "${RUNNER_TEMP}/merge.log"
          merge_exit=${PIPESTATUS[0]}

          if [[ "${merge_exit}" != "0" ]]; then
            echo "::error::dotnet-pgo merge failed (exit ${merge_exit})."
            # Surface the parser source so the failure can be patched precisely.
            grep -rn "ReadMIbcGroup" "${RUNNER_TEMP}/dotnet-runtime/src/coreclr/tools" -l || true
            parser=$(grep -rln "ReadMIbcGroup" "${RUNNER_TEMP}/dotnet-runtime/src/coreclr/tools" | head -1 || true)
            if [[ -n "${parser}" ]]; then
              echo "=== ${parser} (Add call sites) ==="
              grep -n "Add(" "${parser}" || true
            fi
            exit 1
          fi

          ls -l "${mibc}" "${out}"
          echo "out=${out}" >> "${GITHUB_OUTPUT}"

      - name: Validate deduped mibc
        shell: bash
        run: |
          set -uo pipefail
          out="${{ steps.merge.outputs.out }}"
          # dump may crash on CallWeights (dotnet/runtime#125935) — validation is best-effort here;
          # the authoritative gate is a full R2R publish against the deduped file.
          dotnet "${PGO_TOOL}" dump "${out}" "${RUNNER_TEMP}/deduped.txt" 2>&1 | tail -5 || true
          if [[ -s "${RUNNER_TEMP}/deduped.txt" ]]; then
            count=$(grep -c "AbstractMinimalCommitter.CommitNode" "${RUNNER_TEMP}/deduped.txt" || true)
            echo "CommitNode occurrences in deduped dump: ${count}"
          fi

      - name: Upload deduped mibc
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-mibc-deduped
          path: ${{ steps.merge.outputs.out }}
          retention-days: 7
