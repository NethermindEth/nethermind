name: Lean image tests

# The release images cross-compile the EIP-8288 Lean backend for a fixed CPU baseline. These jobs build that library exactly
# as the release does, from the amd64 build platform for both targets, then run the native startup checks and real
# verifications against it on a host of each architecture.
on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.chiseled
      - .dockerignore
      - tools/lean-ffi/**
      - src/Nethermind/Nethermind.Crypto/NativeLeanProofVerifier.cs
      - src/Nethermind/Nethermind.Crypto.LeanFfi.Test/**
      - .github/workflows/lean-image-tests.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the image's Lean backend (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the lean stage
        run: |
          mkdir -p "$RUNNER_TEMP/lean"
          docker buildx build . -f Dockerfile --platform "linux/${{ matrix.arch }}" --target lean --output type=tar,dest=- |
            tar -x -C "$RUNNER_TEMP/lean" libnethermind_lean.so

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: lean-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/lean/libnethermind_lean.so
          if-no-files-found: error

  test:
    name: Test the image's Lean backend (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NATIVE_TEST_PROJECT: Nethermind.Crypto.LeanFfi.Test
      LEANVM_NUM_THREADS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Set up Rust
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' tools/lean-ffi/rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      # BuildLeanFfi builds the fixtures and a host-native library; the image's library then replaces the latter.
      - name: Build the native tests
        run: dotnet build "src/Nethermind/$NATIVE_TEST_PROJECT/$NATIVE_TEST_PROJECT.csproj" -c release --disable-build-servers -m:1 -p:BuildLeanFfi=true

      - name: Download the image's library
        uses: actions/download-artifact@v8
        with:
          name: lean-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/lean

      - name: Replace the host-native library
        run: |
          output="src/Nethermind/artifacts/bin/$NATIVE_TEST_PROJECT/release"
          test -f "$output/libnethermind_lean.so"
          cp "$RUNNER_TEMP/lean/libnethermind_lean.so" "$output/libnethermind_lean.so"
          sha256sum "$output/libnethermind_lean.so"

      - name: Run startup checks and verifications
        run: >-
          dotnet test --project "src/Nethermind/$NATIVE_TEST_PROJECT/$NATIVE_TEST_PROJECT.csproj" -c release --no-build -p:BuildLeanFfi=true --
          --filter "FullyQualifiedName~NativeBackendStartupTests|FullyQualifiedName~NativeLeanProofVerifierTests|FullyQualifiedName~NativeBlockValidationTests"
