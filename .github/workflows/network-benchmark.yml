name: Network Benchmark

# Runs the Nethermind.Network.Benchmark benchmarks at a base and a head commit in one job on one runner,
# and writes a comparison table to the job summary. Timings are only comparable within a run.
# Base and head run in alternating rounds of separate processes, so that drift on the runner during the job
# lands on both sides instead of on whichever ran later, and the comparison pairs each round's runs.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit, branch or tag to compare against. Defaults to the head's merge base with master.
        required: false
        type: string
      head:
        description: Commit, branch or tag to measure. Defaults to the dispatching ref.
        required: false
        type: string
      filter:
        description: Space-separated BenchmarkDotNet filter patterns.
        required: false
        type: string
        default: "*RlpxRoundTripBenchmarks* *OutFlowBenchmarks*"
      rounds:
        description: Number of rounds, each running the benchmarks once at the base and once at the head.
        required: false
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  benchmark:
    name: Network benchmarks
    if: github.repository_owner == 'NethermindEth'
    runs-on: benchmark
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out head
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head || github.sha }}
          # Full history so the base can be any commit-ish and the merge base can be computed.
          fetch-depth: 0
          persist-credentials: false
          path: head

      # Before anything that can fail, so the comparison step always has a runtime.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: head/global.json

      - name: Resolve base
        id: refs
        working-directory: head
        env:
          # Not the tip of master, which may hold commits the head lacks.
          BASE_INPUT: ${{ inputs.base }}
        # Assignments rather than substitutions inside echo, so that a revision that fails to resolve fails the step
        # instead of writing an empty output, which the base checkout would read as the dispatching ref.
        run: |
          if [[ -z "${BASE_INPUT}" ]]; then
            base=$(git merge-base origin/master HEAD)
          else
            # Branches other than the checked-out one exist only as remote-tracking branches.
            base=$(git rev-parse --verify --quiet "${BASE_INPUT}^{commit}" || git rev-parse --verify --quiet "origin/${BASE_INPUT}^{commit}") ||
              { echo "::error::Cannot resolve the base '${BASE_INPUT}'"; exit 1; }
          fi
          head=$(git rev-parse HEAD)
          {
            echo "base=${base}"
            echo "head=${head}"
          } >> "${GITHUB_OUTPUT}"

      # A checkout rather than a worktree: the self-hosted runner keeps its workspace between runs, and
      # checkout cleans what a previous run left in the directory.
      - name: Check out base
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.refs.outputs.base }}
          persist-credentials: false
          path: base

      # The comparison reads the layout this workflow writes, which a head or base from before it may not know.
      - name: Check out the comparison script
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/network-bench
          path: workflow

      - name: Run benchmarks
        id: run
        env:
          FILTER: ${{ inputs.filter }}
          ROUNDS: ${{ inputs.rounds || 5 }}
        run: |
          read -ra patterns <<< "${FILTER}"
          outcome_base=success
          outcome_head=success
          # Fixed counts keep the job's length proportional to the rounds; the rounds supply the repetitions.
          # Keeping the generated benchmark project lets later rounds build it incrementally instead of from scratch.
          for ((round = 1; round <= ROUNDS; round++)); do
            # Alternating the order cancels drift that grows over the job.
            if ((round % 2)); then sides=(base head); else sides=(head base); fi
            for side in "${sides[@]}"; do
              (cd "${side}/src/Nethermind/Nethermind.Benchmark.Runner" &&
                dotnet run -c Release -- --filter "${patterns[@]}" --join --buildTimeout 900 \
                  --launchCount 1 --warmupCount 5 --iterationCount 10 --keepFiles \
                  --artifacts "${RUNNER_TEMP}/bdn-${side}/round-${round}") ||
                printf -v "outcome_${side}" failure
            done
          done
          {
            echo "base=${outcome_base}"
            echo "head=${outcome_head}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compare
        if: always()
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          BASE_OUTCOME: ${{ steps.run.outputs.base }}
          HEAD_OUTCOME: ${{ steps.run.outputs.head }}
        run: workflow/scripts/network-bench/compare.cs "${RUNNER_TEMP}/bdn-base" "${RUNNER_TEMP}/bdn-head" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-benchmark-${{ steps.refs.outputs.head }}
          path: |
            ${{ runner.temp }}/bdn-base
            ${{ runner.temp }}/bdn-head
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if the head run failed
        if: steps.run.outputs.head != 'success'
        run: exit 1
