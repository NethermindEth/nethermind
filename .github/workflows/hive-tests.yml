name: Hive tests

on:
  push:
    tags: ['*', '!zkvm-guests-*', '!bootnode-*']
    branches: [master]
  workflow_dispatch:
    inputs:
      test-suite:
        description: Test suite
        type: choice
        options:
          - 'all'
          - devp2p
          - ethereum/eels/consume-engine
          - ethereum/eels/consume-rlp
          - ethereum/eels/consume-sync
          - ethereum/engine
          - ethereum/graphql
          - ethereum/rpc-compat
          - ethereum/sync
      limit:
        description: Limit
        required: false
        type: string
      log-level:
        description: Log level
        required: true
        default: '3'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
      parallelism:
        description: Hive parallelism (--sim.parallelism)
        required: true
        default: 4
        type: number
      buildarg:
        description: Docker build arguments
        required: false
        type: string
      hive-repo:
        description: Hive repo
        required: true
        default: ethereum/hive
        type: string
      hive-branch:
        description: Hive branch
        required: false
        default: master
        type: string
      max-parallel:
        description: Maximum concurrent matrix jobs (blank = no cap)
        required: false
        type: number
      hive-timeout:
        description: Hive's time limit per simulator, n whole minutes from 1 to 340 (--sim.timelimit); Hive gets TERM n+10 minutes after it starts (KILL a minute later if still running), and the job limit is n+20
        required: false
        default: 40
        type: number
  workflow_call:

concurrency:
  group: hive-tests-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PARALLELISM: 4

jobs:
  setup:
    name: Set up test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      hive-timeout: ${{ steps.limits.outputs.hive-timeout }}
      job-minutes: ${{ steps.limits.outputs.job-minutes }}
    steps:
      - name: Check hive-timeout
        id: limits
        env:
          HIVE_TIMEOUT: ${{ github.event.inputs.hive-timeout || '40' }}
        run: |
          # Hive's time limit per simulator, n whole minutes. In the test job, GNU timeout sends TERM to the Hive command
          # n+10 minutes after it starts, and the job limit is n+20 minutes, which must stay within GitHub's 360-minute
          # job maximum. Expressions have no arithmetic, so the job limit is computed here. Three digits at most keep the
          # shell arithmetic from overflowing.
          if [[ ! "$HIVE_TIMEOUT" =~ ^[1-9][0-9]{0,2}$ ]] || (( HIVE_TIMEOUT > 340 )); then
            echo "::error::hive-timeout must be a whole number of minutes from 1 to 340."
            exit 1
          fi
          echo "hive-timeout=$HIVE_TIMEOUT" >> "$GITHUB_OUTPUT"
          echo "job-minutes=$(( HIVE_TIMEOUT + 20 ))" >> "$GITHUB_OUTPUT"

      - id: matrix
        env:
          SUITE: ${{ github.event.inputs.test-suite }}
          LIMIT: ${{ github.event.inputs.limit }}
          PARALLELISM: ${{ github.event.inputs.parallelism || env.DEFAULT_PARALLELISM }}
        run: |
          # Matches any text that does not start with the literal $1 (letters, spaces, commas and hyphens
          # only): Go RE2 has no lookahead, so the complement is spelled out character by character.
          not_prefixed() {
            local re='' i
            for (( i = ${#1} - 1; i >= 0; i-- )); do
              re="(\$|[^${1:i:1}]${re:+|${1:i:1}$re})"
            done
            printf '%s' "$re"
          }

          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "$SUITE" == "all" ]]; then
            # engine-withdrawals at parallelism 2: the 128-block primary build takes
            # ~5 min on shared CI runners at parallelism 4, consuming the entire 300 s
            # test timeout before the syncing client starts.
            # engine-cancun, engine-api and engine-withdrawals are split by test-name prefix so
            # that no shard runs much past 5 min, which kept engine-cancun's I* tests (12 min)
            # on the critical path of every PR. The patterns of each suite partition its tests:
            # "Invalid NewPayload, <field>" splits at the field's first letter (most fields start
            # with T, for Transaction), and the i-other shards take every other I* name.
            # Re-Execute Payload runs alone because a loaded runner can miss Hive's fixed one-second wait.
            # engine-(auth|[^acw]) catches exchange-capabilities and any future engine suites.
            # The suites that finish in seconds share a job, as most of a job is image builds.
            # ethereum/graphql is left to manual runs: Nethermind serves no GraphQL, so it can only fail.
            cancun_i_other="^I$(not_prefixed 'nvalid NewPayload, ')"
            cancun_n_z="^([N-QS-Z]|R$(not_prefixed 'e-Execute Payload'))"
            api_i_other="^I$(not_prefixed 'nvalid NewPayload')"
            {
              echo 'matrix<<MATRIX_END'
              echo '[
                {"suite":"ethereum/engine", "limit":"engine-cancun/^Invalid NewPayload, [A-S]", "parallelism":3, "name":"engine-cancun-newpayload-a-s"},
                {"suite":"ethereum/engine", "limit":"engine-cancun/^Invalid NewPayload, ([^A-S]|$)", "parallelism":3, "name":"engine-cancun-newpayload-t-z"},
                {"suite":"ethereum/engine", "limit":"engine-cancun/'"$cancun_i_other"'", "parallelism":3, "name":"engine-cancun-i-other"},
                {"suite":"ethereum/engine", "limit":"engine-cancun/'"$cancun_n_z"'", "parallelism":3, "name":"engine-cancun-n-z"},
                {"suite":"ethereum/engine", "limit":"engine-cancun/^Re-Execute Payload", "parallelism":1, "name":"engine-cancun-reexecute"},
                {"suite":"ethereum/engine", "limit":"engine-cancun/^[^IN-Z]", "parallelism":3, "name":"engine-cancun-other"},
                {"suite":"ethereum/engine", "limit":"engine-api/^Invalid NewPayload", "parallelism":3, "name":"engine-api-newpayload"},
                {"suite":"ethereum/engine", "limit":"engine-api/'"$api_i_other"'", "parallelism":3, "name":"engine-api-i-other"},
                {"suite":"ethereum/engine", "limit":"engine-api/^[^I]", "parallelism":3, "name":"engine-api-other"},
                {"suite":"ethereum/engine", "limit":"engine-withdrawals/^[SG]", "parallelism":2, "name":"engine-withdrawals-sync-bodies"},
                {"suite":"ethereum/engine", "limit":"engine-withdrawals/^[^SG]", "parallelism":2, "name":"engine-withdrawals-other"},
                {"suite":"ethereum/engine", "limit":"engine-(auth|[^acw])", "parallelism":2, "name":"engine-auth-other"},
                {"suite":"ethereum/(rpc-compat|sync)", "name":"rpc-compat-sync"}
              ]'
              echo 'MATRIX_END'
            } >> "$GITHUB_OUTPUT"
          else
            jq -rn --arg suite "$SUITE" --arg limit "$LIMIT" --argjson p "$PARALLELISM" \
              '"matrix=" + ([{suite:$suite, limit:$limit, parallelism:$p}] | tojson)' >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build Nethermind image
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nethermind repository
        uses: actions/checkout@v6
        with:
          path: nethermind

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: nethermind
          file: nethermind/Dockerfile
          tags: nethermind:test-${{ github.sha }}
          outputs: type=docker,dest=${{ github.workspace }}/image.tar

      - name: Upload image artifact
        uses: ./nethermind/.github/actions/upload-artifact
        with:
          name: nethermind-image-${{ github.run_id }}
          overwrite: true
          path: image.tar
          retention-days: 1

  test:
    name: Run Hive (${{ matrix.name || matrix.suite }})
    needs: [setup, build-image]
    runs-on: ubuntu-latest
    # Hive's per-simulator limit plus 20 minutes (60 by default), computed by the setup job.
    timeout-minutes: ${{ fromJSON(needs.setup.outputs.job-minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max-parallel || '256') }}
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      LOG_LEVEL: ${{ github.event.inputs.log-level || '3' }}
      BUILDARG: ${{ github.event.inputs.buildarg || '' }}
      HIVE_REPO: ${{ github.event.inputs.hive-repo || 'ethereum/hive' }}
      HIVE_BRANCH: ${{ github.event.inputs.hive-branch || 'master' }}
      HIVE_TIMEOUT: ${{ needs.setup.outputs.hive-timeout }}
    steps:
      - name: Check out Nethermind repository
        uses: actions/checkout@v6
        with:
          path: nethermind

      - name: Download image artifact
        uses: ./nethermind/.github/actions/download-artifact
        with:
          name: nethermind-image-${{ github.run_id }}

      - name: Load Docker image
        run: docker load --input image.tar

      - name: Check out Hive repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HIVE_REPO }}
          ref: ${{ env.HIVE_BRANCH }}
          path: hive

      - name: Patch Hive Dockerfile
        run: sed -i 's#FROM $baseimage:$tag#FROM nethermind:test-${{ github.sha }}#g' hive/clients/nethermind/Dockerfile

      - name: Build Hive
        working-directory: hive
        run: go build .

      - name: Run Hive
        id: hive
        continue-on-error: true
        working-directory: hive
        env:
          LIMIT: ${{ matrix.limit }}
        run: |
          # A hung simulator must not reach the job timeout, which uploads and checks nothing. At its own time limit
          # Hive ends the running cases as failed with "timeout": true, writes the suite files, removes its containers
          # and exits 1, as with failed tests; the results step fails the cases it ended.
          hive_args=(--client nethermind
            --sim "${{ matrix.suite }}"
            --sim.loglevel "$LOG_LEVEL"
            --sim.parallelism "${{ matrix.parallelism || env.DEFAULT_PARALLELISM }}"
            --sim.timelimit "${HIVE_TIMEOUT}m")
          [[ -n "$LIMIT" ]] && hive_args+=(--sim.limit "$LIMIT")
          [[ -n "$BUILDARG" ]] && hive_args+=(--sim.buildarg "$BUILDARG")
          # The outer limit covers what Hive's per-simulator limit does not (image builds, a stuck shutdown, a second
          # simulator): with n = HIVE_TIMEOUT, GNU timeout sends TERM n+10 minutes after it starts ./hive (50 by
          # default) and KILL a minute later if Hive is still running. The job limit is n+20 minutes from the start of
          # the job, which leaves about 9 minutes in total for the steps before this one and the upload, .NET and the
          # results check after it; those took under 2 minutes in the runs so far. That is an estimate, not a bound: the
          # upload action makes up to ten attempts, with no separate total timeout. Image builds, an earlier simulator
          # and Hive's shutdown count against the outer limit too, so it can still stop Hive before Hive's own limit
          # ends a simulator. The status (124, or 137 if Hive had to be killed) tells the results step the run is
          # incomplete. The setup job has checked that HIVE_TIMEOUT is a number.
          status=0
          timeout --kill-after=1m "$(( HIVE_TIMEOUT + 10 ))m" ./hive "${hive_args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload results
        uses: ./nethermind/.github/actions/upload-artifact
        with:
          name: results-${{ strategy.job-index }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: hive/workspace
          retention-days: 7

      - name: Set up .NET
        uses: ./nethermind/.github/actions/setup-dotnet
        with:
          global-json-file: nethermind/global.json

      - name: Print results
        working-directory: nethermind
        env:
          # Empty when "Run Hive" ended without an output, which the results script rejects as a usage error.
          HIVE_STATUS: ${{ steps.hive.outputs.status }}
          LIMIT: ${{ matrix.limit }}
        run: |
          rm -f ../hive/workspace/logs/hive.json
          options=(--hive-exit-code "$HIVE_STATUS")
          # A limit without a suite part (/<test>) makes Hive start every suite, also those where no test matches.
          [[ "$LIMIT" == /* ]] && options+=(--allow-empty-suites)
          dotnet run --file scripts/hive-results.cs -- "${options[@]}" "../hive/workspace/logs/*.json"
