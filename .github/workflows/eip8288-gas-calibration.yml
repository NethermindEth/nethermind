name: EIP-8288 gas calibration

# Runs the lean-bindings calibration suite (src/ffi/calibration) on the reproducible benchmark boxes. All logic is in
# the suite's ci/run-calibration.sh; this workflow reads its inputs from .github/eip8288-calibration.inputs so it can
# become workflow_dispatch / workflow_call unchanged.
on:
  push:
    branches: [test/eip8288-gas-calibration]

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.env.outputs.arches }}
      ref: ${{ steps.env.outputs.ref }}
      scenarios: ${{ steps.env.outputs.scenarios }}
      timeout: ${{ steps.env.outputs.timeout }}
    steps:
      - name: Read inputs
        id: env
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${{ github.repository }}/contents/.github/eip8288-calibration.inputs?ref=${{ github.sha }}" > inputs.env
          set -a; . ./inputs.env; set +a
          echo "arches=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split(",")))' "$ARCHES")" >> "$GITHUB_OUTPUT"
          { echo "ref=$LEAN_BINDINGS_REF"; echo "scenarios=$SCENARIOS"; echo "timeout=$TIMEOUT_MINUTES"; } >> "$GITHUB_OUTPUT"
          cat inputs.env

  calibrate:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve.outputs.arches) }}
    runs-on: [self-hosted, "${{ matrix.arch == 'arm64' && 'reproducible-benchmarks-arm' || 'reproducible-benchmarks' }}"]
    timeout-minutes: 180
    env:
      RUN_DIR: eip8288-calibration-${{ github.run_id }}-${{ matrix.arch }}
      LABEL: ${{ matrix.arch == 'arm64' && 'reproducible-benchmarks-arm' || 'reproducible-benchmarks' }}
    steps:
      - name: Calibrate (yields to a waiting manual benchmark run)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.resolve.outputs.ref }}
          SCENARIOS: ${{ needs.resolve.outputs.scenarios }}
          TIMEOUT_MINUTES: ${{ needs.resolve.outputs.timeout }}
        run: |
          SCRATCH=$RUNNER_TEMP/$RUN_DIR
          mkdir -p "$SCRATCH/out"
          git clone -q --branch "$REF" https://github.com/NethermindEth/lean-bindings.git "$SCRATCH/lean-bindings"
          "$SCRATCH/lean-bindings/src/ffi/calibration/ci/run-calibration.sh" --arch "${{ matrix.arch }}" \
            --lean-bindings-ref "$REF@$(git -C "$SCRATCH/lean-bindings" rev-parse HEAD)" \
            --yield-to-manual-runs "${{ github.repository }}" --runner-label "$LABEL" \
            --scenarios "$SCENARIOS" --timeout-minutes "$TIMEOUT_MINUTES" --out "$SCRATCH/out" --docker rust:1.99.0-bookworm

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eip8288-calibration-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/${{ env.RUN_DIR }}/out
            !${{ runner.temp }}/${{ env.RUN_DIR }}/out/.home
            !${{ runner.temp }}/${{ env.RUN_DIR }}/out/**/bin
            !${{ runner.temp }}/${{ env.RUN_DIR }}/out/**/corpus
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          SCRATCH=$RUNNER_TEMP/$RUN_DIR
          docker ps -aq --filter label=lean-calibration=1 | xargs -r docker rm -f
          if [ -d "$SCRATCH" ]; then
            docker run --rm -v "$SCRATCH":/s rust:1.99.0-bookworm sh -c 'rm -rf /s/* /s/.[!.]*' || true
            rm -rf "$SCRATCH"
          fi
