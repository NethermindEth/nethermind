name: EVM Opcode Benchmark Diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/Nethermind/Nethermind.Evm/**"
      - "src/Nethermind/Nethermind.Evm.Benchmark/EvmOpcodesBenchmark.cs"
      - "src/Nethermind/Nethermind.Evm.Benchmark/EvmOpcodeGasColumnProvider.cs"
      - "src/Nethermind/Nethermind.Evm.Benchmark/EvmPooledMemoryBenchmarkHelper.cs"
      - "Directory.Packages.props"
      - ".github/workflows/evm-opcode-benchmark-diff.yml"
      - "scripts/CompareEvmBenchmarks.cs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-trigger:
    name: Check if EVM benchmark needed
    # Fork-author guard: block fork PRs from dispatching downstream jobs to the
    # self-hosted `benchmark` runner pool. Matches the guard used by sibling
    # benchmark workflows (run-block-processing-benchmark.yml, run-expb-reproducible-benchmarks.yml).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Determine if benchmark is needed
        id: check
        shell: bash
        run: |
          set -euo pipefail
          # Skip if label is set
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-evm-benchmarks') }}" == "true" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Always run if EVM source changed
          if git diff --name-only "$base" "$head" | grep -q "^src/Nethermind/Nethermind\.Evm/"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run if the benchmark harness, workflow, or utility script changed
          if git diff --name-only "$base" "$head" | grep -qE "^(src/Nethermind/Nethermind\.Evm\.Benchmark/(EvmOpcodesBenchmark|EvmOpcodeGasColumnProvider|EvmPooledMemoryBenchmarkHelper)\.cs|\.github/workflows/evm-opcode-benchmark-diff\.yml|scripts/CompareEvmBenchmarks\.cs)$"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run if Nethermind.Numerics.Int256 version changed
          if git diff "$base" "$head" -- Directory.Packages.props | grep -q "Nethermind.Numerics.Int256"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=false" >> "$GITHUB_OUTPUT"

  compare-evm-opcodes:
    name: Compare EVM opcode benchmarks (base vs PR)
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: benchmark
    timeout-minutes: 720
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # EvmOpcodesBenchmarkConfig sets OutlierMode.RemoveAll; the Median / Error / StdDev
      # columns consumed below already reflect an outlier-trimmed distribution, so the
      # multipliers here act on cleaner signals than raw BDN would produce.
      # Default threshold; per-opcode thresholds come from the Threshold column in BDN output
      THRESHOLD_PERCENT: "5"
      # Noise guard for unchanged-code stability.
      # Effective threshold = max(opcode threshold, max(baseCV, prCV) * NOISE_MULTIPLIER)
      NOISE_MULTIPLIER: "2.0"
      # Uncertainty guard from BDN Error column (post-outlier-removal half-width).
      # Effective threshold also includes (baseError + prError) / baseMedian * ERROR_MULTIPLIER.
      ERROR_MULTIPLIER: "1.0"
      # Absolute delta floor in ns to avoid flagging tiny changes on ultra-fast opcodes.
      ABS_DELTA_NS_FLOOR: "2.0"
      # Hysteresis to prevent near-threshold flapping in repeated CI runs.
      DELTA_MARGIN_PERCENT: "2.0"
      # Extra reruns for opcodes that are both flagged and noisy in the first pass.
      NOISY_RERUNS: "2"
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
          tool-cache: false
          swap-storage: false

      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Create base worktree
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          base_dir="${RUNNER_TEMP}/nethermind-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree prune
          git worktree remove --force "${base_dir}" >/dev/null 2>&1 || true
          git worktree add --detach -f "${base_dir}" "${base_sha}"
          echo "BASE_WORKTREE=${base_dir}" >> "${GITHUB_ENV}"

      - name: Use PR opcode benchmark harness for base (probe, fall back to base harness)
        shell: bash
        run: |
          set -euo pipefail
          benchmark_sources=(
            "src/Nethermind/Nethermind.Evm.Benchmark/EvmOpcodesBenchmark.cs"
            "src/Nethermind/Nethermind.Evm.Benchmark/EvmOpcodeGasColumnProvider.cs"
            "src/Nethermind/Nethermind.Evm.Benchmark/EvmPooledMemoryBenchmarkHelper.cs"
          )
          for source in "${benchmark_sources[@]}"; do
            cp "${GITHUB_WORKSPACE}/${source}" "${BASE_WORKTREE}/${source}"
          done

          # A PR that changes an EVM API the harness calls (e.g. the opcode delegate signature) leaves
          # the PR harness uncompilable against base. Fall back to base's own harness so the comparison
          # still runs; the compare step flags that the two sides measured with different sources.
          # Probing the runner rather than the harness alone matches what the benchmark steps build.
          probe_project="Nethermind.Benchmark.Runner/Nethermind.Benchmark.Runner.csproj"
          probe_log="${GITHUB_WORKSPACE}/evm-base-harness-probe.log"
          # Taken before the probe so it can gate the fallback: an unchanged harness cannot be why base
          # fails to build. `|| true` keeps a git failure from aborting a run the probe may yet pass.
          harness_delta="$(git -C "${GITHUB_WORKSPACE}" diff --shortstat "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "${benchmark_sources[@]}" | sed 's/^[[:space:]]*//')" || true
          pushd "${BASE_WORKTREE}/src/Nethermind" >/dev/null
          dotnet restore Benchmarks.slnx --locked-mode
          if ! dotnet build "${probe_project}" -c Release --no-restore 2>&1 | tee "${probe_log}"; then
            if [[ -z "${harness_delta}" ]]; then
              echo "::error::Base build failed with no benchmark harness delta against base (unchanged, or undeterminable); this is not a harness incompatibility."
              exit 1
            fi
            # Restore only the sources base tracks; a harness file the PR adds has no base version.
            mapfile -t tracked < <(git -C "${BASE_WORKTREE}" ls-files -- "${benchmark_sources[@]}")
            if [[ "${#tracked[@]}" -gt 0 ]]; then
              git -C "${BASE_WORKTREE}" checkout -- "${tracked[@]}"
            fi
            for source in "${benchmark_sources[@]}"; do
              git -C "${BASE_WORKTREE}" ls-files --error-unmatch -- "${source}" >/dev/null 2>&1 || rm -f "${BASE_WORKTREE}/${source}"
            done
            # A base that fails to build on its own sources was never a harness incompatibility; let it
            # fail here rather than publish a comparison whose two sides ran different harnesses. Its
            # output appends to the probe log so a red check shows which of the two builds broke.
            dotnet build "${probe_project}" -c Release --no-restore 2>&1 | tee -a "${probe_log}"
            {
              echo "BASE_HARNESS_FALLBACK=true"
              echo "BASE_HARNESS_DELTA=${harness_delta}"
            } >> "${GITHUB_ENV}"
            echo "::warning::PR opcode benchmark harness does not compile against base; the base side used its own harness sources (${harness_delta})."
          fi
          popd >/dev/null

      - name: Run base benchmark
        shell: bash
        run: |
          set -euo pipefail
          pushd "${BASE_WORKTREE}/src/Nethermind/Nethermind.Benchmark.Runner" >/dev/null
          inputs_root="${BASE_WORKTREE}/src/Nethermind/artifacts/bin/Nethermind.Benchmark.Runner/release"
          for d in blake2f blsg1add blsg1msm blsg1mul blsg2add blsg2msm blsg2mul blsmapfp2tog2 blsmapfptog1 blspairingcheck bnadd bnmul bnpair ec_recover modexp point_evaluation ripemd sha256; do
            mkdir -p "${inputs_root}/${d}/current"
            if [[ ! -f "${inputs_root}/${d}/current/sample.csv" ]]; then
              echo "00" > "${inputs_root}/${d}/current/sample.csv"
            fi
          done
          dotnet restore ../Benchmarks.slnx --locked-mode
          dotnet run -c Release -- --filter "*EvmOpcodesBenchmark*" --join --buildTimeout 900 | tee "${GITHUB_WORKSPACE}/evm-opcodes-base.log"
          popd >/dev/null

      - name: Run PR benchmark
        shell: bash
        run: |
          set -euo pipefail
          pushd "src/Nethermind/Nethermind.Benchmark.Runner" >/dev/null
          inputs_root="${GITHUB_WORKSPACE}/src/Nethermind/artifacts/bin/Nethermind.Benchmark.Runner/release"
          for d in blake2f blsg1add blsg1msm blsg1mul blsg2add blsg2msm blsg2mul blsmapfp2tog2 blsmapfptog1 blspairingcheck bnadd bnmul bnpair ec_recover modexp point_evaluation ripemd sha256; do
            mkdir -p "${inputs_root}/${d}/current"
            if [[ ! -f "${inputs_root}/${d}/current/sample.csv" ]]; then
              echo "00" > "${inputs_root}/${d}/current/sample.csv"
            fi
          done
          dotnet restore ../Benchmarks.slnx --locked-mode
          dotnet run -c Release -- --filter "*EvmOpcodesBenchmark*" --join --buildTimeout 900 | tee "${GITHUB_WORKSPACE}/evm-opcodes-pr.log"
          popd >/dev/null

      - name: Detect flagged noisy opcodes for rerun
        id: detect_noisy
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --file scripts/CompareEvmBenchmarks.cs -- detect-noisy

      - name: Rerun base benchmark for flagged noisy opcodes
        if: steps.detect_noisy.outputs.rerun_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t opcodes < evm-rerun-opcodes.txt
          # BDN 0.16+ rejects repeated --filter flags ("Option 'f, filter' is defined multiple times").
          # The CLI accepts one --filter followed by multiple glob patterns as positional args.
          filter_args=(--filter)
          for opcode in "${opcodes[@]}"; do
            [[ -z "${opcode}" ]] && continue
            # BDN renders params as "(Opcode: ADD)" (colon space); the trailing ")" anchors the
            # glob so "ADD" does not also match "ADDMOD".
            filter_args+=("*EvmOpcodesBenchmark*Opcode: ${opcode})*")
          done
          # If no opcodes accumulated, filter_args still contains just "--filter" (length 1).
          if [[ "${#filter_args[@]}" -le 1 ]]; then
            exit 0
          fi

          pushd "${BASE_WORKTREE}/src/Nethermind/Nethermind.Benchmark.Runner" >/dev/null
          repeats="${NOISY_RERUNS:-2}"
          for i in $(seq 1 "${repeats}"); do
            dotnet run -c Release -- "${filter_args[@]}" --join --buildTimeout 900 \
              | tee "${GITHUB_WORKSPACE}/evm-opcodes-base-rerun-${i}.log"
          done
          popd >/dev/null

      - name: Rerun PR benchmark for flagged noisy opcodes
        if: steps.detect_noisy.outputs.rerun_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t opcodes < evm-rerun-opcodes.txt
          # BDN 0.16+ rejects repeated --filter flags ("Option 'f, filter' is defined multiple times").
          # The CLI accepts one --filter followed by multiple glob patterns as positional args.
          filter_args=(--filter)
          for opcode in "${opcodes[@]}"; do
            [[ -z "${opcode}" ]] && continue
            # BDN renders params as "(Opcode: ADD)" (colon space); the trailing ")" anchors the
            # glob so "ADD" does not also match "ADDMOD".
            filter_args+=("*EvmOpcodesBenchmark*Opcode: ${opcode})*")
          done
          # If no opcodes accumulated, filter_args still contains just "--filter" (length 1).
          if [[ "${#filter_args[@]}" -le 1 ]]; then
            exit 0
          fi

          pushd "src/Nethermind/Nethermind.Benchmark.Runner" >/dev/null
          repeats="${NOISY_RERUNS:-2}"
          for i in $(seq 1 "${repeats}"); do
            dotnet run -c Release -- "${filter_args[@]}" --join --buildTimeout 900 \
              | tee "${GITHUB_WORKSPACE}/evm-opcodes-pr-rerun-${i}.log"
          done
          popd >/dev/null

      - name: Compare benchmark summaries
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --file scripts/CompareEvmBenchmarks.cs -- compare

          {
            echo "comment_body<<EOF"
            cat "evm-opcode-comment.md"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish PR benchmark comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ steps.compare.outputs.comment_body }}
        with:
          script: |
            const marker = '<!-- evm-opcode-benchmark-diff -->';
            const body = process.env.COMMENT_BODY;
            if (!body || body.trim().length === 0) {
              core.setFailed('Missing COMMENT_BODY from compare step output.');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const matches = comments
              .filter((comment) => comment.body && comment.body.includes(marker))
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            if (matches.length > 0) {
              const latest = matches[0];
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: latest.id,
                body,
              });

              for (const duplicate of matches.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: duplicate.id,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evm-opcode-benchmark-logs
          path: |
            evm-opcodes-base.log
            evm-opcodes-pr.log
            evm-opcodes-base-rerun-*.log
            evm-opcodes-pr-rerun-*.log
            evm-rerun-opcodes.txt
            evm-base-harness-probe.log
          if-no-files-found: warn

      - name: Cleanup base worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BASE_WORKTREE:-}" ]]; then
            git worktree remove --force "${BASE_WORKTREE}" >/dev/null 2>&1 || true
          fi
          git worktree prune || true
