name: Stateless execution tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: zkVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Run zkVM unit tests
        run: |
          dotnet test --project src/Nethermind/Nethermind.Core.ZkEvm.Test/Nethermind.Core.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.Trie.ZkEvm.Test/Nethermind.Trie.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.Evm.ZkEvm.Test/Nethermind.Evm.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true

  build:
    name: Build ${{ matrix.vm }} guest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: zisk
            project: Nethermind.Stateless.ZiskGuest
          - vm: sp1
            project: Nethermind.Stateless.Sp1Guest
          - vm: openvm
            project: Nethermind.Stateless.OpenVMGuest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      # One bflat image compiles all three; the layout, entry point and exit
      # protocol differ per target and come from the guest's Makefile.
      - name: Build Nethermind
        working-directory: src/Nethermind/${{ matrix.project }}
        run: make build

      - name: Upload guest binary
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-${{ matrix.vm }}
          path: src/Nethermind/${{ matrix.project }}/bin/nethermind
          if-no-files-found: error
          retention-days: 1

  test:
    name: ${{ matrix.vm }} ${{ matrix.block.input }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        vm: [zisk, sp1, openvm]
        block:
          - input: 25526356.ssz
            hash: 93dcf5b1b46c811371e26e99f975bb2e4e6294717abc2d050320839bd855233c
            output: 018cc34e1eb14c42412dc26aeca8e7e1bf540f216753c7431568985b66ecca1f
            digest: 5e782a29f7def400fd79c0dcdadc7495b2f38238d9e449100ab5b165592f893f
          - input: 25532382.ssz
            hash: 1706a8838f8cbb36f78bfdca3d83f8c9779a06dc0e50541172f099b9107c6a2a
            output: d38ffa0643d60c76a25c4ab4ffeeb40d99f2dbedf240b3854b23a9d50233a833
            digest: 7ab22e6edceb28d65718ab0ba5fa3d735bf699cf986c43b6ac3e77ffd35e832b
          - input: 25532442.ssz
            hash: d226fd9a75388fa455e305da180cf6637f4663b9bb64f56a92800da97e8bcb0c
            output: a88d5bd033c480258a436756fc8949313faf557deb9dc5dbe912ae7865d5d1f5
            digest: 83675b03790ebbd65992aa3a0b3ff377ed463538af6a47f8408455079749e71e
          - input: 25532454.ssz
            hash: d75dc30142d089ccdcc226d61e1a4f496f329fc71dd188d87fec9857ef483fa7
            output: efbd3959d821214a3e6f8342548a0574e6eca68958c2ddae579921b2c6ccdc59
            digest: 75cac442594f954b6dddba53cf6530fcec447feb93c3552af99aa82174bd5ff5
          - input: 25532471.ssz
            hash: 315dce051c8509c204c68d99c3ea9790e1369aa1e29838428c7cc9a86caff498
            output: 03a85934149babe2bb198c8f9aed24abbdad3eb1e959ff62249a20e0798aaef6
            digest: d0974d169e4e33238a72b517d9bb3060035a8fe0a76c9c1e714f7cbb67124e84
          - input: 25532480.ssz
            hash: e80386d5dc016a4b63bc6c24bf89ab636995c335dfcfdbea4df3554251c341d4
            output: 0bdd918dd79095dd95e5c68657ed418dee6043e4e4a1d5d5974d4824e24be8f7
            digest: 79da63c269b732fc1ef197f2df0cbccba91c259256e39fd439fa85de9bcb0cfb
          - input: 25532553.ssz
            hash: 7c2ec0703bb1fba9760d9f9f9ff0c0409bf9bd52f3b3c0d166cf2f55f0f5ff45
            output: 9ffd288195959be5fc9bb414b8cd83968a1a653234e25811693950afcfcda880
            digest: 367b6b70f0a8624fbd07d327ba91077f4433e13739a5f57cf875940bda2a4d32
          - input: 25532642.ssz
            hash: c3d82df9b4a68c0348ffb003fd5e8d5e3d45de7fcda5b7f6e4e4fdc64a33c2db
            output: 0a7fe08924c2e0feaeccfdf7541f80333cfe687f8be7c73bb4fbc88c27db6159
            digest: a9d1a50e3322a3f526678a6bd86bfea4910365e379031cfdf4d55321eba0d3f9
          - input: 25532711.ssz
            hash: 19e76df2e2c4439e1dbec2ab075560d4e17817c2194deb119097ec1fae28331d
            output: adf8830ca4fc0fc93d4e0968d84a6a4007081b67bbe6de68d3d6c177f2e812dd
            digest: 08761d24366ded3bdc8a64503fd4dc506930761582fe0d5a31dcf79f71675617
        include:
          # `output` is the guest's 43-byte result and every VM prints it: ZisK
          # and OpenVM on the guest console, SP1 as the public values its runner
          # dumps. `digest` is keccak256 of those bytes, which is what OpenVM
          # actually proves - its public-values window is a fixed 32 bytes, so
          # the guest publishes the hash instead of the result. Checking only
          # the printed line there would assert a debug print and leave the
          # proven value untested, so the OpenVM leg checks both.
          - vm: zisk
            project: Nethermind.Stateless.ZiskGuest
            minutes: 5
          - vm: sp1
            project: Nethermind.Stateless.Sp1Guest
            # SP1 executes ~500-830 M cycles per block. On zk-testing (6 cores)
            # that is ~75 s; a GitHub runner is slower and the image pull is on
            # top, so this is deliberately loose.
            minutes: 30
          - vm: openvm
            project: Nethermind.Stateless.OpenVMGuest
            minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download guest binary
        uses: actions/download-artifact@v8
        with:
          name: nethermind-${{ matrix.vm }}
          path: src/Nethermind/${{ matrix.project }}/bin

      - name: Download input
        working-directory: src/Nethermind/${{ matrix.project }}/bin
        run: |
          curl -fsSL "https://us-southeast-1.linodeobjects.com/zktests/20260819/${{ matrix.block.input }}" \
            -o "${{ matrix.block.input }}"
          echo "${{ matrix.block.hash }}  ${{ matrix.block.input }}" | sha256sum --status -c - || \
            { echo "::error::Checksum failed"; exit 1; }

      # The artifact loses the executable bit; ZisK reads the file, the other
      # two hand it to a runner image that does the same, but make's own
      # recipes expect it back.
      - name: Restore the executable bit
        run: chmod +x "src/Nethermind/${{ matrix.project }}/bin/nethermind"

      - name: Run Nethermind guest
        working-directory: src/Nethermind/${{ matrix.project }}
        run: |
          set -euo pipefail
          # The tail of the SSZ result after its 32-byte root: the success flag,
          # the chain id and the schema id. See Nethermind.Stateless.Executor.
          suffix=0101000000000000000100
          make run INPUT="${{ matrix.block.input }}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "${{ matrix.block.output }}$suffix" "$RUNNER_TEMP/run.log" || \
            { echo "::error::Output mismatch"; exit 1; }
          # The line above is a debug print on OpenVM. What gets proven is the
          # digest in the 32-byte public-values window, so assert that too - a
          # mis-sized window write or an accelerator returning zeros would pass
          # the print check untouched.
          if [ "${{ matrix.vm }}" = openvm ]; then
            grep -q "public_values=${{ matrix.block.digest }}" "$RUNNER_TEMP/run.log" || \
              { echo "::error::Public values mismatch"; exit 1; }
          fi

  status:
    name: Status
    needs: [unit, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          [[ "${{ needs.unit.result }}"  == "success" ]]
          [[ "${{ needs.build.result }}" == "success" ]]
          [[ "${{ needs.test.result }}"  == "success" ]]
