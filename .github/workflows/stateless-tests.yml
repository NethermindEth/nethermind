name: Stateless execution tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.blocks.outputs.json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # inputs.json is the single pinned block set. On master both workflows read it directly; on a
      # pull request the benchmark deliberately uses the base revision to keep its instrument trusted.
      - name: Read the pinned block set
        id: blocks
        run: |
          set -euo pipefail
          json=$(jq -ce 'if type == "array" and length > 0 and all(.[]; (.input | test("^[0-9]+\\.ssz$")) and (.hash | test("^[0-9a-f]{64}$")) and (.output | test("^[0-9a-f]{64}$"))) then . else error("invalid pinned block set") end' src/Nethermind/Nethermind.Stateless.ZiskGuest/inputs.json)
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Run zkVM unit tests
        run: |
          dotnet test --project src/Nethermind/Nethermind.Core.ZkEvm.Test/Nethermind.Core.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.Trie.ZkEvm.Test/Nethermind.Trie.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.Evm.ZkEvm.Test/Nethermind.Evm.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true

      - name: Build Nethermind
        working-directory: src/Nethermind/Nethermind.Stateless.ZiskGuest
        run: make build

      - name: Upload guest binary
        uses: actions/upload-artifact@v7
        with:
          name: nethermind
          path: src/Nethermind/Nethermind.Stateless.ZiskGuest/bin/nethermind
          if-no-files-found: error
          retention-days: 1

  test:
    name: Run ${{ matrix.input }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.blocks) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download guest binary
        uses: actions/download-artifact@v8
        with:
          name: nethermind
          path: src/Nethermind/Nethermind.Stateless.ZiskGuest/bin

      - name: Download input
        working-directory: src/Nethermind/Nethermind.Stateless.ZiskGuest/bin
        run: |
          curl -fsSL "https://us-southeast-1.linodeobjects.com/zktests/20260819/${{ matrix.input }}" \
            -o "${{ matrix.input }}"
          echo "${{ matrix.hash }}  ${{ matrix.input }}" | sha256sum --status -c - || \
            { echo "::error::Checksum failed"; exit 1; }

      - name: Run Nethermind guest
        timeout-minutes: 5
        working-directory: src/Nethermind/Nethermind.Stateless.ZiskGuest
        run: |
          set -euo pipefail
          suffix=0101000000000000000100
          make run INPUT="${{ matrix.input }}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "${{ matrix.output }}$suffix" "$RUNNER_TEMP/run.log" || \
            { echo "::error::Output mismatch"; exit 1; }

  status:
    name: Status
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          [[ "${{ needs.test.result }}" == "success" ]]
