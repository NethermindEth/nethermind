name: Stateless execution tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blocks:
    name: Read the pinned block set
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.blocks.outputs.json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # inputs.json is the single pinned block set. On master both workflows read it directly; on a
      # pull request the benchmark deliberately uses the base revision to keep its instrument trusted.
      - name: Read the pinned block set
        id: blocks
        run: |
          set -euo pipefail
          json=$(jq -ce '
            if type == "array" and length > 0 and
              all(.[];
                (.input | test("^[0-9]+\\.ssz$")) and
                (.hash | test("^[0-9a-f]{64}$")) and
                (.output | test("^[0-9a-f]{86}$")) and
                (.digest | test("^[0-9a-f]{64}$")))
            then .
            else error("invalid pinned block set")
            end
          ' src/Nethermind/Nethermind.Stateless.ZiskGuest/inputs.json)
          echo "json=$json" >> "$GITHUB_OUTPUT"

  unit:
    name: zkVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Run zkVM unit tests
        run: |
          dotnet test --project src/Nethermind/Nethermind.Core.ZkEvm.Test/Nethermind.Core.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.Trie.ZkEvm.Test/Nethermind.Trie.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.State.ZkEvm.Test/Nethermind.State.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true
          dotnet test --project src/Nethermind/Nethermind.Evm.ZkEvm.Test/Nethermind.Evm.ZkEvm.Test.csproj -c release -p:EnableZkEvm=true

  build:
    name: Build ${{ matrix.vm }} guest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: zisk
            project: Nethermind.Stateless.ZiskGuest
          - vm: sp1
            project: Nethermind.Stateless.Sp1Guest
          - vm: openvm
            project: Nethermind.Stateless.OpenVMGuest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Check Docker Hub OIDC availability
        id: dockerhub
        env:
          CONNECTION_ID: ${{ vars.DOCKERHUB_READ_OIDC_CONNECTIONID }}
        run: |
          if [[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && -n "$CONNECTION_ID" ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to Docker Hub
        # Skipped wherever OIDC is unavailable (forks, Dependabot, callers without
        # id-token: write); those runs pull anonymously as before.
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_READ_OIDC_CONNECTIONID }}
          # The longest lifetime docker/login-action accepts; the pinned images are pulled once and then cached
          DOCKERHUB_OIDC_EXPIREIN: 3600
        with:
          username: ${{ vars.DOCKERHUB_READ_ORGANIZATION }}

      # One bflat image compiles all three; the layout, entry point and exit
      # protocol differ per target and come from the guest's Makefile.
      - name: Build Nethermind
        working-directory: src/Nethermind/${{ matrix.project }}
        run: make build

      - name: Upload guest binary
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-${{ matrix.vm }}
          path: src/Nethermind/${{ matrix.project }}/bin/nethermind
          if-no-files-found: error
          retention-days: 1

  test:
    name: ${{ matrix.vm }} ${{ matrix.block.input }}
    needs: [blocks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        vm: [zisk, sp1, openvm]
        block: ${{ fromJSON(needs.blocks.outputs.blocks) }}
        include:
          # `output` is the guest's 43-byte result and every VM prints it: ZisK
          # and OpenVM on the guest console, SP1 as the public values its runner
          # dumps. `digest` is keccak256 of those bytes, which is what OpenVM
          # actually proves - its public-values window is a fixed 32 bytes, so
          # the guest publishes the hash instead of the result. Checking only
          # the printed line there would assert a debug print and leave the
          # proven value untested, so the OpenVM leg checks both.
          - vm: zisk
            project: Nethermind.Stateless.ZiskGuest
            minutes: 5
          - vm: sp1
            project: Nethermind.Stateless.Sp1Guest
            # SP1 executes ~500-830 M cycles per block. On zk-testing (6 cores)
            # that is ~75 s; a GitHub runner is slower and the image pull is on
            # top, so this is deliberately loose.
            minutes: 30
          - vm: openvm
            project: Nethermind.Stateless.OpenVMGuest
            minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download guest binary
        uses: actions/download-artifact@v8
        with:
          name: nethermind-${{ matrix.vm }}
          path: src/Nethermind/${{ matrix.project }}/bin

      - name: Download input
        working-directory: src/Nethermind/${{ matrix.project }}/bin
        run: |
          curl -fsSL "https://us-southeast-1.linodeobjects.com/zktests/20261021/${{ matrix.block.input }}" \
            -o "${{ matrix.block.input }}"
          echo "${{ matrix.block.hash }}  ${{ matrix.block.input }}" | sha256sum --status -c - || \
            { echo "::error::Checksum failed"; exit 1; }

      # The artifact loses the executable bit; ZisK reads the file, the other
      # two hand it to a runner image that does the same, but make's own
      # recipes expect it back.
      - name: Restore the executable bit
        run: chmod +x "src/Nethermind/${{ matrix.project }}/bin/nethermind"

      - name: Check Docker Hub OIDC availability
        id: dockerhub
        env:
          CONNECTION_ID: ${{ vars.DOCKERHUB_READ_OIDC_CONNECTIONID }}
        run: |
          if [[ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && -n "$CONNECTION_ID" ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to Docker Hub
        # Skipped wherever OIDC is unavailable (forks, Dependabot, callers without
        # id-token: write); those runs pull anonymously as before.
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_READ_OIDC_CONNECTIONID }}
          # The longest lifetime docker/login-action accepts; the pinned images are pulled once and then cached
          DOCKERHUB_OIDC_EXPIREIN: 3600
        with:
          username: ${{ vars.DOCKERHUB_READ_ORGANIZATION }}

      - name: Run Nethermind guest
        working-directory: src/Nethermind/${{ matrix.project }}
        run: |
          set -euo pipefail
          make run INPUT="${{ matrix.block.input }}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "${{ matrix.block.output }}" "$RUNNER_TEMP/run.log" || \
            { echo "::error::Output mismatch"; exit 1; }
          # The line above is a debug print on OpenVM. What gets proven is the
          # digest in the 32-byte public-values window, so assert that too - a
          # mis-sized window write or an accelerator returning zeros would pass
          # the print check untouched.
          if [ "${{ matrix.vm }}" = openvm ]; then
            grep -q "public_values=${{ matrix.block.digest }}" "$RUNNER_TEMP/run.log" || \
              { echo "::error::Public values mismatch"; exit 1; }
          fi

  status:
    name: Status
    needs: [blocks, unit, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          [[ "${{ needs.blocks.result }}" == "success" ]]
          [[ "${{ needs.unit.result }}"  == "success" ]]
          [[ "${{ needs.build.result }}" == "success" ]]
          [[ "${{ needs.test.result }}"  == "success" ]]
