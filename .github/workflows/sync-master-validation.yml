# NOTE: Requires repository secret SLACK_WEBHOOK_URL for failure notifications.

name: Sync Master Validation

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    branches: [master]
    types:
      - completed

  workflow_dispatch:
    inputs:
      nethermind_image:
        description: "Docker image tag to test (e.g. nethermindeth/nethermind:master)"
        default: ""
        required: false
      mode:
        description: "Sync mode"
        type: choice
        options:
          - Both
          - HalfPath
          - Flat
        default: Both
        required: true
      chain_filter:
        description: "Run specific chain(s) only (partial name match, e.g. 'mainnet')"
        default: ""
        required: false
      provisioning_model:
        description: "Override the per-network Spot/Standard choice from testnet-matrix.json"
        type: choice
        options:
          - Default
          - Spot
          - Standard
        default: Default
        required: false
      machine_type:
        description: "Override the per-network GCE machine type. Empty uses testnet-matrix.json."
        default: ""
        required: false

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: "1"
  TERM: xterm

# cancel-in-progress would abandon a running sync, which is why #12817 removed this guard.
# The event_name suffix gives a manual dispatch its own slot: it is the tool for debugging
# a broken validation, so it must not queue behind the run it is meant to investigate.
concurrency:
  group: sync-master-validation-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      docker_image: ${{ steps.set-image.outputs.docker_image }}
    steps:
      - name: Determine docker image
        id: set-image
        env:
          IMAGE_INPUT: ${{ github.event.inputs.nethermind_image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ -n "$IMAGE_INPUT" ]; then
            echo "docker_image=$IMAGE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ "$TRIGGER_EVENT" = "push" ] && [ -n "$HEAD_SHA" ]; then
            # Pin to the per-commit tag so concurrent runs each validate their own
            # commit; the nightly schedule publish creates no master-<sha> tag
            echo "docker_image=nethermindeth/nethermind:master-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "docker_image=nethermindeth/nethermind:master" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/config
            scripts/sync
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}

      - name: Set Matrix
        id: set-matrix
        env:
          MODE_INPUT: ${{ github.event.inputs.mode }}
          CHAIN_FILTER: ${{ github.event.inputs.chain_filter }}
          PROVISIONING_INPUT: ${{ github.event.inputs.provisioning_model }}
          MACHINE_TYPE_INPUT: ${{ github.event.inputs.machine_type }}
        run: |
          requested_mode="${MODE_INPUT:-Both}"
          requested_mode=$(echo "$requested_mode" | tr '[:upper:]' '[:lower:]')

          case "$requested_mode" in
            both)     modes='["HalfPath","Flat"]' ;;
            halfpath) modes='["HalfPath"]' ;;
            flat)     modes='["Flat"]' ;;
            *)
              echo "Unsupported mode '$requested_mode'. Expected 'Both', 'HalfPath', or 'Flat'."
              exit 1
              ;;
          esac

          # master-validation chains; op-mainnet dropped to cut cost (kept in sync-supported-chains)
          MASTER_CHAINS='["mainnet","gnosis"]'

          matrix=$(cat scripts/config/testnet-matrix.json | jq \
            --argjson chains "$MASTER_CHAINS" \
            --argjson modes "$modes" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg model "$PROVISIONING_INPUT" \
            --arg machine_type "$MACHINE_TYPE_INPUT" \
            '[.[] | select(.network as $n | $chains | index($n)) ] |
             [.[] as $config
              | $modes[] as $mode
              | ($config + {
                  mode: $mode,
                  runner_label: (
                    (if $mode == "Flat" then "f-" else "hp-" end)
                    + $run_id + "-master-" + $config.network
                  ),
                  machine_type: (if $machine_type == "" then $config.machine_type else $machine_type end),
                  provisioning_model: (
                    if $model == "Spot" then "SPOT"
                    elif $model == "Standard" then "STANDARD"
                    elif $config.spot then "SPOT"
                    else "STANDARD"
                    end
                  ),
                  timeout: (
                    if $mode == "Flat" and ($config.network == "mainnet" or $config.network == "gnosis") then 360
                    else $config.timeout end
                  )
                })
              | . + { max_run_duration: (((.timeout + 60) | tostring) + "m") }]')

          matrix=$(echo "$matrix" | scripts/sync/select-networks.sh "$CHAIN_FILTER")

          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            echo "chain_filter '$CHAIN_FILTER' matched no networks"
            exit 1
          fi

          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  sync:
    needs: [setup-matrix]
    # A called workflow can never elevate GITHUB_TOKEN above its caller, and
    # id-token defaults to none, so the runner lifecycle needs it granted here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    name: "Sync ${{ matrix.config.network }} (${{ matrix.config.mode }})"
    uses: ./.github/workflows/sync-one-chain.yml
    secrets: inherit
    with:
      network: ${{ matrix.config.network }}
      mode: ${{ matrix.config.mode }}
      runner_label: ${{ matrix.config.runner_label }}
      machine_type: ${{ matrix.config.machine_type }}
      local_ssd_count: ${{ matrix.config.local_ssd_count }}
      provisioning_model: ${{ matrix.config.provisioning_model }}
      max_run_duration: ${{ matrix.config.max_run_duration }}
      timeout: ${{ matrix.config.timeout }}
      docker_image: ${{ needs.setup-matrix.outputs.docker_image }}
      node_name_prefix: SyncMasterValidation
      collect_metrics: true
      checkout_ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}
      cl: ${{ matrix.config.cl }}
      cl_image: ${{ matrix.config.cl_image }}
      checkpoint_sync_url: ${{ matrix.config.checkpoint-sync-url }}

  publish-metrics:
    needs: [setup-matrix, sync]
    # Runs whenever any sync job may have produced metrics (partial failures included).
    # Metrics must never turn a green sync run red; the timeout also keeps a hang from
    # holding the concurrency group (and thus blocking every later run) for the 6h default.
    if: ${{ !cancelled() && needs.setup-matrix.result == 'success' }}
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: sync-metrics-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/sync-metrics
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}

      - name: Check for metrics data branch
        id: data-branch
        run: |
          # ls-remote exits 2 when the ref is absent; any other failure is a real error
          rc=0
          git ls-remote --exit-code --heads origin sync-metrics > /dev/null || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with $rc"; exit "$rc" ;;
          esac

      - name: Checkout metrics data branch
        if: steps.data-branch.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: sync-metrics
          path: metrics-branch

      # First publish: start an empty orphan branch. A worktree shares the repository
      # checkout's credentials, so the push below works the same as for a cloned branch.
      - name: Initialize metrics data branch
        if: steps.data-branch.outputs.exists == 'false'
        run: git worktree add --orphan -b sync-metrics metrics-branch

      - name: Download sync metrics artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sync-metrics-${{ github.run_attempt }}-*
          path: metrics
          merge-multiple: true

      - name: Append records to sync-metrics branch
        id: append
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No sync metrics collected; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C metrics-branch config user.name "github-actions[bot]"
          git -C metrics-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # publish.py is idempotent, so on a push race we reset and re-apply
          pushed=false
          for _ in 1 2 3; do
            python scripts/sync-metrics/publish.py metrics metrics-branch/history.jsonl
            git -C metrics-branch add history.jsonl
            if git -C metrics-branch diff --cached --quiet; then
              echo "No new records."
              pushed=true
              break
            fi
            git -C metrics-branch commit -m "Record sync metrics for run ${GITHUB_RUN_ID}"
            if git -C metrics-branch push origin HEAD:sync-metrics; then
              pushed=true
              break
            fi
            git -C metrics-branch fetch origin sync-metrics
            git -C metrics-branch reset --hard FETCH_HEAD
          done
          if [ "$pushed" != true ]; then
            echo "::error::Failed to push sync metrics after 3 attempts."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build dashboard site
        if: steps.append.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp scripts/sync-metrics/index.html _site/index.html
          cp metrics-branch/history.jsonl _site/history.jsonl

      - name: Configure GitHub Pages
        if: steps.append.outputs.publish == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.append.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.append.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  notify-on-failure:
    needs: [setup-matrix, sync]
    # Each network's create/sync/teardown is one unit now, so a failure anywhere in it
    # surfaces as a failed matrix entry here. setup-matrix failing must page too — on the
    # workflow_run path nobody is watching the Actions tab — but a skipped setup-matrix
    # means the docker-publish guard rejected the run, which should stay quiet.
    if: >-
      ${{ always() && needs.setup-matrix.result != 'skipped'
          && (contains(needs.*.result, 'failure')
              || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect failed jobs
        id: failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MATRIX: ${{ needs.setup-matrix.outputs.matrix }}
        run: |
          # Neither lookup may abort the step: without an output the Slack gate below reads
          # as false, which would drop the alert this job exists to send.
          if ! jobs=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --paginate -q '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                           | [.name, ((.completed_at // "") | fromdateiso8601? // 0)] | @tsv'); then
            echo "::warning title=Sync master validation::could not list failed jobs"
            jobs=""
          fi

          # A reclaimed runner leaves a marker artifact; only unexplained failures may page.
          # Markers carry the attempt because a re-run inherits the earlier attempt's artifacts.
          if ! names=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --paginate -q '.artifacts[].name'); then
            echo "::warning title=Sync master validation::could not list artifacts, so no failure counts as preempted"
            names=""
          fi
          markers=$(printf '%s\n' "$names" \
            | sed -n "s/^preempted-${RUN_ATTEMPT}-\([0-9][0-9]*\)-\(.*\)$/\1 \2/p") || markers=""
          reclaims=$(jq -r --arg markers "$markers" \
            '($markers | split("\n") | map(select(length > 0)) | map(split(" "))) as $m
             | . as $matrix
             | $m[] as $one
             | $matrix[] | select(.runner_label == $one[1])
             | "\($one[0])\tSync \(.network) (\(.mode))"' <<<"$MATRIX") || reclaims=""

          listed=0
          unexplained=""
          while IFS=$'\t' read -r job ended; do
            [ -n "$job" ] || continue
            listed=$((listed + 1))
            case "$ended" in '' | *[!0-9]*) ended=0 ;; esac
            explained=false
            while IFS=$'\t' read -r at prefix; do
              [ -n "$prefix" ] || continue
              case "$job" in "${prefix}"*) ;; *) continue ;; esac
              # A reclaim only explains a failure it could have caused. One that finished
              # before the VM was taken was already broken, and an unknown time on either
              # side is not evidence of anything.
              if [ "$at" -gt 0 ] && [ "$ended" -gt 0 ] && [ "$at" -le "$ended" ]; then
                explained=true
                break
              fi
            done <<<"$reclaims"
            if [ "$explained" = true ]; then
              echo "ignoring ${job}: its runner was preempted"
            else
              unexplained="${unexplained}$(cut -c1-60 <<<"$job"), "
            fi
          done <<<"$jobs"
          unexplained="${unexplained%, }"

          # An empty list means the lookup told us nothing, not that every failure was a
          # reclaim, so it must still page.
          if [ "$listed" -gt 0 ] && [ -z "$unexplained" ]; then
            echo "every failure was a preemption, not paging" >> "$GITHUB_STEP_SUMMARY"
            echo "should_page=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$unexplained" ]; then
            unexplained="(check run for details)"
          fi
          echo "should_page=true" >> "$GITHUB_OUTPUT"
          echo "failed_jobs=$unexplained" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        if: ${{ steps.failures.outputs.should_page == 'true' }}
        uses: slackapi/slack-github-action@v3
        env:
          FAILED_JOBS: ${{ steps.failures.outputs.failed_jobs }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Sync validation failed after merge to master",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Sync Failure on Master*\n*Failed:* ${{ env.FAILED_JOBS }}\n*Commit:* `${{ env.COMMIT_SHA }}`\n*Run:* ${{ env.RUN_URL }}"
                  }
                }
              ]
            }
