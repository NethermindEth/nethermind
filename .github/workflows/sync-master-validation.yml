# NOTE: Requires repository secret SLACK_SYNC_WEBHOOK_URL for failure notifications.
# Create a Slack incoming webhook and add it as a repo secret.

name: Sync Master Validation

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    branches: [master]
    types:
      - completed

  workflow_dispatch:
    inputs:
      nethermind_image:
        description: "Docker image tag to test (e.g. nethermindeth/nethermind:master)"
        default: ""
        required: false
      mode:
        description: "Sync mode"
        type: choice
        options:
          - Both
          - HalfPath
          - Flat
        default: Both
        required: true
      chain_filter:
        description: "Run specific chain(s) only (partial name match, e.g. 'mainnet')"
        default: ""
        required: false
      provisioning_model:
        description: "Override the per-network Spot/Standard choice from testnet-matrix.json"
        type: choice
        options:
          - Default
          - Spot
          - Standard
        default: Default
        required: false
      machine_type:
        description: "Override the per-network GCE machine type. Empty uses testnet-matrix.json."
        default: ""
        required: false

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: "1"
  TERM: xterm

concurrency:
  group: sync-master-validation-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      docker_image: ${{ steps.set-image.outputs.docker_image }}
    steps:
      - name: Determine docker image
        id: set-image
        env:
          IMAGE_INPUT: ${{ github.event.inputs.nethermind_image }}
        run: |
          if [ -n "$IMAGE_INPUT" ]; then
            echo "docker_image=$IMAGE_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "docker_image=nethermindeth/nethermind:master" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/config
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}

      - name: Set Matrix
        id: set-matrix
        env:
          MODE_INPUT: ${{ github.event.inputs.mode }}
          CHAIN_FILTER: ${{ github.event.inputs.chain_filter }}
          PROVISIONING_INPUT: ${{ github.event.inputs.provisioning_model }}
          MACHINE_TYPE_INPUT: ${{ github.event.inputs.machine_type }}
        run: |
          requested_mode="${MODE_INPUT:-Both}"
          requested_mode=$(echo "$requested_mode" | tr '[:upper:]' '[:lower:]')

          case "$requested_mode" in
            both)     modes='["HalfPath","Flat"]' ;;
            halfpath) modes='["HalfPath"]' ;;
            flat)     modes='["Flat"]' ;;
            *)
              echo "Unsupported mode '$requested_mode'. Expected 'Both', 'HalfPath', or 'Flat'."
              exit 1
              ;;
          esac

          # master-validation chains; op-mainnet dropped to cut cost (kept in sync-supported-chains)
          MASTER_CHAINS='["mainnet","gnosis"]'

          matrix=$(cat scripts/config/testnet-matrix.json | jq \
            --argjson chains "$MASTER_CHAINS" \
            --argjson modes "$modes" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg model "$PROVISIONING_INPUT" \
            --arg machine_type "$MACHINE_TYPE_INPUT" \
            '[.[] | select(.network as $n | $chains | index($n)) ] |
             [.[] as $config
              | $modes[] as $mode
              | ($config + {
                  mode: $mode,
                  runner_label: (
                    (if $mode == "Flat" then "f-" else "hp-" end)
                    + $run_id + "-master-" + $config.network
                  ),
                  machine_type: (if $machine_type == "" then $config.machine_type else $machine_type end),
                  provisioning_model: (
                    if $model == "Spot" then "SPOT"
                    elif $model == "Standard" then "STANDARD"
                    elif $config.spot then "SPOT"
                    else "STANDARD"
                    end
                  ),
                  timeout: (
                    if $mode == "Flat" and ($config.network == "mainnet" or $config.network == "gnosis") then 360
                    else $config.timeout end
                  )
                })
              | . + { max_run_duration: (((.timeout + 60) | tostring) + "m") }]')

          # Apply chain_filter if provided
          if [ -n "$CHAIN_FILTER" ]; then
            matrix=$(echo "$matrix" | jq --arg filter "$CHAIN_FILTER" '[.[] | select(.network | contains($filter))]')
          fi

          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  create_a_runner:
    needs: [setup-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Create a Runner
        uses: ./.github/actions/gcp-runner
        with:
          action: create
          runner_label: ${{ matrix.config.runner_label }}
          github_token: ${{ steps.gh-app.outputs.token }}
          machine_type: ${{ matrix.config.machine_type }}
          local_ssd_count: ${{ matrix.config.local_ssd_count }}
          provisioning_model: ${{ matrix.config.provisioning_model }}
          max_run_duration: ${{ matrix.config.max_run_duration }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  sync-chain:
    needs: [setup-matrix, create_a_runner]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    name: "Sync ${{ matrix.config.network }} (${{ matrix.config.mode }})"
    runs-on: ${{ matrix.config.runner_label }}
    timeout-minutes: ${{ matrix.config.timeout }}

    steps:
      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: "nethermind,post-merge-smoke-tests"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}

      - name: Sync ${{ matrix.config.network }}
        uses: ./.github/actions/sync-chain
        with:
          network: ${{ matrix.config.network }}
          mode: ${{ matrix.config.mode }}
          docker_image: ${{ needs.setup-matrix.outputs.docker_image }}
          node_name_prefix: SyncMasterValidation
          cl: ${{ matrix.config.cl }}
          cl_image: ${{ matrix.config.cl_image }}
          checkpoint_sync_url: ${{ matrix.config.checkpoint-sync-url }}
          tests_token: ${{ steps.gh-app.outputs.token }}
          mainnet_consensus_url: ${{ secrets.MAINNET_CONSENSUS_URL }}
          mainnet_execution_url: ${{ secrets.MAINNET_EXECUTION_URL }}
          sepolia_consensus_url: ${{ secrets.SEPOLIA_CONSENSUS_URL }}
          sepolia_execution_url: ${{ secrets.SEPOLIA_EXECUTION_URL }}
          hoodi_consensus_url: ${{ secrets.HOODI_CONSENSUS_URL }}
          hoodi_execution_url: ${{ secrets.HOODI_EXECUTION_URL }}
          loki_url: ${{ secrets.LOKI_URL }}
          loki_username: ${{ secrets.LOKI_USERNAME }}
          loki_password: ${{ secrets.LOKI_PASSWORD }}
          prometheus_url: ${{ secrets.PROMETHEUS_URL }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD }}

  destroy_runner:
    needs: [setup-matrix, create_a_runner, sync-chain]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name || 'master' }}

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Destroy Runner
        uses: ./.github/actions/gcp-runner
        with:
          action: destroy
          runner_label: ${{ matrix.config.runner_label }}
          github_token: ${{ steps.gh-app.outputs.token }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  notify-on-failure:
    needs: [sync-chain]
    if: ${{ contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect failed jobs
        id: failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          failed=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --paginate -q '.jobs[] | select(.conclusion == "failure") | select(.name | startswith("Sync ")) | .name' \
            | tr '\n' ', ' | sed 's/,$//')
          if [ -z "$failed" ]; then
            failed="(check run for details)"
          fi
          echo "failed_jobs=$failed" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        env:
          FAILED_JOBS: ${{ steps.failures.outputs.failed_jobs }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          webhook: ${{ secrets.SLACK_SYNC_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Sync validation failed after merge to master",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Sync Failure on Master*\n*Failed:* ${{ env.FAILED_JOBS }}\n*Commit:* `${{ env.COMMIT_SHA }}`\n*Run:* ${{ env.RUN_URL }}"
                  }
                }
              ]
            }
