name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  instructions:
    if: >-
      vars.AI_REVIEW_AUTO != 'false' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/ai-review-instructions.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: read

  ai-review:
    needs: instructions
    if: >-
      vars.AI_REVIEW_AUTO != 'false' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: NethermindEth/github-workflows/.github/workflows/ai-review.yaml@v5.1.1
    with:
      secret_path: /apps/litellm/nethermind-ai-reviewer
      # GitHub cannot return a combined diff above 300 files; bypass diff-size selection.
      model: ${{ github.event.pull_request.changed_files > 300 && 'openai/gemini/gemini-pro-latest' || '' }}
      num_max_findings: 8
      extra_instructions: ${{ needs.instructions.outputs.instructions }}
      # Advisory, not a required check: no label, and LLM/gateway failures stay green.
      # A real security_concerns finding still fails the check.
      label: ""
      fail_on_missing_review: false
    secrets:
      infisical_identity_id: ${{ secrets.INFISICAL_IDENTITY_ID }}
      infisical_project_id: ${{ secrets.INFISICAL_PROJECT_ID }}
