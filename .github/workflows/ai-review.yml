name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  instructions:
    if: >-
      vars.AI_REVIEW_AUTO != 'false' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/ai-review-instructions.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: read

  ai-review:
    needs: instructions
    if: >-
      vars.AI_REVIEW_AUTO != 'false' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: NethermindEth/github-workflows/.github/workflows/ai-review.yaml@v2.4.0
    with:
      secret_path: /apps/litellm/nethermind-ai-reviewer
      num_max_findings: 8
      extra_instructions: ${{ needs.instructions.outputs.instructions }}
    secrets:
      infisical_identity_id: ${{ secrets.INFISICAL_IDENTITY_ID }}
      infisical_project_id: ${{ secrets.INFISICAL_PROJECT_ID }}
