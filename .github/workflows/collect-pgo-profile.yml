name: Collect PGO Profile

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Inspect Linux inputs or collect an instrumentation profile
        required: true
        type: choice
        options: [inventory, instrumentation]
        default: inventory
      training_amount:
        description: Fusaka payload count for instrumentation (1-1000; start with a bounded fixture)
        required: true
        default: "10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  EXPB_DATA_DIR: /mnt/sda/expb-data
  PGO_TAG: pgo-${{ github.run_id }}

jobs:
  inventory:
    name: Inspect Fusaka Flat Linux x64 inputs
    if: inputs.phase == 'inventory'
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Save input and capability inventory
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/inventory"
          mkdir -p "${output}"
          git rev-parse HEAD > "${output}/source-sha.txt"
          uv run --with pyyaml==6.0.3 python scripts/pgo/inventory.py \
            --config "${EXPB_DATA_DIR}/github-action-mainnet-fusaka-flat.yaml" \
            --output "${output}/inventory.json"

      - name: Upload inventory including failed probes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/inventory/
          if-no-files-found: error
          retention-days: 90

  build-pgo-image:
    if: inputs.phase == 'instrumentation'
    name: Build PGO collection image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Trigger publish-docker.yml with Dockerfile.pgo
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: publish-docker.yml
          ref: ${{ github.ref }}
          token: ${{ github.token }}
          inputs: '{
            "image-name": "nethermind",
            "tag": "${{ env.PGO_TAG }}",
            "dockerfile": "Dockerfile.pgo",
            "build-config": "release"
            }'

      - name: Wait for publish-docker.yml to complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for publish-docker.yml to start and complete..."

          max_discovery=300
          poll=15
          max_completion=7200
          elapsed=0
          run_id=""

          # Phase 1: discover the run (filter by head_sha to avoid matching unrelated runs)
          head_sha="${{ github.sha }}"
          while [[ -z "${run_id}" ]]; do
            response=$(gh api "repos/${{ github.repository }}/actions/workflows/publish-docker.yml/runs?per_page=5&branch=${{ github.ref_name }}&head_sha=${head_sha}" 2>/dev/null || echo '{"workflow_runs":[]}')
            run_id=$(echo "${response}" | jq -r '.workflow_runs[0].id // empty')

            if [[ -n "${run_id}" ]]; then
              echo "Found publish-docker run: ${run_id}"
              break
            fi

            elapsed=$((elapsed + poll))
            if [[ "${elapsed}" -ge "${max_discovery}" ]]; then
              echo "No publish-docker.yml run found within ${max_discovery}s."
              exit 1
            fi
            echo "Waiting for run to appear... (${elapsed}/${max_discovery}s)"
            sleep "${poll}"
          done

          # Phase 2: wait for completion
          elapsed=0
          while true; do
            run_data=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" 2>/dev/null || echo '{}')
            status=$(echo "${run_data}" | jq -r '.status // "unknown"')
            conclusion=$(echo "${run_data}" | jq -r '.conclusion // empty')

            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "publish-docker.yml completed successfully."
                exit 0
              else
                echo "publish-docker.yml finished with conclusion: ${conclusion}"
                exit 1
              fi
            fi

            elapsed=$((elapsed + poll))
            if [[ "${elapsed}" -ge "${max_completion}" ]]; then
              echo "Timeout waiting for publish-docker.yml (${max_completion}s)."
              exit 1
            fi
            echo "Status: ${status} — waiting... (${elapsed}/${max_completion}s)"
            sleep "${poll}"
          done

  collect:
    name: Collect PGO profile via EXPB
    needs: [build-pgo-image]
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 720
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve config file
        id: resolve
        shell: bash
        run: |
          echo "config_file=github-action-mainnet-fusaka-flat.yaml" >> "${GITHUB_OUTPUT}"

      - name: Render benchmark config
        id: render-config
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.resolve.outputs.config_file }}
          TRAINING_AMOUNT: ${{ inputs.training_amount }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/collection"
          docker pull "nethermindeth/nethermind:${PGO_TAG}"
          image=$(docker image inspect "nethermindeth/nethermind:${PGO_TAG}" --format '{{index .RepoDigests 0}}')
          uv run --with pyyaml==6.0.3 python scripts/pgo/render_collection.py \
            --config "${EXPB_DATA_DIR}/${CONFIG_FILE}" --root "${root}" \
            --image "${image}" --amount "${TRAINING_AMOUNT}"
          echo "COLLECTION_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "COLLECTION_IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "rendered_config_file=${root}/config.yaml" >> "${GITHUB_OUTPUT}"
          cat "${root}/manifest.json"

      - name: Install or upgrade expb
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            echo "uv is required but not found in PATH."
            exit 1
          fi
          uv tool install --force --from "git+https://github.com/NethermindEth/execution-payloads-benchmarks@56f83b112a93436a66468b863ed9e47bcd5feba6" expb
          uv tool dir --bin >> "${GITHUB_PATH}"

      - name: Run EXPB for PGO collection
        id: run-expb
        shell: bash
        working-directory: ${{ env.EXPB_DATA_DIR }}
        env:
          TRAINING_AMOUNT: ${{ inputs.training_amount }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=INT --kill-after=120s 30m expb execute-scenarios \
            --config-file "${{ steps.render-config.outputs.rendered_config_file }}" \
            --per-payload-metrics --print-logs 2>&1 | tee "${COLLECTION_ROOT}/expb.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [[ "${statuses[1]}" != 0 ]]; then
            echo "Failed to retain EXPB log."
            exit 1
          fi
          python3 "${GITHUB_WORKSPACE}/scripts/pgo/validate_collection.py" \
            --log "${COLLECTION_ROOT}/expb.log" --amount "${TRAINING_AMOUNT}" \
            --exit-code "${statuses[0]}" --output "${COLLECTION_ROOT}/execution-validation.json"

      - name: Check run-owned raw trace
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          traces=("${COLLECTION_ROOT}/pgo/"*.nettrace)
          if [[ "${#traces[@]}" != 1 ]] || [[ ! -s "${traces[0]}" ]]; then
            echo "Expected exactly one complete nonempty trace from this collection run."
            exit 1
          fi
          echo "COLLECTION_TRACE=${traces[0]}" >> "${GITHUB_ENV}"

      - name: Upload run-owned collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/config.yaml
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/manifest.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/expb.log
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/execution-validation.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/pgo/
          if-no-files-found: error
          retention-days: 90

      - name: Set up .NET
        if: always()
        uses: actions/setup-dotnet@v5
        with:
          cache: false
          dotnet-version: "10.0.401"

      - name: Build dotnet-pgo from source
        shell: bash
        run: |
          set -euo pipefail
          tool_root="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/tool"
          mkdir -p "${tool_root}"
          python3 scripts/pgo/prepare_tool.py --destination "${tool_root}/runtime"
          cd "${tool_root}/runtime"
          ./build.sh -c Release \
            --projects "$(pwd)/src/coreclr/tools/dotnet-pgo/dotnet-pgo.csproj"

          dotnet_pgo_dir="${tool_root}/runtime/artifacts/bin/coreclr/linux.x64.Release/dotnet-pgo"
          test -f "${dotnet_pgo_dir}/dotnet-pgo.dll"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec "%s" "%s" "$@"\n' \
            "${tool_root}/runtime/.dotnet/dotnet" "${dotnet_pgo_dir}/dotnet-pgo.dll" \
            > "${dotnet_pgo_dir}/dotnet-pgo"
          chmod +x "${dotnet_pgo_dir}/dotnet-pgo"
          find "${dotnet_pgo_dir}" -type f -print0 | sort -z | xargs -0 sha256sum > "${tool_root}/tool-binaries.sha256"
          echo "${dotnet_pgo_dir}" >> "${GITHUB_PATH}"

      - name: Validate smoothing isolation and sample weights
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/PgoToolValidation/PgoToolValidation.csproj -c Release -- \
            "${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/tool/runtime/artifacts/bin/coreclr/linux.x64.Release/dotnet-pgo" \
            src/Nethermind/Nethermind.Runner/pgo/nethermind.mibc

      - name: Upload offline tool identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-tool-identities-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/tool/*-source-manifest.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/tool/tool-binaries.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Convert traces to .mibc and merge with edge profiling
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          validation_dir="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/profile-validation"
          mkdir -p "${validation_dir}"
          mibc_file="${validation_dir}/nethermind.mibc"
          pgo_dir="${COLLECTION_ROOT}/pgo"

          if [[ ! -d "${pgo_dir}" ]] || [[ -z "$(ls -A "${pgo_dir}" 2>/dev/null)" ]]; then
            echo "No PGO data found in ${pgo_dir}."
            exit 1
          fi

          trace_file="${COLLECTION_TRACE}"
          test -s "${trace_file}"
          ref_dir="${COLLECTION_ROOT}/references"
          mkdir -p "${ref_dir}/app" "${ref_dir}/shared"
          ref_cid=$(docker create --entrypoint /bin/true "${COLLECTION_IMAGE}")
          trap 'docker rm -v "${ref_cid}" >/dev/null' EXIT
          docker cp "${ref_cid}:/nethermind/." "${ref_dir}/app/"
          docker cp "${ref_cid}:/usr/share/dotnet/shared/." "${ref_dir}/shared/"
          python3 scripts/pgo/reference_inventory.py --root "${ref_dir}" --image "${COLLECTION_IMAGE}"

          echo "Converting ${trace_file} to .mibc..."
          trace_mibc="${validation_dir}/trace.mibc"
          create_mibc_args=(
            --trace "${trace_file}"
            --output "${trace_mibc}"
          )
          while IFS= read -r dll; do
            create_mibc_args+=(--reference "${dll}")
          done < "${ref_dir}/references.txt"
          dotnet-pgo create-mibc "${create_mibc_args[@]}"
          dotnet-pgo dump --input "${trace_mibc}" --output "${validation_dir}/dump.json"
          python3 scripts/pgo/validate_profile.py \
            --dump "${validation_dir}/dump.json" --output "${validation_dir}/validation.json" \
            --require instrumentation --require block-counts

          cp "${trace_mibc}" "${mibc_file}"

          echo "Generated .mibc profile:"
          ls -lh "${mibc_file}"
          echo "mibc_file=${mibc_file}" >> "${GITHUB_OUTPUT}"

          # Step 2: Trim .jit edge/block profiling data for runtime PGO
          # .jit files (from DOTNET_WritePGOData) use a JIT-internal text format read
          # back via DOTNET_ReadPGOData — they can't be merged into .mibc by dotnet-pgo.
          jit_file=$(find "${pgo_dir}" -name "*.jit" -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)
          jit_gz="${RUNNER_TEMP}/nethermind.jit.gz"
          if [[ -n "${jit_file}" ]]; then
            echo "Trimming ${jit_file} with PgoTrim..."
            dotnet run --project "${GITHUB_WORKSPACE}/tools/PgoTrim" -c Release -- \
              "${jit_file}" "${jit_gz}" --min-block 100 --min-edge 250
            echo "jit_gz=${jit_gz}" >> "${GITHUB_OUTPUT}"
          else
            echo "No .jit file found — skipping edge profiling trim."
          fi

      - name: Upload matching application and framework references
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-app-references-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/references/
          if-no-files-found: error
          retention-days: 90

      - name: Upload profile validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-profile-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/profile-validation/
          if-no-files-found: error
          retention-days: 90

      - name: Upload .mibc artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-profile
          path: ${{ steps.convert.outputs.mibc_file }}
          retention-days: 14

      - name: Upload trimmed .jit.gz artifact
        if: always() && steps.convert.outputs.jit_gz != ''
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-jit
          path: ${{ steps.convert.outputs.jit_gz }}
          retention-days: 14

      - name: Upload raw PGO data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-raw-data
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/pgo/
          if-no-files-found: warn
          retention-days: 30
