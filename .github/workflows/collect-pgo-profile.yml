name: Collect PGO Profile

on:
  workflow_dispatch:
    inputs:
      inspect_run:
        description: Optional failed run ID and attempt (e.g. 12345-1); report its retained Fusaka errors without collecting
        type: string
      collection_image:
        description: Optional immutable collection image; blank builds Dockerfile.pgo from this commit on the runner
        required: false
        type: string
      corpus:
        description: eth_call corpus filename under /mnt/sda/expb-data/rpc-bench
        default: eth-call-corpus-20260805T104605Z-497-safe.jsonl.gz
        type: string
      amount:
        description: Fusaka training payloads (reserve other payloads for validation)
        default: '1000'
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.inspect_run != ''
    runs-on: [self-hosted, reproducible-benchmarks]
    steps:
      - uses: actions/checkout@v6
      - name: Report retained Fusaka errors
        env:
          INSPECT_RUN: ${{ inputs.inspect_run }}
        run: |
          [[ "$INSPECT_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          python3 scripts/pgo/expb_errors.py "/mnt/sda/expb-data/pgo-$INSPECT_RUN"/fusaka-*/expb.log
  collect:
    if: inputs.inspect_run == ''
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
      - name: Prepare collection
        env:
          IMAGE: ${{ inputs.collection_image }}
          CORPUS: ${{ inputs.corpus }}
          AMOUNT: ${{ inputs.amount }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORPUS" != */* && "$CORPUS" == eth-call-corpus*.jsonl.gz ]]
          [[ "$AMOUNT" =~ ^[1-9][0-9]*$ ]]
          echo "PGO_RUN=/mnt/sda/expb-data/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$GITHUB_WORKSPACE/.vs/dotnet-cli-home" >> "$GITHUB_ENV"
          if [[ -n "$IMAGE" ]]; then
            [[ "$IMAGE" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]
            docker pull "$IMAGE"
          else
            iid_file="$RUNNER_TEMP/pgo-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            docker build -f Dockerfile.pgo --build-arg COMMIT_HASH="$GITHUB_SHA" \
              --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" --iidfile "$iid_file" .
            IMAGE=$(cat "$iid_file")
          fi
          echo "PGO_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          uv tool install --force --from 'git+https://github.com/NethermindEth/execution-payloads-benchmarks@9609a1b66aba5b67c6accc1930cb3e50748ca72f' expb
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Collect Fusaka
        env:
          IMAGE: ${{ env.PGO_IMAGE }}
          AMOUNT: ${{ inputs.amount }}
        run: |
          for mode in instrumentation sampling; do
            uv run --with pyyaml==6.0.2 python scripts/pgo/collect.py fusaka --mode "$mode" \
              --image "$IMAGE" --output "$PGO_RUN/fusaka-$mode" --amount "$AMOUNT" \
              --expb-config /mnt/sda/expb-data/github-action-mainnet-fusaka-flat.yaml
          done
      - name: Collect eth_call
        env:
          IMAGE: ${{ env.PGO_IMAGE }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          for mode in instrumentation sampling; do
            uv run --with pyyaml==6.0.2 python scripts/pgo/collect.py ethcall --mode "$mode" \
              --image "$IMAGE" --output "$PGO_RUN/ethcall-$mode" \
              --db-source /mnt/sda/nethermind-flat-25490000 \
              --corpus "/mnt/sda/expb-data/rpc-bench/$CORPUS"
          done
      - name: Build pinned dotnet-pgo
        run: bash scripts/pgo/build-tool.sh "$RUNNER_TEMP/pgo-runtime-${GITHUB_RUN_ATTEMPT}"
      - name: Convert and validate both workloads
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/pgo-runtime-${GITHUB_RUN_ATTEMPT}/artifacts/bin/coreclr/linux.x64.Release/dotnet-pgo/dotnet-pgo.dll"
          test -s "$tool"
          python3 scripts/pgo/convert.py --tool "$tool" --output "$PGO_RUN/profile" \
            "$PGO_RUN/fusaka-instrumentation" "$PGO_RUN/fusaka-sampling" \
            "$PGO_RUN/ethcall-instrumentation" "$PGO_RUN/ethcall-sampling"
      - name: Upload profile and provenance
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-${{ github.sha }}-linux-x64
          path: |
            ${{ env.PGO_RUN }}/profile/*.mibc
            ${{ env.PGO_RUN }}/profile/nethermind.callchain.json
            ${{ env.PGO_RUN }}/profile/manifest.json
          if-no-files-found: error
          retention-days: 30
