name: Collect PGO Profile

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Inspect inputs, collect training, or build matched benchmark images
        required: true
        type: choice
        options: [inventory, instrumentation, benchmark-images]
        default: inventory
      training_amount:
        description: Fusaka payload count for instrumentation (1-1000; start with a bounded fixture)
        required: true
        default: "10"
      training_run_id:
        description: Successful strict 1000-payload training run for benchmark-images
        required: false
      training_source_sha:
        description: Full source commit SHA of that training run
        required: false
      method_selector:
        description: dotnet-pgo include-methods pattern (selection must retain exactly one method)
        required: false
        default: TrieNode.*GetMemorySize
      profile_method:
        description: Exact dotnet-pgo display name to retain
        required: false
        default: "[Nethermind.Trie]Nethermind.Trie.TrieNode.GetMemorySize(bool)"
      diagnostic_method:
        description: Simple method name for compiler assembly evidence
        required: false
        default: GetMemorySize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  EXPB_DATA_DIR: /mnt/sda/expb-data
  PGO_TAG: pgo-${{ github.run_id }}

jobs:
  inventory:
    name: Inspect Fusaka Flat Linux x64 inputs
    if: inputs.phase == 'inventory'
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Save input and capability inventory
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/inventory"
          mkdir -p "${output}"
          git rev-parse HEAD > "${output}/source-sha.txt"
          uv run --with pyyaml==6.0.3 python scripts/pgo/inventory.py \
            --config "${EXPB_DATA_DIR}/github-action-mainnet-fusaka-flat.yaml" \
            --output "${output}/inventory.json"

      - name: Upload inventory including failed probes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/inventory/
          if-no-files-found: error
          retention-days: 90

  benchmark-images:
    if: inputs.phase == 'benchmark-images'
    name: Build matched Fusaka Flat x64 benchmark images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out orchestration source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download and independently validate strict training
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          TRAINING_SHA: ${{ inputs.training_source_sha }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pgo-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/pgo/download_benchmark_bundle.py \
            --root "${root}/bundle" --run-id "${TRAINING_RUN_ID}" --source-sha "${TRAINING_SHA}"
          git fetch --no-tags --depth=1 origin "${TRAINING_SHA}"

      - name: Set up pinned offline tool SDK
        uses: actions/setup-dotnet@v5
        with:
          cache: false
          dotnet-version: "10.0.401"

      - name: Build pinned dotnet-pgo
        shell: bash
        run: |
          set -euo pipefail
          tool_root="${RUNNER_TEMP}/pgo-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/tool"
          mkdir -p "${tool_root}"
          python3 scripts/pgo/prepare_tool.py --destination "${tool_root}/runtime"
          cd "${tool_root}/runtime"
          ./build.sh -c Release --projects "$(pwd)/src/coreclr/tools/dotnet-pgo/dotnet-pgo.csproj"
          tool_dir="${tool_root}/runtime/artifacts/bin/coreclr/linux.x64.Release/dotnet-pgo"
          test -s "${tool_dir}/dotnet-pgo.dll"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec "%s" "%s" "$@"\n' \
            "${tool_root}/runtime/.dotnet/dotnet" "${tool_dir}/dotnet-pgo.dll" > "${tool_dir}/dotnet-pgo"
          chmod +x "${tool_dir}/dotnet-pgo"
          find "${tool_dir}" -type f -print0 | sort -z | xargs -0 sha256sum > "${tool_root}/tool-binaries.sha256"
          echo "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build, validate and publish run-specific runtime images
        shell: bash
        env:
          TRAINING_SHA: ${{ inputs.training_source_sha }}
          METHOD_SELECTOR: ${{ inputs.method_selector }}
          PROFILE_METHOD: ${{ inputs.profile_method }}
          DIAGNOSTIC_METHOD: ${{ inputs.diagnostic_method }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pgo-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/pgo/build_benchmark_images.py \
            --repository "${GITHUB_WORKSPACE}" --bundle "${root}/bundle" \
            --source-sha "${TRAINING_SHA}" --output "${root}/build" \
            --pgo-tool "$(command -v dotnet-pgo)" --selector "${METHOD_SELECTOR}" \
            --method "${PROFILE_METHOD}" --diagnostic-method "${DIAGNOSTIC_METHOD}" \
            --tag-prefix "pgo-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --publish

      - name: Upload configuration-free build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-benchmark-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/bundle-validation.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/source.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/selection.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/rebuilt-inputs.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/images.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/publication-comparison.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/il-baseline-native-headers.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/no-profile-native-headers.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/one-method-profile-native-headers.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/no-profile-properties.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/one-method-profile-properties.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/no-profile-compiler.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/one-method-profile-compiler.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/no-profile.asm
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/build/evidence/one-method-profile.asm
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/tool/runtime-source-manifest.json
            ${{ runner.temp }}/pgo-images-${{ github.run_id }}-${{ github.run_attempt }}/tool/tool-binaries.sha256
          if-no-files-found: error
          retention-days: 90

  build-pgo-image:
    if: inputs.phase == 'instrumentation'
    name: Build PGO collection image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build run-specific x64 collection image
        uses: ./.github/actions/publish-docker
        with:
          image-name: nethermind
          tag: ${{ env.PGO_TAG }}
          dockerfile: Dockerfile.pgo
          build-config: release
          platforms: linux/amd64
          add-master-tag: "false"
          docker-hub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-hub-password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  collect:
    name: Collect PGO profile via EXPB
    needs: [build-pgo-image]
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 720
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve config file
        id: resolve
        shell: bash
        run: |
          echo "config_file=github-action-mainnet-fusaka-flat.yaml" >> "${GITHUB_OUTPUT}"

      - name: Render benchmark config
        id: render-config
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.resolve.outputs.config_file }}
          TRAINING_AMOUNT: ${{ inputs.training_amount }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/collection"
          docker pull "nethermindeth/nethermind:${PGO_TAG}"
          image=$(docker image inspect "nethermindeth/nethermind:${PGO_TAG}" --format '{{index .RepoDigests 0}}')
          uv run --with pyyaml==6.0.3 python scripts/pgo/render_collection.py \
            --config "${EXPB_DATA_DIR}/${CONFIG_FILE}" --root "${root}" \
            --image "${image}" --amount "${TRAINING_AMOUNT}"
          echo "COLLECTION_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "COLLECTION_IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "rendered_config_file=${root}/config.yaml" >> "${GITHUB_OUTPUT}"

      - name: Prepare isolated EXPB with strict Engine API validation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            echo "uv is required but not found in PATH."
            exit 1
          fi
          environment="${COLLECTION_ROOT}/expb-env"
          uv venv "${environment}" --python 3.13
          uv pip install --python "${environment}/bin/python" \
            "git+https://github.com/NethermindEth/execution-payloads-benchmarks@56f83b112a93436a66468b863ed9e47bcd5feba6"
          template=$("${environment}/bin/python" -c 'import expb; from pathlib import Path; print(Path(expb.__file__).parent / "payloads/executor/services/templates/k6-script.js.j2")')
          python3 scripts/pgo/prepare_expb_validation.py --template "${template}" \
            --environment "${environment}" --manifest "${COLLECTION_ROOT}/expb-validation-tool.json"
          echo "${environment}/bin" >> "${GITHUB_PATH}"

      - name: Run EXPB for PGO collection
        id: run-expb
        shell: bash
        working-directory: ${{ env.EXPB_DATA_DIR }}
        env:
          TRAINING_AMOUNT: ${{ inputs.training_amount }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=INT --kill-after=120s 30m expb execute-scenarios \
            --config-file "${{ steps.render-config.outputs.rendered_config_file }}" \
            --per-payload-metrics --per-payload-metrics-logs --print-logs 2>&1 | tee "${COLLECTION_ROOT}/expb.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [[ "${statuses[1]}" != 0 ]]; then
            echo "Failed to retain EXPB log."
            exit 1
          fi
          python3 "${GITHUB_WORKSPACE}/scripts/pgo/validate_collection.py" \
            --log "${COLLECTION_ROOT}/expb.log" --amount "${TRAINING_AMOUNT}" \
            --manifest "${COLLECTION_ROOT}/manifest.json" \
            --exit-code "${statuses[0]}" --output "${COLLECTION_ROOT}/execution-validation.json"

      - name: Check run-owned raw trace
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          traces=("${COLLECTION_ROOT}/pgo/"*.nettrace)
          if [[ "${#traces[@]}" != 1 ]] || [[ ! -s "${traces[0]}" ]]; then
            echo "Expected exactly one complete nonempty trace from this collection run."
            exit 1
          fi
          echo "COLLECTION_TRACE=${traces[0]}" >> "${GITHUB_ENV}"

      - name: Upload run-owned collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/manifest.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/expb.log
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/execution-validation.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/expb-validation-tool.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/pgo/
          if-no-files-found: error
          retention-days: 90

      - name: Set up .NET
        if: always()
        uses: actions/setup-dotnet@v5
        with:
          cache: false
          dotnet-version: "10.0.401"

      - name: Build dotnet-pgo from source
        shell: bash
        run: |
          set -euo pipefail
          tool_root="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/tool"
          mkdir -p "${tool_root}"
          python3 scripts/pgo/prepare_tool.py --destination "${tool_root}/runtime"
          cd "${tool_root}/runtime"
          ./build.sh -c Release \
            --projects "$(pwd)/src/coreclr/tools/dotnet-pgo/dotnet-pgo.csproj"

          dotnet_pgo_dir="${tool_root}/runtime/artifacts/bin/coreclr/linux.x64.Release/dotnet-pgo"
          test -f "${dotnet_pgo_dir}/dotnet-pgo.dll"
          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec "%s" "%s" "$@"\n' \
            "${tool_root}/runtime/.dotnet/dotnet" "${dotnet_pgo_dir}/dotnet-pgo.dll" \
            > "${dotnet_pgo_dir}/dotnet-pgo"
          chmod +x "${dotnet_pgo_dir}/dotnet-pgo"
          find "${dotnet_pgo_dir}" -type f -print0 | sort -z | xargs -0 sha256sum > "${tool_root}/tool-binaries.sha256"
          echo "${dotnet_pgo_dir}" >> "${GITHUB_PATH}"

      - name: Validate smoothing isolation and sample weights
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/PgoToolValidation/PgoToolValidation.csproj -c Release -- \
            "${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/tool/runtime/artifacts/bin/coreclr/linux.x64.Release/dotnet-pgo" \
            src/Nethermind/Nethermind.Runner/pgo/nethermind.mibc

      - name: Upload offline tool identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-tool-identities-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/tool/*-source-manifest.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/tool/tool-binaries.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Convert traces to .mibc and merge with edge profiling
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          validation_dir="${RUNNER_TEMP}/pgo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/profile-validation"
          mkdir -p "${validation_dir}"
          mibc_file="${validation_dir}/nethermind.mibc"
          pgo_dir="${COLLECTION_ROOT}/pgo"

          if [[ ! -d "${pgo_dir}" ]] || [[ -z "$(ls -A "${pgo_dir}" 2>/dev/null)" ]]; then
            echo "No PGO data found in ${pgo_dir}."
            exit 1
          fi

          trace_file="${COLLECTION_TRACE}"
          test -s "${trace_file}"
          ref_dir="${COLLECTION_ROOT}/references"
          mkdir -p "${ref_dir}/app" "${ref_dir}/shared"
          ref_cid=$(docker create --entrypoint /bin/true "${COLLECTION_IMAGE}")
          trap 'docker rm -v "${ref_cid}" >/dev/null' EXIT
          docker cp "${ref_cid}:/nethermind/." "${ref_dir}/app/"
          docker cp "${ref_cid}:/usr/share/dotnet/shared/." "${ref_dir}/shared/"
          python3 scripts/pgo/reference_inventory.py --root "${ref_dir}" --image "${COLLECTION_IMAGE}"

          echo "Converting ${trace_file} to .mibc..."
          trace_mibc="${validation_dir}/trace.mibc"
          create_mibc_args=(
            --trace "${trace_file}"
            --output "${trace_mibc}"
          )
          while IFS= read -r dll; do
            create_mibc_args+=(--reference "${dll}")
          done < "${ref_dir}/references.txt"
          dotnet-pgo create-mibc "${create_mibc_args[@]}"
          dotnet-pgo dump --input "${trace_mibc}" --output "${validation_dir}/dump.json"
          python3 scripts/pgo/validate_profile.py \
            --dump "${validation_dir}/dump.json" --output "${validation_dir}/validation.json" \
            --require instrumentation --require block-counts

          cp "${trace_mibc}" "${mibc_file}"

          echo "Generated .mibc profile:"
          ls -lh "${mibc_file}"
          echo "mibc_file=${mibc_file}" >> "${GITHUB_OUTPUT}"

          # Step 2: Trim .jit edge/block profiling data for runtime PGO
          # .jit files (from DOTNET_WritePGOData) use a JIT-internal text format read
          # back via DOTNET_ReadPGOData — they can't be merged into .mibc by dotnet-pgo.
          jit_file=$(find "${pgo_dir}" -name "*.jit" -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)
          jit_gz="${RUNNER_TEMP}/nethermind.jit.gz"
          if [[ -n "${jit_file}" ]]; then
            echo "Trimming ${jit_file} with PgoTrim..."
            dotnet run --project "${GITHUB_WORKSPACE}/tools/PgoTrim" -c Release -- \
              "${jit_file}" "${jit_gz}" --min-block 100 --min-edge 250
            echo "jit_gz=${jit_gz}" >> "${GITHUB_OUTPUT}"
          else
            echo "No .jit file found — skipping edge profiling trim."
          fi

      - name: Upload matching application and framework references
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-app-references-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/references/app/**/*.dll
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/references/shared/**/*.dll
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/references/manifest.json
            ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/references/references.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload profile validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-profile-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/profile-validation/
          if-no-files-found: error
          retention-days: 90

      - name: Upload .mibc artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-profile
          path: ${{ steps.convert.outputs.mibc_file }}
          retention-days: 14

      - name: Upload trimmed .jit.gz artifact
        if: always() && steps.convert.outputs.jit_gz != ''
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-jit
          path: ${{ steps.convert.outputs.jit_gz }}
          retention-days: 14

      - name: Upload raw PGO data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-pgo-raw-data
          path: ${{ runner.temp }}/pgo-${{ github.run_id }}-${{ github.run_attempt }}/collection/pgo/
          if-no-files-found: warn
          retention-days: 30
