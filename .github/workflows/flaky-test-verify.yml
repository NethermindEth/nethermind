name: Flaky test verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to run the test on before and after the patch in the flaky-fix artifact.
        required: true
        type: string
      baseline:
        description: Also run the test before the patch.
        required: false
        type: boolean
        default: true
    outputs:
      runs:
        description: Number of test runs before and after the patch.
        value: ${{ jobs.verify.outputs.runs }}
      before:
        description: Failed runs before the patch, or "skipped" without a baseline.
        value: ${{ jobs.verify.outputs.before }}
      after:
        description: Failed runs after the patch.
        value: ${{ jobs.verify.outputs.after }}

permissions:
  contents: read

env:
  RUNS: 20

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      runs: ${{ env.RUNS }}
      before: ${{ steps.run.outputs.before }}
      after: ${{ steps.run.outputs.after }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-dotnet

      - uses: ./.github/actions/download-artifact
        with:
          name: flaky-fix
          path: ${{ runner.temp }}/fix

      - name: Run the test before and after the fix
        id: run
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          project=$(sed -n 1p "$RUNNER_TEMP/fix/test.txt")
          filter=$(sed -n 2p "$RUNNER_TEMP/fix/test.txt")
          count_failures() {
            dotnet build "$project" -c release >&2 || { echo "n/a (build failed)"; return; }
            local failed=0 not_run=0 rc
            for _ in $(seq "$RUNS"); do
              rc=0
              dotnet test --project "$project" -c release --no-build -- --filter "$filter" >&2 || rc=$?
              if [ "$rc" -eq 8 ]; then not_run=$((not_run + 1)); elif [ "$rc" -ne 0 ]; then failed=$((failed + 1)); fi
            done
            if [ "$not_run" -gt 0 ]; then echo "n/a (no matching test in $not_run runs)"; else echo "$failed"; fi
          }
          before=skipped
          if [ "$BASELINE" = true ]; then before=$(count_failures); fi
          git apply --binary "$RUNNER_TEMP/fix/fix.patch"
          after=$(count_failures)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "Failed runs out of $RUNS: $before before the fix, $after after it"
          [ "$after" = 0 ] || { echo "::error::The test still fails with the fix"; exit 1; }
