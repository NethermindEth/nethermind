name: "Hive consensus tests"

on:
  push:
    branches: [release/*]

  workflow_dispatch:
    inputs:
      parallelism:
        description: 'Number of concurrently running tests in each job.'
        required: true
        default: '8'
        type: choice
        options: ['1', '2', '3', '4', '8', '16']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create_docker_image:
    name: "Generate docker image"
    outputs:
      cleanRef: ${{ steps.prepare_ref.outputs.cleanRef }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Prepare docker tag
        id: prepare_ref
        run: |
          REF_NAME=${{ github.ref }}
          CLEAN_REF=$(echo "${REF_NAME/refs\/heads\//}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "CLEAN_REF=$CLEAN_REF" >> $GITHUB_ENV
          echo "cleanRef=$CLEAN_REF" >> $GITHUB_OUTPUT

      - name: Set Repo and Org Variables
        id: cleanup
        run: |
          echo "ORG_NAME=${{ github.repository_owner }}" >> $GITHUB_ENV
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: Check if master or release branch
        id: check_conditions
        run: |
          ref="${{ github.ref }}"
          event_name="${{ github.event_name }}"

          # Append "refs/heads/" prefix if it's not already there
          if [[ $ref != refs/heads/* ]]; then
            ref="refs/heads/$ref"
          fi

          # Initialize variables
          skip_docker_build="false"
          skip_wait_for_docker="false"

          # Set conditions based on branch and event type
          if [[ "$ref" == "refs/heads/master" || $ref == refs/heads/release* ]]; then
            skip_docker_build="true"

            if [[ "$event_name" == "workflow_dispatch" ]]; then
              skip_wait_for_docker="true"
            fi
          fi

          # Output the variables
          echo "skip_docker_build=$skip_docker_build" >> $GITHUB_OUTPUT
          echo "skip_wait_for_docker=$skip_wait_for_docker" >> $GITHUB_OUTPUT

      - name: Trigger Docker Build Action with Cleaned Ref
        if: steps.check_conditions.outputs.skip_docker_build != 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: publish-docker.yml
          ref: "${{ github.ref }}"
          token: "${{ steps.gh-app.outputs.token }}"
          inputs: '{
            "tag": "${{ env.CLEAN_REF }}",
            "dockerfile": "Dockerfile",
            "build-config": "release"
            }'

      - name: Wait for Docker Build Action to complete
        if: steps.check_conditions.outputs.skip_wait_for_docker != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.gh-app.outputs.token }}
          WORKFLOW_ID: 'publish-docker.yml'
          MAX_WAIT_MINUTES: '20'
          INTERVAL: '5'
          TIMEOUT: '20'
          ORG_NAME: ${{ env.ORG_NAME }}
          REPO_NAME: ${{ env.REPO_NAME }}
          REF: ${{ github.ref }}
        run: |
          chmod +x scripts/wait-for-workflow.sh
          ./scripts/wait-for-workflow.sh
        working-directory: ${{ github.workspace }}

  generate_hive_consensus_tests:
    name: "Prepare all hive tests to be started"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    needs: [create_docker_image]
    steps:
      - name: Check out Nethermind repository
        uses: actions/checkout@v6
        with:
          path: nethermind
          submodules: "recursive"
      - name: Check out patched legacy tests
        uses: actions/checkout@v6
        with:
          repository: flcl42/tests
          ref: 0f5b15416604a221ce68b8c3d58830d4512c0e00
          path: tests
          submodules: "recursive"
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: nethermind/global.json
      - name: Generate Hive Json For Matrix
        id: set-matrix
        run: |
          cd nethermind/tools/HiveConsensusWorkflowGenerator
          dotnet run -p:SaveDiskSpace=true -- ../tests/LegacyTests/Cancun
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> $GITHUB_OUTPUT

  run_hive_tests:
    runs-on: ubuntu-latest
    needs: [generate_hive_consensus_tests, create_docker_image]
    strategy:
      fail-fast: false
      matrix:
        hiveTests: ${{fromJson(needs.generate_hive_consensus_tests.outputs.matrix)}}
    steps:
      - name: Set up parameters
        run: |
          echo "PARALLELISM=${{ github.event.inputs.parallelism || '8' }}" >> $GITHUB_ENV

      - name: Check out Nethermind repository
        uses: actions/checkout@v6
        with:
          path: nethermind

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install libsnappy-dev libc6-dev libc6 build-essential

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.17.0'

      - name: Check out Hive repository
        uses: actions/checkout@v6
        with:
          repository: flcl42/hive
          ref: 2fbdf5ecfd892337409d92b10e45f6d09d9f1db9
          path: hive

      - name: Patch Hive Dockerfile
        run: |
          tag=${{ needs.create_docker_image.outputs.cleanRef }}
          sed -i -e "s|^ARG baseimage=.*|ARG baseimage=nethermindeth/nethermind|" -e "s|^ARG tag=.*|ARG tag=$tag|" hive/clients/nethermind/Dockerfile

      - name: Build Hive
        working-directory: hive
        run: go build .

      - name: Run hive for tests - ${{ join(matrix.hiveTests.testNames, ', ') }}
        id: run-hive
        continue-on-error: true
        working-directory: hive
        run: |
          set -euo pipefail
          IFS=',' read -ra TEST_NAMES <<< "${{ join(matrix.hiveTests.testNames, ',') }}"
          echo "expected_loaders=${#TEST_NAMES[@]}" >> "$GITHUB_OUTPUT"
          tests_failed=false
          mkdir -p workspace/logs
          for testName in "${TEST_NAMES[@]}"
          do
            completed=false
            for attempt in 1 2 3
            do
              before_results=$(mktemp)
              find workspace/logs -maxdepth 1 -type f -name '*.json' -print | sort > "$before_results"
              run_log=$(mktemp)
              set +e
              ./hive --client nethermind --sim ethereum/consensus --sim.limit legacy-cancun/$testName --sim.limit.exact --sim.parallelism $PARALLELISM 2>&1 | tee "$run_log"
              hive_status=${PIPESTATUS[0]}
              set -e
              if grep -Eq 'suites=[1-9][0-9]*([[:space:]]|$)' "$run_log"
              then
                completed=true
                if (( hive_status != 0 ))
                then
                  tests_failed=true
                fi
                rm -f "$before_results" "$run_log"
                break
              fi
              echo "Retrying $testName after incomplete Hive attempt $attempt (exit $hive_status)."
              after_results=$(mktemp)
              find workspace/logs -maxdepth 1 -type f -name '*.json' -print | sort > "$after_results"
              comm -13 "$before_results" "$after_results" | while IFS= read -r result_file
              do
                rm -f -- "$result_file"
              done
              rm -f "$after_results" "$before_results" "$run_log"
            done
            if [[ "$completed" != "true" ]]
            then
              echo "Hive did not complete $testName after three attempts."
              exit 1
            fi
          done
          if [[ "$tests_failed" == "true" ]]
          then
            exit 1
          fi
      - name: Print results
        continue-on-error: true
        run: |
          chmod +x nethermind/scripts/hive-results.sh
          nethermind/scripts/hive-results.sh "hive/workspace/logs/*.json"
      - name: Record strict result counts
        id: strict_counts
        if: always()
        env:
          HIVE_OUTCOME: ${{ steps.run-hive.outcome }}
          EXPECTED_LOADERS: ${{ steps.run-hive.outputs.expected_loaders }}
        run: |
          shopt -s nullglob
          result_files=(hive/workspace/logs/*.json)
          output="legacy-cancun-counts-${{ strategy.job-index }}.json"
          expected_loaders=${EXPECTED_LOADERS:-0}
          if (( ${#result_files[@]} == 0 )); then
            jq -n --arg outcome "$HIVE_OUTCOME" --argjson expected_loaders "$expected_loaders" \
              '{passed: 0, failed: 0, loader_passed: 0, loader_failed: 0, expected_loaders: $expected_loaders, complete: false, outcome: $outcome}' > "$output"
          else
            jq -s --arg outcome "$HIVE_OUTCOME" --argjson expected_loaders "$expected_loaders" '
              {
                passed: ([.[] | (.testCases // [])[] | select(.name != "test file loader" and .summaryResult.pass == true)] | length),
                failed: ([.[] | (.testCases // [])[] | select(.name != "test file loader" and .summaryResult.pass == false)] | length),
                loader_passed: ([.[] | (.testCases // [])[] | select(.name == "test file loader" and .summaryResult.pass == true)] | length),
                loader_failed: ([.[] | (.testCases // [])[] | select(.name == "test file loader" and .summaryResult.pass == false)] | length),
                outcome: $outcome
              }
              | . + {
                  expected_loaders: $expected_loaders,
                  complete: ($outcome == "success" and .loader_passed == $expected_loaders and .loader_failed == 0)
                }
            ' "${result_files[@]}" > "$output"
          fi
          cat "$output"
          echo "failed=$(jq -r '.failed' "$output")" >> "$GITHUB_OUTPUT"
          echo "loader_failed=$(jq -r '.loader_failed' "$output")" >> "$GITHUB_OUTPUT"
          echo "complete=$(jq -r '.complete' "$output")" >> "$GITHUB_OUTPUT"
      - name: Upload strict result counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-cancun-counts-${{ strategy.job-index }}
          path: legacy-cancun-counts-${{ strategy.job-index }}.json
          overwrite: true
          retention-days: 7
      - name: Upload failed shard workspace
        if: always() && (steps.strict_counts.outputs.complete != 'true' || steps.strict_counts.outputs.failed != '0' || steps.strict_counts.outputs.loader_failed != '0')
        uses: actions/upload-artifact@v7
        with:
          name: legacy-cancun-failure-${{ strategy.job-index }}
          path: hive/workspace
          retention-days: 7
      # - name: Send results to dashboard
      #   uses: appleboy/scp-action@master
      #   with:
      #     host: ${{ secrets.HIVE_HOST }}
      #     username: ${{ secrets.HIVE_USERNAME }}
      #     key: ${{ secrets.HIVE_KEY }}
      #     port: ${{ secrets.HIVE_PORT }}
      #     source: hive/workspace/logs/*
      #     target: ${{ secrets.HIVE_DIR }}/

  aggregate_hive_results:
    name: "Aggregate legacy-cancun results"
    if: always()
    needs: [run_hive_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download strict result counts
        uses: actions/download-artifact@v8
        with:
          pattern: legacy-cancun-counts-*
          path: counts
          merge-multiple: true
      - name: Verify the complete suite is green
        env:
          MATRIX_RESULT: ${{ needs.run_hive_tests.result }}
        run: |
          shopt -s nullglob
          count_files=(counts/*.json)
          if (( ${#count_files[@]} == 0 )); then
            echo "No result-count artifacts were produced."
            exit 1
          fi
          summary=$(jq -s '
            {
              jobs: length,
              complete_jobs: ([.[] | select(.complete == true)] | length),
              passed: (map(.passed) | add),
              failed: (map(.failed) | add),
              loader_passed: (map(.loader_passed) | add),
              loader_failed: (map(.loader_failed) | add),
              expected_loaders: (map(.expected_loaders) | add)
            }
          ' "${count_files[@]}")
          echo "$summary"
          jobs=$(jq -r '.jobs' <<< "$summary")
          complete_jobs=$(jq -r '.complete_jobs' <<< "$summary")
          passed=$(jq -r '.passed' <<< "$summary")
          failed=$(jq -r '.failed' <<< "$summary")
          loader_passed=$(jq -r '.loader_passed' <<< "$summary")
          loader_failed=$(jq -r '.loader_failed' <<< "$summary")
          expected_loaders=$(jq -r '.expected_loaders' <<< "$summary")
          if [[ "$MATRIX_RESULT" != "success" || "$jobs" -ne 256 || "$complete_jobs" -ne 256 || "$passed" -ne 112031 || "$failed" -ne 0 || "$loader_passed" -ne 3288 || "$loader_failed" -ne 0 || "$expected_loaders" -ne 3288 ]]; then
            exit 1
          fi
