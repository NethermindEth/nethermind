name: Release

on:
  workflow_dispatch:

permissions:
  deployments: write
  packages: write
  contents: write

env:
  PACKAGE_DIR: pkg
  PACKAGE_RETENTION: 7
  PUB_DIR: pub

jobs:
  build:
    name: Build Nethermind packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package-prefix: ${{ steps.version.outputs.package-prefix }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Detect version
        id: version
        working-directory: src/Nethermind
        run: |
          sudo apt-get update && sudo apt-get install xmlstarlet -y --no-install-recommends
          version_prefix=$(xmlstarlet sel -t -v "//Project/PropertyGroup/VersionPrefix" Directory.Build.props)
          version_suffix=$(xmlstarlet sel -t -v "//Project/PropertyGroup/VersionSuffix" -n Directory.Build.props)
          version=$([[ -n "$version_suffix" ]] && echo "$version_prefix-$version_suffix" || echo "$version_prefix")
          package_prefix=nethermind-$version-${GITHUB_SHA:0:8}
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "prerelease=$([[ -n "$version_suffix" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "package-prefix=$package_prefix" >> $GITHUB_OUTPUT
          echo "PACKAGE_PREFIX=$package_prefix" >> $GITHUB_ENV

      - name: Verify signed release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The signers are read from master, so a branch cannot vouch for its own release
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/master:refs/remotes/origin/master" "+refs/tags/$VERSION:refs/tags/$VERSION"

          if [[ "$(git cat-file -t "refs/tags/$VERSION")" != "tag" ]]; then
            echo "::error::Tag $VERSION must be an annotated, signed tag"
            exit 1
          fi

          if [[ "$(git rev-parse "refs/tags/$VERSION^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERSION does not point to $GITHUB_SHA"
            exit 1
          fi

          signers=$(mktemp -d)
          git archive origin/master .github/release-signers | tar -x -C "$signers" --strip-components=2
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --import "$signers"/*.asc
          git -c gpg.ssh.allowedSignersFile="$signers/allowed_signers" verify-tag "$VERSION"

      - name: Build Nethermind.Runner
        id: build
        run: |
          mkdir $PUB_DIR
          docker build . -t nethermind-build -f scripts/build/Dockerfile \
            --build-arg COMMIT_HASH=$GITHUB_SHA \
            --build-arg SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          docker run --rm --mount type=bind,source=./$PUB_DIR,target=/output nethermind-build

      - name: Archive packages
        run: scripts/build/archive.sh

      - name: Upload Nethermind Linux arm64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-linux-arm64-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*linux-arm64*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

      - name: Upload Nethermind Linux x64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-linux-x64-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*linux-x64*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

      - name: Upload Nethermind macOS arm64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-macos-arm64-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*macos-arm64*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

      - name: Upload Nethermind macOS x64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-macos-x64-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*macos-x64*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

      - name: Upload Nethermind Windows arm64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-windows-arm64-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*windows-arm64*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

      - name: Upload Nethermind Windows x64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-windows-x64-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*windows-x64*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

      - name: Upload Nethermind reference assemblies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_PREFIX }}-ref-assemblies-package
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*ref-assemblies*
          compression-level: 0
          retention-days: ${{ env.PACKAGE_RETENTION }}

  approval:
    name: Approve and sign
    runs-on: ubuntu-latest
    needs: build
    # Signing runs only after approval, so the signing key is never exposed to an unapproved run
    environment:
      name: Releases
      url: https://github.com/NethermindEth/nethermind/releases/tag/${{ needs.build.outputs.version }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.build.outputs.package-prefix }}-*-package
          merge-multiple: true
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}

      - name: Write checksums
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          find . -maxdepth 1 -name '*.zip' ! -name '*-ref-assemblies.zip' -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Sign packages
        env:
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          GPG_SECRET_KEY: ${{ secrets.PPA_GPG_SECRET_KEY }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          printf '%s' "$GPG_SECRET_KEY" | base64 --decode | gpg --import --no-tty --batch --yes

          for file_name in $(awk '{print $2}' SHA256SUMS) SHA256SUMS; do
            gpg --no-tty --batch --yes --pinentry-mode loopback \
              --passphrase-file <(printf '%s' "$GPG_PASSPHRASE") \
              -o "$file_name.asc" -ab "$file_name"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*.zip

      - name: Upload signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.package-prefix }}-signatures
          path: |
            ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/SHA256SUMS
            ${{ github.workspace }}/${{ env.PACKAGE_DIR }}/*.asc
          retention-days: ${{ env.PACKAGE_RETENTION }}

  publish-github:
    name: Publish to GitHub
    runs-on: ubuntu-latest
    needs: [approval, build]
    steps:
      - name: Check out Nethermind repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ github.workspace }}/${{ env.PACKAGE_DIR }}

      - name: Publish
        env:
          GIT_TAG: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ steps.gh-app.outputs.token }}
        run: |
          cp $PACKAGE_DIR/**/*.zip $PACKAGE_DIR/**/*.asc $PACKAGE_DIR/**/SHA256SUMS $PACKAGE_DIR
          rm -rf $PACKAGE_DIR/*/
          rm -f $PACKAGE_DIR/*-ref-assemblies.zip
          echo "Publishing packages to GitHub"
          prerelease=${{ needs.build.outputs.prerelease && '1' || '' }}
          if gh release view "$GIT_TAG" >/dev/null 2>&1; then publish=1; else publish=0; fi

          if (( !publish )); then
            echo "Drafting release $GIT_TAG"
            relnotes=$(cat <<'EOF'
          # Release notes

          ### [CONTENT PLACEHOLDER]

          #### Build signatures

          The packages and `SHA256SUMS` are signed with the following OpenPGP key: `AD12 7976 5093 C675 9CD8 A400 24A7 7461 6F1E 617E`

          Every package also has a build provenance attestation: `gh attestation verify <package> -R NethermindEth/nethermind`
          EOF
          )
            gh release create "$GIT_TAG" --verify-tag -t "v$GIT_TAG" -d ${prerelease:+-p} -F <(printf '%s' "$relnotes")
          fi

          cd $PACKAGE_DIR
          echo "Uploading assets"
          gh release upload "$GIT_TAG" *.zip *.asc SHA256SUMS --clobber

          if (( publish )); then
            echo "Publishing release $GIT_TAG"
            if [[ -n "$prerelease" ]]; then flag="--prerelease"; else flag="--latest"; fi
            gh release edit "$GIT_TAG" --verify-tag --target "$GITHUB_SHA" -t "v$GIT_TAG" --draft=false $flag
          fi

          echo "Publishing completed"

  publish-docker:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [approval, build]
    # The release Docker Hub OIDC connection only trusts tokens issued for this environment
    environment: Releases
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      matrix:
        # One image per job, so each is attested while the job's Docker Hub token is still valid
        dockerfile: [Dockerfile, Dockerfile.chiseled]
    steps:
      - name: Check out Nethermind repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_RELEASE_OIDC_CONNECTIONID }}
          # The token must outlive the multi-platform build, as buildx only pushes at the end
          DOCKERHUB_OIDC_EXPIREIN: 3600
        with:
          username: ${{ vars.DOCKERHUB_RELEASE_ORGANIZATION }}

      - name: Build and push image to Docker Hub
        id: build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          image=nethermind/nethermind
          # The OCI created label must be RFC 3339 and must come from the same commit timestamp
          # as SOURCE_DATE_EPOCH, or the image stops being reproducible.
          source_date_epoch=$(git log -1 --format=%ct)
          build_timestamp=$(date -u -d @$source_date_epoch +%Y-%m-%dT%H:%M:%SZ)

          suffix=${DOCKERFILE#Dockerfile}
          tag_suffix=$([[ -z "$suffix" ]] && echo "" || echo "-${suffix:1}")
          # BuildKit's own provenance embeds a per-build invocation ID in the image index, so it is
          # disabled to keep the index digest reproducible; the attestation below replaces it.
          docker buildx build . --platform=linux/amd64,linux/arm64 -f $DOCKERFILE \
            ${{ needs.build.outputs.prerelease == 'false' && '-t $image:latest$tag_suffix' || '' }} \
            -t "$image:${{ needs.build.outputs.version }}$tag_suffix" \
            --build-arg CI=$CI \
            --build-arg COMMIT_HASH=$GITHUB_SHA \
            --build-arg VERSION=${{ needs.build.outputs.version }} \
            --build-arg SOURCE_DATE_EPOCH=$source_date_epoch \
            --build-arg BUILD_TIMESTAMP=$build_timestamp \
            --provenance=false \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --output type=registry,rewrite-timestamp=true
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")" >> $GITHUB_OUTPUT

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/nethermind/nethermind
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
