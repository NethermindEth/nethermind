name: Sync Supported Chains

on:
  workflow_dispatch:
    inputs:
      nethermind_image:
        description: "Docker image to be used by action"
        default: ""
        required: false
      mode:
        description: "Sync mode to run"
        type: choice
        options:
          - Both
          - HalfPath
          - Flat
        default: Both
        required: true
      network_filter:
        description: "Useful for manual execution on only specified networks - provide partial or full name. Will execute action only on networks which contains phrase."
        default: ""
        required: false
      nethermind_args:
        description: "Additional arguments that will be passed to Nethermind, without leading dashes. Example: log=DEBUG"
        default: ""
        required: false
      provisioning_model:
        description: "Override the per-network Spot/Standard choice from testnet-matrix.json"
        type: choice
        options:
          - Default
          - Spot
          - Standard
        default: Default
        required: false
      machine_type:
        description: "Override the per-network GCE machine type. Empty uses testnet-matrix.json."
        default: ""
        required: false

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: "1"
  TERM: xterm

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: nethermind
          ref: ${{ github.ref_name || 'master' }}

      - name: Set Matrix
        id: set-matrix
        env:
          NETWORK_FILTER: ${{ inputs.network_filter }}
          MODE_INPUT: ${{ inputs.mode }}
          PROVISIONING_INPUT: ${{ inputs.provisioning_model }}
          MACHINE_TYPE_INPUT: ${{ inputs.machine_type }}
        run: |
          matrix=$(cat nethermind/scripts/config/testnet-matrix.json)

          if [ -n "$NETWORK_FILTER" ]; then
            matrix=$(echo "$matrix" | jq --arg filter "$NETWORK_FILTER" '[.[] | select(.network | contains($filter))]')
          fi

          requested_mode=$(echo "$MODE_INPUT" | tr '[:upper:]' '[:lower:]')

          case "$requested_mode" in
            both)
              modes='["HalfPath","Flat"]'
              ;;
            halfpath)
              modes='["HalfPath"]'
              ;;
            flat)
              modes='["Flat"]'
              ;;
            *)
              echo "Unsupported mode '$requested_mode'. Expected 'Both', 'HalfPath', or 'Flat'."
              exit 1
              ;;
          esac

          matrix=$(echo "$matrix" | jq \
            --argjson modes "$modes" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg model "$PROVISIONING_INPUT" \
            --arg machine_type "$MACHINE_TYPE_INPUT" '
            [.[] as $config
             | $modes[] as $mode
             | $config + {
                 mode: $mode,
                 runner_label: (
                   (if $mode == "Flat" then "f-" else "hp-" end)
                   + $run_id + "-" + $config.network
                 ),
                 machine_type: (if $machine_type == "" then $config.machine_type else $machine_type end),
                 provisioning_model: (
                   if $model == "Spot" then "SPOT"
                   elif $model == "Standard" then "STANDARD"
                   elif $config.spot then "SPOT"
                   else "STANDARD"
                   end
                 ),
                 max_run_duration: ((($config.timeout + 60) | tostring) + "m")
               }]
            | sort_by(if .mode == "Flat" then 0 else 1 end)
            | to_entries
            | map(.value + { batch_index: ((.key / 5) | floor) })
          ')

          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  create_a_runner:
    needs: [setup-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stagger runner creation
        if: ${{ matrix.config.batch_index > 0 }}
        env:
          BATCH: ${{ matrix.config.batch_index }}
        run: |
          echo "Batch $BATCH — sleeping $(( BATCH * 10 ))s to spread zone capacity pressure"
          sleep $(( BATCH * 10 ))

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name || 'master' }}

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Create a Runner
        uses: ./.github/actions/gcp-runner
        with:
          action: create
          runner_label: ${{ matrix.config.runner_label }}
          github_token: ${{ steps.gh-app.outputs.token }}
          machine_type: ${{ matrix.config.machine_type }}
          local_ssd_count: ${{ matrix.config.local_ssd_count }}
          provisioning_model: ${{ matrix.config.provisioning_model }}
          max_run_duration: ${{ matrix.config.max_run_duration }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  sync-chain:
    needs: [setup-matrix, create_a_runner]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    name: "Run sync of ${{ matrix.config.network }} (${{ matrix.config.mode }}) chain"
    runs-on: ${{ matrix.config.runner_label }}
    timeout-minutes: ${{ matrix.config.timeout }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: "nethermind,post-merge-smoke-tests"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          ref: ${{ github.ref_name || 'master' }}

      - name: Resolve Nethermind image
        id: image
        env:
          IMAGE_INPUT: ${{ inputs.nethermind_image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$IMAGE_INPUT" ]; then
            echo "docker_image=$IMAGE_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == release/* ]]; then
            clean_ref=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "docker_image=nethermindeth/nethermind:$clean_ref" >> "$GITHUB_OUTPUT"
          else
            echo "docker_image=nethermindeth/nethermind:master" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync ${{ matrix.config.network }}
        uses: ./.github/actions/sync-chain
        with:
          network: ${{ matrix.config.network }}
          mode: ${{ matrix.config.mode }}
          docker_image: ${{ steps.image.outputs.docker_image }}
          node_name_prefix: SyncSupportedChains
          cl: ${{ matrix.config.cl }}
          cl_image: ${{ matrix.config.cl_image }}
          checkpoint_sync_url: ${{ matrix.config.checkpoint-sync-url }}
          nethermind_args: ${{ inputs.nethermind_args }}
          tests_token: ${{ steps.gh-app.outputs.token }}
          mainnet_consensus_url: ${{ secrets.MAINNET_CONSENSUS_URL }}
          mainnet_execution_url: ${{ secrets.MAINNET_EXECUTION_URL }}
          sepolia_consensus_url: ${{ secrets.SEPOLIA_CONSENSUS_URL }}
          sepolia_execution_url: ${{ secrets.SEPOLIA_EXECUTION_URL }}
          hoodi_consensus_url: ${{ secrets.HOODI_CONSENSUS_URL }}
          hoodi_execution_url: ${{ secrets.HOODI_EXECUTION_URL }}
          loki_url: ${{ secrets.LOKI_URL }}
          loki_username: ${{ secrets.LOKI_USERNAME }}
          loki_password: ${{ secrets.LOKI_PASSWORD }}
          prometheus_url: ${{ secrets.PROMETHEUS_URL }}
          prometheus_username: ${{ secrets.PROMETHEUS_USERNAME }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD }}

      # Frees each VM as its own sync ends. destroy_runner cannot: matrix-to-matrix needs
      # waits for the whole matrix, so without this a 45-minute hoodi VM would bill until
      # op-mainnet finishes ten hours later.
      - name: Release this runner
        if: always()
        uses: ./.github/actions/gcp-runner
        with:
          action: destroy-self
          runner_label: ${{ matrix.config.runner_label }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  destroy_runner:
    needs: [setup-matrix, create_a_runner, sync-chain]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name || 'master' }}

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Destroy Runner
        uses: ./.github/actions/gcp-runner
        with:
          action: destroy
          runner_label: ${{ matrix.config.runner_label }}
          github_token: ${{ steps.gh-app.outputs.token }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  trigger_tests:
    needs: [setup-matrix, create_a_runner, sync-chain, destroy_runner]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: "nethermind,post-merge-smoke-tests"

      - name: Trigger notification action on test repo
        if: startsWith(github.event.workflow_run.head_branch, 'release/')
        continue-on-error: true
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: receive-push-notification.yml
          repo: NethermindEth/post-merge-smoke-tests
          ref: "main"
          token: "${{ steps.gh-app.outputs.token }}"
          inputs: '{
            "nethermind_branch": "refs/heads/${{ github.event.workflow_run.head_branch }}"
          }'
