name: Update docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag
        required: true
        default: master

permissions:
  contents: read

jobs:
  update-docs:
    name: Update docs
    runs-on: ubuntu-latest
    # Component releases (e.g. the ZisK guest) ship no docs
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'zisk-guest-')
    steps:
      - name: Create GitHub app token
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            nethermind
            docs

      - name: Check out Nethermind repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: n

      - name: Check out Nethermind docs repository
        uses: actions/checkout@v7
        with:
          repository: NethermindEth/docs
          path: d
          token: ${{ steps.gh-app.outputs.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: n/global.json

      - name: Build DocGen
        working-directory: n
        run: dotnet build tools/DocGen/DocGen.csproj -c release -o DocGen

      - name: Generate docs
        run: n/DocGen/DocGen $GITHUB_WORKSPACE/d --config --jsonrpc --metrics

      - name: Tag a new version
        if: github.event_name == 'release' && !github.event.release.prerelease
        working-directory: d
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm ci
          npm run docusaurus docs:version "$TAG"

      - name: Create a pull request
        working-directory: d
        env:
          GH_TOKEN: ${{ steps.gh-app.outputs.token }}
          # Passed through the environment so that a dispatch input cannot be
          # interpolated into the script of a step holding the app token
          VERSION: ${{ github.event_name == 'release' && format('v{0}', github.event.release.tag_name) || inputs.ref }}
        run: |
          set -euo pipefail
          git add -A

          if git diff --cached --quiet; then
            echo "The docs are already up to date"
            exit 0
          fi

          head_branch=docs/auto-update-${{ github.run_number }}-${{ github.run_attempt }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $head_branch
          git commit -m "docs: generated from $VERSION"
          git push origin $head_branch
          gh pr create -B main -H $head_branch -t "docs: update for $VERSION" \
            -b "Generated docs based on $VERSION." -l docgen
