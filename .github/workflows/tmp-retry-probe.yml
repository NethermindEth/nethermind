name: Temporary retry probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload-late:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write the file after 20 s
        run: (sleep 20 && echo probe > probe.txt) > /dev/null 2>&1 &

      - name: Upload (fails until the file exists)
        uses: ./.github/actions/upload-artifact
        with:
          name: retry-probe
          path: probe.txt
          if-no-files-found: error
          retention-days: 1

  download-early:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download (fails until the upload completes)
        uses: ./.github/actions/download-artifact
        with:
          name: retry-probe
          path: probe

      - name: Check the content
        run: test "$(cat probe/probe.txt)" = probe
