name: Flaky test follow-up

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]
    branches: ["test/flaky-**"]

permissions:
  contents: read

env:
  LABEL: flaky-test
  FOLLOW_UP_RUNS: 200
  MAX_REVIEW_ROUNDS: 3
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

defaults:
  run:
    shell: bash

jobs:
  follow-up:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'test/flaky-')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: flaky-test-follow-up-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: read
      id-token: write
    outputs:
      verified: ${{ steps.verify.outcome == 'success' }}
      number: ${{ steps.pr.outputs.number }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Find the PR and its review verdict
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --label "$LABEL" --state open \
            --json number,isDraft,headRefOid,headRepositoryOwner,commits --jq '.[0] // empty')
          [ -n "$pr" ] || exit 0
          [ "$(jq -r .headRepositoryOwner.login <<< "$pr")" = "$GITHUB_REPOSITORY_OWNER" ] || exit 0
          [ "$(jq -r .headRefOid <<< "$pr")" = "$SHA" ] || exit 0
          [ "$(jq -r .isDraft <<< "$pr")" = true ] || exit 0
          status=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" |
            jq -c 'flatten | map(select(.context == "claude-review/reviewed")) | first // {}')
          state=$(jq -r '.state // ""' <<< "$status")
          if [ "$state" = success ] && ! jq -e '.description // "" | startswith("Claude reviewed: no blockers")' <<< "$status" >/dev/null; then
            state=unavailable
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "rounds=$(( $(jq '.commits | length' <<< "$pr") - 1 ))" >> "$GITHUB_OUTPUT"

      - name: Decide the next step
        id: next
        if: steps.pr.outputs.number && contains(fromJSON('["success","failure","unavailable"]'), steps.pr.outputs.state)
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.pr.outputs.state }}
          ROUNDS: ${{ steps.pr.outputs.rounds }}
        run: |
          if [ "$STATE" = unavailable ]; then step=ask
          elif [ "$STATE" = success ]; then step=ready
          elif [ "$ROUNDS" -ge "$MAX_REVIEW_ROUNDS" ]; then step=hand-over
          else
            gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/ci/flaky_tests.py?ref=master" \
              > "$RUNNER_TEMP/flaky_tests.py"
            slot=$(GITHUB_OUTPUT=/dev/null python3 "$RUNNER_TEMP/flaky_tests.py" claude-slot --repo "$GITHUB_REPOSITORY")
            if [[ "$slot" == flaky-claude-* ]]; then step=fix; else step=wait; fi
          fi
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Authenticate App
        if: contains(fromJSON('["ready","hand-over","ask","wait"]'), steps.next.outputs.step)
        id: notify-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Send for review
        if: steps.next.outputs.step == 'ready'
        env:
          GH_TOKEN: ${{ steps.notify-app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr ready "$PR" --repo "$GITHUB_REPOSITORY"

      - name: Ask for a review rerun
        if: steps.next.outputs.step == 'ask'
        env:
          GH_TOKEN: ${{ steps.notify-app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Claude review was unavailable for this commit. To rerun it, add and remove the \`wip\` label."

      - name: Wait for tomorrow's Claude runs
        if: steps.next.outputs.step == 'wait'
        env:
          GH_TOKEN: ${{ steps.notify-app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Today's limit of Claude runs is used up. To retry, add and remove the \`wip\` label tomorrow."

      - name: Hand over after too many review rounds
        if: steps.next.outputs.step == 'hand-over'
        env:
          GH_TOKEN: ${{ steps.notify-app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Claude review still has blocking findings after $MAX_REVIEW_ROUNDS rounds. Handing this over to the code owners."
          gh pr ready "$PR" --repo "$GITHUB_REPOSITORY"

      - uses: actions/checkout@v6
        if: steps.next.outputs.step == 'fix'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Collect review findings from trusted authors
        if: steps.next.outputs.step == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/ci/flaky_tests.py?ref=master" \
            > "$RUNNER_TEMP/flaky_tests.py"
          mkdir -p "$RUNNER_TEMP/claude"
          python3 "$RUNNER_TEMP/flaky_tests.py" feedback --repo "$GITHUB_REPOSITORY" --pr "$PR" --out "$RUNNER_TEMP/claude/feedback.md"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          cp "$RUNNER_TEMP/pr-body.md" "$RUNNER_TEMP/claude/pr-body.md"

      - if: steps.next.outputs.step == 'fix'
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - if: steps.next.outputs.step == 'fix'
        uses: actions/setup-dotnet@v5

      - name: Address review findings
        if: steps.next.outputs.step == 'fix'
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            This branch fixes a flaky test. Claude review marked it not mergeable. The unresolved review findings
            from trusted authors are in `${{ runner.temp }}/claude/feedback.md`; the PR description, with the project and
            test filter under Evidence, is in `${{ runner.temp }}/claude/pr-body.md`.

            Fix every unresolved Critical, High and Medium finding. Keep the flaky-test fix intact.
            Do not change .github/, .agents/, scripts/, AGENTS.md, CLAUDE.md, *.props, *.targets, *.csproj, global.json or NuGet.Config: such changes are rejected.
            Follow AGENTS.md, CONTRIBUTING.md and .agents/rules/.

            Rebuild the project with `dotnet build ... -c release` and rerun
            `python3 scripts/ci/flaky_tests.py repeat --project <project> --filter '<test filter>' --runs 200 --budget 1800 --stop-after 1 --out-dir ${{ runner.temp }}/claude/reruns`
            until it reports 0 failures. Do not commit or push.
          claude_args: |
            --model opus
            --add-dir ${{ runner.temp }}/claude
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(dotnet build:*),Bash(python3 scripts/ci/flaky_tests.py:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"

      - name: Check the change
        if: steps.next.outputs.step == 'fix'
        id: check
        env:
          PR_BODY: ${{ runner.temp }}/pr-body.md
        run: |
          git add -A
          git diff --cached --quiet && { echo "::error::Claude produced no change"; exit 1; }
          git diff --cached --no-renames --name-only -z | xargs -0 python3 "$RUNNER_TEMP/flaky_tests.py" guard
          project=$(sed -n '/^## Evidence$/,$ s/^- Project: `\(.*\)`$/\1/p' "$PR_BODY" | tail -n 1)
          filter=$(sed -n '/^## Evidence$/,$ s/^- Test filter: `\(.*\)`$/\1/p' "$PR_BODY" | tail -n 1)
          [[ "$project" =~ ^Nethermind(\.[A-Za-z0-9]+)+\.Test$ ]] || { echo "::error::Bad project in PR body"; exit 1; }
          mkdir -p "$RUNNER_TEMP/patch"
          git diff --cached --binary > "$RUNNER_TEMP/patch/fix.patch"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"

      - if: steps.check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flaky-follow-up-patch
          path: ${{ runner.temp }}/patch/fix.patch

      - name: Verify the change
        if: steps.check.outcome == 'success'
        id: verify
        env:
          PROJECT: ${{ steps.check.outputs.project }}
          FILTER: ${{ steps.check.outputs.filter }}
        run: |
          dotnet build "src/Nethermind/$PROJECT/$PROJECT.csproj" -c release
          python3 "$RUNNER_TEMP/flaky_tests.py" repeat --project "$PROJECT" --filter "$FILTER" \
            --runs "$FOLLOW_UP_RUNS" --budget 3600 --stop-after 1 --out-dir "$RUNNER_TEMP/verify" | tee "$RUNNER_TEMP/verify.json"
          [ "$(jq -r .failures "$RUNNER_TEMP/verify.json")" = 0 ] && [ "$(jq -r .runs "$RUNNER_TEMP/verify.json")" = "$FOLLOW_UP_RUNS" ]

      - name: Authenticate App
        if: (failure() || cancelled()) && steps.next.outputs.step == 'fix'
        id: fail-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Hand over a failed review-fix round
        if: (failure() || cancelled()) && steps.next.outputs.step == 'fix'
        env:
          GH_TOKEN: ${{ steps.fail-app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Claude could not address the review findings: $RUN_URL. Handing this over to the code owners."
          gh pr ready "$PR" --repo "$GITHUB_REPOSITORY"

  follow-up-push:
    needs: follow-up
    if: needs.follow-up.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR: ${{ needs.follow-up.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: flaky-follow-up-patch
          path: ${{ runner.temp }}/fix

      - name: Apply the verified change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/ci/flaky_tests.py?ref=master" \
            > "$RUNNER_TEMP/flaky_tests.py"
          git apply --index --binary "$RUNNER_TEMP/fix/fix.patch"
          git diff --cached --no-renames --name-only -z | xargs -0 python3 "$RUNNER_TEMP/flaky_tests.py" guard

      - name: Authenticate App
        id: push-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Push and request a new review
        env:
          GH_TOKEN: ${{ steps.push-app.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "Address review findings"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=wip' --silent
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/wip" --silent

      - name: Authenticate App
        if: failure() || cancelled()
        id: fail-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Hand over a failed push
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ steps.fail-app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Claude addressed the review findings, but the push step failed: $RUN_URL. Handing this over to the code owners."
          gh pr ready "$PR" --repo "$GITHUB_REPOSITORY"
