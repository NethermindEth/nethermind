name: Measure storage adoption
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Exact master baseline SHA
        required: true
        type: string
      history_ref:
        description: Exact iterator adoption SHA
        required: true
        type: string
      multiget_ref:
        description: Exact decoded MultiGet adoption SHA
        required: true
        type: string
      binding_ref:
        description: Exact package release commit SHA
        required: true
        type: string
      components:
        description: Components to measure
        required: true
        type: choice
        options: [blob, history, both, chain, receipt, native, bal, trie, trie-profile-report]
        default: both
      control_ref:
        description: Exact shared-master decoded API control SHA for chain measurements
        required: false
        type: string
      chain_ref:
        description: Exact chain-level candidate SHA
        required: false
        type: string
      receipt_ref:
        description: Exact common-master published-174 API source for receipt experiment
        required: false
        type: string
      aa_controls:
        description: Add separate adjacent unchanged-baseline controls
        required: false
        type: boolean
        default: false
      profile_run_id:
        description: Existing diagnostic run whose snapshot must be converted
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: inputs.components != 'chain' && inputs.components != 'receipt' && inputs.components != 'native' && inputs.components != 'bal' && inputs.components != 'trie' && inputs.components != 'trie-profile-report'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      AA_CONTROLS: ${{ inputs.aa_controls && '1' || '0' }}
      COMPONENTS: ${{ inputs.components || 'both' }}
      BASELINE_REF: ${{ inputs.baseline_ref || '60518b8183ed7e0b81252edad8e48573f891dfba' }}
      HISTORY_REF: ${{ inputs.history_ref || 'edc1f97def7bf1a5fbbd741a0a27576ddf57eff8' }}
      BINDING_REF: ${{ inputs.binding_ref || '31b352993ea8678348286d50420713c05fff3ccf' }}
      MULTIGET_REF: ${{ inputs.multiget_ref || 'a63fb8731167fa30dd216a7e87d637353f2ded70' }}
      PACKAGE_VERSION: '11.8.1.174'
    steps:
      - uses: actions/checkout@v7
        with:
          path: proof
      - name: Validate commit inputs
        shell: bash
        run: |
          case "$COMPONENTS" in blob|history|both) ;; *) exit 1 ;; esac
          for sha in "$BASELINE_REF" "$HISTORY_REF" "$MULTIGET_REF" "$BINDING_REF"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref || '60518b8183ed7e0b81252edad8e48573f891dfba' }}
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.history_ref || 'edc1f97def7bf1a5fbbd741a0a27576ddf57eff8' }}
          path: history
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.multiget_ref || 'a63fb8731167fa30dd216a7e87d637353f2ded70' }}
          path: multiget
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: baseline/global.json
      - name: Record and verify source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          for source in baseline history multiget; do
            git -C "$source" rev-parse HEAD > "results/$source-sha.txt"
          done
          printf "%s\n" "$BINDING_REF" > results/binding-release-sha.txt
          printf "%s\n" "$PACKAGE_VERSION" > results/package-version.txt
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          echo "SOURCE_DATE_EPOCH=$(git -C baseline log -1 --format=%ct)" >> "$GITHUB_ENV"
          python3 proof/benchmarks/storage-adoption/validate-sources.py
      - name: Wait for the published package to be indexed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS https://api.nuget.org/v3-flatcontainer/nethermind.rocksdbbindings/11.8.1.174/nethermind.rocksdbbindings.nuspec -o results/release.nuspec; then
              break
            fi
            sleep 20
          done
          python3 proof/benchmarks/storage-adoption/validate-release.py results/release.nuspec
      - name: Validate normal package consumption and component tests
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          if [[ "$COMPONENTS" != blob ]]; then
            targets+=(history:Nethermind.Db.Test history:Nethermind.State.Flat.History.Test)
          fi
          if [[ "$COMPONENTS" != history ]]; then
            targets+=(multiget:Nethermind.Db.Test multiget:Nethermind.TxPool.Test)
          fi
          for target in "${targets[@]}"; do
            source=${target%%:*}
            project=${target#*:}
            dotnet build "$source/src/Nethermind/$project/$project.csproj" -c Release
            dotnet "$source/src/Nethermind/artifacts/bin/$project/release/$project.dll" | tee "results/$source-$project.log"
            python3 proof/benchmarks/storage-adoption/validate-tests.py "results/$source-$project.log"
          done
          python3 proof/benchmarks/storage-adoption/validate-package.py
          cp "$HOME/.nuget/packages/nethermind.rocksdbbindings/11.8.1.174/nethermind.rocksdbbindings.11.8.1.174.nupkg.sha512" results/package.sha512
      - name: Prepare identical measurement harnesses
        shell: bash
        run: |
          for source in baseline history; do
            mkdir -p "$source/benchmarks/history-bounds"
            cp proof/benchmarks/storage-adoption/history-bounds/* "$source/benchmarks/history-bounds/"
          done
          for source in baseline multiget; do
            mkdir -p "$source/benchmarks/blob-batch"
            cp proof/benchmarks/storage-adoption/blob-batch/* "$source/benchmarks/blob-batch/"
          done
          mkdir -p "$RUNNER_TEMP/storage-adoption"
      - name: Measure selected changes against unchanged master in ABBA order
        shell: bash
        env:
          BENCH_DATA: ${{ runner.temp }}/storage-adoption
        run: |
          set -euo pipefail
          kinds=(history blob)
          if [[ "$COMPONENTS" != both ]]; then kinds=("$COMPONENTS"); fi
          for kind in "${kinds[@]}"; do
            round=0
            if [[ "$kind" == history ]]; then
              candidate=history
              project=history-bounds
            else
              candidate=multiget
              project=blob-batch
            fi
            sources=(baseline "$candidate" "$candidate" baseline)
            if [[ "$AA_CONTROLS" == 1 ]]; then
              sources=(baseline baseline "$candidate" "$candidate" baseline baseline)
            fi
            python3 -c 'import json,sys; from pathlib import Path; p=Path("results/measurement-order.json"); d=json.loads(p.read_text()) if p.exists() else {}; d[sys.argv[1]]=sys.argv[2:]; p.write_text(json.dumps(d,indent=2)+"\n")' "$kind" "${sources[@]}"
            for source in "${sources[@]}"; do
              round=$((round + 1))
              output="$GITHUB_WORKSPACE/results/$kind/$round-$source"
              if [[ "$kind" == history && "$source" == history ]]; then
                export BoundsReuse=true
              else
                unset BoundsReuse
              fi
              (
                cd "$source"
                dotnet run --project "benchmarks/$project" -c Release -- --filter '*' --exporters json markdown --artifacts "$output" --join
              )
              python3 proof/benchmarks/storage-adoption/validate-results.py "$output" "$kind"
            done
            python3 proof/benchmarks/storage-adoption/analyze-ordered.py results "$kind"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-adoption-${{ matrix.os }}
          path: results

  chain:
    if: inputs.components == 'chain'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      BASELINE_REF: ${{ inputs.baseline_ref }}
      CONTROL_REF: ${{ inputs.control_ref }}
      CANDIDATE_REF: ${{ inputs.chain_ref }}
    steps:
      - name: Validate source inputs
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$BASELINE_REF" "$CONTROL_REF" "$CANDIDATE_REF"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
      - uses: actions/checkout@v7
        with:
          path: proof
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.control_ref }}
          path: control
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.chain_ref }}
          path: candidate
          fetch-depth: 16
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: baseline/global.json
      - name: Verify source isolation and prepare identical harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          echo "SOURCE_DATE_EPOCH=$(git -C baseline log -1 --format=%ct)" >> "$GITHUB_ENV"
          python3 proof/benchmarks/storage-adoption/validate-chain.py sources
          for source in baseline control candidate; do
            mkdir -p "$source/benchmarks/chain-levels"
            cp proof/benchmarks/storage-adoption/chain-levels/* "$source/benchmarks/chain-levels/"
          done
          sha256sum proof/benchmarks/storage-adoption/chain-levels/* > results/harness-sha256.txt
          python3 -c 'import os; cpu=min(os.sched_getaffinity(0)); assert cpu<63; print("BENCH_AFFINITY="+str(1<<cpu))' >> "$GITHUB_ENV"
      - name: Compile harnesses and run component tests
        shell: bash
        run: |
          set -euo pipefail
          for source in baseline control candidate; do
            dotnet build "$source/benchmarks/chain-levels/ChainLevels.csproj" -c Release
            dotnet build "$source/src/Nethermind/Nethermind.State.Test/Nethermind.State.Test.csproj" -c Release
            dotnet "$source/src/Nethermind/artifacts/bin/Nethermind.State.Test/release/Nethermind.State.Test.dll" | tee "results/$source-State.Test.log"
            python3 proof/benchmarks/storage-adoption/validate-tests.py "results/$source-State.Test.log"
          done
          python3 proof/benchmarks/storage-adoption/validate-chain.py packages
      - name: Measure three variants with separate baseline controls
        shell: bash
        run: |
          set -euo pipefail
          round=0
          python3 -c 'import json; from pathlib import Path; Path("results/measurement-order.json").write_text(json.dumps({"chain":["baseline","baseline","control","candidate","candidate","control","baseline","baseline"]},indent=2)+"\n")'
          for source in baseline baseline control candidate candidate control baseline baseline; do
            round=$((round + 1))
            output="$GITHUB_WORKSPACE/results/chain/$round-$source"
            (
              cd "$source"
              dotnet run --project benchmarks/chain-levels/ChainLevels.csproj -c Release --no-build -- --filter '*' --exporters json markdown --artifacts "$output" --join
            )
            python3 proof/benchmarks/storage-adoption/validate-chain.py results "$output"
          done
          python3 proof/benchmarks/storage-adoption/analyze-ordered.py results chain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chain-levels-${{ matrix.os }}
          path: results

  receipt:
    if: inputs.components == 'receipt'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      BASELINE_REF: ${{ inputs.baseline_ref }}
      RECEIPT_REF: ${{ inputs.receipt_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: proof
      - name: Validate source inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECEIPT_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.receipt_ref }}
          path: control
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.receipt_ref }}
          path: candidate
          fetch-depth: 16
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: baseline/global.json
      - name: Verify sources and prepare identical harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          echo "SOURCE_DATE_EPOCH=$(git -C baseline log -1 --format=%ct)" >> "$GITHUB_ENV"
          python3 proof/benchmarks/storage-adoption/validate-receipt.py sources
          for source in baseline control candidate; do
            mkdir -p "$source/benchmarks/receipt-scan"
            cp proof/benchmarks/storage-adoption/receipt-scan/* "$source/benchmarks/receipt-scan/"
          done
          sha256sum proof/benchmarks/storage-adoption/receipt-scan/* > results/harness-sha256.txt
          python3 -c 'import os; cpu=min(os.sched_getaffinity(0)); assert cpu<63; print("BENCH_AFFINITY="+str(1<<cpu))' >> "$GITHUB_ENV"
          echo "BENCH_DATA=$RUNNER_TEMP/receipt-bench" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/receipt-bench"
      - name: Compile harnesses and test receipt paths
        shell: bash
        run: |
          set -euo pipefail
          for source in baseline control candidate; do
            mode=legacy
            [[ "$source" != candidate ]] || mode=decoded
            RECEIPT_READ_MODE="$mode" dotnet build "$source/benchmarks/receipt-scan/ReceiptScan.csproj" -c Release
          done
          for source in baseline candidate; do
            dotnet build "$source/src/Nethermind/Nethermind.Blockchain.Test/Nethermind.Blockchain.Test.csproj" -c Release
            dotnet "$source/src/Nethermind/artifacts/bin/Nethermind.Blockchain.Test/release/Nethermind.Blockchain.Test.dll" --filter 'FullyQualifiedName~LogFinderTests|FullyQualifiedName~PersistentReceiptStorageTests|FullyQualifiedName~ReceiptsIteratorTests|FullyQualifiedName~DeferredReceiptStorageTests' | tee "results/$source-Receipt.Test.log"
            python3 proof/benchmarks/storage-adoption/validate-tests.py "results/$source-Receipt.Test.log"
          done
          python3 proof/benchmarks/storage-adoption/validate-chain.py packages
      - name: Measure master, package control and decoded receipts
        shell: bash
        run: |
          set -euo pipefail
          round=0
          python3 -c 'import json; from pathlib import Path; Path("results/measurement-order.json").write_text(json.dumps({"receipt":["baseline","baseline","control","candidate","candidate","control","baseline","baseline"]},indent=2)+"\n")'
          for source in baseline baseline control candidate candidate control baseline baseline; do
            round=$((round + 1))
            mode=legacy
            [[ "$source" != candidate ]] || mode=decoded
            output="$GITHUB_WORKSPACE/results/receipt/$round-$source"
            (
              cd "$source"
              RECEIPT_READ_MODE="$mode" dotnet run --project benchmarks/receipt-scan/ReceiptScan.csproj -c Release --no-build -- --filter '*' --exporters json markdown --artifacts "$output" --join
            )
            python3 proof/benchmarks/storage-adoption/validate-receipt.py results "$output"
          done
          python3 proof/benchmarks/storage-adoption/analyze-ordered.py results receipt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: receipt-scan-${{ matrix.os }}
          path: results

  native:
    if: inputs.components == 'native'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CANDIDATE_REF: ${{ inputs.multiget_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: proof
      - name: Validate source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.multiget_ref }}
          path: candidate
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: candidate/global.json
      - name: Verify source and run native tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_REF"
          git -C candidate rev-parse HEAD > results/source-sha.txt
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          projects=(Nethermind.Db.Test Nethermind.State.Flat.Test Nethermind.Consensus.Test Nethermind.Trie.Test Nethermind.State.Test)
          for project in "${projects[@]}"; do
            dotnet build "candidate/src/Nethermind/$project/$project.csproj" -c Release -p:EnforceCodeStyleInBuild=true
            dotnet "candidate/src/Nethermind/artifacts/bin/$project/release/$project.dll" | tee "results/$project.log"
            python3 proof/benchmarks/storage-adoption/validate-tests.py "results/$project.log"
          done
          git -C candidate diff --exit-code
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("candidate/src/Nethermind/artifacts/obj/Nethermind.Db.Rocks/project.assets.json").read_text())
          item = data["libraries"]["Nethermind.RocksDbBindings/11.8.1.174"]
          assert item["type"] == "package"
          roots = [Path(p, item["path"]) for p in data["packageFolders"] if Path(p, item["path"], ".nupkg.metadata").exists()]
          assert len(roots) == 1
          metadata = json.loads((roots[0] / ".nupkg.metadata").read_text())
          assert metadata["source"] == "https://api.nuget.org/v3/index.json"
          assert metadata["contentHash"] == item["sha512"]
          Path("results/package-consumption.json").write_text(json.dumps({"library": item, "metadata": metadata}, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-state-native-${{ matrix.os }}
          path: results

  bal:
    if: inputs.components == 'bal'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      BASELINE_REF: ${{ inputs.baseline_ref }}
      CONTROL_REF: ${{ inputs.control_ref }}
      CANDIDATE_REF: ${{ inputs.multiget_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: proof
      - name: Validate commit inputs
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$BASELINE_REF" "$CONTROL_REF" "$CANDIDATE_REF"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.control_ref }}
          path: control
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.multiget_ref }}
          path: candidate
          fetch-depth: 16
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: baseline/global.json
      - name: Verify sources and prepare identical harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          echo "SOURCE_DATE_EPOCH=$(git -C baseline log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "BAL_DATA=$RUNNER_TEMP/bal-prefetch" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bal-prefetch"
          python3 proof/benchmarks/storage-adoption/validate-bal.py sources
          for source in baseline control candidate; do
            mkdir -p "$source/benchmarks/bal-prefetch"
            cp proof/benchmarks/storage-adoption/bal-prefetch/* "$source/benchmarks/bal-prefetch/"
          done
          sha256sum proof/benchmarks/storage-adoption/bal-prefetch/* > results/harness-sha256.txt
      - name: Build, verify results and run candidate tests
        shell: bash
        run: |
          set -euo pipefail
          for source in baseline control candidate; do
            dotnet build "$source/benchmarks/bal-prefetch/BalPrefetch.csproj" -c Release
            dotnet run --project "$source/benchmarks/bal-prefetch/BalPrefetch.csproj" -c Release --no-build -- --verify | tee "results/$source-preflight.log"
          done
          python3 proof/benchmarks/storage-adoption/validate-chain.py packages
          dotnet build candidate/src/Nethermind/Nethermind.State.Flat.Test/Nethermind.State.Flat.Test.csproj -c Release -p:EnforceCodeStyleInBuild=true
          dotnet candidate/src/Nethermind/artifacts/bin/Nethermind.State.Flat.Test/release/Nethermind.State.Flat.Test.dll | tee results/candidate-State.Flat.Test.log
          python3 proof/benchmarks/storage-adoption/validate-tests.py results/candidate-State.Flat.Test.log
      - name: Measure actual BAL prefetch with baseline controls
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /bin/sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'
          python3 -c 'import json; from pathlib import Path; Path("results/measurement-order.json").write_text(json.dumps({"bal":["baseline","baseline","control","candidate","candidate","control","baseline","baseline"]},indent=2)+"\n")'
          round=0
          for source in baseline baseline control candidate candidate control baseline baseline; do
            round=$((round + 1))
            output="$GITHUB_WORKSPACE/results/bal/$round-$source"
            mkdir -p "$output"
            BAL_OUTPUT="$output/results.json" dotnet run --project "$source/benchmarks/bal-prefetch/BalPrefetch.csproj" -c Release --no-build | tee "$output/measurement.log"
            python3 proof/benchmarks/storage-adoption/validate-bal.py results "$output/results.json"
          done
          python3 proof/benchmarks/storage-adoption/analyze-bal.py results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bal-prefetch-${{ matrix.os }}
          path: results

  trie:
    if: inputs.components == 'trie'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      BASELINE_REF: ${{ inputs.baseline_ref }}
      CONTROL_REF: ${{ inputs.control_ref }}
      CANDIDATE_REF: ${{ inputs.multiget_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: proof
      - name: Validate commit inputs
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$BASELINE_REF" "$CONTROL_REF" "$CANDIDATE_REF"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.control_ref }}
          path: control
          fetch-depth: 16
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.multiget_ref }}
          path: candidate
          fetch-depth: 16
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: baseline/global.json
      - name: Verify sources and prepare identical harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          dotnet --info > results/dotnet.txt
          lscpu > results/cpu.txt
          echo "SOURCE_DATE_EPOCH=$(git -C baseline log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TRIE_DATA=$RUNNER_TEMP/trie-prefetch" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/trie-prefetch"
          python3 proof/benchmarks/storage-adoption/validate-trie.py sources
          for source in baseline control candidate; do
            mkdir -p "$source/benchmarks/trie-prefetch"
            cp proof/benchmarks/storage-adoption/trie-prefetch/* "$source/benchmarks/trie-prefetch/"
          done
          sha256sum proof/benchmarks/storage-adoption/trie-prefetch/* > results/harness-sha256.txt
      - name: Build, verify results and run candidate tests
        shell: bash
        run: |
          set -euo pipefail
          for source in baseline control candidate; do
            flags=()
            if [[ -f "$source/src/Nethermind/Nethermind.Trie/PatriciaTree.WarmUp.cs" ]]; then flags=(-p:BatchTrie=true); fi
            dotnet build "$source/benchmarks/trie-prefetch/TriePrefetch.csproj" -c Release "${flags[@]}"
            mode=scalar
            if [[ -f "$source/src/Nethermind/Nethermind.Trie/PatriciaTree.WarmUp.cs" ]]; then mode=batch; fi
            TRIE_MODE="$mode" dotnet run --project "$source/benchmarks/trie-prefetch/TriePrefetch.csproj" -c Release --no-build -- --verify | tee "results/$source-preflight.log"
          done
          python3 proof/benchmarks/storage-adoption/validate-chain.py packages
          dotnet build candidate/src/Nethermind/Nethermind.State.Flat.Test/Nethermind.State.Flat.Test.csproj -c Release -p:EnforceCodeStyleInBuild=true
          dotnet candidate/src/Nethermind/artifacts/bin/Nethermind.State.Flat.Test/release/Nethermind.State.Flat.Test.dll | tee results/candidate-State.Flat.Test.log
          python3 proof/benchmarks/storage-adoption/validate-tests.py results/candidate-State.Flat.Test.log
      - name: Measure trie warmup and update with baseline controls
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /bin/sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'
          python3 -c 'import json; from pathlib import Path; Path("results/measurement-order.json").write_text(json.dumps({"trie":["baseline","baseline","control","candidate","candidate","control","baseline","baseline"]},indent=2)+"\n")'
          round=0
          for source in baseline baseline control candidate candidate control baseline baseline; do
            round=$((round + 1))
            output="$GITHUB_WORKSPACE/results/trie/$round-$source"
            mkdir -p "$output"
            mode=scalar
            if [[ -f "$source/src/Nethermind/Nethermind.Trie/PatriciaTree.WarmUp.cs" ]]; then mode=batch; fi
            TRIE_MODE="$mode" TRIE_OUTPUT="$output/results.json" dotnet run --project "$source/benchmarks/trie-prefetch/TriePrefetch.csproj" -c Release --no-build | tee "$output/measurement.log"
            python3 proof/benchmarks/storage-adoption/validate-trie.py results "$output/results.json"
          done
          python3 proof/benchmarks/storage-adoption/analyze-trie.py results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trie-prefetch-${{ matrix.os }}
          path: results
  trie-profile-report:
    if: inputs.components == 'trie-profile-report'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate diagnostic run ID
        shell: pwsh
        env:
          PROFILE_RUN_ID: ${{ inputs.profile_run_id }}
        run: |
          if ($env:PROFILE_RUN_ID -notmatch '^[0-9]+$') { throw 'A numeric run ID is required' }
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.profile_run_id }}
          github-token: ${{ github.token }}
          pattern: dottrace-*
          path: snapshots
          merge-multiple: true
      - name: Convert existing diagnostic snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/JetBrains.dotTrace.CommandLineTools.windows-x64/2026.1.0.1' -OutFile dottrace-clt.zip
          Expand-Archive -Path dottrace-clt.zip -DestinationPath dottrace-clt
          $reporter = Get-ChildItem dottrace-clt -Recurse -Filter Reporter.exe | Select-Object -First 1
          if (-not $reporter) { throw 'Reporter.exe was not found' }
          New-Item -ItemType Directory -Force -Path reports, extracted | Out-Null
          '<Patterns><Pattern PrintCallstacks="Full">.*(WarmUp|Warmup|LoadRlps|LoadStateRlps|LoadStorageRlps|ReadRlpGroup|MultiGet|GetManyWithColumnFamily|TryLoadStateRlp|TryLoadStorageRlp|ApplyBal|WaitForBal|RecalculateStateRoot).*</Pattern></Patterns>' | Set-Content pattern.xml
          Get-ChildItem snapshots -Filter '*.zip' | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath (Join-Path extracted $_.BaseName)
          }
          $snapshots = @(Get-ChildItem extracted -Recurse -Filter '*.dtp')
          if ($snapshots.Count -eq 0) { throw 'No diagnostic snapshot was found' }
          foreach ($snapshot in $snapshots) {
            $output = Join-Path reports ($snapshot.BaseName + '-report.xml')
            & $reporter.FullName report $snapshot.FullName --pattern=pattern.xml --save-to=$output
            if ($LASTEXITCODE -ne 0) { throw "Reporter failed with exit code $LASTEXITCODE" }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trie-diagnostic-reports-${{ inputs.profile_run_id }}
          path: reports
          if-no-files-found: error
