name: Sync PR Gate (Hoodi entry)

# One matrix entry of sync-pr-gate.yml: its own runner, sync and teardown, so an entry neither
# waits on nor fails with its siblings, and each VM is deleted as soon as its own sync ends.
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      consensus:
        type: string
        required: true

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: "1"
  TERM: xterm

permissions:
  contents: read

jobs:
  create-runner:
    name: Create runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate Admin App
        id: gh-admin-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          repositories: "nethermind"

      # This gate exists to cover arm64. 8 vCPUs match the GitHub arm64 runner it replaced, which synced
      # about a third faster than 4; C4A has no highcpu -lssd shape and only boots from Hyperdisk.
      - name: Create a runner
        uses: ./.github/actions/gcp-runner
        with:
          action: create
          runner_label: prg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-${{ inputs.consensus }}
          github_token: ${{ steps.gh-admin-app.outputs.token }}
          machine_type: c4a-standard-8-lssd
          local_ssd_count: 2
          boot_disk_type: hyperdisk-balanced
          image_family: ubuntu-2404-lts-arm64
          provisioning_model: SPOT
          max_run_duration: 4h
          zones: ${{ vars.GCP_ZONES }}
          zone_order: rotate
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

  sync-hoodi:
    name: Sync
    needs: create-runner
    # "Re-run failed jobs" keeps the earlier attempt's create result, whose VM is already deleted,
    # so the sync would wait for a runner that never registers. Skip it and let teardown explain.
    if: needs.create-runner.outputs.attempt == github.run_attempt
    runs-on: prg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-${{ inputs.consensus }}
    timeout-minutes: 180
    steps:
      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: "nethermind,post-merge-smoke-tests"
          permission-contents: read

      # PR code only runs inside Docker: the image build and the client container. Everything run on the
      # VM itself comes from master's checkout, as the job holds secrets and master's cache scope.
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Checkout master scripts
        uses: actions/checkout@v6
        with:
          path: base
          sparse-checkout: scripts
          persist-credentials: false

      - name: Build PR image
        # Builds while the tooling below is set up; Sedge waits for it.
        id: build-image
        background: true
        run: |
          docker build -t nethermind:pr-local \
            --build-arg BUILD_CONFIG=release \
            --build-arg CI=true \
            --build-arg COMMIT_HASH=${{ github.event.pull_request.head.sha }} \
            pr

      - name: Checkout tests repository
        uses: actions/checkout@v6
        with:
          repository: NethermindEth/post-merge-smoke-tests
          path: tests
          token: ${{ steps.gh-app.outputs.token }}
          clean: true
          persist-credentials: false

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          # Pinned to 1.26: Go 1.27 breaks sedge's abigen build (cockroachdb/swiss has no go1.27 case)
          go-version: '1.26'
          check-latest: true
          # A pull_request_target run saves caches to master's scope, and this job runs PR code.
          cache: false

      - name: Set up .NET for CI scripts
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: base/global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.X"

      - name: Install Sedge
        env:
          # proxy.golang.org serves large module zips as a redirect to storage.googleapis.com,
          # unreachable from the sync runners; `|` falls back to direct on any error, not just 404/410
          GOPROXY: https://proxy.golang.org|direct
        run: |
          git clone https://github.com/NethermindEth/sedge.git sedge --branch core --single-branch
          cd sedge
          make compile-sedge

      - name: Wait for PR image
        wait: build-image

      - name: Run Nethermind with ${{ inputs.consensus }} consensus
        working-directory: sedge
        env:
          SYNC_MODE: ${{ inputs.mode }}
          FLATDB: ${{ inputs.mode == 'Flat' }}
          CONSENSUS: ${{ inputs.consensus }}
        run: |
          mkdir -p execution-data/logs/configs
          mv ../tests/predefined_configs/customNLog.config execution-data/logs/configs/customNLog.config
          flags=("FlatDb.Enabled=$FLATDB" "Sync.NonValidatorNode=true"
            "Sync.DownloadBodiesInFastSync=false" "Sync.DownloadReceiptsInFastSync=false"
            "Sync.VerifyTrieOnStateSyncFinished=true" "Sync.SnapSync=true"
            "loggerConfigSource=/nethermind/data/logs/configs/customNLog.config"
            "Init.LogRules=Synchronization.Peers.SyncPeersReport:Debug")
          args=()
          if [[ "$CONSENSUS" == "Embedded" ]]; then
            for flag in "${flags[@]}"; do args+=("--${flag%%=*}" "${flag#*=}"); done
            docker run -d --name sedge-execution-client --network host \
              -e DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION=1 \
              -v "$PWD/execution-data:/nethermind/data" nethermind:pr-local \
              --config hoodi --datadir /nethermind/data --BeaconChain.Enabled true "${args[@]}"
          else
            ./build/sedge deps install
            for flag in "${flags[@]}"; do args+=(--el-extra-flag "$flag"); done
            ./build/sedge generate --logging none -p "$GITHUB_WORKSPACE/sedge" full-node \
              -c lodestar:chainsafe/lodestar:latest -e nethermind:nethermind:pr-local \
              --map-all --no-mev-boost --no-validator --network hoodi "${args[@]}" \
              --checkpoint-sync-url=https://checkpoint-sync.hoodi.ethpandaops.io
            # Use docker compose directly instead of `sedge run` because sedge run
            # does `docker compose pull` which fails for the locally-built image.
            docker compose up -d
          fi

      - name: Wait for hoodi to sync
        env:
          NETWORK: hoodi
          SYNC_MODE: ${{ inputs.mode }}
        run: dotnet run --file base/scripts/wait-for-sync.cs

      # The container writes these files as root, so never follow its symlinks or trust its file names.
      - name: Get Nethermind Debug Logs
        if: failure() || cancelled()
        working-directory: sedge
        run: |
          log_dir=$(realpath -e execution-data/logs) || exit 0
          if [[ "$log_dir" != "$PWD"/* ]]; then
            echo "::warning::Skipping logs outside the workspace: $log_dir"
            exit 0
          fi
          find "$log_dir" -type f -name '*.log' -print0 | head -zn 1 | xargs -0r zip -j -y "$RUNNER_TEMP/nethermind-log.zip"

      - name: Upload Nethermind Debug logs artifact
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: nethermind-log-hoodi-${{ inputs.mode }}-${{ inputs.consensus }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nethermind-log.zip
          retention-days: 7

      - name: Get Consensus Logs
        if: always() && inputs.consensus == 'Lodestar'
        run: docker logs sedge-consensus-client

      - name: Check size of DB
        if: always()
        run: du -h $GITHUB_WORKSPACE/sedge

  # always() also runs this when a newer push cancels the run, so the VM is not left until max_run_duration.
  destroy-runner:
    name: Destroy runner
    needs: [create-runner, sync-hoodi]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Reject a partial re-run
        if: needs.sync-hoodi.result == 'skipped' && needs.create-runner.result == 'success' && needs.create-runner.outputs.attempt != github.run_attempt
        run: |
          echo "::error title=Sync PR Gate::Re-run failed jobs cannot recreate the deleted runner. Re-run this entry's 'Create runner' job instead, which also re-runs its sync and teardown."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate Admin App
        id: gh-admin-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          repositories: "nethermind"

      - name: Destroy runner
        id: destroy
        uses: ./.github/actions/gcp-runner
        with:
          action: destroy
          runner_label: prg-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-${{ inputs.consensus }}
          github_token: ${{ steps.gh-admin-app.outputs.token }}
          expect_instance: ${{ needs.create-runner.result == 'success' }}
          zones: ${{ vars.GCP_ZONES }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          spawner_service_account: ${{ vars.GCP_SPAWNER_SERVICE_ACCOUNT }}
          runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}

      - name: Explain a preemption
        if: always() && steps.destroy.outputs.preempted == 'true'
        run: echo "::notice title=Sync PR Gate::The SPOT VM was reclaimed by GCE, not a sync failure. Re-run this entry's 'Create runner' job to retry on a new VM."
