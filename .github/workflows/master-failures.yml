name: Master test failures

# Pull requests run only the tests their change can affect (test-selection.yml), so a regression can reach
# master. When a test workflow fails on master, this opens one issue for it, assigned to the author of the pull
# request that most likely caused it (tools/TestSelection report-master-failure). The issue closes when the workflow is
# green on master again.
on:
  workflow_run:
    workflows:
      - Nethermind/Ethereum tests
      - Nethermind extra test variants
      - Nethermind tests (Trie DB)
      - Nethermind tests (Single Proc)
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: master-failures-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  report:
    name: Report master test failures
    # A fork can name its branch master, so only pushes to this repository count.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STATE: ${{ github.workspace }}/state
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      # The journal tells failures that the environment explains from regressions; the model links projects
      # to the failing tests. Without them every failure counts and only the dependency graph names a cause.
      - name: Download the selection state
        if: github.event.workflow_run.conclusion == 'failure'
        run: scripts/ci/test-selection.sh download --out "$STATE" || echo "::warning::no selection state"

      - name: Report
        # bash runs with pipefail, so tee cannot hide a failed report.
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          scripts/ci/test-selection.sh report-master-failure --run "$RUN_ID" \
            --journal "$STATE/journal.jsonl.gz" --model "$STATE/model.json.gz" | tee -a "$GITHUB_STEP_SUMMARY"
