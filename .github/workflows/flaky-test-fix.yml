name: Flaky test auto-fix

on:
  workflow_run:
    workflows: ["Nethermind/Ethereum tests"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: flaky-test-fix
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5

      - name: Fix the flaky test
        timeout-minutes: 90
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Run ${{ github.event.workflow_run.html_url }} of "Nethermind/Ethereum tests" failed on master.
            List its failed jobs with `gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs`
            and read their logs with `gh api repos/${{ github.repository }}/actions/jobs/<job id>/logs`.

            For each failed test, compare with recent runs (`gh run list --workflow "Nethermind/Ethereum tests"`)
            to decide if it is flaky: it fails only sometimes and passes on the same or neighbouring commits.
            Skip a test that fails consistently, and a test that already has an open PR
            (`gh pr list --label flaky-test --search "<test name>"`). If no test is left, stop without changes.

            For one flaky test, find the root cause and fix it with the smallest change. The bug may be in the test
            or in production code. Do not add retries, sleeps, longer timeouts, [Retry]/[Ignore]/[Explicit] attributes
            or category exclusions, and do not weaken assertions. Do not change .github/, .agents/, scripts/, AGENTS.md,
            CLAUDE.md, *.props, *.targets, *.csproj, global.json or NuGet.Config. Follow AGENTS.md and .agents/rules/.
            Build and run the test with `dotnet test --project <project> -c release -- --filter <filter>`.

            Do not commit or push. Write `${{ runner.temp }}/claude/pr.md`: the first line is the PR title
            `Fix flaky <test name>`, then the failed run link, why the test is flaky, the root cause with file:line
            references, and the fix.
          claude_args: |
            --model opus
            --add-dir ${{ runner.temp }}/claude
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh api:*),Bash(gh run list:*),Bash(gh pr list:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"

      - name: Check the change
        id: check
        run: |
          git add -A
          if git diff --cached --quiet || [ ! -s "$RUNNER_TEMP/claude/pr.md" ]; then exit 0; fi
          if git diff --cached --no-renames --name-only |
            grep -E '^(\.github|\.agents|scripts)/|^(AGENTS|CLAUDE)\.md$|\.(props|targets|csproj)$|(^|/)(global\.json|NuGet\.Config)$'; then
            echo "::error::Protected paths changed"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fix"
          git diff --cached --binary > "$RUNNER_TEMP/fix/fix.patch"
          cp "$RUNNER_TEMP/claude/pr.md" "$RUNNER_TEMP/fix/pr.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flaky-fix
          path: ${{ runner.temp }}/fix

  publish:
    needs: fix
    if: needs.fix.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BRANCH: test/flaky-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: flaky-fix
          path: ${{ runner.temp }}/fix

      - name: Authenticate App
        id: gh-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open a draft PR
        env:
          GH_TOKEN: ${{ steps.gh-app.outputs.token }}
        run: |
          git apply --index --binary "$RUNNER_TEMP/fix/fix.patch"
          title=$(head -n 1 "$RUNNER_TEMP/fix/pr.md")
          tail -n +2 "$RUNNER_TEMP/fix/pr.md" > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git -c core.hooksPath=/dev/null commit -m "$title"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          gh label create flaky-test --color FBCA04 --description "Flaky test" 2>/dev/null || true
          gh pr create --draft --base master --head "$BRANCH" --label flaky-test --title "$title" --body-file "$RUNNER_TEMP/body.md"
