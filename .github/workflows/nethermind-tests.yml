name: Nethermind/Ethereum tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      coverage:
        default: false
        description: Collect coverage
        required: false
        type: boolean

env:
  COLLECT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event.inputs.coverage }}
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm

defaults:
  run:
    shell: bash

permissions:
  # actions: read lets run-nethtest.yml download the EEST test selection model from test-selection.yml.
  actions: read
  contents: read

jobs:
  # Build the test binaries once per Linux RID and share as an artifact. Windows/macOS
  # are excluded — their artifacts can't be deduped cheaply, so building in-job is faster.
  build:
    uses: ./.github/workflows/build-test-artifacts.yml
    with:
      matrix: '{"include":[{"rid":"linux-x64","os":"ubuntu-latest","variant":"release","build_args":""},{"rid":"linux-arm64","os":"ubuntu-24.04-arm","variant":"release","build_args":""}]}'

  # Pull requests run only the test projects their change can affect (.github/actions/select-tests); every
  # other event runs every project. The matrices live in scripts/ci/test-matrices.json.
  select:
    name: Select test projects
    runs-on: ubuntu-latest
    outputs:
      matrices: ${{ steps.select.outputs.matrices }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select test projects
        id: select
        uses: ./.github/actions/select-tests
        with:
          workflow: nethermind-tests

  tests:
    name: Run ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }} (${{ matrix.runner }})
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests != null
    runs-on: ${{ matrix.runner }}
    # A pack runs several projects one after another, so a hang in its last project needs more room to be dumped.
    timeout-minutes: ${{ matrix.project.list && 25 || 15 }}
    outputs:
      collect_coverage: ${{ env.COLLECT_COVERAGE }}
    env:
      DOTNET_GCConserveMemory: 9
    strategy:
      fail-fast: false
      # Slow projects are chunked on slower runners (the include entries in scripts/ci/test-matrices.json) to stay
      # within the 15-minute job budget.
      # Projects under about 4 minutes share a job, run one after another (scripts/ci/run-test-projects.sh);
      # each pack takes about 6 minutes, sized from the job times of a master run.
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests }}
    steps: &test-steps
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        if: runner.os == 'Linux'
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: release

      - name: ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }}
        id: test
        env:
          TEST_CHUNK: ${{ matrix.chunk }}
          PROJECTS: ${{ matrix.project.list || matrix.project }}
          COVERAGE: ${{ matrix.runner == 'ubuntu-latest' && env.COLLECT_COVERAGE == 'true' }}
        run: bash scripts/ci/run-test-projects.sh

      - name: Upload dumps
        if: ${{ failure() || cancelled() || steps.test.outputs.crashed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format('-{0}', matrix.chunk) || '' }}-${{ matrix.runner }}-dumps
          path: |
            src/Nethermind/*/TestResults/*_hang.*
            src/Nethermind/*/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload coverage report
        if: matrix.runner == 'ubuntu-latest' && env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format('-{0}', matrix.chunk) || '' }}-coverage
          path: src/Nethermind/*/TestResults/*.cobertura.xml
          if-no-files-found: error
          retention-days: 1


  # macOS/Windows build their test project in-job instead of using the Linux artifact,
  # so they start once the selection is known instead of waiting for the build.
  tests-native:
    name: Run ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }} (${{ matrix.runner }})
    needs: select
    if: fromJSON(needs.select.outputs.matrices).tests-native != null
    runs-on: ${{ matrix.runner }}
    # A pack runs several projects one after another, so a hang in its last project needs more room to be dumped.
    timeout-minutes: ${{ matrix.project.list && 25 || 15 }}
    env:
      DOTNET_GCConserveMemory: 9
    strategy:
      fail-fast: false
      # macOS/Windows only for OS-sensitive tests (I/O, networking, sockets)
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-native }}
    steps: *test-steps
  tests-spec:
    name: Run ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }} (${{ matrix.runner }})
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests-spec != null
    runs-on: ${{ matrix.runner }}
    # A pack runs several projects one after another, so a hang in its last project needs more room to be dumped.
    timeout-minutes: ${{ matrix.project.list && 25 || 15 }}
    strategy:
      fail-fast: false
      # Packs with fixtures: true read the src/tests submodule at runtime.
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-spec }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch submodules
        if: matrix.project.fixtures
        background: true
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        if: runner.os == 'Linux'
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: release

      - name: Wait for submodules
        wait-all:

      - name: ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }}
        id: test
        env:
          TEST_CHUNK: ${{ matrix.chunk }}
          PROJECTS: ${{ matrix.project.list || matrix.project }}
        run: bash scripts/ci/run-test-projects.sh

      - name: Upload dumps
        if: ${{ failure() || cancelled() || steps.test.outputs.crashed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project.name || matrix.project }}${{ matrix.chunk && format('-{0}', matrix.chunk) || '' }}-${{ matrix.runner }}-dumps
          path: |
            src/Nethermind/*/TestResults/*_hang.*
            src/Nethermind/*/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

  tests-chunked:
    name: Run ${{ matrix.test.project }}${{ matrix.test.label && format(' [{0}]', matrix.test.label) || '' }} (${{ matrix.test.chunk }}) (${{ matrix.runner }})
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests-chunked != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-chunked }}
    steps: &chunked-test-steps
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch submodules
        background: true
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        if: runner.os == 'Linux'
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: release

      - name: Wait for submodules
        wait-all:

      - name: ${{ matrix.test.project }} (${{ matrix.test.chunk }})
        id: test
        working-directory: src/Nethermind/${{ matrix.test.project }}
        env:
          TEST_CHUNK: ${{ matrix.test.chunk }}
        run: |
          hang_timeout=8m
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Run the prebuilt test host directly: dotnet test would restore and evaluate the project first.
            run_tests=(../artifacts/bin/${{ matrix.test.project }}/release/${{ matrix.test.project }} --results-directory TestResults)
          else
            dotnet build ${{ matrix.test.project }}.csproj -c release
            hang_timeout=4m  # the in-job build leaves less of the job budget for a hang to be dumped in
            run_tests=(dotnet test --project ${{ matrix.test.project }}.csproj -c release --no-build --no-restore)
          fi
          dotnet build-server shutdown || true  # macOS VB/C# server sometimes fails to shut down; harmless
          # A hung test host is killed with a dump of every thread instead of running into the job
          # timeout, which kills the job without one. The timeout counts inactivity, not runtime, and
          # a mini dump keeps the write and upload inside whatever job budget the hang leaves.
          # A host that dies mid-run leaves a dump, a crash report where the runtime writes one, and a
          # sequence log of the tests in flight; on its own, exit code 7 names neither test nor cause.
          test_args=(
            --hangdump --hangdump-timeout "$hang_timeout" --hangdump-type Mini
            --crashdump --crashdump-type Mini --crash-report-if-supported)

          set +e
          "${run_tests[@]}" "${test_args[@]}"
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            exit 0
          elif [[ $rc -eq 1 || $rc -eq 2 ]]; then  # 2: at least one test failed, which a retry would only mask
            exit 1
          elif compgen -G "TestResults/*_hang.*" > /dev/null; then
            echo "::error::Test host hung and was dumped; see the hang-dump artifact"
            exit 1
          else
            echo "::warning::Test process crashed (exit code $rc), retrying..."
            echo "crashed=true" >> "$GITHUB_OUTPUT"  # keep the dump the crash just wrote, even if the retry passes
            "${run_tests[@]}" "${test_args[@]}"
          fi

      - name: Upload dumps
        if: ${{ failure() || cancelled() || steps.test.outputs.crashed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test.project }}-${{ matrix.test.chunk }}-${{ matrix.runner }}-dumps
          path: |
            src/Nethermind/${{ matrix.test.project }}/TestResults/*_hang.*
            src/Nethermind/${{ matrix.test.project }}/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3


  tests-chunked-native:
    name: Run ${{ matrix.test.project }}${{ matrix.test.label && format(' [{0}]', matrix.test.label) || '' }} (${{ matrix.test.chunk }}) (${{ matrix.runner }})
    needs: select
    if: fromJSON(needs.select.outputs.matrices).tests-chunked-native != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-chunked-native }}
    steps: *chunked-test-steps
  # EEST and zkEVM fixtures (formerly the Ethereum.Blockchain.Pyspec.Test shards) run
  # through the reusable nethtest workflow: same fixture releases, all fixture formats.
  # setup_group "all" runs both configuration groups - the sequential (patricia) baseline
  # plus the Amsterdam variant toggles, and the flat layout with its own variants. The
  # layout is passed by that workflow's matrix (--triedb), not by TEST_USE_TRIE, which does
  # not propagate into called workflows, so nethermind-tests-trie.yml adds no EEST job.
  nethtest:
    name: EEST nethtest
    uses: ./.github/workflows/run-nethtest.yml
    with:
      test_types: engineTest,blockTest,stateTest,syncTest,txTest,zkevmTest,focilTest,frameTest,frameBlockTest,frameTxTest
      setup_group: all

  matrix-guard:
    name: Check test project matrix is exhaustive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check every test project has a matrix entry
        run: |
          # Intentional exclusions:
          # - Nethermind.Precompiles.Benchmark.Test: lives in Benchmarks.slnx only, not built by the test artifact
          # - Nethermind.Core.ZkEvm.Test, Nethermind.Trie.ZkEvm.Test, Nethermind.State.ZkEvm.Test, Nethermind.Evm.ZkEvm.Test: run with
          #   EnableZkEvm=true in stateless-tests.yml
          # - Ethereum.Blockchain.Pyspec.Test: the fixture shards are superseded by the nethtest job
          #   (see run-nethtest.yml). The assembly also holds plain unit tests (StatelessSchemaTests)
          #   that remain unwired: test discovery loads the full pyspec fixture sets, so a matrix
          #   run exceeds the job timeout. Wiring those tests needs a project move.
          allowlist="Nethermind.Precompiles.Benchmark.Test Nethermind.Core.ZkEvm.Test Nethermind.Trie.ZkEvm.Test Nethermind.State.ZkEvm.Test Nethermind.Evm.ZkEvm.Test Ethereum.Blockchain.Pyspec.Test"
          missing=0
          for dir in src/Nethermind/*.Test; do
            project=$(basename "$dir")
            [[ -f "$dir/$project.csproj" ]] || continue
            [[ " $allowlist " == *" $project "* ]] && continue
            if ! jq -e --arg project "$project" \
                '."nethermind-tests" | [.. | strings | splits(" ")] | index($project) != null' scripts/ci/test-matrices.json > /dev/null; then
              echo "::error::$project runs in no CI matrix - add it to nethermind-tests in scripts/ci/test-matrices.json or to the allowlist in this step"
              missing=1
            fi
          done
          exit $missing

  tests-summary:
    name: Tests summary
    needs: [select, tests, tests-native, tests-spec, tests-chunked, tests-chunked-native, nethtest, matrix-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          MATRICES: ${{ needs.select.outputs.matrices }}
        run: |
          # A test job may be skipped only when the selection left it nothing to run; skipped for any other
          # reason (a failed build, a failed selection) is a failure.
          job_ok() {
            [[ "$2" == "success" ]] || [[ "$2" == "skipped" && "$(jq -r --arg job "$1" '.[$job] == null' <<< "$MATRICES")" == "true" ]]
          }
          [[ "${{ needs.select.result }}" == "success" ]]
          job_ok tests "${{ needs.tests.result }}"
          job_ok tests-native "${{ needs.tests-native.result }}"
          job_ok tests-spec "${{ needs.tests-spec.result }}"
          job_ok tests-chunked "${{ needs.tests-chunked.result }}"
          job_ok tests-chunked-native "${{ needs.tests-chunked-native.result }}"
          [[ "${{ needs.nethtest.result }}" == "success" ]]
          [[ "${{ needs.matrix-guard.result }}" == "success" ]]

  codecov-upload:
    name: Upload Codecov reports
    needs: [tests, tests-summary]
    if: needs.tests.outputs.collect_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          path: coverage
          pattern: '*-coverage'

      - name: Merge coverage reports
        run: |
          shopt -s globstar  # a packed job's artifact holds one directory per project
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge \
            coverage/**/*.cobertura.xml \
            -f cobertura \
            -o coverage.cobertura.xml \
            --remove-input-files

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov-nethermind
          files: coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true

  hive-tests:
    name: Hive tests
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/hive-tests.yml
