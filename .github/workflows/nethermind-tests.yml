name: Nethermind/Ethereum tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-db-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
      - name: Build database tests
        run: dotnet build src/Nethermind/Nethermind.Db.Test/Nethermind.Db.Test.csproj -c Release
      - name: Snapshot sequential reads
        continue-on-error: true
        run: dotnet test --project src/Nethermind/Nethermind.Db.Test/Nethermind.Db.Test.csproj -c Release --no-build -- --filter FullyQualifiedName~Snapshot_Get_WithHintReadAhead --output Detailed --no-ansi --diagnostic --diagnostic-synchronous-write
      - name: Snapshot concurrent reads
        continue-on-error: true
        run: dotnet test --project src/Nethermind/Nethermind.Db.Test/Nethermind.Db.Test.csproj -c Release --no-build -- --filter FullyQualifiedName~Snapshot_ReadAhead_ConcurrentColumns --output Detailed --no-ansi --diagnostic --diagnostic-synchronous-write
      - name: All database tests
        continue-on-error: true
        run: dotnet test --project src/Nethermind/Nethermind.Db.Test/Nethermind.Db.Test.csproj -c Release --no-build -- --output Detailed --no-ansi --diagnostic --diagnostic-synchronous-write
      - name: Windows crash events
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object {$_.ProviderName -in 'Application Error','.NET Runtime','Windows Error Reporting'} | Format-List TimeCreated,ProviderName,Message
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-db-diagnostics
          path: src/Nethermind/artifacts/bin/Nethermind.Db.Test/release/TestResults/
          if-no-files-found: ignore
          retention-days: 3
