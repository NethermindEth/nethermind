name: ARM Disk Probe

# Reclaims the reproducible-benchmarks-arm root disk. Docker here uses the containerd image store,
# so image content lands in /var/lib/containerd (5.8G) rather than /var/lib/docker, and
# `docker image prune -a --filter until=96h` reports 0B against it. Drop every benchmark image tag
# except the two the in-flight A/B needs; all of them are re-pullable from Docker Hub.

on:
  push:
    branches: [diag/arm-disk-probe]
    paths: [.github/workflows/arm-disk-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, reproducible-benchmarks-arm]
    timeout-minutes: 25
    steps:
      - name: Reclaim image store
        shell: bash
        env:
          KEEP: |
            nethermindeth/nethermind:master-46063c7
            nethermindeth/nethermind:rpcbench-pr12905-52e67a830c77
        run: |
          set -uo pipefail
          echo "=== before ==="
          df -h /; du -xsh /var/lib/containerd /var/lib/docker 2>/dev/null
          docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}' | sort

          keep_re="$(printf '%s' "${KEEP}" | tr -d ' ' | grep -v '^$' | paste -sd'|' -)"
          echo "=== keeping: ${keep_re} ==="

          mapfile -t drop < <(docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep -v '<none>' | grep -Ev "^(${keep_re})$" | sort -u)
          echo "=== dropping ${#drop[@]} tag(s) ==="
          for t in "${drop[@]}"; do echo "  rmi ${t}"; docker rmi "${t}" >/dev/null 2>&1 || echo "    (in use / already gone)"; done

          docker image prune -af >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          docker buildx prune -af >/dev/null 2>&1 || true

          echo "=== after ==="
          df -h /; du -xsh /var/lib/containerd /var/lib/docker 2>/dev/null
          docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | sort
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free on /: ${avail}G (rpc-bench guard needs 6G)"
          [[ "${avail}" -ge 6 ]] || { echo "::error::still under the guard threshold"; exit 1; }
