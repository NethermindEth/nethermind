name: AI PR Review Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  authorize:
    # AI_REVIEW_AUTO controls automatic reviews only. This trusted default-branch workflow does
    # not execute PR code, so authorized commands remain useful for drafts, forks, and Dependabot.
    if: >-
      vars.AI_REVIEW_COMMANDS != 'false' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Authorize review command
        id: permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = (context.payload.comment?.body || '').trim();
            const supported = /^\/(?:review|improve|describe)$/i.test(body) ||
              (/^\/ask\s+\S[\s\S]*$/i.test(body) && !body.replace(/["'\\]/g, '').includes('--'));
            if (!supported || context.payload.comment?.user?.type !== 'User') return;

            let permission;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: context.payload.comment.user.login,
              });
              permission = data.permission;
            } catch (error) {
              // A commenter who is not a collaborator gets 404; treat that as denied.
              if (error.status !== 404) throw error;
            }
            if (!['write', 'maintain', 'admin'].includes(permission)) {
              core.info('AI review command ignored: repository write access is required.');
              return;
            }
            core.setOutput('allowed', 'true');

  instructions:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/ai-review-instructions.yml
    with:
      pr_number: ${{ github.event.issue.number }}
    permissions:
      contents: read
      pull-requests: read

  command:
    needs: [authorize, instructions]
    if: needs.authorize.outputs.allowed == 'true'
    concurrency:
      group: ai-pr-review-command-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: NethermindEth/github-workflows/.github/workflows/ai-review-command.yaml@v2.4.0
    with:
      secret_path: /apps/litellm/nethermind-ai-reviewer
      num_max_findings: 8
      extra_instructions: ${{ needs.instructions.outputs.instructions }}
    secrets:
      infisical_identity_id: ${{ secrets.INFISICAL_IDENTITY_ID }}
      infisical_project_id: ${{ secrets.INFISICAL_PROJECT_ID }}
