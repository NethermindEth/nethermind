name: Nethermind tests (Trie DB)

# Mirror of nethermind-tests.yml pinned to the patricia-trie backend via TEST_USE_TRIE. Flat is the
# production default and so the default everywhere else; this workflow keeps patricia validated across
# the same project matrix. Kept to a single Linux runner and without coverage plumbing: the multi-OS and
# codecov legs are backend-independent, and duplicating them would only collide on artifact names.
# EEST fixtures are not run here — nethermind-tests.yml calls run-nethtest.yml with setup_group "all",
# which covers both the patricia and flat configuration groups.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm
  TEST_USE_TRIE: 1

defaults:
  run:
    shell: bash

permissions:
  # actions: read lets the select job download the test selection model from test-selection.yml.
  actions: read
  contents: read

jobs:
  build:
    needs: select
    if: needs.select.outputs.any == 'true'
    uses: ./.github/workflows/build-test-artifacts.yml
    with:
      matrix: >-
        {"include":[{"rid":"linux-x64","os":"ubuntu-latest","variant":"release","build_args":""}]}

  # Pull requests run only the test projects their change can affect (.github/actions/select-tests); every
  # other event runs every project. The matrices live in scripts/ci/test-matrices.json.
  select:
    name: Select test projects
    runs-on: ubuntu-latest
    outputs:
      matrices: ${{ steps.select.outputs.matrices }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select test projects
        id: select
        uses: ./.github/actions/select-tests
        with:
          workflow: nethermind-tests-trie

  tests:
    name: Run ${{ matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }}
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_GCConserveMemory: 9
    strategy:
      fail-fast: false
      # Synchronization.Test is chunked on every runner in the main suite — its unchunked variant hits the wall.
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: release

      - name: ${{ matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }}
        id: test
        working-directory: src/Nethermind/${{ matrix.project }}
        env:
          TEST_CHUNK: ${{ matrix.chunk }}
        run: |
          # A hung test host is killed with a dump of every thread instead of running into the job
          # timeout, which kills the job without one. The timeout counts inactivity, not runtime, and
          # a mini dump keeps the write and upload inside whatever job budget the hang leaves.
          # A host that dies mid-run leaves a dump, a crash report where the runtime writes one, and a
          # sequence log of the tests in flight; on its own, exit code 7 names neither test nor cause.
          ../artifacts/bin/${{ matrix.project }}/release/${{ matrix.project }} --results-directory TestResults \
            --hangdump --hangdump-timeout 8m --hangdump-type Mini \
            --crashdump --crashdump-type Mini --crash-report-if-supported

      - name: Upload dumps
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}${{ matrix.chunk && format('-{0}', matrix.chunk) || '' }}-dumps
          path: |
            src/Nethermind/${{ matrix.project }}/TestResults/*_hang.*
            src/Nethermind/${{ matrix.project }}/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

  tests-spec:
    name: Run ${{ matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }}
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests-spec != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only these EF fixture tests read the src/tests submodule at runtime.
      FIXTURE_PROJECTS: '["Ethereum.Blockchain.Block.Test","Ethereum.Legacy.Blockchain.Block.Test","Ethereum.Legacy.Blockchain.Test","Ethereum.Legacy.Transition.Test","Ethereum.Legacy.VM.Test"]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-spec }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch submodules
        if: ${{ contains(fromJSON(env.FIXTURE_PROJECTS), matrix.project) }}
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: release

      - name: ${{ matrix.project }}${{ matrix.chunk && format(' ({0})', matrix.chunk) || '' }}
        id: test
        working-directory: src/Nethermind/${{ matrix.project }}
        env:
          TEST_CHUNK: ${{ matrix.chunk }}
        run: |
          ../artifacts/bin/${{ matrix.project }}/release/${{ matrix.project }} --results-directory TestResults \
            --hangdump --hangdump-timeout 8m --hangdump-type Mini \
            --crashdump --crashdump-type Mini --crash-report-if-supported

      - name: Upload dumps
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}${{ matrix.chunk && format('-{0}', matrix.chunk) || '' }}-dumps
          path: |
            src/Nethermind/${{ matrix.project }}/TestResults/*_hang.*
            src/Nethermind/${{ matrix.project }}/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

  tests-chunked:
    name: Run ${{ matrix.test.project }} (${{ matrix.test.chunk }})
    needs: [build, select]
    if: fromJSON(needs.select.outputs.matrices).tests-chunked != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrices).tests-chunked }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch submodules
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5

      - name: Download test binaries
        uses: ./.github/actions/download-test-artifacts
        with:
          variant: release

      - name: ${{ matrix.test.project }} (${{ matrix.test.chunk }})
        id: test
        working-directory: src/Nethermind/${{ matrix.test.project }}
        env:
          TEST_CHUNK: ${{ matrix.test.chunk }}
        run: |
          ../artifacts/bin/${{ matrix.test.project }}/release/${{ matrix.test.project }} --results-directory TestResults \
            --hangdump --hangdump-timeout 8m --hangdump-type Mini \
            --crashdump --crashdump-type Mini --crash-report-if-supported

      - name: Upload dumps
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.test.project }}-${{ matrix.test.chunk }}-dumps
          path: |
            src/Nethermind/${{ matrix.test.project }}/TestResults/*_hang.*
            src/Nethermind/${{ matrix.test.project }}/TestResults/*_crash.*
          if-no-files-found: ignore
          retention-days: 3

  tests-summary:
    name: Tests summary
    needs: [select, tests, tests-spec, tests-chunked]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          MATRICES: ${{ needs.select.outputs.matrices }}
        run: |
          # A test job may be skipped only when the selection left it nothing to run; skipped for any other
          # reason (a failed build, a failed selection) is a failure.
          job_ok() {
            [[ "$2" == "success" ]] || [[ "$2" == "skipped" && "$(jq -r --arg job "$1" '.[$job] == null' <<< "$MATRICES")" == "true" ]]
          }
          [[ "${{ needs.select.result }}" == "success" ]]
          job_ok tests "${{ needs.tests.result }}"
          job_ok tests-spec "${{ needs.tests-spec.result }}"
          job_ok tests-chunked "${{ needs.tests-chunked.result }}"