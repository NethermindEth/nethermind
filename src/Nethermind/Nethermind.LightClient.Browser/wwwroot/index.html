<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nethermind Light Client</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
    <h1>Nethermind <span>LC</span></h1>
    <p>Verify Ethereum consensus and state proofs in your browser. Supply a recent trusted finalized beacon block root. The proof relay supplies data; this browser verifies it locally.</p>
    <form id="connect">
        <label for="network">Network</label>
        <select id="network"><option value="mainnet">Mainnet</option><option value="hoodi">Hoodi</option><option value="sepolia">Sepolia</option></select>
        <label for="checkpoint">Trusted checkpoint</label>
        <input id="checkpoint" placeholder="0x… finalized beacon block root" required pattern="0x[0-9a-fA-F]{64}" spellcheck="false">
        <label for="relays">Proof relay URLs, separated by commas</label>
        <input id="relays" required spellcheck="false">
        <button id="start">Connect and verify</button>
    </form>
    <p id="status" role="status">Waiting for a trusted checkpoint.</p>
    <form id="balance" class="hidden">
        <label for="address">Account</label>
        <input id="address" value="0xde198901C5ee4611142E0c61DfbbCEc7ab468F32" required pattern="0x[0-9a-fA-F]{40}" spellcheck="false">
        <button>Read verified finalized balance</button>
    </form>
    <pre id="result" class="hidden"></pre>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
