[package]
name = "flatdb-ffi"
description = "C ABI of the FlatDB core, loaded by Nethermind.State.Flat.Rust as libnethermind_flatdb."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nethermind_flatdb"
crate-type = ["cdylib", "rlib"]

[features]
# The debug exports, the in-memory backend and fault injection (`fdb_test_inject_fault`), for tests driving the library
# from outside; never in a production build. The C# tests build it into target/test-api, apart from the production one.
test-api = []

[dependencies]
flatdb-core.workspace = true
log.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
