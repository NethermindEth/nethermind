name: RPC prospective native capability
run-name: RPC native lifecycle ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-rpc-native-capability
  cancel-in-progress: false
jobs:
  capability:
    runs-on: [self-hosted, reproducible-benchmarks]
    timeout-minutes: 30
    env:
      OPERATOR: rpc-capability-operator-${{ github.run_id }}-${{ github.run_attempt }}
      HARNESS: rpc-capability-harness-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ${{ env.OPERATOR }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 420c992e6d8c8e2b1abae899cece932da7e9e47b
          path: ${{ env.HARNESS }}
          persist-credentials: false
      - name: Verify portable and integration correctness before native mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s "$HARNESS/scripts" -p 'test_rpc_*.py' -v
          python3 -B -m unittest discover -s "$HARNESS/scripts/rpc-bench" -p 'test_sample_resources.py' -v
          python3 -B -m unittest discover -s "$OPERATOR/scripts/rpc-capability" -p 'test_guard.py' -v
          python3 -B -m unittest discover -s "$OPERATOR/scripts/rpc-capability/native" -p 'test_native_capability.py' -v
      - name: Run one prospective lifecycle capability
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B "$OPERATOR/scripts/rpc-capability/launch.py" --operator "$OPERATOR" --harness "$HARNESS"
      - name: Verify owned closure and prepare content-free public result
        id: publication
        if: success() && steps.native.outcome == 'success'
        shell: bash
        run: python3 -B "$OPERATOR/scripts/rpc-capability/guard.py" publish
      - uses: actions/upload-artifact@v4
        id: upload
        if: success() && steps.publication.outputs.ready == 'true'
        with:
          name: rpc-native-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.publication.outputs.public }}/
          if-no-files-found: error
          retention-days: 30
      - name: Record upload and release only this completed reservation
        if: success() && steps.upload.outcome == 'success'
        env:
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: python3 -B "$OPERATOR/scripts/rpc-capability/guard.py" release
