[package]
name = "nethermind-lean"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "nethermind_lean"
crate-type = ["cdylib", "rlib"]

[dependencies]
sphincs = { git = "https://github.com/Marchhill/leanVM", rev = "d4ce2a68235457a242f4aea681bdf99b50462d2d" }
rec_aggregation = { git = "https://github.com/Marchhill/leanVM", rev = "d4ce2a68235457a242f4aea681bdf99b50462d2d", features = ["eip8288-mixed"] }
lean_vm = { git = "https://github.com/Marchhill/leanVM", rev = "d4ce2a68235457a242f4aea681bdf99b50462d2d" }
lean_compiler = { git = "https://github.com/Marchhill/leanVM", rev = "d4ce2a68235457a242f4aea681bdf99b50462d2d" }
primitives = { git = "https://github.com/Marchhill/leanVM", rev = "d4ce2a68235457a242f4aea681bdf99b50462d2d" }
parallel = { git = "https://github.com/Marchhill/leanVM", rev = "d4ce2a68235457a242f4aea681bdf99b50462d2d" }
bincode = "1.3"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[profile.release]
opt-level = 3

[[example]]
name = "lean_startup_stub"
crate-type = ["cdylib"]
test = false
