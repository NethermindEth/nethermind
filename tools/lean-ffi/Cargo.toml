[package]
name = "nethermind-lean"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "nethermind_lean"
crate-type = ["cdylib", "rlib"]

[dependencies]
sphincs = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51" }
rec_aggregation = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51", features = ["eip8288-mixed"] }
lean_vm = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51" }
lean_compiler = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51" }
primitives = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51" }
parallel = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51" }
zk_alloc = { git = "https://github.com/Marchhill/leanVM", rev = "f58279bf065cdc987cf42140b7b9b991847eec51" }
bincode = "1.3"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3

[[example]]
name = "lean_startup_stub"
crate-type = ["cdylib"]
test = false
