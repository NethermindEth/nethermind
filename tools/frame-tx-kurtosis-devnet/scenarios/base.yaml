# Two execution clients, one Nethermind and one ethrex, each with its own Lighthouse beacon node
# and validators, on the fork schedule of the public frames-devnet-0
# (ethpandaops/frames-devnets): Amsterdam/Gloas from genesis, EIP-8141 on the execution layer
# only from bogotaTime.
#
# el_image is left unset: the wrapper pins the ceiling-specific images
# (frame-tx-devnet/{nethermind,ethrex}:vg<ceiling>) built by images/build.sh.

participants:
  - el_type: nethermind
    cl_type: lighthouse
    # The Lighthouse build frames-devnet-0 runs; release tags do not yet follow Gloas.
    cl_image: ethpandaops/lighthouse:unstable-4b1f3c2
    validator_count: 32
    # Fulu at epoch 0 is PeerDAS; the package refuses to start without a supernode.
    supernode: true
  - el_type: ethrex
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-4b1f3c2
    validator_count: 32
    supernode: true

network_params:
  seconds_per_slot: 6
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  # Written into the execution genesis as bogotaTime: both clients enable EIP-8141 there, at
  # 32 slots x 6 s = 192 s after genesis. frames_enabled keeps the consensus layer off Heze:
  # there it means inclusion lists (EIP-7805), which frames-devnet-0 does not run.
  heze_fork_epoch: 1
  frames_enabled: true

additional_services:
  - prometheus
  - grafana
  - dora

port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
  additional_services:
    enabled: true
    public_port_start: 34000
