# Topology: two Nethermind nodes. ethrex is absent on purpose, not by oversight: it decodes a
# frame as [mode, flags, target, gas_limit, value, data] while Nethermind expects
# limits = [execution, state], so the two cannot share a chain until they agree on one EIP
# revision. See UPSTREAM-CANDIDATES.md. Two nodes keep gossip, mempool propagation and block
# production real rather than single-process.
#
# el_image is left unset on purpose: the wrapper pins the ceiling-specific image
# (frame-tx-devnet/nethermind:vg<ceiling>) built by images/build.sh.

participants:
  - el_type: nethermind
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.2.2
    validator_count: 32
    # Fulu at epoch 0 is PeerDAS; the package refuses to start without a supernode.
    supernode: true
  - el_type: nethermind
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.2.2
    validator_count: 32
    # Fulu at epoch 0 is PeerDAS; the package refuses to start without a supernode.
    supernode: true

network_params:
  seconds_per_slot: 6
  # Genesis stays on Fulu, which is what public devnets actually run: glamsterdam devnet-11
  # still has GLOAS_FORK_EPOCH 1125 and HEZE never. Scheduling Gloas earlier stalls the chain,
  # because Nethermind answers engine_newPayloadV5 with "Unsupported fork", and it also breaks
  # Lighthouse's genesis SSZ decode when placed at epoch 0.
  fulu_fork_epoch: 0

# EIP-8141 is therefore not scheduled by a fork label at all. The patched Nethermind image
# reads frame_tx.eip8141_activation_offset_seconds and activates that many seconds after
# genesis.

additional_services:
  - prometheus
  - grafana
  - dora

port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
  additional_services:
    enabled: true
    public_port_start: 34000
