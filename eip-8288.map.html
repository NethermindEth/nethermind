  .status { font: 500 10.5px var(--mono); color: var(--amber); border: 1px solid currentColor; border-radius: 5px; padding: 1px 6px; }

  .box2 { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; }
  .dot.full { background: var(--muted); }

  .keyrow { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }

  .pill.limit { color: var(--orange); }
  .pill.decide { color: var(--amber); border-style: dashed; }
</style>

const DEFAULT_TAGS = {
  public: { label: DATA.lang === "it" ? "pubblico" : "public", tone: "orange" },
  anonymous: { label: DATA.lang === "it" ? "anonimo" : "anonymous", tone: "green" },
  encrypted: { label: DATA.lang === "it" ? "cifrato" : "encrypted", tone: "teal" },

  onchain: { label: "on-chain", tone: "violet" },
  local: { label: DATA.lang === "it" ? "locale" : "local", tone: "slate" },
};
const TAGS = { ...DEFAULT_TAGS, ...(DATA.tags ?? {}) };

// Grid geometry: integer grid coordinates are corridors between cells; nodes sit at cell centers.
const CW = 240, RH = 120, M = 34, NW = 180, NH = 64;
const gx = (c) => M + c * CW;
const gy = (r) => M + r * RH;

const tone = (t) => `var(--${t ?? "slate"})`;
const softTone = (t) => `var(--${t ?? "slate"}-soft)`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

function layoutView(view) {
  const nodes = {};
  for (const n of view.nodes) {
    const [c, r] = n.at;
    const span = n.span ?? 1;
    const w = NW + (span - 1) * CW;
    const x = gx(c) + (CW * span - w) / 2;
    const y = gy(r) + (RH - NH) / 2;
    nodes[n.id] = { ...n, x, y, w, h: NH, c, r, span };
  }
  const zones = (view.zones ?? []).map((z) => {
    const members = Object.values(nodes).filter((n) => n.zone === z.id);
    if (!members.length) return null;
    const x1 = Math.min(...members.map((n) => n.x)) - 14, y1 = Math.min(...members.map((n) => n.y)) - 30;
    const x2 = Math.max(...members.map((n) => n.x + n.w)) + 14, y2 = Math.max(...members.map((n) => n.y + n.h)) + 14;
    return { ...z, x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }).filter(Boolean);
  const cols = Math.max(...Object.values(nodes).map((n) => n.c + n.span));
  const rows = Math.max(...Object.values(nodes).map((n) => n.r + 1));
  return { nodes, zones, width: gx(cols) + M, height: gy(rows) + M };
}

// Orthogonal routing through the corridors; the first candidate that clears every other node wins.
function hits(seg, rects) {
  const [[x1, y1], [x2, y2]] = seg;
  const lx = Math.min(x1, x2), hx = Math.max(x1, x2), ly = Math.min(y1, y2), hy = Math.max(y1, y2);
  return rects.some((r) => hx > r.x - 4 && lx < r.x + r.w + 4 && hy > r.y - 4 && ly < r.y + r.h + 4);
}
function clear(pts, rects) {
  for (let i = 0; i < pts.length - 1; i++) if (hits([pts[i], pts[i + 1]], rects)) return false;
  return true;
}
function routeEdge(edge, layout, off) {
  const A = layout.nodes[edge.from], B = layout.nodes[edge.to];
  const others = Object.values(layout.nodes).filter((n) => n !== A && n !== B);
  if (edge.via) {
    const pts = edge.via.map(([c, r]) => [gx(c), gy(r)]);
    const first = pts[0], last = pts[pts.length - 1];
    const start = sideToward(A, first), end = sideToward(B, last);
    return [start, ...pts, end];
  }
  const acx = A.x + A.w / 2, acy = A.y + A.h / 2, bcx = B.x + B.w / 2, bcy = B.y + B.h / 2;
  const cands = [];
  const yOverlap = Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y);
  const xOverlap = Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x);
  if (yOverlap >= 24) {
    const y = (Math.max(A.y, B.y) + Math.min(A.y + A.h, B.y + B.h)) / 2 + off;
    cands.push(bcx > acx ? [[A.x + A.w, y], [B.x, y]] : [[A.x, y], [B.x + B.w, y]]);
  }
  if (xOverlap >= 24) {
    const x = (Math.max(A.x, B.x) + Math.min(A.x + A.w, B.x + B.w)) / 2 + off;
    cands.push(bcy > acy ? [[x, A.y + A.h], [x, B.y]] : [[x, A.y], [x, B.y + B.h]]);
  }
  const right = bcx > acx, down = bcy > acy;
  const ax = right ? A.x + A.w : A.x, bx = right ? B.x : B.x + B.w;
  const ay = down ? A.y + A.h : A.y, by = down ? B.y : B.y + B.h;
  const aGutX = right ? gx(A.c + A.span) : gx(A.c), bGutX = right ? gx(B.c) : gx(B.c + B.span);
  const aGutY = down ? gy(A.r + 1) : gy(A.r), bGutY = down ? gy(B.r) : gy(B.r + 1);
  const sy = acy + off, ty = bcy + off, sx = acx + off, tx = bcx + off;
  if (Math.abs(bcx - acx) > 1) {
    for (const x of [aGutX, bGutX]) cands.push([[ax, sy], [x + off, sy], [x + off, ty], [bx, ty]]);
  }
  if (Math.abs(bcy - acy) > 1) {
    for (const y of [aGutY, bGutY]) cands.push([[sx, ay], [sx, y + off], [tx, y + off], [tx, by]]);
  }
  for (const y of [aGutY, bGutY, gy(A.r), gy(A.r + 1)]) {
    cands.push([[ax, sy], [aGutX + off, sy], [aGutX + off, y + off], [bGutX + off, y + off], [bGutX + off, ty], [bx, ty]]);
  }
  return cands.find((p) => clear(p, others)) ?? cands[cands.length - 1];
}
const LANES = [0, 8, -8, 16, -16, 24, -24];
const segments = (pts) => pts.slice(1).map((p, i) => [pts[i], p]);
function sameTrack([a, b], [c, d]) {
  const overlap = (p, q, r, s) => Math.min(Math.max(p, q), Math.max(r, s)) - Math.max(Math.min(p, q), Math.min(r, s)) > 2;
  if (a[0] === b[0] && c[0] === d[0]) return Math.abs(a[0] - c[0]) < 5 && overlap(a[1], b[1], c[1], d[1]);
  if (a[1] === b[1] && c[1] === d[1]) return Math.abs(a[1] - c[1]) < 5 && overlap(a[0], b[0], c[0], d[0]);
  return false;
}
function sideToward(n, [px, py]) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  if (px <= n.x) return [n.x, Math.min(Math.max(py, n.y + 8), n.y + n.h - 8)];
  if (px >= n.x + n.w) return [n.x + n.w, Math.min(Math.max(py, n.y + 8), n.y + n.h - 8)];
  if (py <= n.y) return [Math.min(Math.max(px, n.x + 8), n.x + n.w - 8), n.y];
  if (py >= n.y + n.h) return [Math.min(Math.max(px, n.x + 8), n.x + n.w - 8), n.y + n.h];
  return [cx, cy];
}
function roundedPath(pts, r = 8) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const d1 = Math.hypot(x - px, y - py), d2 = Math.hypot(nx - x, ny - y);
    const k = Math.min(r, d1 / 2, d2 / 2);
    if (k < 0.5) { d += ` L${x},${y}`; continue; }
    d += ` L${x - ((x - px) / d1) * k},${y - ((y - py) / d1) * k} Q${x},${y} ${x + ((nx - x) / d2) * k},${y + ((ny - y) / d2) * k}`;
  }
  const last = pts[pts.length - 1];
  return `${d} L${last[0]},${last[1]}`;
}

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const el = (tag, attrs = {}, parent) => {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};

const VIEWS = Object.fromEntries(DATA.views.map((v) => [v.id, v]));
const parentOf = {};
for (const v of DATA.views) for (const n of v.nodes) if (n.drill) parentOf[n.drill] = { view: v.id, node: n.id };

let viewId = DATA.views[0].id, flowId = null, stepIndex = -1, nodeId = null, timer = null;
let layout, edgeEls = {}, nodeEls = {}, badgeLayer;

function drawView() {
  const view = VIEWS[viewId];
  layout = layoutView(view);
  svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
  svg.style.minWidth = `${Math.min(layout.width, 900)}px`;
  svg.setAttribute("aria-label", view.title ?? DATA.title);
  const defs = el("defs", {}, svg);
  for (const [id, fill] of [["arrow", "var(--faint)"], ["arrow-on", "var(--accent)"]]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill }, m);
  }
  el("rect", { x: 0, y: 0, width: layout.width, height: layout.height, fill: "var(--surface)" }, svg);
  const zl = el("g", {}, svg);
  for (const z of layout.zones) {
    const g = el("g", { class: "zone" }, zl);
    el("rect", { x: z.x, y: z.y, width: z.w, height: z.h, rx: 14, fill: softTone(z.tone), stroke: tone(z.tone), "stroke-opacity": 0.35 }, g);
    el("text", { x: z.x + 14, y: z.y + 19, fill: tone(z.tone) }, g).textContent = z.label;
  }
  const edl = el("g", {}, svg);
  edgeEls = {};
  const used = [];
  (view.edges ?? []).forEach((e) => {
    // First free lane in each corridor, so parallel segments never sit on top of each other.
    let pts = null;
    for (const off of LANES) {
      const candidate = routeEdge(e, layout, off);
      if (!segments(candidate).some((s) => used.some((u) => sameTrack(s, u)))) { pts = candidate; break; }
    }
    pts ??= routeEdge(e, layout, 0);
    used.push(...segments(pts));
    const path = el("path", { d: roundedPath(pts), class: `edge${e.style === "dashed" ? " dashed" : ""}`, "marker-end": "url(#arrow)" }, edl);
    const title = el("title", {}, path);
    title.textContent = e.label ?? "";
    edgeEls[e.id] = path;
  });
  const nl = el("g", {}, svg);
  nodeEls = {};
  for (const n of Object.values(layout.nodes)) {
    const g = el("g", { class: "node", tabindex: "0", role: "button", "aria-label": n.title }, nl);
    const kind = n.kind ?? "service";
    const rx = kind === "actor" ? 12 : kind === "key" ? n.h / 2 : kind === "contract" ? 4 : 8;
    const box = el("rect", { class: "box", x: n.x, y: n.y, width: n.w, height: n.h, rx }, g);
    if (kind === "external") box.setAttribute("stroke-dasharray", "4 4");
    if (kind === "contract") el("rect", { x: n.x + 4, y: n.y + 4, width: n.w - 8, height: n.h - 8, rx: 2, fill: "none", stroke: tone(n.tone), "stroke-opacity": 0.35 }, g);
    if (kind === "store") el("path", { d: `M${n.x + n.w - 14},${n.y} L${n.x + n.w},${n.y + 14} L${n.x + n.w - 14},${n.y + 14} z`, fill: tone(n.tone), "fill-opacity": 0.35 }, g);
    if (kind === "queue") for (let k = 0; k < 3; k++) el("rect", { x: n.x + n.w - 26 + k * 7, y: n.y + 8, width: 4, height: 12, rx: 1, fill: tone(n.tone), "fill-opacity": 0.45 }, g);
    if (kind !== "key") el("rect", { x: n.x, y: n.y + 10, width: 3.5, height: n.h - 20, rx: 1.5, fill: tone(n.tone) }, g);
    const pad = kind === "key" ? 20 : 14;
    if (n.tag) el("text", { class: "tag", x: n.x + pad, y: n.y + 17, fill: tone(n.tone) }, g).textContent = n.tag;
    el("text", { class: "title", x: n.x + pad, y: n.y + (n.tag ? 37 : 30) }, g).textContent = n.title;
    if (n.meta) el("text", { class: "meta", x: n.x + pad, y: n.y + n.h - 11 }, g).textContent = n.meta;
    if (n.drill) {
      const dg = el("g", { transform: `translate(${n.x + n.w - 22},${n.y + n.h - 22})` }, g);
      el("rect", { width: 16, height: 16, rx: 4, fill: "none", stroke: tone(n.tone) }, dg);
      el("path", { d: "M5,4 L11,8 L5,12", fill: "none", stroke: tone(n.tone), "stroke-width": 1.6 }, dg);
    }
    const act = () => (n.drill && nodeId === n.id ? openView(n.drill) : selectNode(n.id));
    g.addEventListener("click", act);
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); } });
    nodeEls[n.id] = g;
  }
  badgeLayer = el("g", {}, svg);
}

const flowsOf = (vid) => (DATA.flows ?? []).filter((f) => (f.view ?? DATA.views[0].id) === vid);
const currentFlow = () => (DATA.flows ?? []).find((f) => f.id === flowId);

function renderChrome() {
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("subtitle").textContent = DATA.subtitle ?? T.pickFlow;
  const crumbs = document.getElementById("crumbs");
  const chain = [];
  for (let v = viewId; v; v = parentOf[v]?.view) chain.unshift(v);
  crumbs.innerHTML = DATA.views.length > 1
    ? chain.map((v, i) => (i < chain.length - 1 ? `<button type="button" data-v="${v}">${esc(VIEWS[v].title)}</button> /` : `<span>${esc(VIEWS[v].title)}</span>`)).join(" ")
    : "";
  crumbs.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => openView(b.dataset.v)));
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren();
  const mk = (id, label, n) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab";
    b.setAttribute("aria-pressed", String(flowId === id));
    b.innerHTML = (n ? `<b>${esc(n)}</b>` : "") + esc(label);
    b.addEventListener("click", () => selectFlow(id));
    tabs.appendChild(b);
  };
  mk(null, T.overview);
  flowsOf(viewId).forEach((f, i) => mk(f.id, f.title, String(i + 1)));
}

// Auto numbers continue after custom ones: 1, 2, 3a, 3b, 4.
function stepLabel(f, i) {
  let k = 0, label = "";
  for (const s of f.steps.slice(0, i + 1)) {
    if (s.n) { label = s.n; k = parseInt(s.n, 10) || k + 1; } else { k += 1; label = String(k); }
  }
  return label;
}

function render() {
  renderChrome();
  const f = currentFlow();
  const steps = f?.steps ?? [];
  const active = new Set(steps.filter((s) => s.edge).map((s) => s.edge));
  const nodesOn = new Set();
  for (const s of steps) {
    if (s.node) nodesOn.add(s.node);
    if (s.edge) { const e = VIEWS[viewId].edges.find((x) => x.id === s.edge); nodesOn.add(e.from); nodesOn.add(e.to); }
  }
  const focus = steps[stepIndex];
  const dimming = steps.length > 0;
  for (const [id, p] of Object.entries(edgeEls)) {
    const on = active.has(id);
    p.classList.toggle("on", on);
    p.classList.toggle("focus", Boolean(focus && focus.edge === id));
    p.classList.toggle("dim", dimming && !on);
    p.setAttribute("marker-end", on ? "url(#arrow-on)" : "url(#arrow)");
  }
  for (const [id, g] of Object.entries(nodeEls)) {
    g.classList.toggle("dim", dimming && !nodesOn.has(id));
    g.classList.toggle("sel", nodeId === id || Boolean(focus && focus.node === id));
  }
  badgeLayer.replaceChildren();
  const seen = {};
  const placed = [];
  steps.forEach((s, i) => {
    if (!s.edge && !s.node) return;
    let x, y;
    if (s.node) {
      const n = layout.nodes[s.node];
      seen[s.node] = (seen[s.node] ?? 0) + 1;
      x = n.x + n.w - 12 - (seen[s.node] - 1) * 30; y = n.y;
    } else {
      const p = edgeEls[s.edge];
      const count = steps.filter((o) => o.edge === s.edge).length;
      seen[s.edge] = (seen[s.edge] ?? 0) + 1;
      const base = count === 1 ? 0.5 : 0.25 + (0.5 * (seen[s.edge] - 1)) / (count - 1);
      // Slide along the edge until the badge clears the ones already placed.
      for (const shift of [0, -0.18, 0.18, -0.3, 0.3, -0.38, 0.38]) {
        const frac = Math.min(0.92, Math.max(0.08, base + shift));
        ({ x, y } = p.getPointAtLength(p.getTotalLength() * frac));
        if (!placed.some(([px, py]) => Math.hypot(px - x, py - y) < 24)) break;
      }
    }
    placed.push([x, y]);
    const label = stepLabel(f, i);
    const g = el("g", { class: `badge${i === stepIndex ? " focus" : ""}`, transform: `translate(${x},${y})` }, badgeLayer);
    const w = Math.max(22, label.length * 8 + 10);
    if (label.length > 2) el("rect", { x: -w / 2, y: -11, width: w, height: 22, rx: 11 }, g);
    else el("circle", { r: 11 }, g);
    el("text", { "text-anchor": "middle", y: 4 }, g).textContent = label;
    g.addEventListener("click", () => selectStep(i));
  });
  renderPanel(f);
}

function chipsHtml(tags) {
  if (!tags?.length) return "";
  return `<div class="chips">${tags.map((t) => {
    const def = TAGS[t] ?? { label: t, tone: "slate" };
    return `<span class="chip${def.dashed ? " dashed" : ""}" style="color:${tone(def.tone)}">${esc(def.label)}</span>`;
  }).join("")}</div>`;
}

function renderPanel(f) {
  const panel = document.getElementById("panel");
  if (nodeId) {
    const n = layout.nodes[nodeId];
    panel.innerHTML = `<div class="nodecard"><div class="kindlabel">${esc(n.tag ?? n.kind ?? "")}</div><h3>${esc(n.title)}</h3>
      ${n.info?.length ? `<ul>${n.info.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${n.ref ? `<div class="ref">${esc(n.ref)}</div>` : ""}</div>
      ${n.drill ? `<div class="controls"><button type="button" id="drill">${esc(T.open)} →</button></div>` : ""}
      <div class="hint">${esc(T.backToSteps)}</div>`;
    panel.querySelector("#drill")?.addEventListener("click", () => openView(n.drill));
    return;
  }
  if (!f) {
    const view = VIEWS[viewId];
    const usedTags = new Set((DATA.flows ?? []).flatMap((x) => x.steps.flatMap((s) => s.tags ?? [])));
    panel.innerHTML = `<h3>${esc(view.title ?? T.overview)}</h3><p class="goal">${esc(view.summary ?? T.pickFlow)}</p>
      <div class="legend">
        <div><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--faint)" stroke-width="1.6"/></svg>${esc(T.call)}</div>
        <div><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 5"/></svg>${esc(T.offband)}</div>
      </div>
      ${chipsHtml([...usedTags])}`;
    return;
  }
  panel.innerHTML = `<h3>${esc(f.title)}</h3>${f.goal ? `<p class="goal">${esc(f.goal)}</p>` : ""}
    <div class="controls">
      <button type="button" id="prev">← ${esc(T.back)}</button>
      <button type="button" id="nextb">${esc(T.next)} →</button>
      <button type="button" id="play">${esc(timer ? T.stop : T.play)}</button>
      <button type="button" id="mermaid">${esc(T.mermaid)}</button>
    </div>
    <div class="toast" id="toast"></div>
    <ol class="steps">${f.steps.map((s, i) => `
      <li class="step kind-${s.edge ? "message" : s.node ? "process" : "info"}" tabindex="0" data-i="${i}" aria-current="${i === stepIndex}">
        <span class="num">${esc(stepLabel(f, i))}</span>
        <div><div class="t">${esc(s.title)}</div>${chipsHtml(s.tags)}
          ${s.detail || s.ref ? `<div class="detail">${s.detail ? `<span>${esc(s.detail)}</span>` : ""}${s.ref ? `<span class="ref">${esc(s.ref)}</span>` : ""}</div>` : ""}
        </div>
      </li>`).join("")}</ol>
    <div class="hint">${esc(T.clickStep)}</div>`;
  panel.querySelectorAll(".step").forEach((li) => {
    const i = Number(li.dataset.i);
    li.addEventListener("click", () => selectStep(i));
    li.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectStep(i); } });
  });
  panel.querySelector("#prev").addEventListener("click", () => move(-1));
  panel.querySelector("#nextb").addEventListener("click", () => move(1));
  panel.querySelector("#play").addEventListener("click", togglePlay);
  panel.querySelector("#mermaid").addEventListener("click", () => copyMermaid(f));
}

function mermaidFor(f) {
  const view = VIEWS[f.view ?? DATA.views[0].id];
  const byId = Object.fromEntries(view.nodes.map((n) => [n.id, n]));
  const ids = [];
  const use = (id) => { if (!ids.includes(id)) ids.push(id); };
  const lines = [];
  f.steps.forEach((s, i) => {
    const label = `${stepLabel(f, i)}. ${s.title}`.replace(/[;#]/g, " ");
    if (s.edge) {
      const e = view.edges.find((x) => x.id === s.edge);
      use(e.from); use(e.to);
      lines.push(`  ${e.from}${e.style === "dashed" ? "-->>" : "->>"}${e.to}: ${label}`);
    } else if (s.node) { use(s.node); lines.push(`  Note over ${s.node}: ${label}`); }
    else if (ids.length) lines.push(`  Note over ${ids[0]}: ${label}`);
  });
  return ["sequenceDiagram", ...ids.map((id) => `  participant ${id} as ${byId[id].title}`), ...lines].join("\n");
}
async function copyMermaid(f) {
  const text = mermaidFor(f);
  const toast = document.getElementById("toast");
  try { await navigator.clipboard.writeText(text); toast.textContent = T.copied; }
  catch { toast.textContent = T.copyFail; const pre = document.createElement("pre"); pre.textContent = text; pre.className = "ref"; toast.after(pre); }
}

function selectFlow(id) {
  stopPlay(); flowId = id; stepIndex = -1; nodeId = null;
  // Sandboxed viewers (srcdoc iframes) refuse history changes; the map works without the deep link.
  if (id) try { history.replaceState(null, "", `#${id}`); } catch {}
  render();
}
function selectStep(i) { nodeId = null; stepIndex = stepIndex === i ? -1 : i; render(); }
function selectNode(id) { nodeId = nodeId === id ? null : id; render(); }
function move(d) { const f = currentFlow(); if (!f) return; nodeId = null; stepIndex = Math.max(0, Math.min(f.steps.length - 1, stepIndex + d)); render(); }
function stopPlay() { if (timer) { clearInterval(timer); timer = null; } }
function togglePlay() {
  if (timer) { stopPlay(); render(); return; }
  const f = currentFlow();
  if (stepIndex >= f.steps.length - 1) stepIndex = -1;
  timer = setInterval(() => { const cur = currentFlow(); if (!cur || stepIndex >= cur.steps.length - 1) { stopPlay(); render(); return; } move(1); }, 1800);
  move(1);
}
function openView(id) { stopPlay(); viewId = id; flowId = null; stepIndex = -1; nodeId = null; drawView(); render(); }

document.addEventListener("keydown", (ev) => {
  if (ev.target.closest?.("input, textarea")) return;
  if (ev.key === "ArrowRight") move(1);
  if (ev.key === "ArrowLeft") move(-1);
});

function renderExtras() {
  const L = DATA.labels ?? {};
  if (DATA.decisions?.length) {
    document.getElementById("decisions-section").hidden = false;
    document.getElementById("decisions-title").textContent = L.decisions ?? T.decisions;
    const grid = document.getElementById("decisions");
    for (const d of DATA.decisions) {
      const f = (DATA.flows ?? []).find((x) => x.id === d.flow);
      const card = document.createElement("article");
      card.className = "dcard";
      if (f) { card.dataset.flow = f.id; card.tabIndex = 0; }
      card.innerHTML = `<h4>${esc(d.title)}</h4>
        <div class="row yes"><i>✓</i><span>${esc(d.chosen)}</span></div>
        ${d.rejected ? `<div class="row no"><i>✕</i><span>${esc(d.rejected)}</span></div>` : ""}
        ${d.cost ? `<div class="row cost"><i>△</i><span>${esc(d.cost)}</span></div>` : ""}
        <div class="dfoot">${d.status ? `<span class="status">${esc(d.status)}</span>` : "<span></span>"}${f ? `<small>→ ${esc(f.title)}</small>` : ""}</div>`;
      if (f) {
        const go = () => { if ((f.view ?? DATA.views[0].id) !== viewId) openView(f.view ?? DATA.views[0].id); selectFlow(f.id); document.querySelector(".stage").scrollIntoView({ behavior: "smooth" }); };
        card.addEventListener("click", go);
        card.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
      }
      grid.appendChild(card);
    }
  }
  const vis = DATA.visibility;
  if (vis?.rows?.length) {
    document.getElementById("lower").hidden = false;
    document.getElementById("visibility-box").hidden = false;
    document.getElementById("visibility-title").textContent = L.visibility ?? T.visibility;
    document.getElementById("visibility").innerHTML = `<thead><tr><th></th>${vis.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
      vis.rows.map(([label, ...cells]) => `<tr><td>${esc(label)}</td>${cells.map((c) => `<td><i class="dot ${esc(c)}" title="${esc(T[c] ?? c)}"></i></td>`).join("")}</tr>`).join("")}</tbody>`;
    document.getElementById("visibility-key").innerHTML = ["full", "half", "none", "mine"].map((k) => `<span><i class="dot ${k}"></i>${esc(T[k])}</span>`).join("");
  }
  const op = DATA.openPoints;
  if (op && (op.limits?.length || op.decide?.length)) {
    document.getElementById("lower").hidden = false;
    document.getElementById("open-box").hidden = false;
    document.getElementById("open-title").textContent = L.openPoints ?? T.openPoints;
    const block = (title, items, cls) => (items?.length ? `<h5>${esc(title)}</h5><div class="pills">${items.map((x) => `<span class="pill ${cls}">${esc(x)}</span>`).join("")}</div>` : "");
    document.getElementById("open-limits").innerHTML = block(T.limits, op.limits, "limit");
    document.getElementById("open-decide").innerHTML = block(T.decide, op.decide, "decide");
  }
}

// Theme: auto follows the OS; light and dark override it. Remembered per browser.
const THEME_KEY = "system-map-theme";
function applyTheme(choice) {
  if (choice === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", choice);
  for (const b of document.querySelectorAll("#theme button")) b.setAttribute("aria-pressed", String(b.dataset.theme === choice));
  try { localStorage.setItem(THEME_KEY, choice); } catch {}
}
const themeGroup = document.getElementById("theme");
themeGroup.setAttribute("aria-label", T.theme);
for (const choice of ["auto", "light", "dark"]) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.theme = choice; b.textContent = T[choice];
  b.addEventListener("click", () => applyTheme(choice));
  themeGroup.appendChild(b);
}
let savedTheme = "auto";
try { savedTheme = localStorage.getItem(THEME_KEY) ?? "auto"; } catch {}
applyTheme(["auto", "light", "dark"].includes(savedTheme) ? savedTheme : "auto");

const hash = location.hash.slice(1);
const start = (DATA.flows ?? []).find((f) => f.id === hash) ?? (DATA.flows ?? []).find((f) => f.id === DATA.startFlow);
viewId = start?.view ?? DATA.views[0].id;
flowId = start?.id ?? null;
drawView();
render();
renderExtras();
</script>
</body>
</html>
